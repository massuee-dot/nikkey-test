<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日経TEST 練習問題 500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0EC;
    --paper-raised:#F7F8F4;
    --ink:#1B2A3F;
    --ink-soft:#54626F;
    --line:#C7CDC4;
    --line-soft:#DDE1D9;
    --seal-correct:#2E6B4F;
    --seal-correct-soft:#E4EFE6;
    --seal-wrong:#B23A2C;
    --seal-wrong-soft:#F3E4DF;
    --gold:#B98A2E;
    --gold-soft:#F1E6CC;
    --serif: 'Shippori Mincho', serif;
    --sans: 'Zen Kaku Gothic New', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(circle at 100% 0%, rgba(185,138,46,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 56px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---------- header ---------- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  header.top .title{
    font-family:var(--serif);
    font-weight:800;
    font-size:22px;
    letter-spacing:.02em;
  }
  header.top .title small{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:2px;
  }
  header.top .score{
    font-family:var(--mono);
    font-size:13px;
    text-align:right;
    color:var(--ink-soft);
  }
  header.top .score b{
    font-size:20px;
    color:var(--ink);
    font-weight:700;
  }

  /* ---------- category chips ---------- */
  .chiprow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    border:1.4px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .toolrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .toolrow .count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .toolbtn{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    background:none;
    border:1.4px solid var(--line);
    border-radius:8px;
    padding:6px 11px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .toolbtn:hover{border-color:var(--ink);color:var(--ink);}

  .jumpform{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .jumpform input{
    font-family:var(--mono);
    font-size:12.5px;
    width:56px;
    padding:6px 8px;
    border-radius:8px;
    border:1.4px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    text-align:center;
  }
  .jumpform input:focus{outline:none;border-color:var(--gold);}
  .jumpform button{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--paper);
    background:var(--ink);
    border:1.4px solid var(--ink);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
  }
  .jumpform span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---------- progress ---------- */
  .progress-wrap{margin-bottom:22px;}
  .progress-track{
    height:5px;
    background:var(--line-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--ink));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    display:flex;
    justify-content:space-between;
  }

  /* ---------- question card ---------- */
  .card{
    position:relative;
    background:var(--paper-raised);
    border:1.4px solid var(--line);
    border-radius:4px;
    padding:26px 24px 22px;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .qhead{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:6px;
  }
  .qnum{
    font-family:var(--serif);
    font-weight:800;
    font-size:34px;
    color:var(--ink);
    line-height:1;
    flex:0 0 auto;
  }
  .qmeta{
    padding-top:6px;
  }
  .qcat{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  .qtext{
    font-family:var(--sans);
    font-size:16.5px;
    font-weight:700;
    line-height:1.65;
    margin:10px 0 22px;
    padding-left:48px;
  }

  .choices{display:flex;flex-direction:column;gap:9px;padding-left:48px;}
  .choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.4px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:12px 14px;
    cursor:pointer;
    font-size:14.5px;
    line-height:1.5;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .choice:hover:not(.locked){border-color:var(--ink-soft);}
  .choice:active:not(.locked){transform:scale(.995);}
  .choice .mark{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .choice.selected-correct{
    background:var(--seal-correct-soft);
    border-color:var(--seal-correct);
  }
  .choice.selected-correct .mark{border-color:var(--seal-correct);color:var(--seal-correct);background:#fff;}
  .choice.selected-wrong{
    background:var(--seal-wrong-soft);
    border-color:var(--seal-wrong);
  }
  .choice.selected-wrong .mark{border-color:var(--seal-wrong);color:var(--seal-wrong);background:#fff;}
  .choice.reveal-correct:not(.selected-correct){
    border-color:var(--seal-correct);
    border-style:dashed;
  }
  .choice.locked{cursor:default;}

  /* ---------- stamp ---------- */
  .stamp{
    position:absolute;
    top:14px;
    right:16px;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:scale(1.6) rotate(-14deg);
    pointer-events:none;
  }
  .stamp.show{
    animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.9) rotate(-18deg);}
    55%{opacity:1; transform:scale(.92) rotate(-10deg);}
    75%{transform:scale(1.06) rotate(-12deg);}
    100%{opacity:1; transform:scale(1) rotate(-10deg);}
  }
  .stamp svg{width:100%;height:100%;}

  /* ---------- explanation ---------- */
  .explain{
    margin:18px 0 4px 48px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .32s ease, opacity .32s ease, margin .32s ease;
  }
  .explain.show{
    max-height:220px;
    opacity:1;
  }
  .explain-inner{
    border-left:3px solid var(--gold);
    padding:4px 0 4px 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .explain-inner b{color:var(--ink);font-weight:700;}

  .wrongnote{
    margin:10px 0 4px 48px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .32s ease, opacity .32s ease;
  }
  .wrongnote.show{max-height:220px;opacity:1;}
  .wrongnote-inner{
    border-left:3px solid var(--seal-wrong);
    padding:4px 0 4px 14px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .wrongnote-inner .label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--seal-wrong);
    font-weight:700;
    margin-bottom:4px;
  }

  /* ---------- footer nav ---------- */
  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-left:48px;
  }
  .navbtn{
    font-family:var(--sans);
    font-weight:700;
    font-size:13.5px;
    padding:10px 20px;
    border-radius:7px;
    border:1.4px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .navbtn:disabled{opacity:.35;cursor:not-allowed;}
  .navbtn.ghost{
    background:none;
    color:var(--ink-soft);
    border-color:var(--line);
  }

  /* ---------- empty / done state ---------- */
  .done{
    text-align:center;
    padding:40px 20px;
  }
  .done .bigscore{
    font-family:var(--serif);
    font-size:56px;
    font-weight:800;
  }
  .done .bigscore span{font-family:var(--mono);font-size:24px;color:var(--ink-soft);}
  .breakdown{
    margin-top:26px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .breakdown-row .bname{width:150px;flex:0 0 auto;color:var(--ink-soft);font-weight:700;}
  .breakdown-row .btrack{flex:1;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
  .breakdown-row .bfill{height:100%;background:var(--seal-correct);}
  .breakdown-row .bnum{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);width:52px;text-align:right;}

  .footnote{
    text-align:center;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.6;
    margin-top:30px;
    letter-spacing:.05em;
  }

  /* ---------- wrong-answer review panel ---------- */
  .reviewpanel{
    margin-top:26px;
    border:1.4px solid var(--seal-wrong);
    border-radius:6px;
    background:var(--seal-wrong-soft);
    padding:16px 18px;
  }
  .reviewpanel .rhead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .reviewpanel .rtitle{
    font-family:var(--serif);
    font-weight:800;
    font-size:14.5px;
    color:var(--seal-wrong);
  }
  .reviewpanel .rcount{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .reviewlist{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .reviewlist .rnum{
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    color:var(--seal-wrong);
    background:var(--paper-raised);
    border:1.2px solid var(--seal-wrong);
    border-radius:5px;
    padding:3px 8px;
    cursor:pointer;
  }
  .reviewlist .rnum:hover{background:var(--seal-wrong);color:var(--paper);}
  .reviewempty{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .reviewplain{
    margin-top:10px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.7;
    word-break:break-all;
    border-top:1px dashed var(--line);
    padding-top:8px;
  }

  @media (max-width:420px){
    .qtext, .choices, .explain, .navrow{padding-left:0;}
    .qhead{gap:10px;}
    .qnum{font-size:28px;}
    .stamp{width:52px;height:52px;top:10px;right:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">日経TEST 練習問題<small>ZEN KOKU ISSEI TAISAKU &middot; 500 QUESTIONS</small></div>
    <div class="score">正解 <b id="scoreCorrect">0</b> / <span id="scoreTotal">0</span></div>
  </header>

  <div class="chiprow" id="chipRow"></div>

  <div class="toolrow">
    <span class="count" id="filterCount"></span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <form class="jumpform" id="jumpForm">
        <span>問題番号へ移動</span>
        <input type="number" id="jumpInput" min="1" max="500" placeholder="1-500">
        <button type="submit">移動</button>
      </form>
      <button class="toolbtn" id="shuffleBtn">シャッフル</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressLabel">問 1 / 500</span><span id="progressPct">0%</span></div>
  </div>

  <div id="quizArea"></div>

  <div class="reviewpanel">
    <div class="rhead">
      <span class="rtitle">間違えた問題番号</span>
      <span class="rcount" id="reviewCount">0問</span>
    </div>
    <div id="reviewList"></div>
  </div>

  <div class="footnote">日経TEST 練習問題集（全500問）をもとに自動生成 &middot; 本ツールは非公式の学習補助教材です</div>
</div>

<script id="quiz-data" type="application/json">[{"id": 1, "question": "GDPに算入されるものはどれか。", "choices": ["株式の売買差益", "新築住宅の建設額", "家庭内での家事労働", "中古住宅の売買額"], "category": "経営環境", "correct": 1, "explanation": "中古品の取引は新規の生産ではないためGDPに算入されない。", "wrongNote": "中古住宅の売買や株式の売買差益は新たな価値創出ではなく、家事労働は市場取引されないためGDPには算入されません。"}, {"id": 2, "question": "「実質GDP」の説明として正しいものはどれか。", "choices": ["政府支出のみを集計したGDP", "輸出のみを集計したGDP", "物価変動の影響を除いたGDP", "物価変動を含んだままのGDP"], "category": "経営環境", "correct": 2, "explanation": "名目GDPから物価変動分を調整したもの。", "wrongNote": "物価変動を含んだままのGDPは名目GDPの説明であり、輸出のみや政府支出のみを指す説明はGDP全体の定義ではありません。"}, {"id": 3, "question": "ある国のGDPが前年100兆円から103兆円になった場合の経済成長率はどれか。", "choices": ["3％", "103％", "30％", "0.3％"], "category": "経営環境", "correct": 0, "explanation": "(103-100)/100=3％。", "wrongNote": "0.3％は桁の取り違え、30％や103％は増加額ではなく増加後の金額を誤って用いた計算です。"}, {"id": 4, "question": "消費者物価指数が測定する対象として正しいものはどれか。", "choices": ["家計が購入する財・サービスの価格", "輸出品の価格のみ", "企業間で取引される財の価格", "株式市場の価格"], "category": "経営環境", "correct": 0, "explanation": "消費者の生計費の変動を示す指標。", "wrongNote": "企業間で取引される財の価格は企業物価指数（卸売段階）の対象、輸出品の価格は輸出物価指数、株式市場の価格は株価指数の話であり、いずれもCPIとは別の指標です。"}, {"id": 5, "question": "日銀短観の調査対象として正しいものはどれか。", "choices": ["全国の企業", "全国の自治体", "全国の金融機関のみ", "全国の消費者"], "category": "経営環境", "correct": 0, "explanation": "全国の企業を対象に業況などを調査。", "wrongNote": "日銀短観は企業を対象とした調査であり、消費者・自治体・金融機関のみを対象とするものではありません。"}, {"id": 6, "question": "景気動向指数のうち、景気に先立って動く「先行指数」に含まれる指標はどれか。", "choices": ["新規求人数", "法人税収入", "完全失業率", "有効求人倍率"], "category": "経営環境", "correct": 0, "explanation": "先行指数は景気に先立って動く指標群。有効求人倍率・失業率は一致指数・遅行指数側。", "wrongNote": "有効求人倍率は一致指数、完全失業率や法人税収入は遅行指数に分類され、景気に先行しては動きません。"}, {"id": 7, "question": "「完全失業率」の定義として正しいものはどれか。", "choices": ["就業者数に占める非正規雇用者の割合", "総人口に占める失業者の割合", "労働力人口に占める完全失業者の割合", "生産年齢人口に占める就業者の割合"], "category": "経営環境", "correct": 2, "explanation": "総人口ではなく労働力人口が分母。", "wrongNote": "総人口に対する割合や非正規雇用の割合、就業率はいずれも完全失業率の定義とは異なります。"}, {"id": 8, "question": "「有効求人倍率」が1を上回っている状態が意味するものはどれか。", "choices": ["求人数が求職者数を上回っている", "失業率が急上昇している", "求職者数が求人数を上回っている", "完全雇用が達成されている"], "category": "経営環境", "correct": 0, "explanation": "1人の求職者に対し1件以上の求人がある状態。", "wrongNote": "求職者が求人を上回るのは倍率1未満の状態を指し、完全雇用の達成や失業率の動きとは直接結びつく説明ではありません。"}, {"id": 9, "question": "国際収支のうち、貿易収支・サービス収支・所得収支などをまとめたものはどれか。", "choices": ["資本移転等収支", "経常収支", "金融収支", "外貨準備増減"], "category": "経営環境", "correct": 1, "explanation": "貿易・サービス・所得・二次所得の各収支の合計。", "wrongNote": "資本移転等収支や金融収支は経常収支とは別の区分であり、外貨準備増減は金融収支に含まれる項目です。"}, {"id": 10, "question": "為替相場が「1ドル=140円」から「1ドル=150円」に変化した場合、これは何と呼ばれるか。", "choices": ["ドル安", "変化なし", "円高", "円安"], "category": "経営環境", "correct": 3, "explanation": "同じ1ドルを得るのにより多くの円が必要＝円の価値が下がった状態。", "wrongNote": "1ドルに必要な円が増えるのは円の価値が下がる円安であり、円高やドル安、変化なしという説明は当てはまりません。"}, {"id": 11, "question": "中央銀行が政策金利を引き下げる金融緩和の主な狙いとして正しいものはどれか。", "choices": ["為替を円高に誘導する", "企業や個人の資金調達コストを下げ、経済活動を刺激する", "財政赤字を縮小する", "物価上昇を抑制する"], "category": "経営環境", "correct": 1, "explanation": "金融緩和の基本的な狙い。", "wrongNote": "物価上昇の抑制や円高誘導はむしろ金融引き締めの効果であり、財政赤字の縮小は金融政策とは別の話です。"}, {"id": 12, "question": "「量的緩和」の説明として正しいものはどれか。", "choices": ["銀行が貸出金利を引き上げる動き", "企業が自社株買いを増やす動き", "政府が消費税率を引き下げる政策", "中央銀行が国債などを大量に買い入れ、市場に資金を供給する政策"], "category": "経営環境", "correct": 3, "explanation": "量的緩和の定義。", "wrongNote": "消費税率の引き下げは財政政策、自社株買いは企業の資本政策であり、貸出金利の引き上げは緩和とは逆の動きです。"}, {"id": 13, "question": "「マイナス金利政策」の説明として正しいものはどれか。", "choices": ["為替レートをマイナス表示にする政策", "住宅ローン金利をゼロにする政策", "銀行が日銀に預ける当座預金の一部に、マイナスの金利を適用する政策", "消費者への貸出を禁止する政策"], "category": "経営環境", "correct": 2, "explanation": "2016年に日本でも導入された。", "wrongNote": "住宅ローン金利をゼロにする制度や貸出禁止、為替のマイナス表示といった内容はマイナス金利政策の説明ではありません。"}, {"id": 14, "question": "物価が持続的に上昇し続ける現象を何と呼ぶか。", "choices": ["スタグネーション", "リセッション", "インフレーション", "デフレーション"], "category": "経営環境", "correct": 2, "explanation": "物価の持続的上昇。", "wrongNote": "デフレは物価の持続的下落、スタグネーションは景気停滞、リセッションは景気後退を指し、物価上昇とは異なる概念です。"}, {"id": 15, "question": "不況下で物価が上昇する現象を何と呼ぶか。", "choices": ["デフレスパイラル", "スタグフレーション", "ディスインフレ", "ハイパーインフレ"], "category": "経営環境", "correct": 1, "explanation": "不況（stagnation）とインフレの合成語。", "wrongNote": "デフレスパイラルは物価下落側の悪循環、ハイパーインフレは急激な物価上昇、ディスインフレは物価上昇率の鈍化を指し、不況下の物価上昇とは異なります。"}, {"id": 16, "question": "「プライマリーバランス」が意味する内容として正しいものはどれか。", "choices": ["為替相場の需給バランス", "税収などの歳入と、国債費を除いた歳出の収支", "家計の貯蓄と消費の差額", "輸出と輸入の差額"], "category": "経営環境", "correct": 1, "explanation": "財政の健全性を測る指標の一つ。", "wrongNote": "輸出入の差額は貿易収支、家計の貯蓄と消費の差額や為替の需給バランスはプライマリーバランスとは別の概念です。"}, {"id": 17, "question": "消費税のような税の分類として正しいものはどれか。", "choices": ["間接税", "法人税", "資産税", "直接税"], "category": "経営環境", "correct": 0, "explanation": "税を負担する人と納める人が異なる税。", "wrongNote": "消費税は税を負担する人と納める人が異なる間接税であり、直接税や資産税・法人税といった分類とは異なる軸の話です。"}, {"id": 18, "question": "所得が高くなるほど税率が高くなる課税方式を何と呼ぶか。", "choices": ["逆進課税", "比例課税", "定額課税", "累進課税"], "category": "経営環境", "correct": 3, "explanation": "所得税などで採用されている方式。", "wrongNote": "定額課税は所得に関わらず一定額、逆進課税は低所得者ほど負担が重くなる仕組み、比例課税は税率が一定であり、いずれも累進課税とは異なります。"}, {"id": 19, "question": "G7に含まれない国はどれか。", "choices": ["イタリア", "中国", "カナダ", "日本"], "category": "経営環境", "correct": 1, "explanation": "G7は日・米・英・仏・独・伊・加。", "wrongNote": "日本・カナダ・イタリアはいずれもG7構成国であり、中国はG7には含まれていません。"}, {"id": 20, "question": "国際通貨基金の主な役割として正しいものはどれか。", "choices": ["国際貿易のルール策定", "為替相場の安定と国際収支難に陥った国への融資", "各国の関税率の決定", "世界の気候変動対策の推進"], "category": "経営環境", "correct": 1, "explanation": "世界銀行とは役割が異なる点に注意。", "wrongNote": "貿易ルールの策定はWTO、関税率の決定は各国政府、気候変動対策の推進は国連気候変動枠組条約などが担う役割であり、IMFの役割ではありません。"}, {"id": 21, "question": "世界貿易機関の主な役割として正しいものはどれか。", "choices": ["国際的な貿易ルールの策定・紛争解決", "開発途上国への無償資金協力", "世界の食料備蓄の管理", "各国通貨の為替レート決定"], "category": "経営環境", "correct": 0, "explanation": "自由貿易の推進が目的。", "wrongNote": "為替レートの決定や無償資金協力、食料備蓄の管理はそれぞれ別の主体の役割であり、WTOの役割ではありません。"}, {"id": 22, "question": "OECDの役割として最も適切なものはどれか。", "choices": ["先進国を中心に経済政策の分析・提言を行う", "国連の下部組織として食糧支援を行う", "為替の固定相場を管理する機関", "発展途上国のみを対象とした軍事協力機構"], "category": "経営環境", "correct": 0, "explanation": "「経済協力開発機構」。", "wrongNote": "OECDは先進国中心の経済協力機関であり、軍事協力や為替管理、食糧支援を担う組織ではありません。"}, {"id": 23, "question": "日本の少子高齢化が経済に与える影響として一般的に指摘されているものはどれか。", "choices": ["若年層の急増による内需拡大", "潜在成長率の上昇", "社会保障費の減少", "生産年齢人口の減少による労働力不足"], "category": "経営環境", "correct": 3, "explanation": "少子高齢化の代表的な影響。", "wrongNote": "少子高齢化は労働力不足を招く一方、社会保障費の増加や潜在成長率の低下が課題として指摘されており、選択肢のような逆の効果は一般的に想定されていません。"}, {"id": 24, "question": "「生産年齢人口」の定義として正しいものはどれか。", "choices": ["就業者数のみ", "65歳以上の人口", "15歳以上65歳未満の人口", "20歳以上の人口全体"], "category": "経営環境", "correct": 2, "explanation": "統計上の定義。", "wrongNote": "就業者数のみを指す概念や65歳以上を指す老年人口の定義とは異なり、生産年齢人口は15歳以上65歳未満という年齢区分で定義されます。"}, {"id": 25, "question": "「潜在成長率」の説明として正しいものはどれか。", "choices": ["政府が目標として掲げる財政赤字削減率", "経済が持つ生産要素をフル活用した場合に達成しうる中長期的な成長率", "前年比の実際の経済成長率", "株式市場の期待成長率"], "category": "経営環境", "correct": 1, "explanation": "実際の成長率とは異なる概念。", "wrongNote": "実際の経済成長率や財政赤字削減目標、株式市場の期待成長率はいずれも潜在成長率とは異なる別の指標です。"}, {"id": 26, "question": "「需給ギャップ」がプラスの状態が意味するものはどれか。", "choices": ["供給が需要を上回っている", "実質GDPと名目GDPの差を示している", "需要が供給を上回っている", "需要と供給が完全に一致している"], "category": "経営環境", "correct": 2, "explanation": "プラスは需要超過＝物価上昇圧力。", "wrongNote": "供給が需要を上回る状態や需給が完全に一致する状態は需給ギャップの説明として不十分であり、実質GDPと名目GDPの差はGDPデフレーターに関わる別の概念です。"}, {"id": 27, "question": "2025年10月、自民党総裁選を経て日本初の女性首相に就任したのは誰か。", "choices": ["茂木敏充", "小泉進次郎", "高市早苗", "石破茂"], "category": "経営環境", "correct": 2, "explanation": "2025年10月21日、第104代首相に指名。", "wrongNote": "石破茂は前任の首相、小泉進次郎・茂木敏充は総裁選で候補に挙がった他の政治家であり、実際に選出されたのは高市早苗氏です。"}, {"id": 28, "question": "高市内閣の発足時に財務相に起用されたのは誰か。", "choices": ["鈴木憲和", "河野太郎", "木原稔", "片山さつき"], "category": "経営環境", "correct": 3, "explanation": "高市内閣発足時の財務相。", "wrongNote": "木原稔氏は官房長官、鈴木憲和氏は農相に起用されており、財務相に就いたのは片山さつき氏です。"}, {"id": 29, "question": "高市内閣は自民党とどの政党による連立政権としてスタートしたか。", "choices": ["国民民主党", "日本維新の会", "公明党", "立憲民主党"], "category": "経営環境", "correct": 1, "explanation": "自民・維新の連立政権。", "wrongNote": "公明党は過去の連立相手であり、立憲民主党・国民民主党は野党であるため、高市内閣の連立相手ではありません。"}, {"id": 30, "question": "2025年9月時点で試算された、日米関税交渉合意後の米国の対日平均関税率に最も近い数値はどれか。", "choices": ["約1.5％", "約6％", "約12.3％", "約25％"], "category": "経営環境", "correct": 2, "explanation": "年初1.5％、7月時点14.5％からの低下だが依然高水準。", "wrongNote": "約1.5％は年初時点の関税率、約25％は実際より高すぎる数値であり、合意後の水準として報じられたのは約12.3％です。"}, {"id": 31, "question": "トランプ関税の影響で、2025年8月に輸出額が大きく落ち込んだと報じられた品目はどれか。", "choices": ["医薬品", "半導体製造装置", "農産物", "自動車関連財"], "category": "経営環境", "correct": 3, "explanation": "現地生産強化や価格競争力低下が背景とされる。", "wrongNote": "半導体製造装置や医薬品、農産物は今回大きく取り上げられた品目ではなく、輸出減少が特に注目されたのは自動車関連財でした。"}, {"id": 32, "question": "2025年9月の金融政策決定会合で日銀が決定した内容として正しいものはどれか。", "choices": ["マイナス金利の再導入", "大規模な為替介入の実施", "長短金利操作の再強化", "保有するETF・REITの市場での段階的売却"], "category": "経営環境", "correct": 3, "explanation": "金融正常化の一環として2025年9月に決定。", "wrongNote": "マイナス金利の再導入や長短金利操作の強化は金融緩和方向の政策であり、大規模な為替介入とも異なる、ETF・REITの売却が決定された内容です。"}, {"id": 33, "question": "2025年の基準地価の動きとして正しいものはどれか。", "choices": ["4年連続で上昇した", "5年ぶりに下落した", "横ばいが続いている", "公表が中止された"], "category": "経営環境", "correct": 0, "explanation": "全用途平均1.5％上昇。", "wrongNote": "実際には5年ぶりの下落や横ばいではなく、地価は4年連続で上昇しており、統計公表が中止された事実もありません。"}, {"id": 34, "question": "近年の春闘における賃上げ率のトレンドとして正しいものはどれか。", "choices": ["賃上げはゼロ％台が続いている", "春闘そのものが廃止された", "5％を超える高水準の賃上げが続いている", "賃下げが常態化している"], "category": "経営環境", "correct": 2, "explanation": "人手不足や物価高を背景とした傾向。", "wrongNote": "近年の春闘ではゼロ％台の低い賃上げや賃下げが常態化しているわけではなく、春闘自体も継続しており、5％を超える高水準の賃上げが続いています。"}, {"id": 35, "question": "「実質賃金」の説明として正しいものはどれか。", "choices": ["名目賃金に税金を加えたもの", "ボーナスのみを指すもの", "名目賃金の上昇率から物価上昇率を差し引いたもの", "最低賃金と同義のもの"], "category": "経営環境", "correct": 2, "explanation": "物価上昇が上回ると実質賃金はマイナスになる。", "wrongNote": "税金のみを差し引いたものやボーナスのみを指す概念、最低賃金とは異なり、実質賃金は名目賃金の上昇率から物価上昇率を差し引いたものです。"}, {"id": 36, "question": "為替相場が円安方向に動く一般的な要因として正しいものはどれか。", "choices": ["日本の貿易黒字が急拡大する", "海外投資家が円建て資産を積極的に購入する", "日銀が大規模な円買い介入を行う", "日本の金利が海外に比べて相対的に低い状態が続く"], "category": "経営環境", "correct": 3, "explanation": "低金利通貨は相対的に売られやすく円安要因となる。", "wrongNote": "貿易黒字の拡大や海外投資家による円建て資産の購入、日銀の円買い介入はいずれもむしろ円高要因であり、円安要因とは逆方向です。"}, {"id": 37, "question": "中央銀行の役割として一般的に含まれないものはどれか。", "choices": ["物価の安定", "通貨の発行", "金融システムの安定", "民間企業への出資による経営関与"], "category": "経営環境", "correct": 3, "explanation": "中央銀行の一般的役割には含まれない。", "wrongNote": "通貨の発行や物価の安定、金融システムの安定は中央銀行の代表的な役割であり、民間企業への出資による経営関与は一般的な役割に含まれません。"}, {"id": 38, "question": "「マネーストック」が示す内容として正しいものはどれか。", "choices": ["金融機関や中央政府を除く経済主体が保有する通貨量の残高", "家計の預金金利の平均", "国が発行する国債の総額", "上場企業の時価総額の合計"], "category": "経営環境", "correct": 0, "explanation": "代表的なマネー指標。", "wrongNote": "国債の発行総額や預金金利の平均、上場企業の時価総額合計はマネーストックとは異なる別の統計・指標です。"}, {"id": 39, "question": "通貨当局が為替相場に影響を与えるために外貨を売買する行為を何と呼ぶか。", "choices": ["為替介入", "公開市場操作", "財政出動", "量的緩和"], "category": "経営環境", "correct": 0, "explanation": "通貨当局による外貨売買。", "wrongNote": "公開市場操作は国内の金融調節手段、量的緩和は資産買入れ策、財政出動は政府の歳出政策であり、いずれも為替介入とは異なります。"}, {"id": 40, "question": "CPTPPの説明として正しいものはどれか。", "choices": ["主要国の為替レートを固定する協定", "世界の気候変動対策の国際枠組み", "国連が主導する平和維持活動の枠組み", "参加国間で関税撤廃・削減などを進める経済連携協定"], "category": "経営環境", "correct": 3, "explanation": "日本も参加する多国間協定。", "wrongNote": "気候変動対策の枠組みや平和維持活動、為替の固定相場制度はCPTPPとは別の国際的な仕組みです。"}, {"id": 41, "question": "FTAとEPAの違いとして正しいものはどれか。", "choices": ["FTAは日本が締結できない協定形式である", "FTAとEPAはまったく同じ内容を指す", "FTAは関税撤廃が中心、EPAは投資・人の移動なども含めたより広範な協定", "EPAはFTAより対象範囲が狭い協定である"], "category": "経営環境", "correct": 2, "explanation": "EPAは投資・人の移動なども含む。", "wrongNote": "EPAはFTAより対象範囲が狭いのではなくむしろ広く、日本もFTAを締結できるため、これらの説明はFTAとEPAの違いとして正しくありません。"}, {"id": 42, "question": "「サプライチェーン」が指す内容として正しいものはどれか。", "choices": ["金融機関同士の資金決済網", "企業の株主構成", "原材料の調達から製造・物流・販売に至る一連のつながり", "労働組合の組織構造"], "category": "経営環境", "correct": 2, "explanation": "供給網。", "wrongNote": "株主構成や金融機関同士の決済網、労働組合の組織構造はサプライチェーンとは異なる概念です。"}, {"id": 43, "question": "「経済安全保障」の考え方として正しいものはどれか。", "choices": ["消費税を廃止する政策", "企業の内部留保を最大化する経営手法", "為替レートを完全に固定する制度", "重要物資や技術の供給を特定国に過度に依存しないようにする政策的取り組み"], "category": "経営環境", "correct": 3, "explanation": "近年重視される政策分野。", "wrongNote": "内部留保の最大化や為替の固定制度、消費税の廃止は経済安全保障の考え方とは直接関係しません。"}, {"id": 44, "question": "「カーボンニュートラル」の説明として正しいものはどれか。", "choices": ["中立国のエネルギー政策を指す用語", "温室効果ガスの排出量と吸収量を均衡させ、実質的な排出をゼロにする状態", "石油を一切使用しない経済体制", "二酸化炭素の排出を完全に禁止する法律"], "category": "経営環境", "correct": 1, "explanation": "2050年目標として掲げる国が多い。", "wrongNote": "二酸化炭素の排出を完全に禁止する法律や石油を使わない体制、中立国のエネルギー政策という意味ではなく、排出と吸収を均衡させる考え方です。"}, {"id": 45, "question": "SDGsが国連で採択された際の目標数として正しいものはどれか。", "choices": ["17個", "8つ", "100個", "30個"], "category": "経営環境", "correct": 0, "explanation": "2015年に国連で採択。", "wrongNote": "SDGsの目標数は8つでも30個でも100個でもなく、正しくは17個の目標が採択されました。"}, {"id": 46, "question": "「ESG投資」のESGが指すものの組み合わせとして正しいものはどれか。", "choices": ["Export・Sales・Growth", "Environment・Social・Governance", "Energy・Steel・Gold", "Economy・Society・Growth"], "category": "経営環境", "correct": 1, "explanation": "環境・社会・企業統治。", "wrongNote": "Economy・Society・GrowthやExport・Sales・Growthなどは誤った組み合わせであり、正しくはEnvironment・Social・Governanceです。"}, {"id": 47, "question": "日本銀行の金融政策決定会合で決定される「政策金利」の主な誘導対象として正しいものはどれか。", "choices": ["株式配当利回り", "住宅ローン金利", "社債利回り", "無担保コールレート"], "category": "経営環境", "correct": 3, "explanation": "伝統的な政策金利の誘導対象。", "wrongNote": "住宅ローン金利や社債利回り、株式配当利回りは市場で形成される金利であり、日銀が直接誘導する政策金利の対象ではありません。"}, {"id": 48, "question": "財政赤字が続き、国債残高が累積することの一般的なリスクとして指摘されるものはどれか。", "choices": ["物価が必ず下落すること", "為替が必ず円高になること", "将来世代への負担の先送りや財政の持続可能性への懸念", "GDPが自動的に増加すること"], "category": "経営環境", "correct": 2, "explanation": "財政の持続可能性への懸念が指摘される。", "wrongNote": "財政赤字の累積は必ずしも物価下落や円高、GDPの自動的な増加をもたらすわけではなく、将来世代への負担の先送りが主なリスクとして指摘されます。"}, {"id": 49, "question": "「貿易収支」の説明として正しいものはどれか。", "choices": ["政府間の無償資金協力の総額", "財の輸出額から輸入額を差し引いたもの", "サービスの輸出入のみを集計したもの", "海外への投資収益のみを集計したもの"], "category": "経営環境", "correct": 1, "explanation": "サービスは含まない「モノ」の収支。", "wrongNote": "サービス収支のみや投資収益のみ、無償資金協力の総額はいずれも貿易収支とは異なる範囲・統計です。"}, {"id": 50, "question": "景気循環における「景気の谷」の説明として正しいものはどれか。", "choices": ["景気の後退局面が終わり、回復に転じる転換点", "景気が横ばいで安定している状態", "株価が最高値をつけた時点", "景気が最も拡大したピークの時点"], "category": "経営環境", "correct": 0, "explanation": "対義語は「景気の山（ピーク）」。  --- # 第2章：企業戦略（Q51〜Q100）", "wrongNote": "景気が最も拡大した時点は「山」、横ばいの安定状態や株価の最高値は谷の定義とは異なり、谷は後退局面が終わり回復に転じる転換点を指します。"}, {"id": 51, "question": "「M&A」の説明として正しいものはどれか。", "choices": ["企業の内部監査", "企業の倒産手続き", "企業の株式分割", "企業の合併・買収"], "category": "企業戦略", "correct": 3, "explanation": "企業の合併・買収。", "wrongNote": "企業の倒産手続きや株式分割、内部監査はM&Aとは異なる別の企業活動です。"}, {"id": 52, "question": "TOBの説明として正しいものはどれか。", "choices": ["企業が自社の従業員に無償で株式を配布する制度", "株式を分割して1株あたりの価格を下げる手続き", "新規上場時に株式を売り出す手続き", "買付価格・株数・期間などを公告し、証券取引所を通さずに株式を買い集める手法"], "category": "企業戦略", "correct": 3, "explanation": "買付条件を公告し取引所外で株式を買い集める手法。", "wrongNote": "従業員への無償株式配布や新規上場時の売り出し、株式分割はTOBとは異なる仕組みです。"}, {"id": 53, "question": "経営陣が自社の株式を買い取り、オーナー経営者となる手法を何と呼ぶか。", "choices": ["IPO", "IR", "TOB", "MBO"], "category": "企業戦略", "correct": 3, "explanation": "経営陣自身が買い手となる点が特徴。", "wrongNote": "IPOは新規上場、TOBは株式公開買付け全般を指す言葉、IRは投資家向け広報活動であり、経営陣による自社株買収を指すMBOとは異なります。"}, {"id": 54, "question": "買収対象企業の資産や将来のキャッシュフローを担保に資金を借り入れて行う買収手法を何と呼ぶか。", "choices": ["LBO", "EBO", "DES", "MBI"], "category": "企業戦略", "correct": 0, "explanation": "買収対象の資産・キャッシュフローを担保に借入。", "wrongNote": "MBIは外部の経営陣が企業を買収する手法、EBOは従業員が自社株を買い取る手法、DESは負債を株式に転換する手法を指し、対象企業の資産・キャッシュフローを担保にする手法はLBOと呼ばれます。"}, {"id": 55, "question": "敵対的買収に対する防衛策として知られる「ポイズンピル」の説明として正しいものはどれか。", "choices": ["企業が自社製品の販売を停止する対抗策", "既存株主に有利な条件で新株を発行し、買収者の持株比率を低下させる仕組み", "株式の売買を全面的に禁止する制度", "買収者に対して訴訟を起こす制度"], "category": "企業戦略", "correct": 1, "explanation": "代表的な買収防衛策。", "wrongNote": "買収者への訴訟や株式売買の全面禁止、自社製品の販売停止は一般的な買収防衛策の説明ではなく、ポイズンピルは新株発行により持株比率を薄める仕組みです。"}, {"id": 56, "question": "複数の子会社を傘下に持ち、自らは事業を行わずグループ経営に専念する会社を何と呼ぶか。", "choices": ["持株会社", "一般社団法人", "特例子会社", "匿名組合"], "category": "企業戦略", "correct": 0, "explanation": "グループ経営の中核として機能。", "wrongNote": "特例子会社は障害者雇用促進を目的とした子会社、匿名組合や一般社団法人は別の組織形態であり、グループ経営に専念する会社は持株会社と呼ばれます。"}, {"id": 57, "question": "複数の企業が出資し合って新たに設立する共同事業体を何と呼ぶか。", "choices": ["ジョイントベンチャー", "カルテル", "トラスト", "コンツェルン"], "category": "企業戦略", "correct": 0, "explanation": "複数社の共同出資会社。", "wrongNote": "カルテルは競争制限行為、トラストやコンツェルンは別の企業結合形態であり、複数社が共同出資して設立する会社はジョイントベンチャーと呼ばれます。"}, {"id": 58, "question": "原材料の調達から製造、販売までを自社グループ内で一貫して行う戦略を何と呼ぶか。", "choices": ["水平統合", "多角化", "アウトソーシング", "垂直統合"], "category": "企業戦略", "correct": 3, "explanation": "サプライチェーンを自社内で完結させる戦略。", "wrongNote": "水平統合は同業種内での規模拡大、多角化は異分野への展開、アウトソーシングは外部委託を指し、自社内で調達から販売まで一貫させる戦略とは異なります。"}, {"id": 59, "question": "同業他社を買収して同じ事業領域での規模を拡大する戦略を何と呼ぶか。", "choices": ["コングロマリット化", "スピンオフ", "水平統合", "垂直統合"], "category": "企業戦略", "correct": 2, "explanation": "同業種内での規模拡大。", "wrongNote": "垂直統合はサプライチェーンの一貫化、コングロマリット化は異業種への展開、スピンオフは事業分離を指し、同業他社買収による規模拡大とは異なります。"}, {"id": 60, "question": "既存事業とは異なる新たな事業分野に進出する経営戦略を何と呼ぶか。", "choices": ["現状維持戦略", "多角化戦略", "縮小均衡", "撤退戦略"], "category": "企業戦略", "correct": 1, "explanation": "新分野への事業展開。", "wrongNote": "撤退戦略や縮小均衡、現状維持戦略は新分野への進出とは逆または無関係の方向性であり、多角化戦略とは異なります。"}, {"id": 61, "question": "経営資源を強みのある事業に集中し、不採算事業を整理する経営方針を何と呼ぶか。", "choices": ["全方位経営", "コングロマリット・ディスカウント", "総花的経営", "選択と集中"], "category": "企業戦略", "correct": 3, "explanation": "強みへの資源集中と不採算事業の整理。", "wrongNote": "全方位経営や総花的経営は資源を分散させる逆の考え方、コングロマリット・ディスカウントは複合企業が市場で低く評価される現象を指します。"}, {"id": 62, "question": "関連性の薄い複数の事業を傘下に持つ複合企業を何と呼ぶか。", "choices": ["持分法適用会社", "スタートアップ", "コングロマリット", "カルテル"], "category": "企業戦略", "correct": 2, "explanation": "異業種を傘下に持つ複合企業。", "wrongNote": "カルテルは競争制限行為、スタートアップは新興企業、持分法適用会社は出資比率に基づく会計上の分類であり、複合企業を指す言葉ではありません。"}, {"id": 63, "question": "自社の強み・弱み・機会・脅威を整理する分析フレームワークを何と呼ぶか。", "choices": ["PEST分析", "BCG分析", "SWOT分析", "4P分析"], "category": "企業戦略", "correct": 2, "explanation": "強み・弱み・機会・脅威の枠組み。", "wrongNote": "PEST分析は政治・経済・社会・技術の外部環境分析、4P分析はマーケティング要素の分析であり、自社の強み弱み機会脅威を整理するSWOT分析とは異なります。"}, {"id": 64, "question": "業界の競争構造を「新規参入の脅威」「代替品の脅威」「売り手の交渉力」「買い手の交渉力」「業界内の競争」の5つで分析する手法を何と呼ぶか。", "choices": ["ファイブフォース分析", "バランスト・スコアカード", "マズローの欲求階層", "アンゾフの成長マトリクス"], "category": "企業戦略", "correct": 0, "explanation": "マイケル・ポーターが提唱。", "wrongNote": "バランスト・スコアカードは業績評価の手法、アンゾフの成長マトリクスは成長戦略の分類、マズローの欲求階層は心理学の理論であり、業界の競争構造分析とは異なります。"}, {"id": 65, "question": "市場成長率と市場占有率の2軸で事業を「花形」「金のなる木」「問題児」「負け犬」に分類する手法を何と呼ぶか。", "choices": ["3C分析", "PPM", "コアコンピタンス経営", "バリューチェーン分析"], "category": "企業戦略", "correct": 1, "explanation": "花形・金のなる木・問題児・負け犬の4象限。", "wrongNote": "バリューチェーン分析は価値創出活動の分析、コアコンピタンス経営は中核的強みを軸にした経営、STP分析は市場細分化の枠組みであり、市場成長率とシェアで事業を分類する手法とは異なります。"}, {"id": 66, "question": "原材料調達から製造・物流・販売・アフターサービスに至る一連の活動を、価値の連鎖として捉える分析手法を何と呼ぶか。", "choices": ["PPM", "SWOT分析", "バリューチェーン分析", "STP分析"], "category": "企業戦略", "correct": 2, "explanation": "価値創出活動の連鎖を分析。", "wrongNote": "SWOT分析やPPM、STP分析はそれぞれ別の目的を持つ分析フレームワークであり、価値創出活動の連鎖を分析する手法はバリューチェーン分析と呼ばれます。"}, {"id": 67, "question": "他社が容易に模倣できない、企業独自の中核的な強みを何と呼ぶか。", "choices": ["アウトソーシング", "カニバリゼーション", "コアコンピタンス", "コモディティ化"], "category": "企業戦略", "correct": 2, "explanation": "模倣困難な中核的強み。", "wrongNote": "アウトソーシングは外部委託、カニバリゼーションは自社製品同士の共食い現象、コモディティ化は差別化が失われる現象であり、模倣困難な中核的強みとは異なります。"}, {"id": 68, "question": "競争の激しい既存市場ではなく、競争のない新たな市場を切り開く経営戦略を何と呼ぶか。", "choices": ["コストリーダーシップ戦略", "レッドオーシャン戦略", "ニッチ戦略", "ブルーオーシャン戦略"], "category": "企業戦略", "correct": 3, "explanation": "競争のない未開拓市場を狙う。", "wrongNote": "レッドオーシャン戦略は競争の激しい既存市場を指し、ニッチ戦略やコストリーダーシップ戦略とも異なる、競争のない新市場を切り開く考え方がブルーオーシャン戦略です。"}, {"id": 69, "question": "既存の優良企業が既存顧客のニーズに応え続けるあまり、新興企業の破壊的な技術革新に対応できなくなる現象を何と呼ぶか。", "choices": ["イノベーションのジレンマ", "ネットワーク外部性", "キャズム理論", "プロダクトライフサイクル"], "category": "企業戦略", "correct": 0, "explanation": "クレイトン・クリステンセンが提唱。", "wrongNote": "キャズム理論は新技術普及の壁、プロダクトライフサイクルは製品の段階変化、ネットワーク外部性は利用者増加による価値向上を指し、既存企業が新興企業に対応できなくなる現象とは異なります。"}, {"id": 70, "question": "従来の製品やサービスを性能面では下回るが、低価格・利便性などで市場構造を覆す技術革新を何と呼ぶか。", "choices": ["破壊的イノベーション", "持続的イノベーション", "プロセスイノベーション", "リバースイノベーション"], "category": "企業戦略", "correct": 0, "explanation": "低価格・利便性で市場構造を覆す。", "wrongNote": "持続的イノベーションは既存製品の性能向上、プロセスイノベーションは製造工程の革新、リバースイノベーションは新興国発の技術普及を指し、市場構造を覆す技術革新とは異なる説明です。"}, {"id": 71, "question": "評価額が10億ドルを超える未上場のスタートアップ企業を何と呼ぶか。", "choices": ["ゾンビ企業", "デカコーン企業", "ペーパーカンパニー", "ユニコーン企業"], "category": "企業戦略", "correct": 3, "explanation": "評価額10億ドル超の未上場企業。", "wrongNote": "デカコーン企業は評価額100億ドルを超える企業、ゾンビ企業は実質的に破綻状態の企業、ペーパーカンパニーは実体のない会社を指し、評価額10億ドル超の未上場企業とは異なります。"}, {"id": 72, "question": "企業が証券取引所に株式を新規上場することを何と呼ぶか。", "choices": ["M&A", "TOB", "IPO", "LBO"], "category": "企業戦略", "correct": 2, "explanation": "新規株式公開。", "wrongNote": "M&AやLBO、TOBはいずれも買収・統合に関する用語であり、新規株式公開を指すIPOとは異なります。"}, {"id": 73, "question": "成長が見込まれる未上場企業に出資し、将来の株式売却益を狙う投資会社を何と呼ぶか。", "choices": ["政府系金融機関", "信用金庫", "ベンチャーキャピタル", "メガバンク"], "category": "企業戦略", "correct": 2, "explanation": "未上場企業への出資が特徴。", "wrongNote": "メガバンクや政府系金融機関、信用金庫は主に融資を行う金融機関であり、未上場企業への出資を専門とするベンチャーキャピタルとは異なります。"}, {"id": 74, "question": "創業初期のスタートアップに個人資産で出資する富裕な個人投資家を何と呼ぶか。", "choices": ["ヘッジファンド", "エンジェル投資家", "機関投資家", "アクティビスト"], "category": "企業戦略", "correct": 1, "explanation": "創業初期段階での個人投資家。", "wrongNote": "アクティビストは経営改善を要求する投資家、ヘッジファンドや機関投資家は法人としての大口投資家であり、個人の富裕層による創業初期投資を指すエンジェル投資家とは異なります。"}, {"id": 75, "question": "企業が特定の事業部門を切り出し、外部資本を受け入れる形で独立させる手法を何と呼ぶか。", "choices": ["アウトソーシング", "カーブアウト", "リストラクチャリング", "ダウンサイジング"], "category": "企業戦略", "correct": 1, "explanation": "事業部門を切り出し独立させる手法。", "wrongNote": "リストラクチャリングは事業再構築全般、ダウンサイジングは規模縮小、アウトソーシングは外部委託を指し、事業部門を切り出し外部資本を受け入れる手法とは異なります。"}, {"id": 76, "question": "企業が事業の一部を分離し、独立した新会社として株主に株式を分配する手法を何と呼ぶか。", "choices": ["トラッキングストック", "ライツイシュー", "デットエクイティスワップ", "スピンオフ"], "category": "企業戦略", "correct": 3, "explanation": "株主への株式分配を伴う事業分離。", "wrongNote": "デットエクイティスワップは負債の株式化、トラッキングストックは特定事業に連動する株式、ライツイシューは株主割当増資を指し、事業分離とは異なる仕組みです。"}, {"id": 77, "question": "M&Aの買収額が被買収企業の純資産額を上回った差額を会計上何と呼ぶか。", "choices": ["資本剰余金", "繰延資産", "利益準備金", "のれん"], "category": "企業戦略", "correct": 3, "explanation": "買収額と純資産の差額として計上。", "wrongNote": "資本剰余金や利益準備金、繰延資産はのれんとは異なる会計項目であり、買収額と純資産の差額を指すのはのれんです。"}, {"id": 78, "question": "M&A成立後、経営統合の実務を進めるプロセスを何と呼ぶか。", "choices": ["KPI", "ROI", "CSR", "PMI"], "category": "企業戦略", "correct": 3, "explanation": "統合プロセスの実務。", "wrongNote": "KPIやROI、CSRはそれぞれ業績指標や社会的責任を指す別の概念であり、M&A後の統合プロセスを指すのはPMIです。"}, {"id": 79, "question": "M&Aの交渉過程で、対象企業の財務・法務・事業内容などを詳細に調査することを何と呼ぶか。", "choices": ["デューデリジェンス", "コンプライアンス", "アカウンタビリティ", "ガバナンス"], "category": "企業戦略", "correct": 0, "explanation": "財務・法務等の詳細調査。", "wrongNote": "アカウンタビリティは説明責任、コンプライアンスは法令遵守、ガバナンスは企業統治を指し、対象企業の詳細調査とは異なる概念です。"}, {"id": 80, "question": "上場企業の企業統治のあり方を示す原則集を何と呼ぶか。", "choices": ["金融商品取引法", "コーポレートガバナンス・コード", "独占禁止法", "インサイダー取引規制"], "category": "企業戦略", "correct": 1, "explanation": "企業統治の原則集。", "wrongNote": "インサイダー取引規制や金融商品取引法、独占禁止法はそれぞれ別の法規制であり、企業統治の原則集を指すのはコーポレートガバナンス・コードです。"}, {"id": 81, "question": "社外取締役に主に期待される役割として正しいものはどれか。", "choices": ["株主総会の議長を必ず務めること", "経営陣から独立した立場で経営を監督・助言すること", "会社の資金を管理すること", "会社の日常業務を実際に執行すること"], "category": "企業戦略", "correct": 1, "explanation": "執行そのものは担わない。", "wrongNote": "日常業務の執行や株主総会の議長、資金管理はそれぞれ別の役割であり、社外取締役に期待されるのは経営陣から独立した監督・助言です。"}, {"id": 82, "question": "株式会社における最高意思決定機関として正しいものはどれか。", "choices": ["株主総会", "監査役会", "取締役会", "従業員組合"], "category": "企業戦略", "correct": 0, "explanation": "会社の最高意思決定機関。", "wrongNote": "取締役会は業務執行の意思決定機関、監査役会は監査機関、従業員組合は労働者の団体であり、会社の最高意思決定機関は株主総会です。"}, {"id": 83, "question": "取締役の職務執行を監査する機関として正しいものはどれか。", "choices": ["監査役", "支店長", "執行役員", "顧問"], "category": "企業戦略", "correct": 0, "explanation": "取締役の職務執行を監査。", "wrongNote": "執行役員は業務執行を担う役職、顧問は助言役、支店長は現場の管理職であり、取締役の職務執行を監査するのは監査役です。"}, {"id": 84, "question": "「指名委員会等設置会社」に必ず設置される委員会の組み合わせとして正しいものはどれか。", "choices": ["営業委員会・製造委員会・品質委員会", "倫理委員会・環境委員会・安全委員会", "指名委員会・監査委員会・報酬委員会", "予算委員会・広報委員会・人事委員会"], "category": "企業戦略", "correct": 2, "explanation": "指名委員会等設置会社の必置機関。", "wrongNote": "予算委員会や広報委員会、営業委員会などは会社が任意に設ける委員会であり、指名委員会等設置会社で法定必置となるのは指名・監査・報酬の3委員会です。"}, {"id": 85, "question": "自己資本を効率的に活用し、株主にとっての収益性を重視する経営を何と呼ぶか。", "choices": ["総花経営", "どんぶり勘定経営", "ROE経営", "コストプラス経営"], "category": "企業戦略", "correct": 2, "explanation": "自己資本利益率を重視する経営。", "wrongNote": "コストプラス経営は価格設定の手法、どんぶり勘定経営や総花経営は非効率な経営のあり方を指す言葉であり、自己資本の効率性を重視する経営とは異なります。"}, {"id": 86, "question": "他社が模倣困難な強みを長期間維持できる状態を何と呼ぶか。", "choices": ["一時的優位性", "カニバリゼーション", "持続的競争優位", "コモディティ化"], "category": "企業戦略", "correct": 2, "explanation": "長期間維持できる優位性。", "wrongNote": "一時的優位性は短期間しか続かない優位、コモディティ化やカニバリゼーションはむしろ競争優位を損なう現象であり、長期的に優位性を保てる状態とは異なります。"}, {"id": 87, "question": "生産量が増えるほど1単位あたりのコストが下がる効果を何と呼ぶか。", "choices": ["範囲の経済", "規模の経済", "密度の経済", "速度の経済"], "category": "企業戦略", "correct": 1, "explanation": "生産量拡大による単位コスト低下。", "wrongNote": "範囲の経済は複数事業間でのコスト共有効果を指し、密度の経済や速度の経済は一般的な用語として定着しておらず、生産量拡大によるコスト低下とは異なります。"}, {"id": 88, "question": "複数の事業を同じ企業内で展開することでコストを共有し、単独で行うより効率的になる効果を何と呼ぶか。", "choices": ["範囲の経済", "スイッチングコスト", "経験曲線効果", "規模の経済"], "category": "企業戦略", "correct": 0, "explanation": "複数事業間でのコスト共有効果。", "wrongNote": "規模の経済は生産量拡大によるコスト低下、経験曲線効果は累積生産量による習熟効果、スイッチングコストは乗り換えコストを指し、複数事業間のコスト共有効果とは異なります。"}, {"id": 89, "question": "サービスの利用者が増えるほど、そのサービス自体の価値が高まる効果を何と呼ぶか。", "choices": ["クラウディングアウト効果", "デモンストレーション効果", "ネットワーク効果", "コストプッシュ効果"], "category": "企業戦略", "correct": 2, "explanation": "利用者増加が価値を高める効果。", "wrongNote": "コストプッシュ効果は物価押し上げ、デモンストレーション効果は消費行動への影響、クラウディングアウト効果は財政支出による民間投資抑制を指し、利用者増加によるサービス価値向上とは異なります。"}, {"id": 90, "question": "多数の売り手と買い手をマッチングさせる場を提供するビジネスモデルを何と呼ぶか。", "choices": ["フランチャイズビジネス", "プラットフォームビジネス", "コングロマリット経営", "OEMビジネス"], "category": "企業戦略", "correct": 1, "explanation": "売り手と買い手をマッチングさせる場。", "wrongNote": "OEMビジネスは受託製造、フランチャイズビジネスは商標・ノウハウ提供モデル、コングロマリット経営は複合企業の経営を指し、売り手と買い手を仲介する場を提供するビジネスとは異なります。"}, {"id": 91, "question": "顧客が定額料金を支払い続けることで継続的にサービスや商品を利用できるビジネスモデルを何と呼ぶか。", "choices": ["バーター取引モデル", "サブスクリプションモデル", "委託販売モデル", "スポット販売モデル"], "category": "企業戦略", "correct": 1, "explanation": "定額課金の継続利用モデル。", "wrongNote": "スポット販売や委託販売、バーター取引はいずれも異なる販売形態であり、定額料金で継続利用できるモデルはサブスクリプションと呼ばれます。"}, {"id": 92, "question": "本部が商標・ノウハウの使用権を加盟店に提供し、対価を得るビジネス形態を何と呼ぶか。", "choices": ["シンジケート", "コンソーシアム", "アウトソーシング", "フランチャイズ"], "category": "企業戦略", "correct": 3, "explanation": "商標・ノウハウ提供の対価を得る形態。", "wrongNote": "アウトソーシングは外部委託、コンソーシアムやシンジケートは共同事業体の形態を指し、商標・ノウハウの使用権提供とは異なります。"}, {"id": 93, "question": "発注元のブランド名で製品を製造する、受託製造の形態を何と呼ぶか。", "choices": ["ROE", "IPO", "OEM", "LBO"], "category": "企業戦略", "correct": 2, "explanation": "発注元ブランドでの受託製造。", "wrongNote": "IPOは新規株式公開、LBOは買収手法、ROEは収益性指標であり、発注元ブランドでの受託製造とは異なる用語です。"}, {"id": 94, "question": "設計から製造までを受託し、発注元のブランドで販売される形態を何と呼ぶか。", "choices": ["ODM", "MBO", "PPM", "TOB"], "category": "企業戦略", "correct": 0, "explanation": "設計から製造までを受託。", "wrongNote": "TOBは株式公開買付け、MBOは経営陣による買収、PPMは事業ポートフォリオ分析であり、設計から製造までを受託する形態とは異なります。"}, {"id": 95, "question": "複数企業が独立性を保ったまま、特定分野で協力関係を結ぶことを何と呼ぶか。", "choices": ["戦略的アライアンス", "完全子会社化", "買収", "カルテル"], "category": "企業戦略", "correct": 0, "explanation": "独立性を保った協力関係。", "wrongNote": "カルテルは競争制限行為、買収や完全子会社化は独立性を失う統合形態であり、独立性を保ったまま協力する関係とは異なります。"}, {"id": 96, "question": "各国市場のニーズに合わせて経営を現地に大きく委ねる国際経営戦略を何と呼ぶか。", "choices": ["垂直統合戦略", "マルチドメスティック戦略", "グローバル統合戦略", "コングロマリット戦略"], "category": "企業戦略", "correct": 1, "explanation": "現地適応を重視。", "wrongNote": "グローバル統合戦略は標準化を重視する戦略、垂直統合戦略はサプライチェーンの一貫化、コングロマリット戦略は異業種展開を指し、現地適応を重視する戦略とは異なります。"}, {"id": 97, "question": "世界市場を一つの市場とみなし、標準化された製品・戦略で展開する国際経営戦略を何と呼ぶか。", "choices": ["ローカライゼーション戦略", "フランチャイズ戦略", "マルチドメスティック戦略", "グローバル戦略"], "category": "企業戦略", "correct": 3, "explanation": "世界を一つの市場とみなし標準化。", "wrongNote": "マルチドメスティック戦略やローカライゼーション戦略は現地適応を重視する考え方であり、フランチャイズ戦略も異なる事業展開手法であるため、世界を一つの市場とみなす標準化戦略とは異なります。"}, {"id": 98, "question": "企業が既存事業の縮小・撤退を通じて経営資源を立て直すことを何と呼ぶか。", "choices": ["IPO", "のれん償却", "カーブアウト", "リストラクチャリング"], "category": "企業戦略", "correct": 3, "explanation": "事業の縮小・再構築。", "wrongNote": "IPOは新規上場、カーブアウトは事業の切り出し、のれん償却は会計処理を指し、事業の縮小・撤退による立て直しとは異なります。"}, {"id": 99, "question": "アンゾフの成長マトリクスにおいて「既存製品」を「新規市場」に投入する戦略を何と呼ぶか。", "choices": ["多角化戦略", "市場浸透戦略", "市場開拓戦略", "新製品開発戦略"], "category": "企業戦略", "correct": 2, "explanation": "既存製品×新規市場。", "wrongNote": "市場浸透戦略は既存製品×既存市場、新製品開発戦略は新製品×既存市場、多角化戦略は新製品×新規市場を指し、既存製品を新規市場に投入する戦略とは異なります。"}, {"id": 100, "question": "アンゾフの成長マトリクスにおいて「新製品」を「新規市場」に投入する戦略を何と呼ぶか。", "choices": ["新製品開発戦略", "市場開拓戦略", "多角化戦略", "市場浸透戦略"], "category": "企業戦略", "correct": 2, "explanation": "新製品×新規市場。  --- # 第3章：会計・財務（Q101〜Q150）", "wrongNote": "市場浸透戦略は既存製品×既存市場、市場開拓戦略は既存製品×新規市場、新製品開発戦略は新製品×既存市場を指し、新製品を新規市場に投入する戦略が多角化戦略です。"}, {"id": 101, "question": "「財務三表」に含まれないものはどれか。", "choices": ["有価証券報告書", "損益計算書", "貸借対照表", "キャッシュフロー計算書"], "category": "会計・財務", "correct": 0, "explanation": "財務三表はBS・PL・CF計算書の3つ。有報はそれらを含む開示書類。", "wrongNote": "貸借対照表・損益計算書・キャッシュフロー計算書はまさに財務三表そのものであり、それらを含む開示書類が有価証券報告書です。"}, {"id": 102, "question": "貸借対照表が示す内容として正しいものはどれか。", "choices": ["一定期間の売上と費用の状況", "ある一時点における会社の資産・負債・純資産の状況", "株主への配当実績のみ", "一定期間の現金の増減"], "category": "会計・財務", "correct": 1, "explanation": "ストック情報。", "wrongNote": "一定期間の売上・費用は損益計算書、現金の増減はキャッシュフロー計算書の説明であり、貸借対照表は一時点のストック情報を示します。"}, {"id": 103, "question": "損益計算書が示す内容として正しいものはどれか。", "choices": ["ある一時点における資産の残高", "一定期間における収益と費用、その結果としての利益", "株主構成の変化", "現金及び現金同等物の増減"], "category": "会計・財務", "correct": 1, "explanation": "フロー情報。", "wrongNote": "ある一時点の資産残高は貸借対照表、現金の増減はキャッシュフロー計算書の説明であり、損益計算書は一定期間のフロー情報を示します。"}, {"id": 104, "question": "売上高から売上原価を差し引いた利益を何と呼ぶか。", "choices": ["経常利益", "売上総利益", "当期純利益", "営業利益"], "category": "会計・財務", "correct": 1, "explanation": "いわゆる「粗利」。", "wrongNote": "営業利益は販管費を差し引いた後、経常利益は営業外損益を加減した後、当期純利益は最終的な利益であり、売上高から売上原価のみを差し引いたものが売上総利益です。"}, {"id": 105, "question": "売上総利益から販売費及び一般管理費を差し引いた利益を何と呼ぶか。", "choices": ["営業利益", "特別利益", "経常利益", "売上総利益"], "category": "会計・財務", "correct": 0, "explanation": "本業の儲けを示す。", "wrongNote": "売上総利益は売上高から売上原価を差し引いたもの、経常利益は営業外損益を加減した後の利益、特別利益は一時的な損益を指します。"}, {"id": 106, "question": "営業利益に受取利息や支払利息などの営業外損益を加減した利益を何と呼ぶか。", "choices": ["当期純利益", "売上総利益", "営業利益", "経常利益"], "category": "会計・財務", "correct": 3, "explanation": "営業損益＋営業外損益。", "wrongNote": "売上総利益や営業利益はそれ以前の段階の利益、当期純利益は特別損益や税金を差し引いた最終利益であり、営業利益に営業外損益を加減したものが経常利益です。"}, {"id": 107, "question": "本業とは無関係な一時的な損益を計上する区分はどれか。", "choices": ["販売費及び一般管理費", "営業外損益", "売上高", "特別損益"], "category": "会計・財務", "correct": 3, "explanation": "一時的・臨時的な損益の区分。", "wrongNote": "営業外損益は経常的に発生する財務関連の損益、販管費は営業活動に伴う費用であり、一時的・臨時的な損益は特別損益に区分されます。"}, {"id": 108, "question": "建物や機械などの固定資産の取得原価を、使用期間にわたって費用配分する会計処理を何と呼ぶか。", "choices": ["繰延処理", "減価償却", "減損処理", "圧縮記帳"], "category": "会計・財務", "correct": 1, "explanation": "固定資産の費用配分。", "wrongNote": "減損処理は収益性が著しく低下した際の評価減、圧縮記帳は税務上の特例処理であり、通常の使用期間にわたる費用配分は減価償却と呼ばれます。"}, {"id": 109, "question": "総資産に占める自己資本の割合を示す指標を何と呼ぶか。", "choices": ["固定比率", "流動比率", "当座比率", "自己資本比率"], "category": "会計・財務", "correct": 3, "explanation": "財務の安全性指標。", "wrongNote": "流動比率や当座比率は短期的な支払能力を示す指標、固定比率は固定資産と自己資本の関係を示す指標であり、総資産に占める自己資本の割合とは異なります。"}, {"id": 110, "question": "自己資本に対する当期純利益の割合を示す、株主目線の収益性指標を何と呼ぶか。", "choices": ["ROA", "PER", "ROE", "ROI"], "category": "会計・財務", "correct": 2, "explanation": "株主資本に対する収益性。", "wrongNote": "ROAは総資産に対する利益率、ROIは投資額に対する利益率、PERは株価の割高・割安を示す指標であり、自己資本に対する収益性を示すのはROEです。"}, {"id": 111, "question": "総資産に対する当期純利益の割合を示す指標を何と呼ぶか。", "choices": ["EPS", "ROA", "ROE", "PBR"], "category": "会計・財務", "correct": 1, "explanation": "総資産の効率的活用度を示す。", "wrongNote": "ROEは自己資本に対する利益率、PBRは株価純資産倍率、EPSは1株当たり利益を示す指標であり、総資産に対する利益率を示すのはROAです。"}, {"id": 112, "question": "流動資産を流動負債で割った、短期的な支払い能力を示す指標を何と呼ぶか。", "choices": ["流動比率", "総資産回転率", "固定比率", "自己資本比率"], "category": "会計・財務", "correct": 0, "explanation": "短期支払能力の代表指標。", "wrongNote": "自己資本比率は財務の安全性全体を示す指標、固定比率は固定資産と自己資本の関係、総資産回転率は資産効率を示す指標であり、短期支払能力を示すのは流動比率です。"}, {"id": 113, "question": "棚卸資産を除いた流動資産で流動負債をカバーできるかを見る、より厳格な短期支払能力指標を何と呼ぶか。", "choices": ["流動比率", "当座比率", "固定比率", "インタレスト・カバレッジ・レシオ"], "category": "会計・財務", "correct": 1, "explanation": "棚卸資産を除くためより厳格。", "wrongNote": "流動比率は棚卸資産を含んだ指標であり、固定比率や利払い能力を示すインタレスト・カバレッジ・レシオとも異なる、棚卸資産を除いたより厳格な指標が当座比率です。"}, {"id": 114, "question": "キャッシュフロー計算書の3区分に含まれないものはどれか。", "choices": ["投資活動によるキャッシュフロー", "財務活動によるキャッシュフロー", "経常活動によるキャッシュフロー", "営業活動によるキャッシュフロー"], "category": "会計・財務", "correct": 2, "explanation": "CF計算書は営業・投資・財務の3区分。", "wrongNote": "営業活動・投資活動・財務活動によるキャッシュフローが実際の3区分であり、「経常活動によるキャッシュフロー」という区分は存在しません。"}, {"id": 115, "question": "利払前・税引前・減価償却前利益を示す指標を何と呼ぶか。", "choices": ["PER", "PBR", "EPS", "EBITDA"], "category": "会計・財務", "correct": 3, "explanation": "利払・税・償却前の利益。", "wrongNote": "EPSは1株当たり利益、PERは株価収益率、PBRは株価純資産倍率を示す指標であり、利払・税・償却前の利益を示すのはEBITDAです。"}, {"id": 116, "question": "株価が1株当たり純利益の何倍まで買われているかを示す指標を何と呼ぶか。", "choices": ["PBR", "ROE", "PER", "配当利回り"], "category": "会計・財務", "correct": 2, "explanation": "株価の割高・割安を測る代表指標。", "wrongNote": "PBRは株価純資産倍率、ROEは自己資本利益率、配当利回りは株価に対する配当金の割合を示す指標であり、株価とEPSの関係を示すのはPERです。"}, {"id": 117, "question": "株価が1株当たり純資産の何倍まで買われているかを示す指標を何と呼ぶか。", "choices": ["配当性向", "PBR", "PER", "ROA"], "category": "会計・財務", "correct": 1, "explanation": "解散価値に対する株価の評価。", "wrongNote": "PERは株価収益率、ROAは総資産利益率、配当性向は利益に占める配当の割合を示す指標であり、株価と1株当たり純資産の関係を示すのはPBRです。"}, {"id": 118, "question": "当期純利益のうち、配当金として株主に還元される割合を示す指標を何と呼ぶか。", "choices": ["配当利回り", "内部留保率", "配当性向", "自己資本比率"], "category": "会計・財務", "correct": 2, "explanation": "純利益に占める配当の割合。", "wrongNote": "配当利回りは株価に対する配当金の割合、自己資本比率は財務の安全性を示す指標であり、内部留保率は逆に社内に残す割合を示すため、配当性向とは視点が異なります。"}, {"id": 119, "question": "発行済株式数に株価を掛け合わせた、企業の市場評価額を何と呼ぶか。", "choices": ["発行済資本金", "純資産額", "簿価総額", "時価総額"], "category": "会計・財務", "correct": 3, "explanation": "株価×発行済株式数。", "wrongNote": "簿価総額は帳簿上の評価額、純資産額は資産から負債を差し引いた額、発行済資本金は出資額に基づく数値であり、株価×発行済株式数で示されるのが時価総額です。"}, {"id": 120, "question": "売上高と費用が等しくなり、利益がゼロになる売上高の水準を何と呼ぶか。", "choices": ["均衡価格", "分水嶺点", "損益分岐点", "減損点"], "category": "会計・財務", "correct": 2, "explanation": "利益ゼロとなる売上水準。", "wrongNote": "減損点や分水嶺点は一般的な会計用語として定着しておらず、均衡価格は需給が一致する価格水準を指すため、売上と費用が等しくなる水準を指す損益分岐点とは異なります。"}, {"id": 121, "question": "売上の増減にかかわらず一定額発生する費用を何と呼ぶか。", "choices": ["機会費用", "固定費", "埋没費用", "変動費"], "category": "会計・財務", "correct": 1, "explanation": "売上に関係なく発生。", "wrongNote": "変動費は売上に比例して発生する費用、機会費用は選択しなかった場合の逸失利益、埋没費用は既に支出し回収不能な費用であり、売上に関係なく一定額発生するのは固定費です。"}, {"id": 122, "question": "売上の増減に比例して発生する費用を何と呼ぶか。", "choices": ["固定費", "減価償却費", "資本的支出", "変動費"], "category": "会計・財務", "correct": 3, "explanation": "売上に比例して増減。", "wrongNote": "固定費は売上に関係なく一定額発生する費用、資本的支出は固定資産への投資、減価償却費は固定資産の費用配分を指し、売上に比例するのが変動費です。"}, {"id": 123, "question": "企業が獲得した利益のうち、配当されずに社内に蓄積された部分を何と呼ぶか。", "choices": ["資本金", "内部留保", "短期借入金", "買掛金"], "category": "会計・財務", "correct": 1, "explanation": "配当されず社内に蓄積される利益。", "wrongNote": "資本金は株主からの出資額、短期借入金や買掛金は負債であり、配当されずに社内に蓄積された利益を指すのは内部留保です。"}, {"id": 124, "question": "保有する資産の収益性が著しく低下した場合に帳簿価額を切り下げる会計処理を何と呼ぶか。", "choices": ["減価償却", "繰延資産計上", "減損処理", "圧縮記帳"], "category": "会計・財務", "correct": 2, "explanation": "資産の収益性低下を反映。", "wrongNote": "減価償却は通常の使用期間にわたる費用配分、圧縮記帳は税務上の特例処理、繰延資産計上は費用の資産計上を指し、収益性の著しい低下時の評価減は減損処理です。"}, {"id": 125, "question": "将来発生する可能性のある費用や損失に備え、あらかじめ計上しておく負債項目を何と呼ぶか。", "choices": ["未収金", "前受金", "引当金", "仮払金"], "category": "会計・財務", "correct": 2, "explanation": "将来の費用・損失に備える負債。", "wrongNote": "前受金は代金の前受け、未収金は未回収の代金、仮払金は一時的な支払いを指し、将来の費用・損失に備える負債は引当金と呼ばれます。"}, {"id": 126, "question": "親会社と子会社の財務諸表を合算し、グループ全体の経営成績を示す決算を何と呼ぶか。", "choices": ["概算決算", "中間決算", "連結決算", "単体決算"], "category": "会計・財務", "correct": 2, "explanation": "グループ全体の経営成績を示す。", "wrongNote": "単体決算は個社ごとの決算、概算決算や中間決算は別の区分を指し、親会社と子会社を合算するのは連結決算です。"}, {"id": 127, "question": "議決権の20〜50％程度を保有する関連会社の業績を、持分割合に応じて連結財務諸表に反映させる会計処理を何と呼ぶか。", "choices": ["時価法", "持分法", "連結法", "原価法"], "category": "会計・財務", "correct": 1, "explanation": "持分割合に応じて業績を反映。", "wrongNote": "連結法は子会社を全面的に合算する方法、原価法や時価法は資産の評価方法であり、持分割合に応じて業績を反映させるのは持分法です。"}, {"id": 128, "question": "国際的に広く採用されている会計基準の略称として正しいものはどれか。", "choices": ["TOPIX", "JASDAQ", "IFRS", "GAAP"], "category": "会計・財務", "correct": 2, "explanation": "国際財務報告基準。", "wrongNote": "GAAPは各国の会計基準を指す言葉、JASDAQやTOPIXは日本の株式市場・指数の名称であり、国際的に採用されている会計基準はIFRSです。"}, {"id": 129, "question": "外貨建て資産・負債を円換算する際に発生する損益を何と呼ぶか。", "choices": ["為替差損益", "特別損失のみ", "減損損失", "償却損"], "category": "会計・財務", "correct": 0, "explanation": "外貨建て資産負債の円換算差額。", "wrongNote": "減損損失は資産の評価減、償却損は資産の償却に伴う損失を指し、特別損失だけに限られるわけでもなく、外貨建て資産負債の円換算で生じるのは為替差損益です。"}, {"id": 130, "question": "上場企業が投資家保護のために事業年度ごとに開示する法定書類を何と呼ぶか。", "choices": ["議事録", "就業規則", "定款", "有価証券報告書"], "category": "会計・財務", "correct": 3, "explanation": "投資家保護のための法定開示書類。", "wrongNote": "定款は会社の基本規則、就業規則は労働条件の規則、議事録は会議の記録であり、投資家保護のための法定開示書類は有価証券報告書です。"}, {"id": 131, "question": "2023年に日本で導入された、仕入税額控除の適用要件を厳格化する消費税の新制度を何と呼ぶか。", "choices": ["インボイス制度", "マイナンバー制度", "ふるさと納税制度", "NISA制度"], "category": "会計・財務", "correct": 0, "explanation": "2023年10月開始。", "wrongNote": "マイナンバー制度やふるさと納税制度、NISA制度はいずれも消費税とは別の制度であり、仕入税額控除の要件を厳格化したのはインボイス制度です。"}, {"id": 132, "question": "消費税のように、税を負担する者と納める者が異なる税を何と呼ぶか。", "choices": ["資産税", "間接税", "財産税", "直接税"], "category": "会計・財務", "correct": 1, "explanation": "消費税の代表的性質。", "wrongNote": "直接税は税を負担する人と納める人が同じ税を指し、資産税や財産税とも分類の軸が異なるため、消費税は間接税に分類されます。"}, {"id": 133, "question": "企業の所得に対して課される税を何と呼ぶか。", "choices": ["法人税", "固定資産税", "贈与税", "相続税"], "category": "会計・財務", "correct": 0, "explanation": "企業の所得課税。", "wrongNote": "相続税や贈与税は個人の資産移転に対する税、固定資産税は資産保有に対する税であり、企業の所得に対して課されるのは法人税です。"}, {"id": 134, "question": "減価償却の方法のうち、毎期一定額を償却する方式を何と呼ぶか。", "choices": ["生産高比例法", "定率法", "級数法", "定額法"], "category": "会計・財務", "correct": 3, "explanation": "毎期一定額を償却。", "wrongNote": "定率法は未償却残高に一定率をかける方式、生産高比例法は生産量に応じた償却、級数法は償却率を逓減させる方式であり、毎期一定額を償却するのは定額法です。"}, {"id": 135, "question": "減価償却の方法のうち、未償却残高に一定率を掛けて償却額を計算し、初期の償却額が大きくなる方式を何と呼ぶか。", "choices": ["定率法", "定額法", "個別償却法", "総合償却法"], "category": "会計・財務", "correct": 0, "explanation": "初期の償却額が大きい方式。", "wrongNote": "定額法は毎期一定額を償却する方式、総合償却法や個別償却法は資産のまとめ方の違いを指し、未償却残高に一定率をかけるのは定率法です。"}, {"id": 136, "question": "販売目的で保有する商品・製品・原材料などの資産を何と呼ぶか。", "choices": ["固定資産", "棚卸資産", "繰延資産", "投資有価証券"], "category": "会計・財務", "correct": 1, "explanation": "販売目的で保有する資産。", "wrongNote": "固定資産は長期使用目的の資産、繰延資産は費用の資産計上、投資有価証券は投資目的の有価証券であり、販売目的で保有する資産は棚卸資産です。"}, {"id": 137, "question": "商品を販売したがまだ代金を受け取っていない場合に計上される資産を何と呼ぶか。", "choices": ["買掛金", "売掛金", "前受金", "未払金"], "category": "会計・財務", "correct": 1, "explanation": "未回収の売上代金債権。", "wrongNote": "買掛金は仕入代金の未払い、前受金は代金の前受け、未払金は代金以外の未払い債務を指し、販売代金の未回収債権は売掛金です。"}, {"id": 138, "question": "商品を仕入れたがまだ代金を支払っていない場合に計上される負債を何と呼ぶか。", "choices": ["未収金", "売掛金", "買掛金", "前払金"], "category": "会計・財務", "correct": 2, "explanation": "未払いの仕入代金債務。", "wrongNote": "売掛金は販売代金の未回収債権、前払金は代金の前払い、未収金は代金以外の未回収債権を指し、仕入代金の未払いは買掛金です。"}, {"id": 139, "question": "仕入から販売、代金回収までにかかる日数を示す、資金効率を測る指標を何と呼ぶか。", "choices": ["損益分岐点比率", "デットエクイティレシオ", "インタレスト・カバレッジ・レシオ", "キャッシュ・コンバージョン・サイクル"], "category": "会計・財務", "correct": 3, "explanation": "資金効率を測る指標。", "wrongNote": "損益分岐点比率や利払い能力を示すインタレスト・カバレッジ・レシオ、負債比率を示すデットエクイティレシオはいずれも別の指標であり、資金回収までの日数を示すのがキャッシュ・コンバージョン・サイクルです。"}, {"id": 140, "question": "営業活動によるキャッシュフローから設備投資などの投資支出を差し引いた、企業が自由に使えるお金を何と呼ぶか。", "choices": ["オペレーティングレバレッジ", "フリーキャッシュフロー", "グロスキャッシュフロー", "ネットキャッシュフロー"], "category": "会計・財務", "correct": 1, "explanation": "営業CF−投資CF。", "wrongNote": "グロスキャッシュフローやネットキャッシュフローは単純な総額・純額の集計、オペレーティングレバレッジは費用構造を示す指標であり、営業CFから投資支出を差し引いたものがフリーキャッシュフローです。"}, {"id": 141, "question": "株価に対する年間配当金の割合を示す指標を何と呼ぶか。", "choices": ["配当利回り", "配当性向", "PBR", "PER"], "category": "会計・財務", "correct": 0, "explanation": "株価に対する配当金の割合。", "wrongNote": "配当性向は利益に占める配当の割合、PERは株価収益率、PBRは株価純資産倍率を示す指標であり、株価に対する配当金の割合を示すのが配当利回りです。"}, {"id": 142, "question": "企業が市場に流通する自社の株式を買い戻す行為を何と呼ぶか。", "choices": ["第三者割当増資", "株式分割", "株式併合", "自社株買い"], "category": "会計・財務", "correct": 3, "explanation": "流通株式数を減らす行為。", "wrongNote": "株式分割は1株を複数に分ける行為、株式併合は複数株を1株にまとめる行為、第三者割当増資は特定の第三者への新株発行を指し、自社の株式を買い戻す行為は自社株買いです。"}, {"id": 143, "question": "企業が新株を発行して資金を調達することを何と呼ぶか。", "choices": ["増資", "減資", "引当", "償却"], "category": "会計・財務", "correct": 0, "explanation": "新株発行による資金調達。", "wrongNote": "減資は資本金を減らす行為、償却は資産の費用配分、引当は将来の費用への備えを指し、新株発行による資金調達は増資です。"}, {"id": 144, "question": "企業が投資家からの借入として発行する債券を何と呼ぶか。", "choices": ["社債", "為替予約", "株式", "手形"], "category": "会計・財務", "correct": 0, "explanation": "企業が発行する借入証券。", "wrongNote": "株式は出資に対して発行される証券、手形は決済手段、為替予約は為替リスク回避のための契約であり、借入として発行される債券は社債です。"}, {"id": 145, "question": "債券や発行体の信用力を評価し、記号で示す会社を何と呼ぶか。", "choices": ["監査法人", "税理士法人", "格付け会社", "証券取引所"], "category": "会計・財務", "correct": 2, "explanation": "信用力を記号で評価。", "wrongNote": "証券取引所は株式等の売買の場、監査法人は会計監査を行う法人、税理士法人は税務業務を行う法人であり、信用力を評価するのは格付け会社です。"}, {"id": 146, "question": "債務者が約束通りに元利金を支払えなくなるリスクを何と呼ぶか。", "choices": ["流動性リスク", "デフォルトリスク", "カントリーリスク", "インフレリスク"], "category": "会計・財務", "correct": 1, "explanation": "債務不履行のリスク。", "wrongNote": "流動性リスクは資産を現金化しにくいリスク、カントリーリスクは投資先国特有のリスク、インフレリスクは物価上昇によるリスクを指し、元利金の不払いリスクはデフォルトリスクです。"}, {"id": 147, "question": "借入金などの他人資本を活用して自己資本利益率を高める経営手法を何と呼ぶか。", "choices": ["カーブアウト経営", "レバレッジ経営", "デレバレッジ経営", "コングロマリット経営"], "category": "会計・財務", "correct": 1, "explanation": "他人資本を活用した経営手法。", "wrongNote": "デレバレッジ経営はむしろ負債を圧縮する方向の経営、コングロマリット経営は異業種展開、カーブアウト経営は事業の切り出しを指し、他人資本を活用するのはレバレッジ経営です。"}, {"id": 148, "question": "企業が資金調達に要する総合的なコストを示す指標を何と呼ぶか。", "choices": ["ROIC", "WACC", "EBITDA", "EPS"], "category": "会計・財務", "correct": 1, "explanation": "加重平均資本コスト。", "wrongNote": "EBITDAは利払・税・償却前利益、EPSは1株当たり利益、ROICは投下資本利益率を示す指標であり、資金調達コストの総合指標はWACCです。"}, {"id": 149, "question": "資産の「簿価」の説明として正しいものはどれか。", "choices": ["帳簿上に記載されている資産の価額", "現在の市場での売却可能価額", "将来の予想売却価額", "発行済株式数に基づく評価額"], "category": "会計・財務", "correct": 0, "explanation": "簿価の定義。", "wrongNote": "現在の市場売却可能価額は時価、将来の予想売却価額は予測に基づく別の概念、発行済株式数に基づく評価額は時価総額を指し、帳簿上の記載価額が簿価です。"}, {"id": 150, "question": "資産の現在の市場価値を示す価額を何と呼ぶか。", "choices": ["時価", "額面価額", "簿価", "償却原価"], "category": "会計・財務", "correct": 0, "explanation": "市場での現在価値。  --- # 第4章：法務・人事（Q151〜Q200）", "wrongNote": "簿価は帳簿上の記載価額、額面価額は証券に記載された名目上の価額、償却原価は取得原価を償却した後の価額を指し、市場での現在価値を示すのが時価です。"}, {"id": 151, "question": "労働基準法上、勤続6年6か月以上（フルタイム勤務）の労働者に付与される年次有給休暇の日数として正しいものはどれか。", "choices": ["20日", "25日", "10日", "15日"], "category": "法務・人事", "correct": 0, "explanation": "勤続年数に応じて増加し、6年6か月以上で上限の20日となる。", "wrongNote": "15日は勤続4年6か月時点の日数、10日は初回付与（6か月勤続）時点の日数であり、25日という上限は労基法上設定されていません。"}, {"id": 152, "question": "36協定を締結した場合でも、時間外労働の上限として労働基準法が原則定める月間の時間数はどれか（特別条項なしの場合）。", "choices": ["月100時間", "月45時間", "月80時間", "月60時間"], "category": "法務・人事", "correct": 1, "explanation": "原則の上限は月45時間・年360時間。", "wrongNote": "月60時間や月80時間、月100時間は特別条項付き36協定でも超えてはならない上限に近い数値であり、特別条項なしの原則的な上限は月45時間です。"}, {"id": 153, "question": "1年単位の変形労働時間制と1か月単位の変形労働時間制の違いとして正しいものはどれか。", "choices": ["対象期間の長さが異なり、1年単位の方が労働日数等の制限が厳格になる", "1年単位の変形労働時間制は正社員のみ、1か月単位はパートのみが対象", "両制度に実質的な違いはなく呼び方が異なるだけである", "1か月単位の変形労働時間制は労使協定の締結が不要である"], "category": "法務・人事", "correct": 0, "explanation": "1年単位は対象期間が長い分、労働日数や連続労働日数の上限などがより厳格に定められている。", "wrongNote": "雇用形態で対象が分かれる制度ではなく、1か月単位の制度も労使協定または就業規則の定めが必要であり、両者は対象期間の長さや規制の厳格さが異なる別の制度です。"}, {"id": 154, "question": "労働基準法上、原則として解雇が制限される期間として正しい組み合わせはどれか。", "choices": ["年次有給休暇取得期間とその後30日間", "業務上・業務外を問わずあらゆる病気休業期間とその後30日間", "育児休業期間中に限り、産前産後休業期間は含まれない", "業務上負傷・疾病による療養のための休業期間とその後30日間、産前産後休業期間とその後30日間"], "category": "法務・人事", "correct": 3, "explanation": "業務上の傷病による休業と産前産後休業の期間およびその後30日間は原則解雇できない。", "wrongNote": "業務外の私傷病による休業や年次有給休暇の取得はこの解雇制限の対象ではなく、育児休業期間も別の規律で保護されるため、正しい組み合わせは業務上傷病と産前産後休業に関するものです。"}, {"id": 155, "question": "育児・介護休業法上、育児休業の対象となる子の年齢の原則として正しいものはどれか。", "choices": ["原則として生後6か月に達するまで", "原則として小学校就学まで", "原則として1歳に達するまで（要件を満たせば最長2歳まで延長可）", "原則として3歳に達するまで"], "category": "法務・人事", "correct": 2, "explanation": "原則1歳まで、保育所に入れない等の事情があれば最長2歳まで延長できる。", "wrongNote": "3歳までや小学校就学までは短時間勤務制度など別の措置の対象年齢であり、生後6か月は産後休業に近い期間であるため、育児休業の原則対象年齢とは異なります。"}, {"id": 156, "question": "パワーハラスメントの代表的な6類型のうち、「業務上明らかに不要なことや遂行不可能なことの強制、仕事の妨害」に該当する類型はどれか。", "choices": ["身体的な攻撃", "人間関係からの切り離し", "個の侵害", "過大な要求"], "category": "法務・人事", "correct": 3, "explanation": "遂行不可能な業務の強制や仕事の妨害は「過大な要求」に分類される。", "wrongNote": "身体的な攻撃は暴行・傷害、人間関係からの切り離しは隔離や仲間外れ、個の侵害はプライバシーへの過度な立ち入りを指す類型であり、業務遂行の強制・妨害とは異なる類型です。"}, {"id": 157, "question": "労働基準法上の「管理監督者」に該当するための実質的な要件として適切なものはどれか。", "choices": ["役職名に「課長」や「マネージャー」が含まれていること", "経営者と一体的な立場で、労働時間管理を受けず、地位にふさわしい待遇を得ていること", "月給制で支払われていること", "部下を1人でも持っていること"], "category": "法務・人事", "correct": 1, "explanation": "肩書きではなく、権限・裁量・待遇等の実態に基づいて判断される。", "wrongNote": "役職名や月給制、部下の有無は形式的な要素にすぎず、管理監督者かどうかは経営者と一体的な立場か、労働時間の裁量や待遇の実態があるかで実質的に判断されます。"}, {"id": 158, "question": "就業規則を新たに作成・変更する際、労働基準法上、使用者に義務付けられている手続きとして正しいものはどれか。", "choices": ["労働基準監督署の事前許可を得ること", "労働者の過半数で組織する労働組合、それがない場合は過半数代表者の意見を聴くこと", "全労働者から個別に同意書を取得すること", "特に手続きは不要で、使用者が自由に定めてよい"], "category": "法務・人事", "correct": 1, "explanation": "意見を聴く義務はあるが、同意までは必須ではない。", "wrongNote": "全労働者からの個別同意取得や労基署の事前許可は法律上の要件ではなく、意見聴取なしで自由に定めてよいわけでもないため、過半数労働組合または過半数代表者からの意見聴取が正しい手続きです。"}, {"id": 159, "question": "労働契約法上、有期労働契約が通算で何年を超えて更新された場合に、労働者の申込みにより無期労働契約に転換できるか。", "choices": ["5年", "3年", "1年", "10年"], "category": "法務・人事", "correct": 0, "explanation": "いわゆる無期転換ルールは通算契約期間が5年を超える場合に成立する。", "wrongNote": "1年や3年では通算期間の要件を満たさず、10年は大学教員等の一部特例に関わる年数であり、原則的な無期転換ルールの通算期間は5年です。"}, {"id": 160, "question": "同一労働同一賃金のガイドラインが主な対象としている待遇差はどれか。", "choices": ["業種の異なる企業間の賃金水準の差", "本社勤務と支社勤務の間の待遇差", "正社員と、パートタイム労働者・有期雇用労働者・派遣労働者との間の不合理な待遇差", "正社員同士の年齢による待遇差"], "category": "法務・人事", "correct": 2, "explanation": "非正規雇用と正社員との間の不合理な待遇差の是正を目的とする。", "wrongNote": "正社員同士の年齢差や勤務地の違い、業種間の賃金水準差は同一労働同一賃金ガイドラインの直接の対象ではなく、対象となるのは正社員と非正規雇用労働者との間の待遇差です。"}, {"id": 161, "question": "会社法上、非公開会社における取締役の任期の原則として正しいものはどれか。", "choices": ["任期の定めを置くことは認められていない", "常に4年で固定されている", "常に2年で固定されている", "定款により最長10年まで伸長できる"], "category": "法務・人事", "correct": 3, "explanation": "原則は2年だが、非公開会社は定款で最長10年まで伸長可能。", "wrongNote": "公開会社では原則2年で伸長できませんが、任期を定款で定めないことはできず、4年という数値は監査役の任期に関する原則であるため、非公開会社の取締役任期は最長10年まで伸ばせます。"}, {"id": 162, "question": "会社法上の「大会社」の定義として正しいものはどれか。", "choices": ["最終事業年度の資本金が5億円以上、または負債の合計額が200億円以上の株式会社", "売上高が100億円以上の株式会社", "上場している株式会社すべて", "従業員数が1000人以上の株式会社"], "category": "法務・人事", "correct": 0, "explanation": "資本金5億円以上または負債200億円以上のいずれかを満たすと大会社に該当する。", "wrongNote": "従業員数や売上高、上場の有無は会社法上の大会社の定義要件ではなく、資本金または負債総額の基準によって大会社かどうかが判定されます。"}, {"id": 163, "question": "株主総会の特別決議が成立するために、原則として必要な要件はどれか。", "choices": ["出席株主全員の賛成", "取締役会の承認があれば株主総会の決議は不要", "発行済株式総数の過半数の賛成のみで足りる", "議決権を行使できる株主の議決権の過半数を有する株主が出席し、出席株主の議決権の3分の2以上の賛成"], "category": "法務・人事", "correct": 3, "explanation": "定足数は議決権の過半数、可決要件は出席株主の議決権の3分の2以上が原則。", "wrongNote": "全会一致までは要求されず、発行済株式総数の過半数の賛成だけでは特別決議の要件を満たさず、取締役会の承認で株主総会決議を省略することもできないため、定足数と3分の2以上の賛成が正しい要件です。"}, {"id": 164, "question": "株主提案権を行使するために、公開会社の株主に原則として求められる要件はどれか。", "choices": ["発行済株式総数の過半数を保有していること", "取締役会の事前承認を得ていること", "1株でも保有していれば誰でも行使できる", "総株主の議決権の1％以上または300個以上の議決権を6か月前から継続して保有していること"], "category": "法務・人事", "correct": 3, "explanation": "少数株主権として一定の保有期間・保有割合の要件が定められている。", "wrongNote": "1株の保有だけでは要件を満たさず、過半数の保有は不要で、取締役会の承認も前提条件ではないため、一定割合または一定数の議決権を継続保有することが要件です。"}, {"id": 165, "question": "独占禁止法が規制する行為類型のうち、「複数の事業者が示し合わせて価格や生産量を取り決める行為」に該当するものはどれか。", "choices": ["不当な取引制限", "私的独占", "不公正な取引方法", "優越的地位の濫用"], "category": "法務・人事", "correct": 0, "explanation": "複数事業者による価格・数量の取り決めは不当な取引制限に分類される。", "wrongNote": "私的独占は単独または少数の事業者が競争を排除・支配する行為、不公正な取引方法は取引条件面での不当な行為全般、優越的地位の濫用は取引上の力関係を利用した不当な要求を指し、複数事業者間の価格・数量の取り決めとは異なる類型です。"}, {"id": 166, "question": "「取引上優位な立場にある事業者が、取引先に対して著しく不利益な要求を押し付ける行為」を独占禁止法上何と呼ぶか。", "choices": ["優越的地位の濫用", "不当な取引制限", "私的独占", "不当廉売"], "category": "法務・人事", "correct": 0, "explanation": "取引上の力関係を利用した不当な要求は優越的地位の濫用に分類される。", "wrongNote": "不当な取引制限は複数事業者間の協定行為、私的独占は競争の排除・支配行為、不当廉売は過度な安売りによる競争阻害を指し、取引上の優位性を利用した不利益要求とは異なる類型です。"}, {"id": 167, "question": "金融商品取引法上のインサイダー取引規制における「重要事実」に該当しない可能性が高いものはどれか。", "choices": ["未公表の重大な業績の下方修正", "未公表の業務提携の決定", "一般に公開された、すでに株価に織り込まれている業績予想の再確認情報", "未公表の第三者割当増資の決定"], "category": "法務・人事", "correct": 2, "explanation": "既に公表され株価に反映済みの情報は、新たな重要事実とはみなされにくい。", "wrongNote": "未公表の業務提携や業績下方修正、第三者割当増資の決定はいずれも典型的な重要事実に該当するため規制対象となりやすく、既に公表済みの情報の再確認とは性質が異なります。"}, {"id": 168, "question": "日本における特許権の存続期間の原則として正しいものはどれか。", "choices": ["出願日から50年", "出願日から20年", "登録日から10年", "登録日から70年"], "category": "法務・人事", "correct": 1, "explanation": "特許権の存続期間は原則として出願日から20年。", "wrongNote": "登録日から10年は商標権の存続期間（更新可能）に近い数値であり、50年や登録日から70年という期間は特許権の制度には存在しないため、正しくは出願日から20年です。"}, {"id": 169, "question": "著作権の保護期間の原則（実名の著作物、日本の制度）として正しいものはどれか。", "choices": ["著作者の死後70年", "著作者の死後50年", "創作後10年", "公表後20年"], "category": "法務・人事", "correct": 0, "explanation": "2018年の法改正により、原則として著作者の死後70年まで保護される。", "wrongNote": "死後50年は改正前の旧制度における期間であり、公表後20年や創作後10年という短い期間は著作権の一般的な保護期間ではないため、現行制度では死後70年が正しい期間です。"}, {"id": 170, "question": "商標権の存続期間の原則として正しいものはどれか。", "choices": ["登録日から10年（更新により半永久的に継続可能）", "登録日から5年（更新不可）", "登録日から70年", "出願日から20年（更新不可）"], "category": "法務・人事", "correct": 0, "explanation": "商標権は登録から10年で、更新登録により何度でも延長できる。", "wrongNote": "出願日から20年は特許権の存続期間、登録日から5年という短い期間や更新不可という条件、70年という期間はいずれも商標権の制度とは異なり、正しくは10年ごとの更新により継続可能な仕組みです。"}, {"id": 171, "question": "不正競争防止法上、「営業秘密」として保護されるために必要とされる要件に含まれないものはどれか。", "choices": ["公然と知られていないこと", "秘密として管理されていること", "事業活動に有用な情報であること", "特許庁への登録がなされていること"], "category": "法務・人事", "correct": 3, "explanation": "営業秘密は登録制度ではなく、秘密管理性・有用性・非公知性の3要件で保護される。", "wrongNote": "秘密管理性・有用性・非公知性はいずれも営業秘密として保護されるための実質的な要件であり、特許権とは異なり、特許庁への登録は営業秘密保護の要件には含まれません。"}, {"id": 172, "question": "個人情報保護法上、本人の人種、信条、病歴などが含まれ、取得に原則本人同意が必要とされる情報を何と呼ぶか。", "choices": ["要配慮個人情報", "仮名加工情報", "個人関連情報", "匿名加工情報"], "category": "法務・人事", "correct": 0, "explanation": "人種・信条・病歴等、特に配慮が必要な情報は要配慮個人情報に分類される。", "wrongNote": "匿名加工情報や仮名加工情報は特定の加工処理を施した情報の分類、個人関連情報は個人データに該当しない関連情報を指す分類であり、機微な情報そのものを指すのは要配慮個人情報です。"}, {"id": 173, "question": "マイナンバーの利用範囲に関する規律として正しいものはどれか。", "choices": ["民間企業が自由な目的で利用してよい", "社会保障、税、災害対策の分野など法律で定められた範囲に限定されている", "利用範囲に関する法律上の制限は存在しない", "本人の同意さえあれば無制限に利用できる"], "category": "法務・人事", "correct": 1, "explanation": "マイナンバー法により利用目的・範囲が限定列挙されている。", "wrongNote": "本人の同意があっても法定範囲を超えた利用は認められず、民間企業が自由に利用できるものでもなく、利用範囲の制限が存在しないというのも誤りであるため、社会保障・税・災害対策等の法定分野に限定される点が正しい規律です。"}, {"id": 174, "question": "下請法の適用対象となるかどうかを判断する際に用いられる主な基準はどれか。", "choices": ["業種が製造業かどうかのみ", "取引が継続的かどうか", "親事業者と下請事業者それぞれの資本金の区分", "取引金額が1000万円を超えるかどうか"], "category": "法務・人事", "correct": 2, "explanation": "取引の内容に加え、親事業者・下請事業者双方の資本金区分によって適用の有無が決まる。", "wrongNote": "取引金額の大小や継続性の有無だけでは適用可否は決まらず、対象は製造業だけに限られないため、資本金区分の組み合わせが下請法適用の主な判断基準です。"}, {"id": 175, "question": "労働者派遣法上、同一の派遣労働者を同一の組織単位で受け入れられる期間の原則的な上限はどれか。", "choices": ["1年", "3年", "5年", "上限は設けられていない"], "category": "法務・人事", "correct": 1, "explanation": "個人単位の期間制限は原則3年。", "wrongNote": "1年では短すぎ、5年は無期転換ルールの通算期間に近い年数であり、期間制限自体は存在するため、正しくは原則3年という個人単位の期間制限です。"}, {"id": 176, "question": "高年齢者雇用安定法における70歳までの就業機会確保に関する事業主の義務として正しいものはどれか。", "choices": ["違反した場合は罰則が科される", "70歳までの雇用確保措置は法律上存在しない", "努力義務として定められている", "すべての事業主に一律の法的義務として定められている"], "category": "法務・人事", "correct": 2, "explanation": "65歳までの雇用確保措置は義務だが、70歳までの就業確保措置は努力義務にとどまる。", "wrongNote": "70歳までの措置は一律の法的義務や罰則付きの規制ではなく、制度自体は存在するため、正しくは努力義務として位置づけられている点です。"}, {"id": 177, "question": "障害者雇用促進法における民間企業の法定雇用率（近年の水準）に最も近いものはどれか。", "choices": ["2.5％前後", "5.0％前後", "0.5％前後", "10.0％前後"], "category": "法務・人事", "correct": 0, "explanation": "民間企業の法定雇用率は段階的に引き上げられ、2.5％前後の水準となっている。", "wrongNote": "0.5％では低すぎ、5.0％や10.0％は実際の法定雇用率よりかなり高い水準であるため、近年の民間企業の法定雇用率は2.5％前後です。"}, {"id": 178, "question": "男女雇用機会均等法上の「間接差別」に該当しうる例として挙げられるものはどれか。", "choices": ["女性であることを理由に採用を拒否すること", "男性であることを理由に昇進させないこと", "合理的な理由なく、募集・採用の要件に身長・体重・体力を一律に設定すること", "性別を理由に賃金を直接差別すること"], "category": "法務・人事", "correct": 2, "explanation": "性別以外の要件でも、実質的に一方の性に不利益が生じる措置は間接差別となりうる。", "wrongNote": "性別を直接の理由とする採用拒否や昇進差別、賃金差別は直接差別に分類され、性別以外の基準を用いつつ実質的な不利益を生じさせる措置が間接差別に当たります。"}, {"id": 179, "question": "育児・介護休業法上の「子の看護休暇」の説明として正しいものはどれか。", "choices": ["子が20歳になるまで無制限に取得できる休暇", "小学校就学前の子の看護等のために、年5日（子が2人以上なら年10日）を限度に取得できる休暇", "子が生まれた直後の父親のみが取得できる休暇", "介護休業と同一の制度であり別枠では取得できない"], "category": "法務・人事", "correct": 1, "explanation": "小学校就学前の子の世話のために、年5日（子2人以上で10日）を限度に取得できる。", "wrongNote": "父親のみに限定される制度ではなく、無制限に取得できるわけでもなく、介護休業とは別の制度として設けられているため、正しくは年5日（子2人以上で10日）を限度とする休暇です。"}, {"id": 180, "question": "労働契約法上の「解雇権濫用法理」の内容として正しいものはどれか。", "choices": ["解雇には必ず労働基準監督署の許可が必要である", "客観的に合理的な理由を欠き、社会通念上相当と認められない解雇は無効となる", "使用者はいつでも自由に労働者を解雇できる", "正当な理由があっても解雇は一切認められない"], "category": "法務・人事", "correct": 1, "explanation": "合理的理由と社会的相当性を欠く解雇は権利濫用として無効となる。", "wrongNote": "使用者が自由に解雇できるわけではなく、労基署の許可が要件となっているわけでもなく、正当な理由があれば解雇自体は認められうるため、正しくは合理性・相当性を欠く解雇が無効となる法理です。"}, {"id": 181, "question": "有期労働契約の「雇止め法理」が適用される典型的な場面として正しいものはどれか。", "choices": ["反復更新により雇用継続への合理的期待が認められる有期契約を、合理的理由なく更新拒絶する場合", "労働者本人が更新を希望しない場合", "初めての契約期間満了時に一律更新しない場合すべて", "無期労働契約の従業員を解雇する場合"], "category": "法務・人事", "correct": 0, "explanation": "更新への合理的期待がある場合の合理的理由のない雇止めは無効となりうる。", "wrongNote": "初回契約満了時の一律不更新や無期契約者の解雇、労働者本人が更新を望まない場合は雇止め法理が問題となる典型例ではなく、反復更新による継続への合理的期待がある場合が典型的な適用場面です。"}, {"id": 182, "question": "労働安全衛生法上、ストレスチェックの実施が事業者に義務付けられている事業場の規模として正しいものはどれか。", "choices": ["常時10人以上の労働者を使用する事業場", "常時50人以上の労働者を使用する事業場", "従業員数に関わらずすべての事業場", "常時100人以上の労働者を使用する事業場"], "category": "法務・人事", "correct": 1, "explanation": "常時50人以上の労働者を使用する事業場で年1回以上の実施が義務付けられている。", "wrongNote": "常時10人以上は就業規則の作成義務が生じる規模、すべての事業場や100人以上という基準は制度上の要件と異なるため、正しくは常時50人以上の事業場が対象です。"}, {"id": 183, "question": "会社法上の監査役の任期の原則として正しいものはどれか。", "choices": ["1年で固定され、伸長は認められない", "2年で固定され、伸長は認められない", "4年（非公開会社では定款により最長10年まで伸長可）", "任期の定めはなく無期限である"], "category": "法務・人事", "correct": 2, "explanation": "監査役の任期は原則4年で、取締役の原則2年より長い。", "wrongNote": "2年は取締役の原則的な任期であり、1年固定や無期限という扱いは監査役の制度と異なるため、正しくは原則4年（非公開会社は最長10年まで伸長可）です。"}, {"id": 184, "question": "監査等委員会設置会社の特徴として正しいものはどれか。", "choices": ["指名委員会・報酬委員会の設置が必須である", "監査等委員会が過半数の社外取締役で構成され、監査役を置かない", "監査役会と監査等委員会の両方を必ず設置する", "社外取締役の設置が禁止されている"], "category": "法務・人事", "correct": 1, "explanation": "監査役を置かず、社外取締役が過半数を占める監査等委員会が監査機能を担う。", "wrongNote": "監査役会と監査等委員会を併設することはなく、指名・報酬委員会の設置は指名委員会等設置会社の要件であり、社外取締役の設置はむしろこの制度の前提であるため、正しくは監査役を置かず社外取締役中心の監査等委員会を設ける点です。"}, {"id": 185, "question": "会社分割のうち、既存の他の会社に事業を承継させる形態を何と呼ぶか。", "choices": ["吸収分割", "株式交換", "新設分割", "株式移転"], "category": "法務・人事", "correct": 0, "explanation": "既存会社への承継は吸収分割、新設会社への承継は新設分割と呼ばれる。", "wrongNote": "新設分割は新たに設立する会社に事業を承継させる形態、株式交換・株式移転は完全親子会社関係を作るための手法であり、既存の他社への事業承継を指すのは吸収分割です。"}, {"id": 186, "question": "事業譲渡と会社分割の違いに関する説明として正しいものはどれか。", "choices": ["会社分割では債権者保護手続きが一切不要である", "事業譲渡は個別の資産・債務ごとに移転手続きが必要だが、会社分割は権利義務が包括的に承継される", "事業譲渡と会社分割はまったく同じ法的効果を持つ", "事業譲渡は会社法上の組織再編行為ではなく、会社分割よりも手続きが常に複雑である"], "category": "法務・人事", "correct": 1, "explanation": "会社分割は包括承継、事業譲渡は個別の資産・契約ごとの移転手続きが必要となる。", "wrongNote": "事業譲渡の方が個別移転が必要な分、手続きが複雑になりやすく、会社分割でも一定の場合に債権者保護手続きが必要となるため、両者はまったく同じ効果を持つわけではなく、承継方式（個別移転か包括承継か）が主な違いです。"}, {"id": 187, "question": "既存の2社が完全親子会社関係を作るために、一方の全株式を他方が取得する組織再編手法を何と呼ぶか。", "choices": ["新設分割", "事業譲渡", "吸収分割", "株式交換"], "category": "法務・人事", "correct": 3, "explanation": "既存会社同士で完全親子関係を作る手法は株式交換と呼ばれる（新設会社を介する場合は株式移転）。", "wrongNote": "吸収分割・新設分割は事業（権利義務）の承継に関する手法、事業譲渡は個別資産の譲渡取引であり、既存会社間で完全親子関係を作る株式取得の手法とは異なります。"}, {"id": 188, "question": "合同会社の特徴として正しいものはどれか。", "choices": ["取締役会の設置が法律上義務付けられている", "出資者の一部が無限責任を負う必要がある", "株式会社と同様、株式を発行して資金調達する", "出資者全員が有限責任社員であり、内部の運営ルールを定款で自由に定めやすい"], "category": "法務・人事", "correct": 3, "explanation": "全社員が有限責任で、内部自治の自由度が高いのが合同会社の特徴。", "wrongNote": "無限責任社員を置く会社形態は合名会社・合資会社であり、合同会社は株式を発行せず、取締役会の設置義務もないため、有限責任と内部自治の柔軟性が合同会社の特徴です。"}, {"id": 189, "question": "合名会社と合資会社の違いとして正しいものはどれか。", "choices": ["合資会社は株式を発行できる会社形態である", "合名会社は社員全員が無限責任社員だが、合資会社は無限責任社員と有限責任社員が混在する", "両者に法的な違いはなく呼び方のみが異なる", "合名会社は社員全員が有限責任社員である"], "category": "法務・人事", "correct": 1, "explanation": "合名会社は無限責任社員のみ、合資会社は無限責任社員と有限責任社員の両方で構成される。", "wrongNote": "合名会社の社員は無限責任であり、合資会社も株式を発行する会社形態ではなく、両者は責任の範囲が異なる別の会社形態です。"}, {"id": 190, "question": "一般社団法人と株式会社の根本的な違いとして正しいものはどれか。", "choices": ["株式会社より一般社団法人の方が設立に大きな財産的基礎が必要である", "一般社団法人には理事や社員総会に相当する機関を置けない", "一般社団法人は株式を発行して資金調達する", "一般社団法人は剰余金を社員に分配できない非営利型の法人である"], "category": "法務・人事", "correct": 3, "explanation": "一般社団法人は事業で得た利益を構成員に分配できない点で株式会社と根本的に異なる。", "wrongNote": "一般社団法人は株式を発行せず、理事や社員総会に相当する機関は設置でき、設立に必要な財産的基礎も株式会社より重いわけではないため、剰余金を分配できない非営利性が根本的な違いです。"}, {"id": 191, "question": "労働審判制度の対象となりにくいものとして正しいものはどれか。", "choices": ["労働条件の変更をめぐる個別労働者と使用者の紛争", "解雇の有効性をめぐる個別労働者と使用者の紛争", "労働組合と使用者との間の団体的な労使紛争", "未払い賃金をめぐる個別労働者と使用者の紛争"], "category": "法務・人事", "correct": 2, "explanation": "労働審判は個別労働紛争の迅速な解決を目的とし、団体的な労使紛争は主な対象ではない。", "wrongNote": "解雇の有効性や未払い賃金、労働条件変更をめぐる紛争はいずれも個別労働紛争として労働審判の典型的な対象であり、対象になりにくいのは団体的な労使紛争です。"}, {"id": 192, "question": "使用者による不当労働行為（団体交渉拒否など）を救済する機関として正しいものはどれか。", "choices": ["労働委員会", "消費者庁", "労働基準監督署", "公正取引委員会"], "category": "法務・人事", "correct": 0, "explanation": "不当労働行為の審査・救済は労働委員会が担う。", "wrongNote": "労働基準監督署は労働基準法違反の監督機関、公正取引委員会は独占禁止法の執行機関、消費者庁は消費者保護行政を担う機関であり、不当労働行為の救済を担うのは労働委員会です。"}, {"id": 193, "question": "使用者が団体交渉を拒否できる「正当な理由」に該当しうるものとして正しいものはどれか。", "choices": ["交渉事項が使用者の権限外であり、義務的団交事項に該当しない場合", "労働組合が正式に結成されて間もないから", "労働組合の要求内容が使用者にとって不利益だから", "労働組合の組合員数が少ないから"], "category": "法務・人事", "correct": 0, "explanation": "義務的団交事項に該当しない事項については、団体交渉を拒否する正当な理由となりうる。", "wrongNote": "要求内容が不利益であることや組合員数の少なさ、結成からの期間の短さは団体交渉拒否の正当な理由とは認められにくく、義務的団交事項に該当しないことが正当な理由となりえます。"}, {"id": 194, "question": "公益通報者保護法によって保護される「公益通報」の対象として正しいものはどれか。", "choices": ["労働者が同僚の私生活上の噂を広めること", "労働者が会社の経営方針に反対する意見を表明すること", "労働者が上司への不満を人事部に伝えること", "労働者等が、勤務先の犯罪行為など一定の法令違反行為を、一定の要件のもとで通報すること"], "category": "法務・人事", "correct": 3, "explanation": "一定の法令違反行為について、一定の要件のもとで行う通報が保護の対象となる。", "wrongNote": "単なる不満の申し出や私生活上の噂の拡散、経営方針への反対意見の表明は公益通報保護法上の保護対象ではなく、対象となるのは法令違反行為に関する一定要件下での通報です。"}, {"id": 195, "question": "コーポレートガバナンス・コードが採用している「コンプライ・オア・エクスプレイン」の考え方として正しいものはどれか。", "choices": ["違反した企業に対して罰金を科す考え方", "上場企業以外にも一律適用される法律上の義務", "すべての原則を法的強制力をもって一律に遵守させる考え方", "原則を実施するか、実施しない場合はその理由を説明するという柔軟な運用の考え方"], "category": "法務・人事", "correct": 3, "explanation": "法的強制ではなく、実施するか、しない場合は理由を説明する自主的な枠組み。", "wrongNote": "法的強制力による一律遵守や罰金の賦課、上場企業以外への一律適用はコーポレートガバナンス・コードの性質と異なり、正しくは実施するか理由を説明するかを選べる柔軟な枠組みです。"}, {"id": 196, "question": "労働基準法上の「賃金支払いの5原則」に含まれないものはどれか。", "choices": ["通貨払いの原則", "全額払いの原則", "直接払いの原則", "賞与優先払いの原則"], "category": "法務・人事", "correct": 3, "explanation": "5原則は通貨払い・直接払い・全額払い・毎月1回以上払い・一定期日払いの5つ。", "wrongNote": "通貨払い・直接払い・全額払いはいずれも実際の5原則に含まれる要素であり、賞与を優先的に支払うべきという原則は労働基準法の賃金支払いの5原則には含まれていません。"}, {"id": 197, "question": "会社法上、取締役が会社に対して負う「善管注意義務」の説明として正しいものはどれか。", "choices": ["会社の利益より自己の利益を優先してよいとする義務", "株主全員から個別に承認を得なければ業務執行できないとする義務", "取締役会に出席する義務のみを指す限定的な義務", "委任契約に基づき、善良な管理者として通常期待される注意を払って職務を行う義務"], "category": "法務・人事", "correct": 3, "explanation": "取締役と会社の関係は委任に関する規定に従い、善管注意義務を負う。", "wrongNote": "自己の利益を優先してよいという内容は忠実義務に反し、株主全員の個別承認や出席義務のみといった限定的な内容でもなく、正しくは委任契約に基づく通常の注意義務を指します。"}, {"id": 198, "question": "株主代表訴訟において、株主が会社に取締役の責任追及を請求してから、原則として何日以内に会社が提訴しない場合、株主自身が訴訟を提起できるか。", "choices": ["10日", "180日", "30日", "60日"], "category": "法務・人事", "correct": 3, "explanation": "株主の提訴請求から60日以内に会社が提訴しない場合、株主が自ら提訴できる。", "wrongNote": "10日や30日では短すぎ、180日は実際の期間より長いため、正しい期間は株主の提訴請求から60日です。"}, {"id": 199, "question": "独占禁止法上、カルテルなどの違反を自主的に申告した事業者に対して課徴金を減免する制度を何と呼ぶか。", "choices": ["確約手続制度", "審判制度", "課徴金減免制度", "優越的地位の濫用救済制度"], "category": "法務・人事", "correct": 2, "explanation": "違反行為を自主的に報告した事業者の課徴金を減免する制度はリニエンシー制度と呼ばれる。", "wrongNote": "確約手続制度は事業者が自主的な改善計画を提出して排除措置命令等を回避する別の制度、審判制度はかつて存在した不服申立て手続き、優越的地位の濫用救済制度という名称の制度は存在せず、自主申告による減免制度がリニエンシー制度です。"}, {"id": 200, "question": "有期労働契約の雇止めについて、労働基準法に基づく告示上、使用者に求められる原則的な対応として正しいものはどれか。", "choices": ["契約締結時に一切の予告なく即日終了させてよい", "労働基準監督署の事前許可を得なければならない", "必ず退職金を支払わなければならない", "契約を3回以上更新しているなど一定の場合、少なくとも30日前までに雇止めの予告をすること"], "category": "法務・人事", "correct": 3, "explanation": "一定要件を満たす有期契約の雇止めには、少なくとも30日前の予告が求められる。", "wrongNote": "即日終了は認められず、退職金の支払いは法律上一律に義務付けられているものではなく、労基署の事前許可も要件ではないため、正しくは一定の場合に30日前までの予告が求められる点です。"}, {"id": 201, "question": "マーケティングミックスの「4P」に含まれないものはどれか。", "choices": ["Product", "Price", "Place", "People"], "category": "マーケティング・販売", "correct": 3, "explanation": "4PはProduct・Price・Place・Promotion。", "wrongNote": "Product・Price・Placeはいずれも実際の4Pの構成要素であり、Peopleは4Pには含まれません（7Pなど拡張モデルで使われる要素です）。"}, {"id": 202, "question": "顧客視点でマーケティングを捉え直した「4C」のうち、企業の「Price」に対応する概念はどれか。", "choices": ["Cost", "Communication", "Customer Value", "Convenience"], "category": "マーケティング・販売", "correct": 0, "explanation": "企業のPriceは顧客視点ではCost（負担）に対応。", "wrongNote": "Customer Valueは製品(Product)、Convenienceは流通(Place)、Communicationは販売促進(Promotion)に対応する概念であり、価格(Price)に対応するのはCostです。"}, {"id": 203, "question": "市場を細分化し、狙う市場を選び、自社の立ち位置を明確化する一連のプロセスを何と呼ぶか。", "choices": ["PPM分析", "STP分析", "3C分析", "SWOT分析"], "category": "マーケティング・販売", "correct": 1, "explanation": "Segmentation・Targeting・Positioning。", "wrongNote": "SWOT分析は内部外部環境分析、PPM分析は事業ポートフォリオ分析、3C分析は自社・競合・顧客の分析を指し、市場細分化・ターゲット選定・ポジショニングの一連のプロセスはSTP分析です。"}, {"id": 204, "question": "ブランドが持つ、価格プレミアムや顧客ロイヤルティなどの無形の資産価値を何と呼ぶか。", "choices": ["商標権", "営業権", "のれん代", "ブランドエクイティ"], "category": "マーケティング・販売", "correct": 3, "explanation": "ブランドの無形資産価値。", "wrongNote": "のれん代や営業権は会計上の概念に近く、商標権は法的な権利を指し、ブランドが持つ無形の資産価値を指すのはブランドエクイティです。"}, {"id": 205, "question": "製品が市場に投入されてから撤退するまでを「導入期・成長期・成熟期・衰退期」に分けて捉える考え方を何と呼ぶか。", "choices": ["バリューチェーン", "プロダクトライフサイクル", "サプライチェーン", "カスタマージャーニー"], "category": "マーケティング・販売", "correct": 1, "explanation": "製品の導入〜衰退の各段階。", "wrongNote": "バリューチェーンは価値創出活動の連鎖、サプライチェーンは供給網、カスタマージャーニーは顧客の行動プロセスを指し、製品の導入から衰退までの段階を捉える考え方はプロダクトライフサイクルです。"}, {"id": 206, "question": "顧客が商品・サービスを認知してから購入、利用後に至るまでの一連の行動・心理プロセスを可視化したものを何と呼ぶか。", "choices": ["バリューチェーン", "コアコンピタンス", "サプライチェーン", "カスタマージャーニー"], "category": "マーケティング・販売", "correct": 3, "explanation": "認知から購入・利用後までの可視化。", "wrongNote": "バリューチェーンやサプライチェーンは企業側の活動の連鎖、コアコンピタンスは企業の中核的な強みを指し、顧客の認知から購入後までのプロセスを可視化したものはカスタマージャーニーです。"}, {"id": 207, "question": "1人の顧客が取引期間全体を通じて企業にもたらす利益の総額を何と呼ぶか。", "choices": ["ARPU", "CPA", "CVR", "LTV"], "category": "マーケティング・販売", "correct": 3, "explanation": "顧客生涯価値。", "wrongNote": "CPAは顧客獲得単価、CVRはコンバージョン率、ARPUは1ユーザー当たりの平均収益を示す指標であり、取引期間全体を通じた利益総額を示すのはLTVです。"}, {"id": 208, "question": "広告等を通じて1件の成果を得るためにかかったコストを何と呼ぶか。", "choices": ["LTV", "KPI", "NPS", "CPA"], "category": "マーケティング・販売", "correct": 3, "explanation": "顧客獲得単価。", "wrongNote": "LTVは顧客生涯価値、NPSは顧客の推奨意向を示す指標、KPIは中間目標を示す指標であり、1件の成果獲得にかかったコストを示すのはCPAです。"}, {"id": 209, "question": "Webサイト訪問者のうち、購入や会員登録などの目的行動に至った割合を何と呼ぶか。", "choices": ["CVR", "CPA", "UU", "PV"], "category": "マーケティング・販売", "correct": 0, "explanation": "訪問者に対する目的行動達成率。", "wrongNote": "CPAは顧客獲得単価、PVはページの閲覧数、UUは訪問者の実人数を示す指標であり、訪問者に占める目的行動達成の割合を示すのはCVRです。"}, {"id": 210, "question": "最終目標である「KGI」を達成するための中間指標を何と呼ぶか。", "choices": ["WACC", "ROI", "KPI", "ROE"], "category": "マーケティング・販売", "correct": 2, "explanation": "KGI達成のための中間指標。", "wrongNote": "ROIは投資利益率、ROEは自己資本利益率、WACCは資本コストを示す指標であり、最終目標KGI達成のための中間指標はKPIです。"}, {"id": 211, "question": "実店舗とECサイトなど複数の販売チャネルを、顧客視点でシームレスに統合する考え方を何と呼ぶか。", "choices": ["アグリゲーター", "B2B2C", "マルチレベルマーケティング", "オムニチャネル"], "category": "マーケティング・販売", "correct": 3, "explanation": "チャネル横断でのシームレスな体験提供。", "wrongNote": "マルチレベルマーケティングは連鎖販売の仕組み、B2B2Cは取引形態の分類、アグリゲーターは情報・サービスを集約する事業者を指し、複数チャネルを統合する考え方はオムニチャネルです。"}, {"id": 212, "question": "メーカーが卸や小売を介さず、消費者に直接商品を販売するビジネスモデルを何と呼ぶか。", "choices": ["OEM", "C2C", "B2B", "D2C"], "category": "マーケティング・販売", "correct": 3, "explanation": "中間流通を介さない直接販売。", "wrongNote": "B2Bは企業間取引、C2Cは消費者間取引、OEMは受託製造を指し、メーカーが直接消費者に販売するモデルはD2Cです。"}, {"id": 213, "question": "SNS上で影響力を持つ人物に商品やサービスを紹介してもらう手法を何と呼ぶか。", "choices": ["アンバサダーマーケティング", "インフルエンサーマーケティング", "マスマーケティング", "リレーションシップマーケティング"], "category": "マーケティング・販売", "correct": 1, "explanation": "影響力のある人物を活用。", "wrongNote": "マスマーケティングは不特定多数への一律訴求、リレーションシップマーケティングは顧客との関係構築を重視する手法であり、影響力のある個人を起用する手法はインフルエンサーマーケティングです。"}, {"id": 214, "question": "有益な記事や動画などのコンテンツを通じて見込み顧客との関係を構築する手法を何と呼ぶか。", "choices": ["トレードマーケティング", "プロダクトマーケティング", "コンテンツマーケティング", "リレーションシップマーケティング"], "category": "マーケティング・販売", "correct": 2, "explanation": "有益な情報発信で関係構築。", "wrongNote": "プロダクトマーケティングは製品の市場投入戦略、トレードマーケティングは店頭での販促活動、リレーションシップマーケティングは関係構築全般を指し、有益なコンテンツを通じた関係構築はコンテンツマーケティングです。"}, {"id": 215, "question": "検索エンジンの検索結果で自然表示の順位を上げるための施策を何と呼ぶか。", "choices": ["SEO", "CRM", "SEM", "CMS"], "category": "マーケティング・販売", "correct": 0, "explanation": "検索エンジン最適化。", "wrongNote": "SEMは検索エンジン上のマーケティング全般を指し広告も含む概念、CRMは顧客関係管理システム、CMSはコンテンツ管理システムであり、自然検索順位を上げる施策はSEOです。"}, {"id": 216, "question": "検索連動型広告のように、クリックされた回数に応じて広告費が発生する広告を何と呼ぶか。", "choices": ["マスメディア広告", "リスティング広告", "純広告", "交通広告"], "category": "マーケティング・販売", "correct": 1, "explanation": "クリック課金型の検索連動広告。", "wrongNote": "純広告は掲載枠を買い切る形式の広告、交通広告は電車・バス等の広告、マスメディア広告はテレビ・新聞等の広告であり、クリック課金型の検索連動広告はリスティング広告です。"}, {"id": 217, "question": "基本機能を無料で提供し、高度な機能を有料にすることで収益化するビジネスモデルを何と呼ぶか。", "choices": ["ダイナミックプライシング", "バンドリング", "サブスクリプション", "フリーミアム"], "category": "マーケティング・販売", "correct": 3, "explanation": "基本無料＋高度機能有料のモデル。", "wrongNote": "サブスクリプションは定額課金モデル、バンドリングは複数商品の組み合わせ販売、ダイナミックプライシングは需給に応じた価格変動を指し、基本機能無料・高度機能有料のモデルはフリーミアムです。"}, {"id": 218, "question": "新製品投入時に低価格で市場に浸透させ、シェア拡大を図る価格戦略を何と呼ぶか。", "choices": ["市場浸透価格戦略", "名声価格戦略", "端数価格戦略", "上澄み吸収価格戦略"], "category": "マーケティング・販売", "correct": 0, "explanation": "低価格でシェア拡大を狙う。", "wrongNote": "上澄み吸収価格戦略は高価格からスタートする戦略、名声価格戦略は高級イメージを演出する価格設定、端数価格戦略は端数で割安感を演出する価格設定であり、低価格でシェア拡大を狙うのは市場浸透価格戦略です。"}, {"id": 219, "question": "新製品投入時にあえて高価格を設定し、価格に敏感でない層から先に利益を回収する価格戦略を何と呼ぶか。", "choices": ["コストプラス価格戦略", "市場浸透価格戦略", "上澄み吸収価格戦略", "均一価格戦略"], "category": "マーケティング・販売", "correct": 2, "explanation": "高価格で先に利益回収。", "wrongNote": "市場浸透価格戦略は低価格からスタートする戦略、均一価格戦略は一律の価格設定、コストプラス価格戦略は原価に利益を上乗せする方式であり、高価格から先に利益を回収するのは上澄み吸収価格戦略です。"}, {"id": 220, "question": "複数の商品・サービスを組み合わせて1つの価格で販売する手法を何と呼ぶか。", "choices": ["アップセル", "アンバンドリング", "バンドリング", "クロスセル"], "category": "マーケティング・販売", "correct": 2, "explanation": "複数商品を組み合わせて販売。", "wrongNote": "アンバンドリングは組み合わせを解いて個別に販売する手法、クロスセルは関連商品の提案、アップセルは上位商品の提案を指し、複数商品を1つの価格で販売するのはバンドリングです。"}, {"id": 221, "question": "顧客が検討中の商品に関連する別の商品も一緒に提案し、購入点数を増やす販売手法を何と呼ぶか。", "choices": ["クロスセル", "ダウンセル", "バンドリング", "アップセル"], "category": "マーケティング・販売", "correct": 0, "explanation": "関連商品の提案。", "wrongNote": "アップセルは上位商品の提案、ダウンセルは下位商品の提案、バンドリングは組み合わせ販売を指し、関連商品を一緒に提案する手法はクロスセルです。"}, {"id": 222, "question": "顧客が検討中の商品より上位・高価格帯の商品を提案する販売手法を何と呼ぶか。", "choices": ["アップセル", "バンドリング", "クロスセル", "ダウンセル"], "category": "マーケティング・販売", "correct": 0, "explanation": "上位商品の提案。", "wrongNote": "クロスセルは関連商品の提案、ダウンセルは下位商品の提案、バンドリングは組み合わせ販売を指し、上位・高価格帯の商品を提案する手法はアップセルです。"}, {"id": 223, "question": "顧客が企業やブランドをどの程度他者に薦めたいと思うかを数値化した指標を何と呼ぶか。", "choices": ["LTV", "ROAS", "CPA", "NPS"], "category": "マーケティング・販売", "correct": 3, "explanation": "推奨意向を数値化した指標。", "wrongNote": "LTVは顧客生涯価値、CPAは顧客獲得単価、ROASは広告費用対効果を示す指標であり、他者への推奨意向を数値化した指標はNPSです。"}, {"id": 224, "question": "マーケティング施策を検討する際に設定する、架空の典型的な顧客像を何と呼ぶか。", "choices": ["インフルエンサー", "アバター", "アンバサダー", "ペルソナ"], "category": "マーケティング・販売", "correct": 3, "explanation": "架空の典型顧客像。", "wrongNote": "アバターは仮
