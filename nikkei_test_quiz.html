<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日経TEST 練習問題 300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0EC;
    --paper-raised:#F7F8F4;
    --ink:#1B2A3F;
    --ink-soft:#54626F;
    --line:#C7CDC4;
    --line-soft:#DDE1D9;
    --seal-correct:#2E6B4F;
    --seal-correct-soft:#E4EFE6;
    --seal-wrong:#B23A2C;
    --seal-wrong-soft:#F3E4DF;
    --gold:#B98A2E;
    --gold-soft:#F1E6CC;
    --serif: 'Shippori Mincho', serif;
    --sans: 'Zen Kaku Gothic New', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(circle at 100% 0%, rgba(185,138,46,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 56px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---------- header ---------- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  header.top .title{
    font-family:var(--serif);
    font-weight:800;
    font-size:22px;
    letter-spacing:.02em;
  }
  header.top .title small{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:2px;
  }
  header.top .score{
    font-family:var(--mono);
    font-size:13px;
    text-align:right;
    color:var(--ink-soft);
  }
  header.top .score b{
    font-size:20px;
    color:var(--ink);
    font-weight:700;
  }

  /* ---------- category chips ---------- */
  .chiprow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    border:1.4px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .toolrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .toolrow .count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .toolbtn{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    background:none;
    border:1.4px solid var(--line);
    border-radius:8px;
    padding:6px 11px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .toolbtn:hover{border-color:var(--ink);color:var(--ink);}

  .jumpform{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .jumpform input{
    font-family:var(--mono);
    font-size:12.5px;
    width:56px;
    padding:6px 8px;
    border-radius:8px;
    border:1.4px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    text-align:center;
  }
  .jumpform input:focus{outline:none;border-color:var(--gold);}
  .jumpform button{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--paper);
    background:var(--ink);
    border:1.4px solid var(--ink);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
  }
  .jumpform span{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }

  /* ---------- progress ---------- */
  .progress-wrap{margin-bottom:22px;}
  .progress-track{
    height:5px;
    background:var(--line-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--ink));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    display:flex;
    justify-content:space-between;
  }

  /* ---------- question card ---------- */
  .card{
    position:relative;
    background:var(--paper-raised);
    border:1.4px solid var(--line);
    border-radius:4px;
    padding:26px 24px 22px;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .qhead{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:6px;
  }
  .qnum{
    font-family:var(--serif);
    font-weight:800;
    font-size:34px;
    color:var(--ink);
    line-height:1;
    flex:0 0 auto;
  }
  .qmeta{
    padding-top:6px;
  }
  .qcat{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  .qtext{
    font-family:var(--sans);
    font-size:16.5px;
    font-weight:700;
    line-height:1.65;
    margin:10px 0 22px;
    padding-left:48px;
  }

  .choices{display:flex;flex-direction:column;gap:9px;padding-left:48px;}
  .choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.4px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:12px 14px;
    cursor:pointer;
    font-size:14.5px;
    line-height:1.5;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .choice:hover:not(.locked){border-color:var(--ink-soft);}
  .choice:active:not(.locked){transform:scale(.995);}
  .choice .mark{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .choice.selected-correct{
    background:var(--seal-correct-soft);
    border-color:var(--seal-correct);
  }
  .choice.selected-correct .mark{border-color:var(--seal-correct);color:var(--seal-correct);background:#fff;}
  .choice.selected-wrong{
    background:var(--seal-wrong-soft);
    border-color:var(--seal-wrong);
  }
  .choice.selected-wrong .mark{border-color:var(--seal-wrong);color:var(--seal-wrong);background:#fff;}
  .choice.reveal-correct:not(.selected-correct){
    border-color:var(--seal-correct);
    border-style:dashed;
  }
  .choice.locked{cursor:default;}

  /* ---------- stamp ---------- */
  .stamp{
    position:absolute;
    top:14px;
    right:16px;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:scale(1.6) rotate(-14deg);
    pointer-events:none;
  }
  .stamp.show{
    animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.9) rotate(-18deg);}
    55%{opacity:1; transform:scale(.92) rotate(-10deg);}
    75%{transform:scale(1.06) rotate(-12deg);}
    100%{opacity:1; transform:scale(1) rotate(-10deg);}
  }
  .stamp svg{width:100%;height:100%;}

  /* ---------- explanation ---------- */
  .explain{
    margin:18px 0 4px 48px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .32s ease, opacity .32s ease, margin .32s ease;
  }
  .explain.show{
    max-height:220px;
    opacity:1;
  }
  .explain-inner{
    border-left:3px solid var(--gold);
    padding:4px 0 4px 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .explain-inner b{color:var(--ink);font-weight:700;}

  .wrongnote{
    margin:10px 0 4px 48px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .32s ease, opacity .32s ease;
  }
  .wrongnote.show{max-height:220px;opacity:1;}
  .wrongnote-inner{
    border-left:3px solid var(--seal-wrong);
    padding:4px 0 4px 14px;
    font-size:13px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .wrongnote-inner .label{
    display:block;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:.08em;
    color:var(--seal-wrong);
    font-weight:700;
    margin-bottom:4px;
  }

  /* ---------- footer nav ---------- */
  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-left:48px;
  }
  .navbtn{
    font-family:var(--sans);
    font-weight:700;
    font-size:13.5px;
    padding:10px 20px;
    border-radius:7px;
    border:1.4px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .navbtn:disabled{opacity:.35;cursor:not-allowed;}
  .navbtn.ghost{
    background:none;
    color:var(--ink-soft);
    border-color:var(--line);
  }

  /* ---------- empty / done state ---------- */
  .done{
    text-align:center;
    padding:40px 20px;
  }
  .done .bigscore{
    font-family:var(--serif);
    font-size:56px;
    font-weight:800;
  }
  .done .bigscore span{font-family:var(--mono);font-size:24px;color:var(--ink-soft);}
  .breakdown{
    margin-top:26px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .breakdown-row .bname{width:150px;flex:0 0 auto;color:var(--ink-soft);font-weight:700;}
  .breakdown-row .btrack{flex:1;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
  .breakdown-row .bfill{height:100%;background:var(--seal-correct);}
  .breakdown-row .bnum{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);width:52px;text-align:right;}

  .footnote{
    text-align:center;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.6;
    margin-top:30px;
    letter-spacing:.05em;
  }

  /* ---------- wrong-answer review panel ---------- */
  .reviewpanel{
    margin-top:26px;
    border:1.4px solid var(--seal-wrong);
    border-radius:6px;
    background:var(--seal-wrong-soft);
    padding:16px 18px;
  }
  .reviewpanel .rhead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .reviewpanel .rtitle{
    font-family:var(--serif);
    font-weight:800;
    font-size:14.5px;
    color:var(--seal-wrong);
  }
  .reviewpanel .rcount{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .reviewlist{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .reviewlist .rnum{
    font-family:var(--mono);
    font-size:12px;
    font-weight:700;
    color:var(--seal-wrong);
    background:var(--paper-raised);
    border:1.2px solid var(--seal-wrong);
    border-radius:5px;
    padding:3px 8px;
    cursor:pointer;
  }
  .reviewlist .rnum:hover{background:var(--seal-wrong);color:var(--paper);}
  .reviewempty{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .reviewplain{
    margin-top:10px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    line-height:1.7;
    word-break:break-all;
    border-top:1px dashed var(--line);
    padding-top:8px;
  }

  @media (max-width:420px){
    .qtext, .choices, .explain, .navrow{padding-left:0;}
    .qhead{gap:10px;}
    .qnum{font-size:28px;}
    .stamp{width:52px;height:52px;top:10px;right:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">日経TEST 練習問題<small>ZEN KOKU ISSEI TAISAKU &middot; 300 QUESTIONS</small></div>
    <div class="score">正解 <b id="scoreCorrect">0</b> / <span id="scoreTotal">0</span></div>
  </header>

  <div class="chiprow" id="chipRow"></div>

  <div class="toolrow">
    <span class="count" id="filterCount"></span>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <form class="jumpform" id="jumpForm">
        <span>問題番号へ移動</span>
        <input type="number" id="jumpInput" min="1" max="300" placeholder="1-300">
        <button type="submit">移動</button>
      </form>
      <button class="toolbtn" id="shuffleBtn">シャッフル</button>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressLabel">問 1 / 300</span><span id="progressPct">0%</span></div>
  </div>

  <div id="quizArea"></div>

  <div class="reviewpanel">
    <div class="rhead">
      <span class="rtitle">間違えた問題番号</span>
      <span class="rcount" id="reviewCount">0問</span>
    </div>
    <div id="reviewList"></div>
  </div>

  <div class="footnote">日経TEST 練習問題集（全300問）をもとに自動生成 &middot; 本ツールは非公式の学習補助教材です</div>
</div>

<script id="quiz-data" type="application/json">[{"id": 1, "question": "GDP（国内総生産）に算入されるものはどれか。", "choices": ["中古住宅の売買額", "新築住宅の建設額", "株式の売買差益", "家庭内での家事労働"], "category": "経営環境", "correct": 1, "explanation": "中古品の取引は新規の生産ではないためGDPに算入されない。", "wrongNote": "中古住宅の売買や株式の売買差益は新たな価値創出ではなく、家事労働は市場取引されないためGDPには算入されません。"}, {"id": 2, "question": "「実質GDP」の説明として正しいものはどれか。", "choices": ["物価変動の影響を除いたGDP", "物価変動を含んだままのGDP", "輸出のみを集計したGDP", "政府支出のみを集計したGDP"], "category": "経営環境", "correct": 0, "explanation": "名目GDPから物価変動分を調整したもの。", "wrongNote": "Bは名目GDPの説明、C・Dはそれぞれ輸出や政府支出のみを指す説明であり、GDP全体の定義ではありません。"}, {"id": 3, "question": "ある国のGDPが前年100兆円から103兆円になった場合の経済成長率はどれか。", "choices": ["0.3％", "3％", "30％", "103％"], "category": "経営環境", "correct": 1, "explanation": "(103-100)/100=3％。", "wrongNote": "0.3％は桁の取り違え、30％や103％は増加額ではなく増加後の金額を誤って用いた計算です。"}, {"id": 4, "question": "消費者物価指数（CPI）が測定する対象として正しいものはどれか。", "choices": ["企業間で取引される財の価格", "家計が購入する財・サービスの価格", "輸出品の価格のみ", "株式市場の価格"], "category": "経営環境", "correct": 1, "explanation": "消費者の生計費の変動を示す指標。", "wrongNote": "Aは企業物価指数（卸売段階）の対象、Cは輸出物価指数、Dは株価指数の話であり、CPIとは別の指標です。"}, {"id": 5, "question": "日銀短観（全国企業短期経済観測調査）の調査対象として正しいものはどれか。", "choices": ["全国の消費者", "全国の企業", "全国の自治体", "全国の金融機関のみ"], "category": "経営環境", "correct": 1, "explanation": "全国の企業を対象に業況などを調査。", "wrongNote": "日銀短観は企業を対象とした調査であり、消費者・自治体・金融機関のみを対象とするものではありません。"}, {"id": 6, "question": "景気動向指数のうち、景気に先立って動く「先行指数」に含まれる指標はどれか。", "choices": ["有効求人倍率", "新規求人数（除学卒）", "完全失業率", "法人税収入"], "category": "経営環境", "correct": 1, "explanation": "先行指数は景気に先立って動く指標群。有効求人倍率・失業率は一致指数・遅行指数側。", "wrongNote": "有効求人倍率は一致指数、完全失業率や法人税収入は遅行指数に分類され、景気に先行しては動きません。"}, {"id": 7, "question": "「完全失業率」の定義として正しいものはどれか。", "choices": ["労働力人口に占める完全失業者の割合", "総人口に占める失業者の割合", "就業者数に占める非正規雇用者の割合", "生産年齢人口に占める就業者の割合"], "category": "経営環境", "correct": 0, "explanation": "総人口ではなく労働力人口が分母。", "wrongNote": "総人口に対する割合や非正規雇用の割合、就業率はいずれも完全失業率の定義とは異なります。"}, {"id": 8, "question": "「有効求人倍率」が1を上回っている状態が意味するものはどれか。", "choices": ["求職者数が求人数を上回っている", "求人数が求職者数を上回っている", "完全雇用が達成されている", "失業率が急上昇している"], "category": "経営環境", "correct": 1, "explanation": "1人の求職者に対し1件以上の求人がある状態。", "wrongNote": "求職者が求人を上回るのは倍率1未満の状態を指し、完全雇用の達成や失業率の動きとは直接結びつく説明ではありません。"}, {"id": 9, "question": "国際収支のうち、貿易収支・サービス収支・所得収支などをまとめたものはどれか。", "choices": ["資本移転等収支", "金融収支", "経常収支", "外貨準備増減"], "category": "経営環境", "correct": 2, "explanation": "貿易・サービス・所得・二次所得の各収支の合計。", "wrongNote": "資本移転等収支や金融収支は経常収支とは別の区分であり、外貨準備増減は金融収支に含まれる項目です。"}, {"id": 10, "question": "為替相場が「1ドル=140円」から「1ドル=150円」に変化した場合、これは何と呼ばれるか。", "choices": ["円高", "円安", "ドル安", "変化なし"], "category": "経営環境", "correct": 1, "explanation": "同じ1ドルを得るのにより多くの円が必要＝円の価値が下がった状態。", "wrongNote": "1ドルに必要な円が増えるのは円の価値が下がる円安であり、円高やドル安、変化なしという説明は当てはまりません。"}, {"id": 11, "question": "中央銀行が政策金利を引き下げる金融緩和の主な狙いとして正しいものはどれか。", "choices": ["物価上昇を抑制する", "企業や個人の資金調達コストを下げ、経済活動を刺激する", "為替を円高に誘導する", "財政赤字を縮小する"], "category": "経営環境", "correct": 1, "explanation": "金融緩和の基本的な狙い。", "wrongNote": "物価上昇の抑制や円高誘導はむしろ金融引き締めの効果であり、財政赤字の縮小は金融政策とは別の話です。"}, {"id": 12, "question": "「量的緩和」の説明として正しいものはどれか。", "choices": ["中央銀行が国債などを大量に買い入れ、市場に資金を供給する政策", "政府が消費税率を引き下げる政策", "企業が自社株買いを増やす動き", "銀行が貸出金利を引き上げる動き"], "category": "経営環境", "correct": 0, "explanation": "量的緩和の定義。", "wrongNote": "消費税率の引き下げは財政政策、自社株買いは企業の資本政策であり、貸出金利の引き上げは緩和とは逆の動きです。"}, {"id": 13, "question": "「マイナス金利政策」の説明として正しいものはどれか。", "choices": ["銀行が日銀に預ける当座預金の一部に、マイナスの金利を適用する政策", "住宅ローン金利をゼロにする政策", "消費者への貸出を禁止する政策", "為替レートをマイナス表示にする政策"], "category": "経営環境", "correct": 0, "explanation": "2016年に日本でも導入された。", "wrongNote": "住宅ローン金利をゼロにする制度や貸出禁止、為替のマイナス表示といった内容はマイナス金利政策の説明ではありません。"}, {"id": 14, "question": "物価が持続的に上昇し続ける現象を何と呼ぶか。", "choices": ["デフレーション", "インフレーション", "スタグネーション", "リセッション"], "category": "経営環境", "correct": 1, "explanation": "物価の持続的上昇。", "wrongNote": "デフレは物価の持続的下落、スタグネーションは景気停滞、リセッションは景気後退を指し、物価上昇とは異なる概念です。"}, {"id": 15, "question": "不況下で物価が上昇する現象を何と呼ぶか。", "choices": ["デフレスパイラル", "スタグフレーション", "ハイパーインフレ", "ディスインフレ"], "category": "経営環境", "correct": 1, "explanation": "不況（stagnation）とインフレの合成語。", "wrongNote": "デフレスパイラルは物価下落側の悪循環、ハイパーインフレは急激な物価上昇、ディスインフレは物価上昇率の鈍化を指し、不況下の物価上昇とは異なります。"}, {"id": 16, "question": "「プライマリーバランス」が意味する内容として正しいものはどれか。", "choices": ["税収などの歳入と、国債費を除いた歳出の収支", "輸出と輸入の差額", "家計の貯蓄と消費の差額", "為替相場の需給バランス"], "category": "経営環境", "correct": 0, "explanation": "財政の健全性を測る指標の一つ。", "wrongNote": "輸出入の差額は貿易収支、家計の貯蓄と消費の差額や為替の需給バランスはプライマリーバランスとは別の概念です。"}, {"id": 17, "question": "消費税のような税の分類として正しいものはどれか。", "choices": ["直接税", "間接税", "資産税", "法人税"], "category": "経営環境", "correct": 1, "explanation": "税を負担する人と納める人が異なる税。", "wrongNote": "消費税は税を負担する人と納める人が異なる間接税であり、直接税や資産税・法人税といった分類とは異なる軸の話です。"}, {"id": 18, "question": "所得が高くなるほど税率が高くなる課税方式を何と呼ぶか。", "choices": ["定額課税", "逆進課税", "累進課税", "比例課税"], "category": "経営環境", "correct": 2, "explanation": "所得税などで採用されている方式。", "wrongNote": "定額課税は所得に関わらず一定額、逆進課税は低所得者ほど負担が重くなる仕組み、比例課税は税率が一定であり、いずれも累進課税とは異なります。"}, {"id": 19, "question": "G7（主要7カ国）に含まれない国はどれか。", "choices": ["日本", "カナダ", "中国", "イタリア"], "category": "経営環境", "correct": 2, "explanation": "G7は日・米・英・仏・独・伊・加。", "wrongNote": "日本・カナダ・イタリアはいずれもG7構成国であり、中国はG7には含まれていません。"}, {"id": 20, "question": "国際通貨基金（IMF）の主な役割として正しいものはどれか。", "choices": ["国際貿易のルール策定", "為替相場の安定と国際収支難に陥った国への融資", "各国の関税率の決定", "世界の気候変動対策の推進"], "category": "経営環境", "correct": 1, "explanation": "世界銀行とは役割が異なる点に注意。", "wrongNote": "貿易ルールの策定はWTO、関税率の決定は各国政府、気候変動対策の推進は国連気候変動枠組条約などが担う役割であり、IMFの役割ではありません。"}, {"id": 21, "question": "世界貿易機関（WTO）の主な役割として正しいものはどれか。", "choices": ["国際的な貿易ルールの策定・紛争解決", "各国通貨の為替レート決定", "開発途上国への無償資金協力", "世界の食料備蓄の管理"], "category": "経営環境", "correct": 0, "explanation": "自由貿易の推進が目的。", "wrongNote": "為替レートの決定や無償資金協力、食料備蓄の管理はそれぞれ別の主体の役割であり、WTOの役割ではありません。"}, {"id": 22, "question": "OECD（経済協力開発機構）の役割として最も適切なものはどれか。", "choices": ["先進国を中心に経済政策の分析・提言を行う", "発展途上国のみを対象とした軍事協力機構", "為替の固定相場を管理する機関", "国連の下部組織として食糧支援を行う"], "category": "経営環境", "correct": 0, "explanation": "「経済協力開発機構」。", "wrongNote": "OECDは先進国中心の経済協力機関であり、軍事協力や為替管理、食糧支援を担う組織ではありません。"}, {"id": 23, "question": "日本の少子高齢化が経済に与える影響として一般的に指摘されているものはどれか。", "choices": ["生産年齢人口の減少による労働力不足", "若年層の急増による内需拡大", "社会保障費の減少", "潜在成長率の上昇"], "category": "経営環境", "correct": 0, "explanation": "少子高齢化の代表的な影響。", "wrongNote": "少子高齢化は労働力不足を招く一方、社会保障費の増加や潜在成長率の低下が課題として指摘されており、選択肢のような逆の効果は一般的に想定されていません。"}, {"id": 24, "question": "「生産年齢人口」の定義として正しいものはどれか。", "choices": ["15歳以上65歳未満の人口", "20歳以上の人口全体", "就業者数のみ", "65歳以上の人口"], "category": "経営環境", "correct": 0, "explanation": "統計上の定義。", "wrongNote": "就業者数のみを指す概念や65歳以上を指す老年人口の定義とは異なり、生産年齢人口は15歳以上65歳未満という年齢区分で定義されます。"}, {"id": 25, "question": "「潜在成長率」の説明として正しいものはどれか。", "choices": ["経済が持つ生産要素をフル活用した場合に達成しうる中長期的な成長率", "前年比の実際の経済成長率", "政府が目標として掲げる財政赤字削減率", "株式市場の期待成長率"], "category": "経営環境", "correct": 0, "explanation": "実際の成長率とは異なる概念。", "wrongNote": "実際の経済成長率や財政赤字削減目標、株式市場の期待成長率はいずれも潜在成長率とは異なる別の指標です。"}, {"id": 26, "question": "「需給ギャップ」がプラスの状態が意味するものはどれか。", "choices": ["需要が供給（潜在GDP）を上回っている", "供給が需要を上回っている", "需要と供給が完全に一致している", "需給ギャップという概念は存在しない"], "category": "経営環境", "correct": 0, "explanation": "プラスは需要超過＝物価上昇圧力。", "wrongNote": "供給が需要を上回る状態や需給が完全に一致する状態は需給ギャップの説明として不十分で、需給ギャップという概念自体は広く使われています。"}, {"id": 27, "question": "2025年10月、自民党総裁選を経て日本初の女性首相に就任したのは誰か。", "choices": ["石破茂", "高市早苗", "小泉進次郎", "茂木敏充"], "category": "経営環境", "correct": 1, "explanation": "2025年10月21日、第104代首相に指名。", "wrongNote": "石破茂は前任の首相、小泉進次郎・茂木敏充は総裁選で候補に挙がった他の政治家であり、実際に選出されたのは高市早苗氏です。"}, {"id": 28, "question": "高市内閣の発足時に財務相に起用されたのは誰か。", "choices": ["木原稔", "鈴木憲和", "片山さつき", "河野太郎"], "category": "経営環境", "correct": 2, "explanation": "高市内閣発足時の財務相。", "wrongNote": "木原稔氏は官房長官、鈴木憲和氏は農相に起用されており、財務相に就いたのは片山さつき氏です。"}, {"id": 29, "question": "高市内閣は自民党とどの政党による連立政権としてスタートしたか。", "choices": ["公明党", "日本維新の会", "立憲民主党", "国民民主党"], "category": "経営環境", "correct": 1, "explanation": "自民・維新の連立政権。", "wrongNote": "公明党は過去の連立相手であり、立憲民主党・国民民主党は野党であるため、高市内閣の連立相手ではありません。"}, {"id": 30, "question": "2025年9月時点で試算された、日米関税交渉合意後の米国の対日平均関税率に最も近い数値はどれか。", "choices": ["約1.5％", "約6％", "約12.3％", "約25％"], "category": "経営環境", "correct": 2, "explanation": "年初1.5％、7月時点14.5％からの低下だが依然高水準。", "wrongNote": "約1.5％は年初時点の関税率、約25％は実際より高すぎる数値であり、合意後の水準として報じられたのは約12.3％です。"}, {"id": 31, "question": "トランプ関税の影響で、2025年8月に輸出額が大きく落ち込んだと報じられた品目はどれか。", "choices": ["半導体製造装置", "自動車関連財", "医薬品", "農産物"], "category": "経営環境", "correct": 1, "explanation": "現地生産強化や価格競争力低下が背景とされる。", "wrongNote": "半導体製造装置や医薬品、農産物は今回大きく取り上げられた品目ではなく、輸出減少が特に注目されたのは自動車関連財でした。"}, {"id": 32, "question": "2025年9月の金融政策決定会合で日銀が決定した内容として正しいものはどれか。", "choices": ["マイナス金利の再導入", "保有するETF・REITの市場での段階的売却", "長短金利操作の再強化", "大規模な為替介入の実施"], "category": "経営環境", "correct": 1, "explanation": "金融正常化の一環として2025年9月に決定。", "wrongNote": "マイナス金利の再導入や長短金利操作の強化は金融緩和方向の政策であり、大規模な為替介入とも異なる、ETF・REITの売却が決定された内容です。"}, {"id": 33, "question": "2025年の基準地価（全用途平均）の動きとして正しいものはどれか。", "choices": ["4年連続で上昇した", "5年ぶりに下落した", "横ばいが続いている", "公表が中止された"], "category": "経営環境", "correct": 0, "explanation": "全用途平均1.5％上昇。", "wrongNote": "実際には5年ぶりの下落や横ばいではなく、地価は4年連続で上昇しており、統計公表が中止された事実もありません。"}, {"id": 34, "question": "近年の春闘（春季労使交渉）における賃上げ率のトレンドとして正しいものはどれか。", "choices": ["5％を超える高水準の賃上げが続いている", "賃上げはゼロ％台が続いている", "賃下げが常態化している", "春闘そのものが廃止された"], "category": "経営環境", "correct": 0, "explanation": "人手不足や物価高を背景とした傾向。", "wrongNote": "近年の春闘ではゼロ％台の低い賃上げや賃下げが常態化しているわけではなく、春闘自体も継続しており、5％を超える高水準の賃上げが続いています。"}, {"id": 35, "question": "「実質賃金」の説明として正しいものはどれか。", "choices": ["名目賃金の上昇率から物価上昇率を差し引いたもの", "名目賃金に税金を加えたもの", "ボーナスのみを指すもの", "最低賃金と同義のもの"], "category": "経営環境", "correct": 0, "explanation": "物価上昇が上回ると実質賃金はマイナスになる。", "wrongNote": "税金のみを差し引いたものやボーナスのみを指す概念、最低賃金とは異なり、実質賃金は名目賃金の上昇率から物価上昇率を差し引いたものです。"}, {"id": 36, "question": "為替相場が円安方向に動く一般的な要因として正しいものはどれか。", "choices": ["日本の金利が海外に比べて相対的に低い状態が続く", "日本の貿易黒字が急拡大する", "海外投資家が円建て資産を積極的に購入する", "日銀が大規模な円買い介入を行う"], "category": "経営環境", "correct": 0, "explanation": "低金利通貨は相対的に売られやすく円安要因となる。", "wrongNote": "貿易黒字の拡大や海外投資家による円建て資産の購入、日銀の円買い介入はいずれもむしろ円高要因であり、円安要因とは逆方向です。"}, {"id": 37, "question": "中央銀行の役割として一般的に含まれないものはどれか。", "choices": ["通貨の発行", "物価の安定", "金融システムの安定", "民間企業への出資による経営関与"], "category": "経営環境", "correct": 3, "explanation": "中央銀行の一般的役割には含まれない。", "wrongNote": "通貨の発行や物価の安定、金融システムの安定は中央銀行の代表的な役割であり、民間企業への出資による経営関与は一般的な役割に含まれません。"}, {"id": 38, "question": "「マネーストック」が示す内容として正しいものはどれか。", "choices": ["金融機関や中央政府を除く経済主体が保有する通貨量の残高", "国が発行する国債の総額", "家計の預金金利の平均", "上場企業の時価総額の合計"], "category": "経営環境", "correct": 0, "explanation": "代表的なマネー指標。", "wrongNote": "国債の発行総額や預金金利の平均、上場企業の時価総額合計はマネーストックとは異なる別の統計・指標です。"}, {"id": 39, "question": "通貨当局が為替相場に影響を与えるために外貨を売買する行為を何と呼ぶか。", "choices": ["公開市場操作", "為替介入", "量的緩和", "財政出動"], "category": "経営環境", "correct": 1, "explanation": "通貨当局による外貨売買。", "wrongNote": "公開市場操作は国内の金融調節手段、量的緩和は資産買入れ策、財政出動は政府の歳出政策であり、いずれも為替介入とは異なります。"}, {"id": 40, "question": "CPTPP（環太平洋パートナーシップに関する包括的及び先進的な協定）の説明として正しいものはどれか。", "choices": ["参加国間で関税撤廃・削減などを進める経済連携協定", "世界の気候変動対策の国際枠組み", "国連が主導する平和維持活動の枠組み", "主要国の為替レートを固定する協定"], "category": "経営環境", "correct": 0, "explanation": "日本も参加する多国間協定。", "wrongNote": "気候変動対策の枠組みや平和維持活動、為替の固定相場制度はCPTPPとは別の国際的な仕組みです。"}, {"id": 41, "question": "FTA（自由貿易協定）とEPA（経済連携協定）の違いとして正しいものはどれか。", "choices": ["FTAは関税撤廃が中心、EPAは投資・人の移動なども含めたより広範な協定", "FTAとEPAはまったく同じ内容を指す", "EPAは関税に関する協定ではない", "FTAは日本が締結できない協定形式である"], "category": "経営環境", "correct": 0, "explanation": "EPAは投資・人の移動なども含む。", "wrongNote": "EPAも関税に関する内容を含んでおり、日本もFTAを締結できるため、これらの説明はFTAとEPAの違いとして正しくありません。"}, {"id": 42, "question": "「サプライチェーン」が指す内容として正しいものはどれか。", "choices": ["原材料の調達から製造・物流・販売に至る一連のつながり", "企業の株主構成", "金融機関同士の資金決済網", "労働組合の組織構造"], "category": "経営環境", "correct": 0, "explanation": "供給網。", "wrongNote": "株主構成や金融機関同士の決済網、労働組合の組織構造はサプライチェーンとは異なる概念です。"}, {"id": 43, "question": "「経済安全保障」の考え方として正しいものはどれか。", "choices": ["重要物資や技術の供給を特定国に過度に依存しないようにする政策的取り組み", "企業の内部留保を最大化する経営手法", "為替レートを完全に固定する制度", "消費税を廃止する政策"], "category": "経営環境", "correct": 0, "explanation": "近年重視される政策分野。", "wrongNote": "内部留保の最大化や為替の固定制度、消費税の廃止は経済安全保障の考え方とは直接関係しません。"}, {"id": 44, "question": "「カーボンニュートラル」の説明として正しいものはどれか。", "choices": ["温室効果ガスの排出量と吸収量を均衡させ、実質的な排出をゼロにする状態", "二酸化炭素の排出を完全に禁止する法律", "石油を一切使用しない経済体制", "中立国のエネルギー政策を指す用語"], "category": "経営環境", "correct": 0, "explanation": "2050年目標として掲げる国が多い。", "wrongNote": "二酸化炭素の排出を完全に禁止する法律や石油を使わない体制、中立国のエネルギー政策という意味ではなく、排出と吸収を均衡させる考え方です。"}, {"id": 45, "question": "SDGs（持続可能な開発目標）が国連で採択された際の目標数として正しいものはどれか。", "choices": ["8つ", "17個", "30個", "100個"], "category": "経営環境", "correct": 1, "explanation": "2015年に国連で採択。", "wrongNote": "SDGsの目標数は8つでも30個でも100個でもなく、正しくは17個の目標が採択されました。"}, {"id": 46, "question": "「ESG投資」のESGが指すものの組み合わせとして正しいものはどれか。", "choices": ["Environment・Social・Governance", "Economy・Society・Growth", "Export・Sales・Growth", "Energy・Steel・Gold"], "category": "経営環境", "correct": 0, "explanation": "環境・社会・企業統治。", "wrongNote": "Economy・Society・GrowthやExport・Sales・Growthなどは誤った組み合わせであり、正しくはEnvironment・Social・Governanceです。"}, {"id": 47, "question": "日本銀行の金融政策決定会合で決定される「政策金利」の主な誘導対象として正しいものはどれか。", "choices": ["無担保コールレート（オーバーナイト物）", "住宅ローン金利", "社債利回り", "株式配当利回り"], "category": "経営環境", "correct": 0, "explanation": "伝統的な政策金利の誘導対象。", "wrongNote": "住宅ローン金利や社債利回り、株式配当利回りは市場で形成される金利であり、日銀が直接誘導する政策金利の対象ではありません。"}, {"id": 48, "question": "財政赤字が続き、国債残高が累積することの一般的なリスクとして指摘されるものはどれか。", "choices": ["将来世代への負担の先送りや財政の持続可能性への懸念", "物価が必ず下落すること", "為替が必ず円高になること", "GDPが自動的に増加すること"], "category": "経営環境", "correct": 0, "explanation": "財政の持続可能性への懸念が指摘される。", "wrongNote": "財政赤字の累積は必ずしも物価下落や円高、GDPの自動的な増加をもたらすわけではなく、将来世代への負担の先送りが主なリスクとして指摘されます。"}, {"id": 49, "question": "「貿易収支」の説明として正しいものはどれか。", "choices": ["財（モノ）の輸出額から輸入額を差し引いたもの", "サービスの輸出入のみを集計したもの", "海外への投資収益のみを集計したもの", "政府間の無償資金協力の総額"], "category": "経営環境", "correct": 0, "explanation": "サービスは含まない「モノ」の収支。", "wrongNote": "サービス収支のみや投資収益のみ、無償資金協力の総額はいずれも貿易収支とは異なる範囲・統計です。"}, {"id": 50, "question": "景気循環における「景気の谷」の説明として正しいものはどれか。", "choices": ["景気が最も拡大したピークの時点", "景気の後退局面が終わり、回復に転じる転換点", "景気が横ばいで安定している状態", "株価が最高値をつけた時点"], "category": "経営環境", "correct": 1, "explanation": "対義語は「景気の山（ピーク）」。  --- # 第2章：企業戦略（Q51〜Q100）", "wrongNote": "景気が最も拡大した時点は「山」、横ばいの安定状態や株価の最高値は谷の定義とは異なり、谷は後退局面が終わり回復に転じる転換点を指します。"}, {"id": 51, "question": "「M&A」の説明として正しいものはどれか。", "choices": ["企業の合併・買収", "企業の倒産手続き", "企業の株式分割", "企業の内部監査"], "category": "企業戦略", "correct": 0, "explanation": "A（企業の合併・買収）", "wrongNote": "企業の倒産手続きや株式分割、内部監査はM&Aとは異なる別の企業活動です。"}, {"id": 52, "question": "TOB（株式公開買付け）の説明として正しいものはどれか。", "choices": ["買付価格・株数・期間などを公告し、証券取引所を通さずに株式を買い集める手法", "企業が自社の従業員に無償で株式を配布する制度", "新規上場時に株式を売り出す手続き", "株式を分割して1株あたりの価格を下げる手続き"], "category": "企業戦略", "correct": 0, "explanation": "A（買付条件を公告し取引所外で株式を買い集める手法）", "wrongNote": "従業員への無償株式配布や新規上場時の売り出し、株式分割はTOBとは異なる仕組みです。"}, {"id": 53, "question": "経営陣が自社の株式を買い取り、オーナー経営者となる手法を何と呼ぶか。", "choices": ["IPO", "MBO（マネジメント・バイアウト）", "TOB", "IR"], "category": "企業戦略", "correct": 1, "explanation": "経営陣自身が買い手となる点が特徴。", "wrongNote": "IPOは新規上場、TOBは株式公開買付け全般を指す言葉、IRは投資家向け広報活動であり、経営陣による自社株買収を指すMBOとは異なります。"}, {"id": 54, "question": "買収対象企業の資産や将来のキャッシュフローを担保に資金を借り入れて行う買収手法を何と呼ぶか。", "choices": ["LBO（レバレッジド・バイアウト）", "ABO", "VBO", "NBO"], "category": "企業戦略", "correct": 0, "explanation": "買収対象の資産・キャッシュフローを担保に借入。", "wrongNote": "ABOやVBO、NBOは一般的なM&A用語ではなく、対象企業の資産・キャッシュフローを担保にする手法はLBOと呼ばれます。"}, {"id": 55, "question": "敵対的買収に対する防衛策として知られる「ポイズンピル」の説明として正しいものはどれか。", "choices": ["既存株主に有利な条件で新株を発行し、買収者の持株比率を低下させる仕組み", "買収者に対して訴訟を起こす制度", "株式の売買を全面的に禁止する制度", "企業が自社製品の販売を停止する対抗策"], "category": "企業戦略", "correct": 0, "explanation": "代表的な買収防衛策。", "wrongNote": "買収者への訴訟や株式売買の全面禁止、自社製品の販売停止は一般的な買収防衛策の説明ではなく、ポイズンピルは新株発行により持株比率を薄める仕組みです。"}, {"id": 56, "question": "複数の子会社を傘下に持ち、自らは事業を行わずグループ経営に専念する会社を何と呼ぶか。", "choices": ["持株会社", "特例子会社", "匿名組合", "一般社団法人"], "category": "企業戦略", "correct": 0, "explanation": "グループ経営の中核として機能。", "wrongNote": "特例子会社は障害者雇用促進を目的とした子会社、匿名組合や一般社団法人は別の組織形態であり、グループ経営に専念する会社は持株会社と呼ばれます。"}, {"id": 57, "question": "複数の企業が出資し合って新たに設立する共同事業体を何と呼ぶか。", "choices": ["ジョイントベンチャー（合弁会社）", "カルテル", "トラスト", "コンツェルン"], "category": "企業戦略", "correct": 0, "explanation": "複数社の共同出資会社。", "wrongNote": "カルテルは競争制限行為、トラストやコンツェルンは別の企業結合形態であり、複数社が共同出資して設立する会社はジョイントベンチャーと呼ばれます。"}, {"id": 58, "question": "原材料の調達から製造、販売までを自社グループ内で一貫して行う戦略を何と呼ぶか。", "choices": ["垂直統合", "水平統合", "多角化", "アウトソーシング"], "category": "企業戦略", "correct": 0, "explanation": "サプライチェーンを自社内で完結させる戦略。", "wrongNote": "水平統合は同業種内での規模拡大、多角化は異分野への展開、アウトソーシングは外部委託を指し、自社内で調達から販売まで一貫させる戦略とは異なります。"}, {"id": 59, "question": "同業他社を買収して同じ事業領域での規模を拡大する戦略を何と呼ぶか。", "choices": ["垂直統合", "水平統合", "コングロマリット化", "スピンオフ"], "category": "企業戦略", "correct": 1, "explanation": "同業種内での規模拡大。", "wrongNote": "垂直統合はサプライチェーンの一貫化、コングロマリット化は異業種への展開、スピンオフは事業分離を指し、同業他社買収による規模拡大とは異なります。"}, {"id": 60, "question": "既存事業とは異なる新たな事業分野に進出する経営戦略を何と呼ぶか。", "choices": ["多角化戦略", "撤退戦略", "縮小均衡", "現状維持戦略"], "category": "企業戦略", "correct": 0, "explanation": "新分野への事業展開。", "wrongNote": "撤退戦略や縮小均衡、現状維持戦略は新分野への進出とは逆または無関係の方向性であり、多角化戦略とは異なります。"}, {"id": 61, "question": "経営資源を強みのある事業に集中し、不採算事業を整理する経営方針を何と呼ぶか。", "choices": ["選択と集中", "全方位経営", "コングロマリット・ディスカウント", "総花的経営"], "category": "企業戦略", "correct": 0, "explanation": "強みへの資源集中と不採算事業の整理。", "wrongNote": "全方位経営や総花的経営は資源を分散させる逆の考え方、コングロマリット・ディスカウントは複合企業が市場で低く評価される現象を指します。"}, {"id": 62, "question": "関連性の薄い複数の事業を傘下に持つ複合企業を何と呼ぶか。", "choices": ["コングロマリット", "カルテル", "スタートアップ", "持分法適用会社"], "category": "企業戦略", "correct": 0, "explanation": "異業種を傘下に持つ複合企業。", "wrongNote": "カルテルは競争制限行為、スタートアップは新興企業、持分法適用会社は出資比率に基づく会計上の分類であり、複合企業を指す言葉ではありません。"}, {"id": 63, "question": "自社の強み・弱み・機会・脅威を整理する分析フレームワークを何と呼ぶか。", "choices": ["SWOT分析", "PEST分析", "4P分析", "BCG分析"], "category": "企業戦略", "correct": 0, "explanation": "強み・弱み・機会・脅威の枠組み。", "wrongNote": "PEST分析は政治・経済・社会・技術の外部環境分析、4P分析はマーケティング要素の分析であり、自社の強み弱み機会脅威を整理するSWOT分析とは異なります。"}, {"id": 64, "question": "業界の競争構造を「新規参入の脅威」「代替品の脅威」「売り手の交渉力」「買い手の交渉力」「業界内の競争」の5つで分析する手法を何と呼ぶか。", "choices": ["ファイブフォース分析", "バランスト・スコアカード", "アンゾフの成長マトリクス", "マズローの欲求階層"], "category": "企業戦略", "correct": 0, "explanation": "マイケル・ポーターが提唱。", "wrongNote": "バランスト・スコアカードは業績評価の手法、アンゾフの成長マトリクスは成長戦略の分類、マズローの欲求階層は心理学の理論であり、業界の競争構造分析とは異なります。"}, {"id": 65, "question": "市場成長率と市場占有率の2軸で事業を「花形」「金のなる木」「問題児」「負け犬」に分類する手法を何と呼ぶか。", "choices": ["PPM（プロダクト・ポートフォリオ・マネジメント）", "バリューチェーン分析", "コアコンピタンス経営", "3C分析"], "category": "企業戦略", "correct": 0, "explanation": "花形・金のなる木・問題児・負け犬の4象限。", "wrongNote": "バリューチェーン分析は価値創出活動の分析、コアコンピタンス経営は中核的強みを軸にした経営、STP分析は市場細分化の枠組みであり、市場成長率とシェアで事業を分類する手法とは異なります。"}, {"id": 66, "question": "原材料調達から製造・物流・販売・アフターサービスに至る一連の活動を、価値の連鎖として捉える分析手法を何と呼ぶか。", "choices": ["バリューチェーン分析", "SWOT分析", "PPM", "STP分析"], "category": "企業戦略", "correct": 0, "explanation": "価値創出活動の連鎖を分析。", "wrongNote": "SWOT分析やPPM、STP分析はそれぞれ別の目的を持つ分析フレームワークであり、価値創出活動の連鎖を分析する手法はバリューチェーン分析と呼ばれます。"}, {"id": 67, "question": "他社が容易に模倣できない、企業独自の中核的な強みを何と呼ぶか。", "choices": ["コアコンピタンス", "アウトソーシング", "カニバリゼーション", "コモディティ化"], "category": "企業戦略", "correct": 0, "explanation": "模倣困難な中核的強み。", "wrongNote": "アウトソーシングは外部委託、カニバリゼーションは自社製品同士の共食い現象、コモディティ化は差別化が失われる現象であり、模倣困難な中核的強みとは異なります。"}, {"id": 68, "question": "競争の激しい既存市場ではなく、競争のない新たな市場を切り開く経営戦略を何と呼ぶか。", "choices": ["ブルーオーシャン戦略", "レッドオーシャン戦略", "ニッチ戦略", "コストリーダーシップ戦略"], "category": "企業戦略", "correct": 0, "explanation": "競争のない未開拓市場を狙う。", "wrongNote": "レッドオーシャン戦略は競争の激しい既存市場を指し、ニッチ戦略やコストリーダーシップ戦略とも異なる、競争のない新市場を切り開く考え方がブルーオーシャン戦略です。"}, {"id": 69, "question": "既存の優良企業が既存顧客のニーズに応え続けるあまり、新興企業の破壊的な技術革新に対応できなくなる現象を何と呼ぶか。", "choices": ["イノベーションのジレンマ", "キャズム理論", "プロダクトライフサイクル", "ネットワーク外部性"], "category": "企業戦略", "correct": 0, "explanation": "クレイトン・クリステンセンが提唱。", "wrongNote": "キャズム理論は新技術普及の壁、プロダクトライフサイクルは製品の段階変化、ネットワーク外部性は利用者増加による価値向上を指し、既存企業が新興企業に対応できなくなる現象とは異なります。"}, {"id": 70, "question": "従来の製品やサービスを性能面では下回るが、低価格・利便性などで市場構造を覆す技術革新を何と呼ぶか。", "choices": ["持続的イノベーション", "破壊的イノベーション", "プロセスイノベーション", "リバースイノベーション"], "category": "企業戦略", "correct": 1, "explanation": "低価格・利便性で市場構造を覆す。", "wrongNote": "持続的イノベーションは既存製品の性能向上、プロセスイノベーションは製造工程の革新、リバースイノベーションは新興国発の技術普及を指し、市場構造を覆す技術革新とは異なる説明です。"}, {"id": 71, "question": "評価額が10億ドルを超える未上場のスタートアップ企業を何と呼ぶか。", "choices": ["ユニコーン企業", "デカコーン企業", "ゾンビ企業", "ペーパーカンパニー"], "category": "企業戦略", "correct": 0, "explanation": "評価額10億ドル超の未上場企業。", "wrongNote": "デカコーン企業は評価額100億ドルを超える企業、ゾンビ企業は実質的に破綻状態の企業、ペーパーカンパニーは実体のない会社を指し、評価額10億ドル超の未上場企業とは異なります。"}, {"id": 72, "question": "企業が証券取引所に株式を新規上場することを何と呼ぶか。", "choices": ["IPO", "M&A", "LBO", "TOB"], "category": "企業戦略", "correct": 0, "explanation": "新規株式公開。", "wrongNote": "M&AやLBO、TOBはいずれも買収・統合に関する用語であり、新規株式公開を指すIPOとは異なります。"}, {"id": 73, "question": "成長が見込まれる未上場企業に出資し、将来の株式売却益（キャピタルゲイン）を狙う投資会社を何と呼ぶか。", "choices": ["ベンチャーキャピタル", "メガバンク", "政府系金融機関", "信用金庫"], "category": "企業戦略", "correct": 0, "explanation": "未上場企業への出資が特徴。", "wrongNote": "メガバンクや政府系金融機関、信用金庫は主に融資を行う金融機関であり、未上場企業への出資を専門とするベンチャーキャピタルとは異なります。"}, {"id": 74, "question": "創業初期のスタートアップに個人資産で出資する富裕な個人投資家を何と呼ぶか。", "choices": ["エンジェル投資家", "アクティビスト", "ヘッジファンド", "機関投資家"], "category": "企業戦略", "correct": 0, "explanation": "創業初期段階での個人投資家。", "wrongNote": "アクティビストは経営改善を要求する投資家、ヘッジファンドや機関投資家は法人としての大口投資家であり、個人の富裕層による創業初期投資を指すエンジェル投資家とは異なります。"}, {"id": 75, "question": "企業が特定の事業部門を切り出し、外部資本を受け入れる形で独立させる手法を何と呼ぶか。", "choices": ["カーブアウト", "リストラクチャリング", "ダウンサイジング", "アウトソーシング"], "category": "企業戦略", "correct": 0, "explanation": "事業部門を切り出し独立させる手法。", "wrongNote": "リストラクチャリングは事業再構築全般、ダウンサイジングは規模縮小、アウトソーシングは外部委託を指し、事業部門を切り出し外部資本を受け入れる手法とは異なります。"}, {"id": 76, "question": "企業が事業の一部を分離し、独立した新会社として株主に株式を分配する手法を何と呼ぶか。", "choices": ["スピンオフ", "デットエクイティスワップ", "トラッキングストック", "ライツイシュー"], "category": "企業戦略", "correct": 0, "explanation": "株主への株式分配を伴う事業分離。", "wrongNote": "デットエクイティスワップは負債の株式化、トラッキングストックは特定事業に連動する株式、ライツイシューは株主割当増資を指し、事業分離とは異なる仕組みです。"}, {"id": 77, "question": "M&Aの買収額が被買収企業の純資産額を上回った差額を会計上何と呼ぶか。", "choices": ["のれん", "資本剰余金", "利益準備金", "繰延資産"], "category": "企業戦略", "correct": 0, "explanation": "買収額と純資産の差額として計上。", "wrongNote": "資本剰余金や利益準備金、繰延資産はのれんとは異なる会計項目であり、買収額と純資産の差額を指すのはのれんです。"}, {"id": 78, "question": "M&A成立後、経営統合の実務を進めるプロセスを何と呼ぶか。", "choices": ["PMI（Post Merger Integration）", "KPI", "ROI", "CSR"], "category": "企業戦略", "correct": 0, "explanation": "統合プロセスの実務。", "wrongNote": "KPIやROI、CSRはそれぞれ業績指標や社会的責任を指す別の概念であり、M&A後の統合プロセスを指すのはPMIです。"}, {"id": 79, "question": "M&Aの交渉過程で、対象企業の財務・法務・事業内容などを詳細に調査することを何と呼ぶか。", "choices": ["デューデリジェンス", "アカウンタビリティ", "コンプライアンス", "ガバナンス"], "category": "企業戦略", "correct": 0, "explanation": "財務・法務等の詳細調査。", "wrongNote": "アカウンタビリティは説明責任、コンプライアンスは法令遵守、ガバナンスは企業統治を指し、対象企業の詳細調査とは異なる概念です。"}, {"id": 80, "question": "上場企業の企業統治のあり方を示す原則集を何と呼ぶか。", "choices": ["コーポレートガバナンス・コード", "インサイダー取引規制", "金融商品取引法", "独占禁止法"], "category": "企業戦略", "correct": 0, "explanation": "企業統治の原則集。", "wrongNote": "インサイダー取引規制や金融商品取引法、独占禁止法はそれぞれ別の法規制であり、企業統治の原則集を指すのはコーポレートガバナンス・コードです。"}, {"id": 81, "question": "社外取締役に主に期待される役割として正しいものはどれか。", "choices": ["経営陣から独立した立場で経営を監督・助言すること", "会社の日常業務を実際に執行すること", "株主総会の議長を必ず務めること", "会社の資金を管理すること"], "category": "企業戦略", "correct": 0, "explanation": "執行そのものは担わない。", "wrongNote": "日常業務の執行や株主総会の議長、資金管理はそれぞれ別の役割であり、社外取締役に期待されるのは経営陣から独立した監督・助言です。"}, {"id": 82, "question": "株式会社における最高意思決定機関として正しいものはどれか。", "choices": ["株主総会", "取締役会", "監査役会", "従業員組合"], "category": "企業戦略", "correct": 0, "explanation": "会社の最高意思決定機関。", "wrongNote": "取締役会は業務執行の意思決定機関、監査役会は監査機関、従業員組合は労働者の団体であり、会社の最高意思決定機関は株主総会です。"}, {"id": 83, "question": "取締役の職務執行を監査する機関として正しいものはどれか。", "choices": ["監査役", "執行役員", "顧問", "支店長"], "category": "企業戦略", "correct": 0, "explanation": "取締役の職務執行を監査。", "wrongNote": "執行役員は業務執行を担う役職、顧問は助言役、支店長は現場の管理職であり、取締役の職務執行を監査するのは監査役です。"}, {"id": 84, "question": "「指名委員会等設置会社」に必ず設置される委員会の組み合わせとして正しいものはどれか。", "choices": ["指名委員会・監査委員会・報酬委員会", "予算委員会・広報委員会・人事委員会", "営業委員会・製造委員会・品質委員会", "倫理委員会・環境委員会・安全委員会"], "category": "企業戦略", "correct": 0, "explanation": "指名委員会等設置会社の必置機関。", "wrongNote": "予算委員会や広報委員会、営業委員会などは会社が任意に設ける委員会であり、指名委員会等設置会社で法定必置となるのは指名・監査・報酬の3委員会です。"}, {"id": 85, "question": "自己資本を効率的に活用し、株主にとっての収益性を重視する経営を何と呼ぶか。", "choices": ["ROE経営", "コストプラス経営", "どんぶり勘定経営", "総花経営"], "category": "企業戦略", "correct": 0, "explanation": "自己資本利益率を重視する経営。", "wrongNote": "コストプラス経営は価格設定の手法、どんぶり勘定経営や総花経営は非効率な経営のあり方を指す言葉であり、自己資本の効率性を重視する経営とは異なります。"}, {"id": 86, "question": "他社が模倣困難な強みを長期間維持できる状態を何と呼ぶか。", "choices": ["持続的競争優位", "一時的優位性", "コモディティ化", "カニバリゼーション"], "category": "企業戦略", "correct": 0, "explanation": "長期間維持できる優位性。", "wrongNote": "一時的優位性は短期間しか続かない優位、コモディティ化やカニバリゼーションはむしろ競争優位を損なう現象であり、長期的に優位性を保てる状態とは異なります。"}, {"id": 87, "question": "生産量が増えるほど1単位あたりのコストが下がる効果を何と呼ぶか。", "choices": ["規模の経済", "範囲の経済", "密度の経済", "速度の経済"], "category": "企業戦略", "correct": 0, "explanation": "生産量拡大による単位コスト低下。", "wrongNote": "範囲の経済は複数事業間でのコスト共有効果を指し、密度の経済や速度の経済は一般的な用語として定着しておらず、生産量拡大によるコスト低下とは異なります。"}, {"id": 88, "question": "複数の事業を同じ企業内で展開することでコストを共有し、単独で行うより効率的になる効果を何と呼ぶか。", "choices": ["規模の経済", "範囲の経済", "経験曲線効果", "スイッチングコスト"], "category": "企業戦略", "correct": 1, "explanation": "複数事業間でのコスト共有効果。", "wrongNote": "規模の経済は生産量拡大によるコスト低下、経験曲線効果は累積生産量による習熟効果、スイッチングコストは乗り換えコストを指し、複数事業間のコスト共有効果とは異なります。"}, {"id": 89, "question": "サービスの利用者が増えるほど、そのサービス自体の価値が高まる効果を何と呼ぶか。", "choices": ["ネットワーク効果", "コストプッシュ効果", "デモンストレーション効果", "クラウディングアウト効果"], "category": "企業戦略", "correct": 0, "explanation": "利用者増加が価値を高める効果。", "wrongNote": "コストプッシュ効果は物価押し上げ、デモンストレーション効果は消費行動への影響、クラウディングアウト効果は財政支出による民間投資抑制を指し、利用者増加によるサービス価値向上とは異なります。"}, {"id": 90, "question": "多数の売り手と買い手をマッチングさせる場を提供するビジネスモデルを何と呼ぶか。", "choices": ["プラットフォームビジネス", "OEMビジネス", "フランチャイズビジネス", "コングロマリット経営"], "category": "企業戦略", "correct": 0, "explanation": "売り手と買い手をマッチングさせる場。", "wrongNote": "OEMビジネスは受託製造、フランチャイズビジネスは商標・ノウハウ提供モデル、コングロマリット経営は複合企業の経営を指し、売り手と買い手を仲介する場を提供するビジネスとは異なります。"}, {"id": 91, "question": "顧客が定額料金を支払い続けることで継続的にサービスや商品を利用できるビジネスモデルを何と呼ぶか。", "choices": ["サブスクリプションモデル", "スポット販売モデル", "委託販売モデル", "バーター取引モデル"], "category": "企業戦略", "correct": 0, "explanation": "定額課金の継続利用モデル。", "wrongNote": "スポット販売や委託販売、バーター取引はいずれも異なる販売形態であり、定額料金で継続利用できるモデルはサブスクリプションと呼ばれます。"}, {"id": 92, "question": "本部が商標・ノウハウの使用権を加盟店に提供し、対価を得るビジネス形態を何と呼ぶか。", "choices": ["フランチャイズ", "アウトソーシング", "コンソーシアム", "シンジケート"], "category": "企業戦略", "correct": 0, "explanation": "商標・ノウハウ提供の対価を得る形態。", "wrongNote": "アウトソーシングは外部委託、コンソーシアムやシンジケートは共同事業体の形態を指し、商標・ノウハウの使用権提供とは異なります。"}, {"id": 93, "question": "発注元のブランド名で製品を製造する、受託製造の形態を何と呼ぶか。", "choices": ["OEM", "IPO", "LBO", "ROE"], "category": "企業戦略", "correct": 0, "explanation": "発注元ブランドでの受託製造。", "wrongNote": "IPOは新規株式公開、LBOは買収手法、ROEは収益性指標であり、発注元ブランドでの受託製造とは異なる用語です。"}, {"id": 94, "question": "設計から製造までを受託し、発注元のブランドで販売される形態を何と呼ぶか。", "choices": ["ODM", "TOB", "MBO", "PPM"], "category": "企業戦略", "correct": 0, "explanation": "設計から製造までを受託。", "wrongNote": "TOBは株式公開買付け、MBOは経営陣による買収、PPMは事業ポートフォリオ分析であり、設計から製造までを受託する形態とは異なります。"}, {"id": 95, "question": "複数企業が独立性を保ったまま、特定分野で協力関係を結ぶことを何と呼ぶか。", "choices": ["戦略的アライアンス", "カルテル", "買収", "完全子会社化"], "category": "企業戦略", "correct": 0, "explanation": "独立性を保った協力関係。", "wrongNote": "カルテルは競争制限行為、買収や完全子会社化は独立性を失う統合形態であり、独立性を保ったまま協力する関係とは異なります。"}, {"id": 96, "question": "各国市場のニーズに合わせて経営を現地に大きく委ねる国際経営戦略を何と呼ぶか。", "choices": ["マルチドメスティック戦略", "グローバル統合戦略", "垂直統合戦略", "コングロマリット戦略"], "category": "企業戦略", "correct": 0, "explanation": "現地適応を重視。", "wrongNote": "グローバル統合戦略は標準化を重視する戦略、垂直統合戦略はサプライチェーンの一貫化、コングロマリット戦略は異業種展開を指し、現地適応を重視する戦略とは異なります。"}, {"id": 97, "question": "世界市場を一つの市場とみなし、標準化された製品・戦略で展開する国際経営戦略を何と呼ぶか。", "choices": ["グローバル戦略", "マルチドメスティック戦略", "ローカライゼーション戦略", "フランチャイズ戦略"], "category": "企業戦略", "correct": 0, "explanation": "世界を一つの市場とみなし標準化。", "wrongNote": "マルチドメスティック戦略やローカライゼーション戦略は現地適応を重視する考え方であり、フランチャイズ戦略も異なる事業展開手法であるため、世界を一つの市場とみなす標準化戦略とは異なります。"}, {"id": 98, "question": "企業が既存事業の縮小・撤退を通じて経営資源を立て直すことを何と呼ぶか。", "choices": ["リストラクチャリング", "IPO", "カーブアウト", "のれん償却"], "category": "企業戦略", "correct": 0, "explanation": "事業の縮小・再構築。", "wrongNote": "IPOは新規上場、カーブアウトは事業の切り出し、のれん償却は会計処理を指し、事業の縮小・撤退による立て直しとは異なります。"}, {"id": 99, "question": "アンゾフの成長マトリクスにおいて「既存製品」を「新規市場」に投入する戦略を何と呼ぶか。", "choices": ["市場開拓戦略", "市場浸透戦略", "新製品開発戦略", "多角化戦略"], "category": "企業戦略", "correct": 0, "explanation": "既存製品×新規市場。", "wrongNote": "市場浸透戦略は既存製品×既存市場、新製品開発戦略は新製品×既存市場、多角化戦略は新製品×新規市場を指し、既存製品を新規市場に投入する戦略とは異なります。"}, {"id": 100, "question": "アンゾフの成長マトリクスにおいて「新製品」を「新規市場」に投入する戦略を何と呼ぶか。", "choices": ["市場浸透戦略", "市場開拓戦略", "新製品開発戦略", "多角化戦略"], "category": "企業戦略", "correct": 3, "explanation": "新製品×新規市場。  --- # 第3章：会計・財務（Q101〜Q150）", "wrongNote": "市場浸透戦略は既存製品×既存市場、市場開拓戦略は既存製品×新規市場、新製品開発戦略は新製品×既存市場を指し、新製品を新規市場に投入する戦略が多角化戦略です。"}, {"id": 101, "question": "「財務三表」に含まれないものはどれか。", "choices": ["貸借対照表", "損益計算書", "キャッシュフロー計算書", "有価証券報告書"], "category": "会計・財務", "correct": 3, "explanation": "財務三表はBS・PL・CF計算書の3つ。有報はそれらを含む開示書類。", "wrongNote": "貸借対照表・損益計算書・キャッシュフロー計算書はまさに財務三表そのものであり、それらを含む開示書類が有価証券報告書です。"}, {"id": 102, "question": "貸借対照表（バランスシート）が示す内容として正しいものはどれか。", "choices": ["ある一時点における会社の資産・負債・純資産の状況", "一定期間の売上と費用の状況", "一定期間の現金の増減", "株主への配当実績のみ"], "category": "会計・財務", "correct": 0, "explanation": "ストック情報。", "wrongNote": "一定期間の売上・費用は損益計算書、現金の増減はキャッシュフロー計算書の説明であり、貸借対照表は一時点のストック情報を示します。"}, {"id": 103, "question": "損益計算書が示す内容として正しいものはどれか。", "choices": ["一定期間における収益と費用、その結果としての利益", "ある一時点における資産の残高", "現金及び現金同等物の増減", "株主構成の変化"], "category": "会計・財務", "correct": 0, "explanation": "フロー情報。", "wrongNote": "ある一時点の資産残高は貸借対照表、現金の増減はキャッシュフロー計算書の説明であり、損益計算書は一定期間のフロー情報を示します。"}, {"id": 104, "question": "売上高から売上原価を差し引いた利益を何と呼ぶか。", "choices": ["売上総利益", "営業利益", "経常利益", "当期純利益"], "category": "会計・財務", "correct": 0, "explanation": "いわゆる「粗利」。", "wrongNote": "営業利益は販管費を差し引いた後、経常利益は営業外損益を加減した後、当期純利益は最終的な利益であり、売上高から売上原価のみを差し引いたものが売上総利益です。"}, {"id": 105, "question": "売上総利益から販売費及び一般管理費を差し引いた利益を何と呼ぶか。", "choices": ["売上総利益", "営業利益", "経常利益", "特別利益"], "category": "会計・財務", "correct": 1, "explanation": "本業の儲けを示す。", "wrongNote": "売上総利益は売上高から売上原価を差し引いたもの、経常利益は営業外損益を加減した後の利益、特別利益は一時的な損益を指します。"}, {"id": 106, "question": "営業利益に受取利息や支払利息などの営業外損益を加減した利益を何と呼ぶか。", "choices": ["売上総利益", "営業利益", "経常利益", "当期純利益"], "category": "会計・財務", "correct": 2, "explanation": "営業損益＋営業外損益。", "wrongNote": "売上総利益や営業利益はそれ以前の段階の利益、当期純利益は特別損益や税金を差し引いた最終利益であり、営業利益に営業外損益を加減したものが経常利益です。"}, {"id": 107, "question": "本業とは無関係な一時的な損益（固定資産売却益など）を計上する区分はどれか。", "choices": ["売上高", "営業外損益", "特別損益", "販売費及び一般管理費"], "category": "会計・財務", "correct": 2, "explanation": "一時的・臨時的な損益の区分。", "wrongNote": "営業外損益は経常的に発生する財務関連の損益、販管費は営業活動に伴う費用であり、一時的・臨時的な損益は特別損益に区分されます。"}, {"id": 108, "question": "建物や機械などの固定資産の取得原価を、使用期間にわたって費用配分する会計処理を何と呼ぶか。", "choices": ["減価償却", "減損処理", "繰延処理", "圧縮記帳"], "category": "会計・財務", "correct": 0, "explanation": "固定資産の費用配分。", "wrongNote": "減損処理は収益性が著しく低下した際の評価減、圧縮記帳は税務上の特例処理であり、通常の使用期間にわたる費用配分は減価償却と呼ばれます。"}, {"id": 109, "question": "総資産に占める自己資本（純資産）の割合を示す指標を何と呼ぶか。", "choices": ["自己資本比率", "流動比率", "当座比率", "固定比率"], "category": "会計・財務", "correct": 0, "explanation": "財務の安全性指標。", "wrongNote": "流動比率や当座比率は短期的な支払能力を示す指標、固定比率は固定資産と自己資本の関係を示す指標であり、総資産に占める自己資本の割合とは異なります。"}, {"id": 110, "question": "自己資本に対する当期純利益の割合を示す、株主目線の収益性指標を何と呼ぶか。", "choices": ["ROE（自己資本利益率）", "ROA（総資産利益率）", "ROI（投資利益率）", "PER（株価収益率）"], "category": "会計・財務", "correct": 0, "explanation": "株主資本に対する収益性。", "wrongNote": "ROAは総資産に対する利益率、ROIは投資額に対する利益率、PERは株価の割高・割安を示す指標であり、自己資本に対する収益性を示すのはROEです。"}, {"id": 111, "question": "総資産に対する当期純利益の割合を示す指標を何と呼ぶか。", "choices": ["ROE", "ROA", "PBR", "EPS"], "category": "会計・財務", "correct": 1, "explanation": "総資産の効率的活用度を示す。", "wrongNote": "ROEは自己資本に対する利益率、PBRは株価純資産倍率、EPSは1株当たり利益を示す指標であり、総資産に対する利益率を示すのはROAです。"}, {"id": 112, "question": "流動資産を流動負債で割った、短期的な支払い能力を示す指標を何と呼ぶか。", "choices": ["流動比率", "自己資本比率", "固定比率", "総資産回転率"], "category": "会計・財務", "correct": 0, "explanation": "短期支払能力の代表指標。", "wrongNote": "自己資本比率は財務の安全性全体を示す指標、固定比率は固定資産と自己資本の関係、総資産回転率は資産効率を示す指標であり、短期支払能力を示すのは流動比率です。"}, {"id": 113, "question": "棚卸資産を除いた流動資産で流動負債をカバーできるかを見る、より厳格な短期支払能力指標を何と呼ぶか。", "choices": ["当座比率", "流動比率", "固定比率", "インタレスト・カバレッジ・レシオ"], "category": "会計・財務", "correct": 0, "explanation": "棚卸資産を除くためより厳格。", "wrongNote": "流動比率は棚卸資産を含んだ指標であり、固定比率や利払い能力を示すインタレスト・カバレッジ・レシオとも異なる、棚卸資産を除いたより厳格な指標が当座比率です。"}, {"id": 114, "question": "キャッシュフロー計算書の3区分に含まれないものはどれか。", "choices": ["営業活動によるキャッシュフロー", "投資活動によるキャッシュフロー", "財務活動によるキャッシュフロー", "特別活動によるキャッシュフロー"], "category": "会計・財務", "correct": 3, "explanation": "CF計算書は営業・投資・財務の3区分。", "wrongNote": "営業活動・投資活動・財務活動によるキャッシュフローが実際の3区分であり、特別活動という区分は存在しません。"}, {"id": 115, "question": "利払前・税引前・減価償却前利益を示す指標を何と呼ぶか。", "choices": ["EBITDA", "EPS", "PER", "PBR"], "category": "会計・財務", "correct": 0, "explanation": "利払・税・償却前の利益。", "wrongNote": "EPSは1株当たり利益、PERは株価収益率、PBRは株価純資産倍率を示す指標であり、利払・税・償却前の利益を示すのはEBITDAです。"}, {"id": 116, "question": "株価が1株当たり純利益（EPS）の何倍まで買われているかを示す指標を何と呼ぶか。", "choices": ["PER（株価収益率）", "PBR（株価純資産倍率）", "ROE", "配当利回り"], "category": "会計・財務", "correct": 0, "explanation": "株価の割高・割安を測る代表指標。", "wrongNote": "PBRは株価純資産倍率、ROEは自己資本利益率、配当利回りは株価に対する配当金の割合を示す指標であり、株価とEPSの関係を示すのはPERです。"}, {"id": 117, "question": "株価が1株当たり純資産（BPS）の何倍まで買われているかを示す指標を何と呼ぶか。", "choices": ["PBR（株価純資産倍率）", "PER（株価収益率）", "ROA", "配当性向"], "category": "会計・財務", "correct": 0, "explanation": "解散価値に対する株価の評価。", "wrongNote": "PERは株価収益率、ROAは総資産利益率、配当性向は利益に占める配当の割合を示す指標であり、株価と1株当たり純資産の関係を示すのはPBRです。"}, {"id": 118, "question": "当期純利益のうち、配当金として株主に還元される割合を示す指標を何と呼ぶか。", "choices": ["配当性向", "配当利回り", "自己資本比率", "内部留保率"], "category": "会計・財務", "correct": 0, "explanation": "純利益に占める配当の割合。", "wrongNote": "配当利回りは株価に対する配当金の割合、自己資本比率は財務の安全性を示す指標であり、内部留保率は逆に社内に残す割合を示すため、配当性向とは視点が異なります。"}, {"id": 119, "question": "発行済株式数に株価を掛け合わせた、企業の市場評価額を何と呼ぶか。", "choices": ["時価総額", "簿価総額", "純資産額", "発行済資本金"], "category": "会計・財務", "correct": 0, "explanation": "株価×発行済株式数。", "wrongNote": "簿価総額は帳簿上の評価額、純資産額は資産から負債を差し引いた額、発行済資本金は出資額に基づく数値であり、株価×発行済株式数で示されるのが時価総額です。"}, {"id": 120, "question": "売上高と費用が等しくなり、利益がゼロになる売上高の水準を何と呼ぶか。", "choices": ["損益分岐点", "減損点", "分水嶺点", "均衡価格"], "category": "会計・財務", "correct": 0, "explanation": "利益ゼロとなる売上水準。", "wrongNote": "減損点や分水嶺点は一般的な会計用語として定着しておらず、均衡価格は需給が一致する価格水準を指すため、売上と費用が等しくなる水準を指す損益分岐点とは異なります。"}, {"id": 121, "question": "売上の増減にかかわらず一定額発生する費用を何と呼ぶか。", "choices": ["固定費", "変動費", "機会費用", "埋没費用"], "category": "会計・財務", "correct": 0, "explanation": "売上に関係なく発生。", "wrongNote": "変動費は売上に比例して発生する費用、機会費用は選択しなかった場合の逸失利益、埋没費用は既に支出し回収不能な費用であり、売上に関係なく一定額発生するのは固定費です。"}, {"id": 122, "question": "売上の増減に比例して発生する費用を何と呼ぶか。", "choices": ["固定費", "変動費", "資本的支出", "減価償却費"], "category": "会計・財務", "correct": 1, "explanation": "売上に比例して増減。", "wrongNote": "固定費は売上に関係なく一定額発生する費用、資本的支出は固定資産への投資、減価償却費は固定資産の費用配分を指し、売上に比例するのが変動費です。"}, {"id": 123, "question": "企業が獲得した利益のうち、配当されずに社内に蓄積された部分を何と呼ぶか。", "choices": ["内部留保", "資本金", "短期借入金", "買掛金"], "category": "会計・財務", "correct": 0, "explanation": "配当されず社内に蓄積される利益。", "wrongNote": "資本金は株主からの出資額、短期借入金や買掛金は負債であり、配当されずに社内に蓄積された利益を指すのは内部留保です。"}, {"id": 124, "question": "保有する資産の収益性が著しく低下した場合に帳簿価額を切り下げる会計処理を何と呼ぶか。", "choices": ["減損処理", "減価償却", "圧縮記帳", "繰延資産計上"], "category": "会計・財務", "correct": 0, "explanation": "資産の収益性低下を反映。", "wrongNote": "減価償却は通常の使用期間にわたる費用配分、圧縮記帳は税務上の特例処理、繰延資産計上は費用の資産計上を指し、収益性の著しい低下時の評価減は減損処理です。"}, {"id": 125, "question": "将来発生する可能性のある費用や損失に備え、あらかじめ計上しておく負債項目を何と呼ぶか。", "choices": ["引当金", "前受金", "未収金", "仮払金"], "category": "会計・財務", "correct": 0, "explanation": "将来の費用・損失に備える負債。", "wrongNote": "前受金は代金の前受け、未収金は未回収の代金、仮払金は一時的な支払いを指し、将来の費用・損失に備える負債は引当金と呼ばれます。"}, {"id": 126, "question": "親会社と子会社の財務諸表を合算し、グループ全体の経営成績を示す決算を何と呼ぶか。", "choices": ["連結決算", "単体決算", "概算決算", "中間決算"], "category": "会計・財務", "correct": 0, "explanation": "グループ全体の経営成績を示す。", "wrongNote": "単体決算は個社ごとの決算、概算決算や中間決算は別の区分を指し、親会社と子会社を合算するのは連結決算です。"}, {"id": 127, "question": "議決権の20〜50％程度を保有する関連会社の業績を、持分割合に応じて連結財務諸表に反映させる会計処理を何と呼ぶか。", "choices": ["持分法", "連結法", "原価法", "時価法"], "category": "会計・財務", "correct": 0, "explanation": "持分割合に応じて業績を反映。", "wrongNote": "連結法は子会社を全面的に合算する方法、原価法や時価法は資産の評価方法であり、持分割合に応じて業績を反映させるのは持分法です。"}, {"id": 128, "question": "国際的に広く採用されている会計基準の略称として正しいものはどれか。", "choices": ["IFRS", "GAAP", "JASDAQ", "TOPIX"], "category": "会計・財務", "correct": 0, "explanation": "国際財務報告基準。", "wrongNote": "GAAPは各国の会計基準を指す言葉、JASDAQやTOPIXは日本の株式市場・指数の名称であり、国際的に採用されている会計基準はIFRSです。"}, {"id": 129, "question": "外貨建て資産・負債を円換算する際に発生する損益を何と呼ぶか。", "choices": ["為替差損益", "減損損失", "特別損失のみ", "償却損"], "category": "会計・財務", "correct": 0, "explanation": "外貨建て資産負債の円換算差額。", "wrongNote": "減損損失は資産の評価減、償却損は資産の償却に伴う損失を指し、特別損失だけに限られるわけでもなく、外貨建て資産負債の円換算で生じるのは為替差損益です。"}, {"id": 130, "question": "上場企業が投資家保護のために事業年度ごとに開示する法定書類を何と呼ぶか。", "choices": ["有価証券報告書", "定款", "就業規則", "議事録"], "category": "会計・財務", "correct": 0, "explanation": "投資家保護のための法定開示書類。", "wrongNote": "定款は会社の基本規則、就業規則は労働条件の規則、議事録は会議の記録であり、投資家保護のための法定開示書類は有価証券報告書です。"}, {"id": 131, "question": "2023年に日本で導入された、仕入税額控除の適用要件を厳格化する消費税の新制度を何と呼ぶか。", "choices": ["インボイス制度", "マイナンバー制度", "ふるさと納税制度", "NISA制度"], "category": "会計・財務", "correct": 0, "explanation": "2023年10月開始。", "wrongNote": "マイナンバー制度やふるさと納税制度、NISA制度はいずれも消費税とは別の制度であり、仕入税額控除の要件を厳格化したのはインボイス制度です。"}, {"id": 132, "question": "消費税のように、税を負担する者と納める者が異なる税を何と呼ぶか。", "choices": ["直接税", "間接税", "資産税", "財産税"], "category": "会計・財務", "correct": 1, "explanation": "消費税の代表的性質。", "wrongNote": "直接税は税を負担する人と納める人が同じ税を指し、資産税や財産税とも分類の軸が異なるため、消費税は間接税に分類されます。"}, {"id": 133, "question": "企業の所得に対して課される税を何と呼ぶか。", "choices": ["法人税", "相続税", "贈与税", "固定資産税"], "category": "会計・財務", "correct": 0, "explanation": "企業の所得課税。", "wrongNote": "相続税や贈与税は個人の資産移転に対する税、固定資産税は資産保有に対する税であり、企業の所得に対して課されるのは法人税です。"}, {"id": 134, "question": "減価償却の方法のうち、毎期一定額を償却する方式を何と呼ぶか。", "choices": ["定額法", "定率法", "生産高比例法", "級数法"], "category": "会計・財務", "correct": 0, "explanation": "毎期一定額を償却。", "wrongNote": "定率法は未償却残高に一定率をかける方式、生産高比例法は生産量に応じた償却、級数法は償却率を逓減させる方式であり、毎期一定額を償却するのは定額法です。"}, {"id": 135, "question": "減価償却の方法のうち、未償却残高に一定率を掛けて償却額を計算し、初期の償却額が大きくなる方式を何と呼ぶか。", "choices": ["定率法", "定額法", "総合償却法", "個別償却法"], "category": "会計・財務", "correct": 0, "explanation": "初期の償却額が大きい方式。", "wrongNote": "定額法は毎期一定額を償却する方式、総合償却法や個別償却法は資産のまとめ方の違いを指し、未償却残高に一定率をかけるのは定率法です。"}, {"id": 136, "question": "販売目的で保有する商品・製品・原材料などの資産を何と呼ぶか。", "choices": ["棚卸資産", "固定資産", "繰延資産", "投資有価証券"], "category": "会計・財務", "correct": 0, "explanation": "販売目的で保有する資産。", "wrongNote": "固定資産は長期使用目的の資産、繰延資産は費用の資産計上、投資有価証券は投資目的の有価証券であり、販売目的で保有する資産は棚卸資産です。"}, {"id": 137, "question": "商品を販売したがまだ代金を受け取っていない場合に計上される資産を何と呼ぶか。", "choices": ["売掛金", "買掛金", "前受金", "未払金"], "category": "会計・財務", "correct": 0, "explanation": "未回収の売上代金債権。", "wrongNote": "買掛金は仕入代金の未払い、前受金は代金の前受け、未払金は代金以外の未払い債務を指し、販売代金の未回収債権は売掛金です。"}, {"id": 138, "question": "商品を仕入れたがまだ代金を支払っていない場合に計上される負債を何と呼ぶか。", "choices": ["買掛金", "売掛金", "前払金", "未収金"], "category": "会計・財務", "correct": 0, "explanation": "未払いの仕入代金債務。", "wrongNote": "売掛金は販売代金の未回収債権、前払金は代金の前払い、未収金は代金以外の未回収債権を指し、仕入代金の未払いは買掛金です。"}, {"id": 139, "question": "仕入から販売、代金回収までにかかる日数を示す、資金効率を測る指標を何と呼ぶか。", "choices": ["キャッシュ・コンバージョン・サイクル", "損益分岐点比率", "インタレスト・カバレッジ・レシオ", "デットエクイティレシオ"], "category": "会計・財務", "correct": 0, "explanation": "資金効率を測る指標。", "wrongNote": "損益分岐点比率や利払い能力を示すインタレスト・カバレッジ・レシオ、負債比率を示すデットエクイティレシオはいずれも別の指標であり、資金回収までの日数を示すのがキャッシュ・コンバージョン・サイクルです。"}, {"id": 140, "question": "営業活動によるキャッシュフローから設備投資などの投資支出を差し引いた、企業が自由に使えるお金を何と呼ぶか。", "choices": ["フリーキャッシュフロー", "グロスキャッシュフロー", "ネットキャッシュフロー", "オペレーティングレバレッジ"], "category": "会計・財務", "correct": 0, "explanation": "営業CF−投資CF。", "wrongNote": "グロスキャッシュフローやネットキャッシュフローは単純な総額・純額の集計、オペレーティングレバレッジは費用構造を示す指標であり、営業CFから投資支出を差し引いたものがフリーキャッシュフローです。"}, {"id": 141, "question": "株価に対する年間配当金の割合を示す指標を何と呼ぶか。", "choices": ["配当利回り", "配当性向", "PER", "PBR"], "category": "会計・財務", "correct": 0, "explanation": "株価に対する配当金の割合。", "wrongNote": "配当性向は利益に占める配当の割合、PERは株価収益率、PBRは株価純資産倍率を示す指標であり、株価に対する配当金の割合を示すのが配当利回りです。"}, {"id": 142, "question": "企業が市場に流通する自社の株式を買い戻す行為を何と呼ぶか。", "choices": ["自社株買い", "株式分割", "株式併合", "第三者割当増資"], "category": "会計・財務", "correct": 0, "explanation": "流通株式数を減らす行為。", "wrongNote": "株式分割は1株を複数に分ける行為、株式併合は複数株を1株にまとめる行為、第三者割当増資は特定の第三者への新株発行を指し、自社の株式を買い戻す行為は自社株買いです。"}, {"id": 143, "question": "企業が新株を発行して資金を調達することを何と呼ぶか。", "choices": ["増資", "減資", "償却", "引当"], "category": "会計・財務", "correct": 0, "explanation": "新株発行による資金調達。", "wrongNote": "減資は資本金を減らす行為、償却は資産の費用配分、引当は将来の費用への備えを指し、新株発行による資金調達は増資です。"}, {"id": 144, "question": "企業が投資家からの借入として発行する債券を何と呼ぶか。", "choices": ["社債", "株式", "手形", "為替予約"], "category": "会計・財務", "correct": 0, "explanation": "企業が発行する借入証券。", "wrongNote": "株式は出資に対して発行される証券、手形は決済手段、為替予約は為替リスク回避のための契約であり、借入として発行される債券は社債です。"}, {"id": 145, "question": "債券や発行体の信用力を評価し、記号で示す会社を何と呼ぶか。", "choices": ["格付け会社", "証券取引所", "監査法人", "税理士法人"], "category": "会計・財務", "correct": 0, "explanation": "信用力を記号で評価。", "wrongNote": "証券取引所は株式等の売買の場、監査法人は会計監査を行う法人、税理士法人は税務業務を行う法人であり、信用力を評価するのは格付け会社です。"}, {"id": 146, "question": "債務者が約束通りに元利金を支払えなくなるリスクを何と呼ぶか。", "choices": ["デフォルトリスク", "流動性リスク", "カントリーリスク", "インフレリスク"], "category": "会計・財務", "correct": 0, "explanation": "債務不履行のリスク。", "wrongNote": "流動性リスクは資産を現金化しにくいリスク、カントリーリスクは投資先国特有のリスク、インフレリスクは物価上昇によるリスクを指し、元利金の不払いリスクはデフォルトリスクです。"}, {"id": 147, "question": "借入金などの他人資本を活用して自己資本利益率を高める経営手法を何と呼ぶか。", "choices": ["レバレッジ経営", "デレバレッジ経営", "コングロマリット経営", "カーブアウト経営"], "category": "会計・財務", "correct": 0, "explanation": "他人資本を活用した経営手法。", "wrongNote": "デレバレッジ経営はむしろ負債を圧縮する方向の経営、コングロマリット経営は異業種展開、カーブアウト経営は事業の切り出しを指し、他人資本を活用するのはレバレッジ経営です。"}, {"id": 148, "question": "企業が資金調達に要する総合的なコスト（資本コスト）を示す指標を何と呼ぶか。", "choices": ["WACC（加重平均資本コスト）", "EBITDA", "EPS", "ROIC"], "category": "会計・財務", "correct": 0, "explanation": "加重平均資本コスト。", "wrongNote": "EBITDAは利払・税・償却前利益、EPSは1株当たり利益、ROICは投下資本利益率を示す指標であり、資金調達コストの総合指標はWACCです。"}, {"id": 149, "question": "資産の「簿価」の説明として正しいものはどれか。", "choices": ["帳簿上に記載されている資産の価額", "現在の市場での売却可能価額", "将来の予想売却価額", "発行済株式数に基づく評価額"], "category": "会計・財務", "correct": 0, "explanation": "簿価の定義。", "wrongNote": "現在の市場売却可能価額は時価、将来の予想売却価額は予測に基づく別の概念、発行済株式数に基づく評価額は時価総額を指し、帳簿上の記載価額が簿価です。"}, {"id": 150, "question": "資産の現在の市場価値を示す価額を何と呼ぶか。", "choices": ["時価", "簿価", "額面価額", "償却原価"], "category": "会計・財務", "correct": 0, "explanation": "市場での現在価値。  --- # 第4章：法務・人事（Q151〜Q200）", "wrongNote": "簿価は帳簿上の記載価額、額面価額は証券に記載された名目上の価額、償却原価は取得原価を償却した後の価額を指し、市場での現在価値を示すのが時価です。"}, {"id": 151, "question": "労働時間・休憩・休日などの労働条件の最低基準を定めた法律はどれか。", "choices": ["労働基準法", "労働組合法", "労働関係調整法", "職業安定法"], "category": "法務・人事", "correct": 0, "explanation": "労働条件の最低基準を定める。", "wrongNote": "労働組合法は団結権などを保障する法律、労働関係調整法は労働争議の調整に関する法律、職業安定法は職業紹介等を規律する法律であり、労働条件の最低基準を定めるのは労働基準法です。"}, {"id": 152, "question": "法定労働時間を超えて従業員に残業をさせる場合に労使間で締結が必要な協定を何と呼ぶか。", "choices": ["36協定", "労働協約", "就業規則", "労働契約"], "category": "法務・人事", "correct": 0, "explanation": "時間外・休日労働に関する労使協定。", "wrongNote": "労働協約は労使間の合意文書全般、就業規則は職場のルール、労働契約は個別の雇用契約を指し、時間外・休日労働に関する労使協定は36協定と呼ばれます。"}, {"id": 153, "question": "各都道府県ごとに定められている、企業が支払わなければならない賃金の下限を何と呼ぶか。", "choices": ["最低賃金", "標準報酬月額", "基準内賃金", "平均賃金"], "category": "法務・人事", "correct": 0, "explanation": "都道府県ごとに設定。", "wrongNote": "標準報酬月額は社会保険料の算定基準、基準内賃金は諸手当を除いた基本給等、平均賃金は解雇予告手当等の算定基礎であり、賃金の下限を定めるのは最低賃金です。"}, {"id": 154, "question": "労働基準法で定められている年次有給休暇の説明として正しいものはどれか。", "choices": ["一定期間勤務した労働者に付与される、賃金が支払われる休暇", "病気の際にのみ取得できる無給の休暇", "正社員のみが取得できる特別な福利厚生", "会社が任意に付与するかどうかを決められる休暇"], "category": "法務・人事", "correct": 0, "explanation": "労基法上の権利。", "wrongNote": "病気の際にのみ取得できる無給の休暇ではなく、正社員に限らず一定条件を満たせば取得でき、会社が任意に付与を決められる制度でもありません。"}, {"id": 155, "question": "労働者が団結して労働組合を結成し、団体交渉を行う権利などを保障する法律はどれか。", "choices": ["労働組合法", "労働基準法", "男女雇用機会均等法", "職業安定法"], "category": "法務・人事", "correct": 0, "explanation": "団結権・団体交渉権などを保障。", "wrongNote": "労働基準法は労働条件の最低基準を定める法律、男女雇用機会均等法は性差別を禁止する法律、職業安定法は職業紹介等を規律する法律であり、団結権等を保障するのは労働組合法です。"}, {"id": 156, "question": "正社員と非正規雇用者の間で、職務内容が同じであれば待遇に不合理な差を設けてはならないとする考え方を何と呼ぶか。", "choices": ["同一労働同一賃金", "年功序列賃金", "成果主義賃金", "職務給"], "category": "法務・人事", "correct": 0, "explanation": "不合理な待遇差の禁止。", "wrongNote": "年功序列賃金は勤続年数を重視する賃金体系、成果主義賃金は成果を重視する賃金体系、職務給は職務内容に基づく賃金体系を指し、待遇差の不合理性を問う考え方が同一労働同一賃金です。"}, {"id": 157, "question": "労働者が育児や家族の介護をしながら働き続けられるよう休業取得の権利などを定めた法律はどれか。", "choices": ["育児・介護休業法", "男女雇用機会均等法", "次世代育成支援対策推進法", "少子化社会対策基本法"], "category": "法務・人事", "correct": 0, "explanation": "休業取得等の権利を規定。", "wrongNote": "男女雇用機会均等法は性差別を禁止する法律、次世代育成支援対策推進法は事業主の行動計画策定等を求める法律、少子化社会対策基本法は基本理念を定める法律であり、休業取得の権利を定めるのは育児・介護休業法です。"}, {"id": 158, "question": "職場におけるパワーハラスメントの防止措置を事業主に義務付けた法律・改正の通称はどれか。", "choices": ["パワハラ防止法", "カスハラ対策法", "労働災害防止法", "職業能力開発促進法"], "category": "法務・人事", "correct": 0, "explanation": "改正労働施策総合推進法の通称。", "wrongNote": "カスタマーハラスメント対策は別途整備が進む分野、労働災害防止法は労災防止のための法律、職業能力開発促進法は職業訓練等の推進を目的とする法律であり、職場のパワハラ防止義務を定めたのはパワハラ防止法です。"}, {"id": 159, "question": "雇用の分野における性別を理由とした差別を禁止する法律はどれか。", "choices": ["男女雇用機会均等法", "男女共同参画社会基本法", "女性活躍推進法", "育児・介護休業法"], "category": "法務・人事", "correct": 0, "explanation": "雇用における性差別を禁止。", "wrongNote": "男女共同参画社会基本法は社会全体の基本理念を定める法律、女性活躍推進法は行動計画の策定等を求める法律、育児・介護休業法は休業取得の権利を定める法律であり、雇用における性差別を禁止するのは男女雇用機会均等法です。"}, {"id": 160, "question": "妊娠・出産等を理由とした不利益取扱いやハラスメントを何と呼ぶか。", "choices": ["マタニティハラスメント（マタハラ）", "セクシュアルハラスメント", "モラルハラスメント", "アカデミックハラスメント"], "category": "法務・人事", "correct": 0, "explanation": "妊娠・出産関連のハラスメント。", "wrongNote": "セクシュアルハラスメントは性的な言動によるもの、モラルハラスメントは精神的な嫌がらせ全般、アカデミックハラスメントは大学等における嫌がらせを指し、妊娠・出産等を理由とするものはマタニティハラスメントです。"}, {"id": 161, "question": "個人情報の適正な取扱いを事業者に義務付ける法律はどれか。", "choices": ["個人情報保護法", "情報公開法", "特定秘密保護法", "マイナンバー法"], "category": "法務・人事", "correct": 0, "explanation": "事業者の個人情報取扱いを規律。", "wrongNote": "情報公開法は行政文書の開示に関する法律、特定秘密保護法は国家機密の保護に関する法律、マイナンバー法はマイナンバー制度の運用に関する法律であり、事業者の個人情報取扱いを規律するのは個人情報保護法です。"}, {"id": 162, "question": "企業間の公正な競争を確保し、カルテルや不当な取引制限を規制する法律はどれか。", "choices": ["独占禁止法", "会社法", "商法", "金融商品取引法"], "category": "法務・人事", "correct": 0, "explanation": "公正な競争の確保。", "wrongNote": "会社法は会社の組織・運営に関する法律、商法は商取引全般に関する法律、金融商品取引法は金融商品取引を規律する法律であり、公正な競争を確保するのは独占禁止法です。"}, {"id": 163, "question": "親事業者が下請事業者に対して代金支払遅延や不当な減額などを行うことを規制する法律はどれか。", "choices": ["下請法", "独占禁止法", "労働基準法", "消費者契約法"], "category": "法務・人事", "correct": 0, "explanation": "親事業者の優越的地位濫用を規制。", "wrongNote": "独占禁止法は競争制限行為全般を規制する法律、労働基準法は労働条件を規律する法律、消費者契約法は消費者保護のための法律であり、下請取引の適正化を図るのは下請法です。"}, {"id": 164, "question": "株式会社の設立・組織・運営に関する基本的な事項を定めた法律はどれか。", "choices": ["会社法", "商法", "民法", "金融商品取引法"], "category": "法務・人事", "correct": 0, "explanation": "会社の設立・組織・運営を規律。", "wrongNote": "商法は商取引全般に関する法律、民法は私法の一般法、金融商品取引法は金融商品取引を規律する法律であり、会社の設立・組織・運営を定めるのは会社法です。"}, {"id": 165, "question": "発明を保護し、一定期間独占的に実施できる権利を何と呼ぶか。", "choices": ["特許権", "著作権", "商標権", "意匠権"], "category": "法務・人事", "correct": 0, "explanation": "発明の保護。", "wrongNote": "著作権は創作的な表現を保護する権利、商標権はマークや名称を保護する権利、意匠権はデザインを保護する権利であり、発明を保護するのは特許権です。"}, {"id": 166, "question": "商品やサービスに使用するマークや名称を保護する権利を何と呼ぶか。", "choices": ["商標権", "特許権", "実用新案権", "著作権"], "category": "法務・人事", "correct": 0, "explanation": "マーク・名称の保護。", "wrongNote": "特許権は発明を保護する権利、実用新案権は物品の形状等の考案を保護する権利、著作権は創作的表現を保護する権利であり、マークや名称を保護するのは商標権です。"}, {"id": 167, "question": "小説・音楽・プログラムなどの創作的な表現を保護する権利を何と呼ぶか。", "choices": ["著作権", "特許権", "商標権", "意匠権"], "category": "法務・人事", "correct": 0, "explanation": "創作的表現の保護。", "wrongNote": "特許権は発明を保護する権利、商標権はマークや名称を保護する権利、意匠権はデザインを保護する権利であり、創作的な表現を保護するのは著作権です。"}, {"id": 168, "question": "物品のデザイン（形状・模様・色彩など）を保護する権利を何と呼ぶか。", "choices": ["意匠権", "特許権", "商標権", "著作権"], "category": "法務・人事", "correct": 0, "explanation": "デザインの保護。", "wrongNote": "特許権は発明を保護する権利、商標権はマークや名称を保護する権利、著作権は創作的表現を保護する権利であり、物品のデザインを保護するのは意匠権です。"}, {"id": 169, "question": "従業員が組織内の不正行為を、社内外の窓口に知らせる仕組みを何と呼ぶか。", "choices": ["内部通報制度", "稟議制度", "監査役会制度", "株主代表訴訟制度"], "category": "法務・人事", "correct": 0, "explanation": "不正行為の早期発見に活用。", "wrongNote": "稟議制度は社内の意思決定・決裁の仕組み、監査役会制度は監査機関、株主代表訴訟制度は株主による責任追及の訴訟手続きであり、不正行為を知らせる仕組みは内部通報制度です。"}, {"id": 170, "question": "企業が法令や社会規範を遵守して事業活動を行うことを何と呼ぶか。", "choices": ["コンプライアンス", "アカウンタビリティ", "サステナビリティ", "アイデンティティ"], "category": "法務・人事", "correct": 0, "explanation": "法令・社会規範の遵守。", "wrongNote": "アカウンタビリティは説明責任、サステナビリティは持続可能性、アイデンティティは自己同一性を指す言葉であり、法令や社会規範の遵守を指すのはコンプライアンスです。"}, {"id": 171, "question": "上場企業の未公表の重要情報を知る立場を利用し、公表前に株式を売買する行為を規制する制度を何と呼ぶか。", "choices": ["インサイダー取引規制", "空売り規制", "サーキットブレーカー", "ストップ高規制"], "category": "法務・人事", "correct": 0, "explanation": "未公表重要情報を利用した取引の禁止。", "wrongNote": "空売り規制は株式の空売りに関する規制、サーキットブレーカーは急落時の取引停止措置、ストップ高規制は価格変動幅の制限を指し、未公表の重要情報を利用した取引を規制するのはインサイダー取引規制です。"}, {"id": 172, "question": "金融商品取引の公正性を確保し、有価証券報告書の提出義務などを定める法律はどれか。", "choices": ["金融商品取引法", "銀行法", "保険業法", "資金決済法"], "category": "法務・人事", "correct": 0, "explanation": "金商法。開示制度等を規定。", "wrongNote": "銀行法は銀行業を規律する法律、保険業法は保険業を規律する法律、資金決済法は資金決済サービスを規律する法律であり、有価証券報告書の提出義務等を定めるのは金融商品取引法です。"}, {"id": 173, "question": "労働者を雇用する企業ではなく、他の企業（派遣先）で就業させる仕組みを規律する法律はどれか。", "choices": ["労働者派遣法", "職業安定法", "パートタイム・有期雇用労働法", "高年齢者雇用安定法"], "category": "法務・人事", "correct": 0, "explanation": "派遣就業を規律。", "wrongNote": "職業安定法は職業紹介等を規律する法律、パートタイム・有期雇用労働法は非正規雇用の待遇を規律する法律、高年齢者雇用安定法は高齢者雇用を規律する法律であり、派遣就業を規律するのは労働者派遣法です。"}, {"id": 174, "question": "労働者が始業・終業の時刻を一定の範囲で自ら決められる制度を何と呼ぶか。", "choices": ["フレックスタイム制", "変形労働時間制", "裁量労働制", "みなし労働時間制"], "category": "法務・人事", "correct": 0, "explanation": "始業・終業時刻の自己決定。", "wrongNote": "変形労働時間制は一定期間内で労働時間を調整する制度、裁量労働制やみなし労働時間制は実労働時間によらず一定時間働いたとみなす別の制度であり、始業・終業時刻を自ら決められるのはフレックスタイム制です。"}, {"id": 175, "question": "業務の進め方や時間配分を労働者の裁量に委ね、実際の労働時間にかかわらず一定時間働いたとみなす制度を何と呼ぶか。", "choices": ["裁量労働制", "フレックスタイム制", "短時間勤務制", "シフト制"], "category": "法務・人事", "correct": 0, "explanation": "みなし労働時間制の一種。", "wrongNote": "フレックスタイム制は始業・終業時刻を自ら決められる制度、短時間勤務制は勤務時間を短縮する制度、シフト制は交代制勤務の仕組みであり、業務の進め方を裁量に委ねるのは裁量労働制です。"}, {"id": 176, "question": "一定年齢に達した従業員の雇用契約を終了させる制度を何と呼ぶか。", "choices": ["定年制", "育児休業制", "産前産後休業制", "傷病休職制"], "category": "法務・人事", "correct": 0, "explanation": "一定年齢での雇用契約終了。", "wrongNote": "育児休業制は育児のための休業制度、産前産後休業制は出産前後の休業制度、傷病休職制は病気療養のための休職制度であり、一定年齢での雇用契約終了を指すのは定年制です。"}, {"id": 177, "question": "職務内容を明確に定義し、その職務に必要なスキルを持つ人材を採用・配置する雇用形態を何と呼ぶか。", "choices": ["ジョブ型雇用", "メンバーシップ型雇用", "終身雇用", "年功序列雇用"], "category": "法務・人事", "correct": 0, "explanation": "職務内容を明確化した雇用。", "wrongNote": "メンバーシップ型雇用は職務を限定しない日本型の雇用慣行、終身雇用は長期雇用の慣行、年功序列雇用は勤続年数を重視する処遇を指し、職務内容を明確に定義するのはジョブ型雇用です。"}, {"id": 178, "question": "職務を限定せず、新卒一括採用や社内異動を通じて人材を育成する日本型の雇用慣行を何と呼ぶか。", "choices": ["メンバーシップ型雇用", "ジョブ型雇用", "成果主義雇用", "出来高制雇用"], "category": "法務・人事", "correct": 0, "explanation": "日本型の雇用慣行。", "wrongNote": "ジョブ型雇用は職務内容を明確化した雇用、成果主義雇用は成果を重視する処遇、出来高制雇用は成果量に応じた賃金制度を指し、新卒一括採用や社内異動を通じた育成は日本型のメンバーシップ型雇用です。"}, {"id": 179, "question": "労働契約に期間の定めがなく、フルタイムで働く典型的な雇用形態を何と呼ぶか。", "choices": ["正社員", "契約社員", "パートタイム労働者", "業務委託"], "category": "法務・人事", "correct": 0, "explanation": "無期・フルタイムが典型。", "wrongNote": "契約社員は期間の定めがある雇用形態、パートタイム労働者は所定労働時間が短い雇用形態、業務委託はそもそも雇用契約ではなく、期間の定めのないフルタイム雇用は正社員です。"}, {"id": 180, "question": "労働条件や職場規律などを定め、常時10人以上の労働者を使用する事業場で作成・届出が義務付けられている規程を何と呼ぶか。", "choices": ["就業規則", "労働協約", "雇用契約書", "内規"], "category": "法務・人事", "correct": 0, "explanation": "常時10人以上の事業場で作成・届出義務。", "wrongNote": "労働協約は労使間の合意文書、雇用契約書は個別の労働契約、内規は社内の非公式な規程を指し、常時10人以上の事業場で作成・届出が義務付けられているのは就業規則です。"}, {"id": 181, "question": "労働者と事業主の間の個別労働紛争を、原則3回以内の期日で迅速に解決する裁判所の手続を何と呼ぶか。", "choices": ["労働審判", "民事調停", "仮処分", "家事審判"], "category": "法務・人事", "correct": 0, "explanation": "迅速な個別労働紛争解決手続。", "wrongNote": "民事調停は一般の民事紛争解決手続、仮処分は緊急の権利保全手続、家事審判は家庭に関する紛争の手続であり、個別労働紛争を迅速に解決する手続きは労働審判です。"}, {"id": 182, "question": "労働基準法違反の疑いがある事業場への立ち入り調査などを行う行政機関はどれか。", "choices": ["労働基準監督署", "公正取引委員会", "消費者庁", "金融庁"], "category": "法務・人事", "correct": 0, "explanation": "労基法違反の調査等を実施。", "wrongNote": "公正取引委員会は独占禁止法の執行機関、消費者庁は消費者保護行政を担う機関、金融庁は金融行政を担う機関であり、労基法違反の調査等を行うのは労働基準監督署です。"}, {"id": 183, "question": "人手不足分野において一定の専門性・技能を持つ外国人の就労を認める在留資格を何と呼ぶか。", "choices": ["特定技能", "技能実習", "高度専門職", "永住者"], "category": "法務・人事", "correct": 0, "explanation": "人手不足分野の外国人就労資格。", "wrongNote": "技能実習は技能移転を目的とした在留資格、高度専門職は高度な専門性を持つ人材向けの在留資格、永住者は在留期間に制限のない資格を指し、人手不足分野での就労を認めるのは特定技能です。"}, {"id": 184, "question": "オフィスに出社せず、自宅などで情報通信技術を活用して働く勤務形態を何と呼ぶか。", "choices": ["テレワーク", "ジョブローテーション", "OJT", "アウトプレースメント"], "category": "法務・人事", "correct": 0, "explanation": "ICTを活用した非出社型勤務。", "wrongNote": "ジョブローテーションは社内での配置転換による育成、OJTは実務を通じた教育訓練、アウトプレースメントは再就職支援を指し、ICTを活用した非出社型勤務はテレワークです。"}, {"id": 185, "question": "従業員が本業以外に別の仕事を持つことを何と呼ぶか。", "choices": ["副業・兼業", "出向", "転籍", "配置転換"], "category": "法務・人事", "correct": 0, "explanation": "本業以外の就労。", "wrongNote": "出向は籍を置いたまま他社で勤務する形態、転籍は籍を移して他社で勤務する形態、配置転換は社内での異動を指し、本業以外に別の仕事を持つことは副業・兼業と呼ばれます。"}, {"id": 186, "question": "女性の職業生活における活躍を推進するための行動計画策定などを事業主に求める法律はどれか。", "choices": ["女性活躍推進法", "男女雇用機会均等法", "育児・介護休業法", "パートタイム・有期雇用労働法"], "category": "法務・人事", "correct": 0, "explanation": "行動計画策定等を義務付け。", "wrongNote": "男女雇用機会均等法は性差別を禁止する法律、育児・介護休業法は休業取得の権利を定める法律、パートタイム・有期雇用労働法は非正規雇用の待遇を規律する法律であり、行動計画の策定等を求めるのは女性活躍推進法です。"}, {"id": 187, "question": "一定規模以上の事業主に対し、障害者の法定雇用率達成を義務付ける法律はどれか。", "choices": ["障害者雇用促進法", "障害者総合支援法", "バリアフリー法", "障害者差別解消法"], "category": "法務・人事", "correct": 0, "explanation": "法定雇用率の達成義務。", "wrongNote": "障害者総合支援法は福祉サービスの提供に関する法律、バリアフリー法は施設等のバリアフリー化に関する法律、障害者差別解消法は差別的取扱いの禁止を定める法律であり、法定雇用率の達成を義務付けるのは障害者雇用促進法です。"}, {"id": 188, "question": "65歳までの高年齢者雇用確保措置（定年引上げ・継続雇用制度導入等）を事業主に義務付ける法律はどれか。", "choices": ["高年齢者雇用安定法", "厚生年金保険法", "国民年金法", "介護保険法"], "category": "法務・人事", "correct": 0, "explanation": "65歳までの雇用確保措置。", "wrongNote": "厚生年金保険法や国民年金法は年金制度を規律する法律、介護保険法は介護保険制度を規律する法律であり、65歳までの雇用確保措置を義務付けるのは高年齢者雇用安定法です。"}, {"id": 189, "question": "労働者の心理的負担の程度を把握するため、一定規模以上の事業場で年1回以上実施が義務付けられている検査を何と呼ぶか。", "choices": ["ストレスチェック制度", "特定健康診査", "がん検診", "産業医面談義務"], "category": "法務・人事", "correct": 0, "explanation": "心理的負担の把握が目的。", "wrongNote": "特定健康診査は生活習慣病予防のための健診、がん検診は特定のがんを対象とした検診であり、産業医面談も別途定められた制度であるため、心理的負担を把握する検査はストレスチェック制度と呼ばれます。"}, {"id": 190, "question": "職場における性的な言動により就業環境が害されることを何と呼ぶか。", "choices": ["セクシュアルハラスメント", "パワーハラスメント", "モラルハラスメント", "ジェンダーギャップ"], "category": "法務・人事", "correct": 0, "explanation": "性的言動による就業環境の悪化。", "wrongNote": "パワーハラスメントは職務上の地位を利用した嫌がらせ、モラルハラスメントは精神的な嫌がらせ全般、ジェンダーギャップは性別による格差を指す言葉であり、性的な言動によるものはセクシュアルハラスメントです。"}, {"id": 191, "question": "会社法上、株式会社の設立時に最低限必要な出資額として現在定められているものはどれか。", "choices": ["特に最低資本金の制限はない", "300万円以上", "1000万円以上", "1円未満は認められない"], "category": "法務・人事", "correct": 0, "explanation": "2006年会社法施行以降、1円でも設立可能。", "wrongNote": "かつては最低資本金制度がありましたが、2006年の会社法施行後は撤廃されており、300万円や1000万円といった下限、1円未満禁止といった制約はありません。"}, {"id": 192, "question": "労働契約の内容について労使間のルールを定めた法律はどれか。", "choices": ["労働契約法", "労働組合法", "労働関係調整法", "雇用保険法"], "category": "法務・人事", "correct": 0, "explanation": "労働契約に関するルールを規定。", "wrongNote": "労働組合法は団結権等を保障する法律、労働関係調整法は労働争議の調整に関する法律、雇用保険法は失業給付等を規律する法律であり、労働契約のルールを定めるのは労働契約法です。"}, {"id": 193, "question": "会社の重要事項を決定する株主総会において、原則として議決権を行使できるのは誰か。", "choices": ["株主", "従業員", "取引先", "監督官庁"], "category": "法務・人事", "correct": 0, "explanation": "原則として株主が議決権を行使。", "wrongNote": "従業員や取引先、監督官庁は原則として株主総会での議決権を持たず、議決権を行使できるのは株主です。"}, {"id": 194, "question": "商標登録を管轄する日本の行政機関はどれか。", "choices": ["特許庁", "公正取引委員会", "消費者庁", "総務省"], "category": "法務・人事", "correct": 0, "explanation": "商標・特許等の登録を管轄。", "wrongNote": "公正取引委員会は独占禁止法の執行機関、消費者庁は消費者保護行政を担う機関、総務省は幅広い行政分野を所管する機関であり、商標登録を管轄するのは特許庁です。"}, {"id": 195, "question": "従業員代表や労働組合と使用者が締結し、労働条件について合意した文書を何と呼ぶか。", "choices": ["労働協約", "雇用契約書", "就業規則", "内部規程"], "category": "法務・人事", "correct": 0, "explanation": "労使間の合意文書。", "wrongNote": "雇用契約書は個別の労働契約、就業規則は職場のルール、内部規程は社内の非公式な規程を指し、労使間で締結する合意文書は労働協約と呼ばれます。"}, {"id": 196, "question": "会社が従業員を解雇する際、労働基準法上原則として必要とされる予告期間はどれか。", "choices": ["少なくとも30日前", "少なくとも7日前", "即日でよい", "90日前"], "category": "法務・人事", "correct": 0, "explanation": "解雇予告義務。", "wrongNote": "労働基準法上、解雇の際は原則として少なくとも30日前の予告が必要であり、7日前や即日、90日前といった期間は法定の内容と異なります。"}, {"id": 197, "question": "労働災害が発生した際に被災労働者やその遺族に給付を行う公的保険制度を何と呼ぶか。", "choices": ["労働者災害補償保険（労災保険）", "雇用保険", "健康保険", "介護保険"], "category": "法務・人事", "correct": 0, "explanation": "業務災害・通勤災害への給付。", "wrongNote": "雇用保険は失業給付等を行う制度、健康保険は病気やけがに対する医療給付を行う制度、介護保険は介護サービスの給付を行う制度であり、労働災害に対する給付は労災保険です。"}, {"id": 198, "question": "会社が倒産した場合、法的整理の方法として事業の継続を前提とするものはどれか。", "choices": ["民事再生", "破産", "特別清算", "通常清算"], "category": "法務・人事", "correct": 0, "explanation": "事業継続を前提とした再建型手続。", "wrongNote": "破産や特別清算、通常清算はいずれも事業の継続を前提としない清算型の手続きであり、事業継続を前提とする再建型の手続きは民事再生です。"}, {"id": 199, "question": "独占禁止法における「カルテル」の説明として正しいものはどれか。", "choices": ["複数の企業が価格や生産量を協定して競争を制限する行為", "企業が単独で価格を大幅に引き下げる行為", "企業が新技術を共同開発する行為全般", "政府が企業に補助金を交付する行為"], "category": "法務・人事", "correct": 0, "explanation": "独禁法上の代表的な違反類型。", "wrongNote": "企業が単独で価格を引き下げる行為や共同での技術開発全般は必ずしも違法ではなく、政府の補助金交付も無関係であり、カルテルは複数企業が価格や生産量を協定して競争を制限する行為を指します。"}, {"id": 200, "question": "取締役が会社に損害を与えた場合に、株主が会社に代わって責任を追及する訴訟を何と呼ぶか。", "choices": ["株主代表訴訟", "労働審判", "民事調停", "集団訴訟（クラスアクション）"], "category": "法務・人事", "correct": 0, "explanation": "株主が会社に代わり取締役の責任を追及。  --- # 第5章：マーケティング・販売（Q201〜Q250）", "wrongNote": "労働審判は労働紛争の解決手続、民事調停は一般の民事紛争解決手続、クラスアクションは日本の制度とは異なる仕組みであり、株主が会社に代わり取締役の責任を追及する訴訟は株主代表訴訟です。"}, {"id": 201, "question": "マーケティングミックスの「4P」に含まれないものはどれか。", "choices": ["Product（製品）", "Price（価格）", "Place（流通）", "People（人材）"], "category": "マーケティング・販売", "correct": 3, "explanation": "4PはProduct・Price・Place・Promotion。", "wrongNote": "Product・Price・Placeはいずれも実際の4Pの構成要素であり、Peopleは4Pには含まれません（7Pなど拡張モデルで使われる要素です）。"}, {"id": 202, "question": "顧客視点でマーケティングを捉え直した「4C」のうち、企業の「Price」に対応する概念はどれか。", "choices": ["Customer Value（顧客価値）", "Cost（顧客の負担）", "Convenience（利便性）", "Communication（対話）"], "category": "マーケティング・販売", "correct": 1, "explanation": "企業のPriceは顧客視点ではCost（負担）に対応。", "wrongNote": "Customer Valueは製品(Product)、Convenienceは流通(Place)、Communicationは販売促進(Promotion)に対応する概念であり、価格(Price)に対応するのはCostです。"}, {"id": 203, "question": "市場を細分化し（Segmentation）、狙う市場を選び（Targeting）、自社の立ち位置を明確化する（Positioning）一連のプロセスを何と呼ぶか。", "choices": ["STP分析", "SWOT分析", "PPM分析", "3C分析"], "category": "マーケティング・販売", "correct": 0, "explanation": "Segmentation・Targeting・Positioning。", "wrongNote": "SWOT分析は内部外部環境分析、PPM分析は事業ポートフォリオ分析、3C分析は自社・競合・顧客の分析を指し、市場細分化・ターゲット選定・ポジショニングの一連のプロセスはSTP分析です。"}, {"id": 204, "question": "ブランドが持つ、価格プレミアムや顧客ロイヤルティなどの無形の資産価値を何と呼ぶか。", "choices": ["ブランドエクイティ", "のれん代", "営業権", "商標権"], "category": "マーケティング・販売", "correct": 0, "explanation": "ブランドの無形資産価値。", "wrongNote": "のれん代や営業権は会計上の概念に近く、商標権は法的な権利を指し、ブランドが持つ無形の資産価値を指すのはブランドエクイティです。"}, {"id": 205, "question": "製品が市場に投入されてから撤退するまでを「導入期・成長期・成熟期・衰退期」に分けて捉える考え方を何と呼ぶか。", "choices": ["プロダクトライフサイクル", "バリューチェーン", "サプライチェーン", "カスタマージャーニー"], "category": "マーケティング・販売", "correct": 0, "explanation": "製品の導入〜衰退の各段階。", "wrongNote": "バリューチェーンは価値創出活動の連鎖、サプライチェーンは供給網、カスタマージャーニーは顧客の行動プロセスを指し、製品の導入から衰退までの段階を捉える考え方はプロダクトライフサイクルです。"}, {"id": 206, "question": "顧客が商品・サービスを認知してから購入、利用後に至るまでの一連の行動・心理プロセスを可視化したものを何と呼ぶか。", "choices": ["カスタマージャーニー", "バリューチェーン", "サプライチェーン", "コアコンピタンス"], "category": "マーケティング・販売", "correct": 0, "explanation": "認知から購入・利用後までの可視化。", "wrongNote": "バリューチェーンやサプライチェーンは企業側の活動の連鎖、コアコンピタンスは企業の中核的な強みを指し、顧客の認知から購入後までのプロセスを可視化したものはカスタマージャーニーです。"}, {"id": 207, "question": "1人の顧客が取引期間全体を通じて企業にもたらす利益の総額を何と呼ぶか。", "choices": ["LTV（顧客生涯価値）", "CPA", "CVR", "ARPU"], "category": "マーケティング・販売", "correct": 0, "explanation": "顧客生涯価値。", "wrongNote": "CPAは顧客獲得単価、CVRはコンバージョン率、ARPUは1ユーザー当たりの平均収益を示す指標であり、取引期間全体を通じた利益総額を示すのはLTVです。"}, {"id": 208, "question": "広告等を通じて1件の成果（顧客獲得）を得るためにかかったコストを何と呼ぶか。", "choices": ["CPA（顧客獲得単価）", "LTV", "NPS", "KPI"], "category": "マーケティング・販売", "correct": 0, "explanation": "顧客獲得単価。", "wrongNote": "LTVは顧客生涯価値、NPSは顧客の推奨意向を示す指標、KPIは中間目標を示す指標であり、1件の成果獲得にかかったコストを示すのはCPAです。"}, {"id": 209, "question": "Webサイト訪問者のうち、購入や会員登録などの目的行動に至った割合を何と呼ぶか。", "choices": ["CVR（コンバージョン率）", "CPA", "PV（ページビュー）", "UU（ユニークユーザー）"], "category": "マーケティング・販売", "correct": 0, "explanation": "訪問者に対する目的行動達成率。", "wrongNote": "CPAは顧客獲得単価、PVはページの閲覧数、UUは訪問者の実人数を示す指標であり、訪問者に占める目的行動達成の割合を示すのはCVRです。"}, {"id": 210, "question": "最終目標である「KGI」を達成するための中間指標を何と呼ぶか。", "choices": ["KPI", "ROI", "ROE", "WACC"], "category": "マーケティング・販売", "correct": 0, "explanation": "KGI達成のための中間指標。", "wrongNote": "ROIは投資利益率、ROEは自己資本利益率、WACCは資本コストを示す指標であり、最終目標KGI達成のための中間指標はKPIです。"}, {"id": 211, "question": "実店舗とECサイトなど複数の販売チャネルを、顧客視点でシームレスに統合する考え方を何と呼ぶか。", "choices": ["オムニチャネル", "マルチレベルマーケティング", "B2B2C", "アグリゲーター"], "category": "マーケティング・販売", "correct": 0, "explanation": "チャネル横断でのシームレスな体験提供。", "wrongNote": "マルチレベルマーケティングは連鎖販売の仕組み、B2B2Cは取引形態の分類、アグリゲーターは情報・サービスを集約する事業者を指し、複数チャネルを統合する考え方はオムニチャネルです。"}, {"id": 212, "question": "メーカーが卸や小売を介さず、消費者に直接商品を販売するビジネスモデルを何と呼ぶか。", "choices": ["D2C（Direct to Consumer）", "B2B（Business to Business）", "C2C（Consumer to Consumer）", "OEM"], "category": "マーケティング・販売", "correct": 0, "explanation": "中間流通を介さない直接販売。", "wrongNote": "B2Bは企業間取引、C2Cは消費者間取引、OEMは受託製造を指し、メーカーが直接消費者に販売するモデルはD2Cです。"}, {"id": 213, "question": "SNS上で影響力を持つ人物に商品やサービスを紹介してもらう手法を何と呼ぶか。", "choices": ["インフルエンサーマーケティング", "アンバサダーマーケティング（と混同されやすいが本問では別扱い）", "マスマーケティング", "リレーションシップマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "影響力のある人物を活用。", "wrongNote": "マスマーケティングは不特定多数への一律訴求、リレーションシップマーケティングは顧客との関係構築を重視する手法であり、影響力のある個人を起用する手法はインフルエンサーマーケティングです。"}, {"id": 214, "question": "有益な記事や動画などのコンテンツを通じて見込み顧客との関係を構築する手法を何と呼ぶか。", "choices": ["コンテンツマーケティング", "プロダクトマーケティング", "トレードマーケティング", "リレーションシップマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "有益な情報発信で関係構築。", "wrongNote": "プロダクトマーケティングは製品の市場投入戦略、トレードマーケティングは店頭での販促活動、リレーションシップマーケティングは関係構築全般を指し、有益なコンテンツを通じた関係構築はコンテンツマーケティングです。"}, {"id": 215, "question": "検索エンジンの検索結果で自然表示の順位を上げるための施策を何と呼ぶか。", "choices": ["SEO（検索エンジン最適化）", "SEM", "CRM", "CMS"], "category": "マーケティング・販売", "correct": 0, "explanation": "検索エンジン最適化。", "wrongNote": "SEMは検索エンジン上のマーケティング全般を指し広告も含む概念、CRMは顧客関係管理システム、CMSはコンテンツ管理システムであり、自然検索順位を上げる施策はSEOです。"}, {"id": 216, "question": "検索連動型広告のように、クリックされた回数に応じて広告費が発生する広告を何と呼ぶか。", "choices": ["リスティング広告", "純広告", "交通広告", "マスメディア広告"], "category": "マーケティング・販売", "correct": 0, "explanation": "クリック課金型の検索連動広告。", "wrongNote": "純広告は掲載枠を買い切る形式の広告、交通広告は電車・バス等の広告、マスメディア広告はテレビ・新聞等の広告であり、クリック課金型の検索連動広告はリスティング広告です。"}, {"id": 217, "question": "基本機能を無料で提供し、高度な機能を有料にすることで収益化するビジネスモデルを何と呼ぶか。", "choices": ["フリーミアム", "サブスクリプション", "バンドリング", "ダイナミックプライシング"], "category": "マーケティング・販売", "correct": 0, "explanation": "基本無料＋高度機能有料のモデル。", "wrongNote": "サブスクリプションは定額課金モデル、バンドリングは複数商品の組み合わせ販売、ダイナミックプライシングは需給に応じた価格変動を指し、基本機能無料・高度機能有料のモデルはフリーミアムです。"}, {"id": 218, "question": "新製品投入時に低価格で市場に浸透させ、シェア拡大を図る価格戦略を何と呼ぶか。", "choices": ["市場浸透価格戦略", "上澄み吸収価格戦略（スキミングプライシング）", "名声価格戦略", "端数価格戦略"], "category": "マーケティング・販売", "correct": 0, "explanation": "低価格でシェア拡大を狙う。", "wrongNote": "上澄み吸収価格戦略は高価格からスタートする戦略、名声価格戦略は高級イメージを演出する価格設定、端数価格戦略は端数で割安感を演出する価格設定であり、低価格でシェア拡大を狙うのは市場浸透価格戦略です。"}, {"id": 219, "question": "新製品投入時にあえて高価格を設定し、価格に敏感でない層から先に利益を回収する価格戦略を何と呼ぶか。", "choices": ["上澄み吸収価格戦略（スキミングプライシング）", "市場浸透価格戦略", "均一価格戦略", "コストプラス価格戦略"], "category": "マーケティング・販売", "correct": 0, "explanation": "高価格で先に利益回収。", "wrongNote": "市場浸透価格戦略は低価格からスタートする戦略、均一価格戦略は一律の価格設定、コストプラス価格戦略は原価に利益を上乗せする方式であり、高価格から先に利益を回収するのは上澄み吸収価格戦略です。"}, {"id": 220, "question": "複数の商品・サービスを組み合わせて1つの価格で販売する手法を何と呼ぶか。", "choices": ["バンドリング", "アンバンドリング", "クロスセル", "アップセル"], "category": "マーケティング・販売", "correct": 0, "explanation": "複数商品を組み合わせて販売。", "wrongNote": "アンバンドリングは組み合わせを解いて個別に販売する手法、クロスセルは関連商品の提案、アップセルは上位商品の提案を指し、複数商品を1つの価格で販売するのはバンドリングです。"}, {"id": 221, "question": "顧客が検討中の商品に関連する別の商品も一緒に提案し、購入点数を増やす販売手法を何と呼ぶか。", "choices": ["クロスセル", "アップセル", "ダウンセル", "バンドリング"], "category": "マーケティング・販売", "correct": 0, "explanation": "関連商品の提案。", "wrongNote": "アップセルは上位商品の提案、ダウンセルは下位商品の提案、バンドリングは組み合わせ販売を指し、関連商品を一緒に提案する手法はクロスセルです。"}, {"id": 222, "question": "顧客が検討中の商品より上位・高価格帯の商品を提案する販売手法を何と呼ぶか。", "choices": ["アップセル", "クロスセル", "ダウンセル", "バンドリング"], "category": "マーケティング・販売", "correct": 0, "explanation": "上位商品の提案。", "wrongNote": "クロスセルは関連商品の提案、ダウンセルは下位商品の提案、バンドリングは組み合わせ販売を指し、上位・高価格帯の商品を提案する手法はアップセルです。"}, {"id": 223, "question": "顧客が企業やブランドをどの程度他者に薦めたいと思うかを数値化した指標を何と呼ぶか。", "choices": ["NPS（ネットプロモータースコア）", "LTV", "CPA", "ROAS"], "category": "マーケティング・販売", "correct": 0, "explanation": "推奨意向を数値化した指標。", "wrongNote": "LTVは顧客生涯価値、CPAは顧客獲得単価、ROASは広告費用対効果を示す指標であり、他者への推奨意向を数値化した指標はNPSです。"}, {"id": 224, "question": "マーケティング施策を検討する際に設定する、架空の典型的な顧客像を何と呼ぶか。", "choices": ["ペルソナ", "アバター", "インフルエンサー", "アンバサダー"], "category": "マーケティング・販売", "correct": 0, "explanation": "架空の典型顧客像。", "wrongNote": "アバターは仮想空間上の自分の分身、インフルエンサーは影響力のある個人、アンバサダーはブランドの発信に協力する人物を指し、架空の典型的な顧客像はペルソナです。"}, {"id": 225, "question": "自社の新製品が既存の自社製品の売上を奪ってしまう現象を何と呼ぶか。", "choices": ["カニバリゼーション", "コモディティ化", "ブランドスイッチ", "ロイヤルティ低下"], "category": "マーケティング・販売", "correct": 0, "explanation": "自社製品同士の共食い現象。", "wrongNote": "コモディティ化は差別化が失われる現象、ブランドスイッチは他ブランドへの乗り換え、ロイヤルティ低下は忠誠度の低下を指し、自社製品同士が売上を奪い合う現象はカニバリゼーションです。"}, {"id": 226, "question": "顧客ニーズの調査から出発して製品を開発する考え方を何と呼ぶか。", "choices": ["マーケットイン", "プロダクトアウト", "プロダクトライフサイクル", "バリュープロポジション"], "category": "マーケティング・販売", "correct": 0, "explanation": "顧客ニーズ起点の開発。", "wrongNote": "プロダクトアウトは自社の技術・シーズを起点とする考え方、プロダクトライフサイクルは製品の段階変化、バリュープロポジションは提供価値の明確化を指し、顧客ニーズ起点の考え方はマーケットインです。"}, {"id": 227, "question": "自社の技術やシーズを起点に製品を開発し、市場に投入する考え方を何と呼ぶか。", "choices": ["プロダクトアウト", "マーケットイン", "カスタマージャーニー", "STP"], "category": "マーケティング・販売", "correct": 0, "explanation": "自社シーズ起点の開発。", "wrongNote": "マーケットインは顧客ニーズを起点とする考え方、カスタマージャーニーは顧客の行動プロセス、STPは市場細分化の枠組みを指し、自社の技術やシーズを起点とするのはプロダクトアウトです。"}, {"id": 228, "question": "社会課題の解決と自社の利益向上を結びつけたマーケティング手法を何と呼ぶか。", "choices": ["コーズマーケティング", "ゲリラマーケティング", "バズマーケティング", "アンブッシュマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "社会貢献と利益を結びつける手法。", "wrongNote": "ゲリラマーケティングは低予算で意表を突く手法、バズマーケティングは話題性を利用した手法、アンブッシュマーケティングはスポンサーでないのに関連付けて訴求する手法であり、社会課題解決と利益向上を結びつけるのはコーズマーケティングです。"}, {"id": 229, "question": "ブランドの世界観を体現する旗艦店を何と呼ぶか。", "choices": ["フラッグシップストア", "アウトレットストア", "ポップアップストア", "アンテナショップ"], "category": "マーケティング・販売", "correct": 0, "explanation": "ブランド世界観を体現する旗艦店。", "wrongNote": "アウトレットストアは在庫処分等を目的とした店舗、ポップアップストアは期間限定の店舗、アンテナショップは情報発信・テスト販売の拠点を指し、ブランドの世界観を体現する旗艦店はフラッグシップストアです。"}, {"id": 230, "question": "小売業者が独自に企画・販売する自主企画商品を何と呼ぶか。", "choices": ["PB（プライベートブランド）", "NB（ナショナルブランド）", "OEMブランド", "ジェネリックブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "小売独自の企画商品。", "wrongNote": "NBはメーカーの全国的なブランド、OEMブランドは受託製造による別のブランド展開、ジェネリックブランドはノーブランドに近い廉価商品を指し、小売独自の企画商品はPBです。"}, {"id": 231, "question": "メーカーが全国的に展開する、広く知られたブランドを何と呼ぶか。", "choices": ["NB（ナショナルブランド）", "PB（プライベートブランド)", "ローカルブランド", "コーポレートブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "メーカーの全国的ブランド。", "wrongNote": "PBは小売独自の企画商品、ローカルブランドは地域限定のブランド、コーポレートブランドは企業そのものを示すブランドを指し、メーカーが全国的に展開するブランドはNBです。"}, {"id": 232, "question": "小売店の店頭で消費者の購買を促すためにメーカーが行う販促活動を何と呼ぶか。", "choices": ["トレードマーケティング", "デジタルマーケティング", "コーポレートマーケティング", "リレーションシップマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "店頭での購買促進活動。", "wrongNote": "デジタルマーケティングはデジタル技術活用のマーケティング全般、コーポレートマーケティングは企業ブランド全体の訴求、リレーションシップマーケティングは関係構築全般を指し、店頭での購買促進活動はトレードマーケティングです。"}, {"id": 233, "question": "小売業
