子炉を何と呼ぶか。", "choices": ["沸騰水型炉", "SMR（小型モジュール炉）", "加圧水型炉", "高速増殖炉"], "correct": 1, "explanation": "小型・モジュール化により量産効果が期待される次世代炉はSMRと呼ばれる。", "wrongNote": "高速増殖炉・加圧水型炉・沸騰水型炉はいずれも既存の原子炉の型式を指す言葉であり、小型化・量産化を特徴とする次世代炉はSMRです。", "id": 475}, {"category": "生産・テクノロジー", "question": "軽い原子核同士を融合させる反応からエネルギーを取り出す、実用化が期待されている発電技術を何と呼ぶか。", "choices": ["地熱発電", "水力発電", "核融合発電（フュージョンエネルギー）", "核分裂発電"], "correct": 2, "explanation": "原子核の融合反応を利用する発電技術は核融合発電（フュージョンエネルギー）と呼ばれる。", "wrongNote": "核分裂発電は既存の原子力発電の仕組み、水力発電や地熱発電は再生可能エネルギーの一種であり、原子核融合を利用する次世代技術は核融合発電です。", "id": 476}, {"category": "生産・テクノロジー", "question": "半導体のうち、演算処理を担う種類を一般に何と呼ぶか。", "choices": ["パワー半導体", "メモリ半導体", "アナログ半導体", "ロジック半導体"], "correct": 3, "explanation": "演算処理を担う半導体はロジック半導体と呼ばれる。", "wrongNote": "メモリ半導体はデータの記憶を担う種類、パワー半導体やアナログ半導体はそれぞれ別の機能を担う種類であり、演算処理を担うのはロジック半導体です。", "id": 477}, {"category": "生産・テクノロジー", "question": "半導体のうち、データを記憶する役割を担う種類を一般に何と呼ぶか。", "choices": ["光半導体", "センサー半導体", "ロジック半導体", "メモリ半導体"], "correct": 3, "explanation": "データの記憶を担う半導体はメモリ半導体と呼ばれる。", "wrongNote": "ロジック半導体は演算処理を担う種類、センサー半導体や光半導体はそれぞれ別の機能を担う種類であり、記憶を担うのはメモリ半導体です。", "id": 478}, {"category": "生産・テクノロジー", "question": "半導体の回路パターンをウエハー上に転写する工程で用いられる、日本企業が強みを持つ製造装置を何と呼ぶか。", "choices": ["組立装置", "洗浄装置", "検査装置", "露光装置"], "correct": 3, "explanation": "回路パターンの転写に用いられる装置は露光装置と呼ばれ、関連分野で日本企業が強みを持つ。", "wrongNote": "組立装置・検査装置・洗浄装置はそれぞれ製造工程の別の段階で使われる装置であり、回路パターンの転写を担う装置は露光装置です。", "id": 479}, {"category": "生産・テクノロジー", "question": "日本で先端ロジック半導体の国産化を目指し、複数の大手企業が出資して設立された企業を何と呼ぶか。", "choices": ["ラピダス", "キオクシア", "デンソー", "ソニーセミコンダクタ"], "correct": 0, "explanation": "次世代半導体の国産化を目指す新会社としてラピダスが設立された。", "wrongNote": "ソニーセミコンダクタやキオクシア、デンソーはそれぞれ既存の日本の半導体関連企業であり、次世代半導体国産化を目指す新会社はラピダスです。", "id": 480}, {"category": "生産・テクノロジー", "question": "従来の中央集権的なインターネットに対し、ブロックチェーン技術などを活用した分散型のインターネットの構想を何と呼ぶか。", "choices": ["イントラネット", "エクストラネット", "Web1.0", "Web3"], "correct": 3, "explanation": "分散型の次世代インターネットの構想はWeb3と呼ばれる。", "wrongNote": "Web1.0は初期の一方向的な情報発信中心のインターネット、イントラネットやエクストラネットは組織内外のネットワークを指し、分散型の次世代構想はWeb3です。", "id": 481}, {"category": "生産・テクノロジー", "question": "ブロックチェーン技術を用い、デジタルデータに唯一性・真正性を持たせる技術・資産を何と呼ぶか。", "choices": ["暗号資産", "ステーブルコイン", "電子マネー", "NFT（非代替性トークン）"], "correct": 3, "explanation": "デジタルデータの唯一性を証明する技術・資産はNFTと呼ばれる。", "wrongNote": "暗号資産は交換価値を持つデジタル資産全般、電子マネーやステーブルコインは決済手段としての性質が強いデジタル通貨であり、唯一性の証明を目的とするのはNFTです。", "id": 482}, {"category": "生産・テクノロジー", "question": "企業が保有する大量かつ多様なデータを分析し、経営判断に活用する考え方を何と呼ぶか。", "choices": ["定性情報のみに基づく経営", "データドリブン経営", "勘と経験に頼る経営", "データを一切用いない経営"], "correct": 1, "explanation": "データを根拠に意思決定を行う経営はデータドリブン経営と呼ばれる。", "wrongNote": "勘と経験に頼る経営や定性情報のみに基づく経営、データを一切用いない経営はデータドリブン経営とは対照的な考え方であり、正しくはデータを活用した意思決定を行う経営です。", "id": 483}, {"category": "生産・テクノロジー", "question": "特定のタスクだけでなく、人間のように幅広い課題に対応できる汎用的な人工知能の概念を何と呼ぶか。", "choices": ["特化型AI", "エキスパートシステム", "AGI（汎用人工知能）", "ルールベースAI"], "correct": 2, "explanation": "幅広い課題に対応できる汎用的なAIの概念はAGIと呼ばれる。", "wrongNote": "特化型AIは特定タスクに特化したAI、ルールベースAIやエキスパートシステムは初期のAI技術を指し、人間のように汎用的に対応できるAIの概念はAGIです。", "id": 484}, {"category": "生産・テクノロジー", "question": "AIをロボットなど実世界で動作する物理的な機器と組み合わせ、現実世界で自律的に動作させる技術・概念を何と呼ぶか。", "choices": ["フィジカルAI", "バーチャルAI", "ナラティブAI", "ジェネレーティブAI"], "correct": 0, "explanation": "AIと物理的な機器を組み合わせ現実世界で動作させる概念はフィジカルAIと呼ばれる。", "wrongNote": "ジェネレーティブAIはコンテンツを生成するAI、ナラティブAIやバーチャルAIという呼称は一般的でなく、実世界で動作するAIの概念はフィジカルAIです。", "id": 485}, {"category": "生産・テクノロジー", "question": "民間企業がロケット開発や人工衛星の打ち上げなど、宇宙関連事業に参入する動きを一般に何と呼ぶか。", "choices": ["宇宙開発の完全停止", "宇宙産業の商業化", "宇宙開発の国家独占化", "宇宙条約の廃止"], "correct": 1, "explanation": "民間企業による宇宙事業参入は宇宙産業の商業化と呼ばれる。", "wrongNote": "国家独占化や開発の完全停止、宇宙条約の廃止は実際の動向とは逆であり、正しくは民間企業による商業化の進展です。", "id": 486}, {"category": "生産・テクノロジー", "question": "工場の生産ラインなどで単純作業や重作業を代替する機械を一般に何と呼ぶか。", "choices": ["産業用ロボット", "AGV（無人搬送車）", "AMR（自律走行搬送ロボット）", "ドローン"], "correct": 0, "explanation": "生産ラインでの作業を代替する機械は産業用ロボットと呼ばれる。", "wrongNote": "AGVやAMRは主に工場内の搬送を担う機器、ドローンは無人航空機であり、生産ラインでの作業代替を担う機械は産業用ロボットです。", "id": 487}, {"category": "生産・テクノロジー", "question": "日本企業が世界的に高いシェアを持つとされる分野の一つとして挙げられるものはどれか。", "choices": ["スマートフォンOS", "SNSプラットフォーム", "検索エンジン", "産業用ロボット"], "correct": 3, "explanation": "産業用ロボットの分野で日本企業は世界的に高いシェアを持つとされる。", "wrongNote": "スマートフォンOSや検索エンジン、SNSプラットフォームは主に海外企業が高いシェアを持つ分野であり、日本企業が強みを持つ分野として産業用ロボットが挙げられます。", "id": 488}, {"category": "生産・テクノロジー", "question": "操縦者を必要とせず、あらかじめ設定されたルートを自律飛行して荷物を運ぶドローンの活用分野として正しいものはどれか。", "choices": ["会計監査分野", "人事評価分野", "法務分野", "物流（配送）分野"], "correct": 3, "explanation": "自律飛行するドローンは物流・配送分野での活用が期待されている。", "wrongNote": "会計監査や法務、人事評価はドローンの主な活用分野とは異なり、期待されているのは物流（配送）分野での活用です。", "id": 489}, {"category": "生産・テクノロジー", "question": "人の体細胞に特定の因子を導入することで、さまざまな組織や臓器に分化できる能力を持たせた細胞を何と呼ぶか。", "choices": ["iPS細胞（人工多能性幹細胞）", "体細胞", "ES細胞", "幹細胞"], "correct": 0, "explanation": "体細胞に因子を導入し多能性を持たせた細胞はiPS細胞と呼ばれる。", "wrongNote": "ES細胞は受精卵に由来する別の多能性幹細胞、幹細胞や体細胞はより広い・限定的な概念であり、人工的に多能性を持たせた細胞はiPS細胞です。", "id": 490}, {"category": "生産・テクノロジー", "question": "病院に行かずに、スマートフォンなどを通じて医師の診療を受けられるサービスを何と呼ぶか。", "choices": ["レセプト請求", "地域包括ケア", "オンライン診療", "電子カルテ"], "correct": 2, "explanation": "通信機器を通じて診療を受けるサービスはオンライン診療と呼ばれる。", "wrongNote": "電子カルテは診療記録の電子化、レセプト請求は診療報酬の請求手続き、地域包括ケアは高齢者支援の仕組みを指し、通信を通じた診療サービスはオンライン診療です。", "id": 491}, {"category": "生産・テクノロジー", "question": "新薬候補物質の探索や臨床試験の設計などにAIを活用し、開発期間の短縮を図る取り組みを何と呼ぶか。", "choices": ["治験の完全廃止", "ジェネリック医薬品開発", "バイオシミラー開発", "AI創薬"], "correct": 3, "explanation": "AIを活用した新薬候補の探索・開発はAI創薬と呼ばれる。", "wrongNote": "バイオシミラー開発やジェネリック医薬品開発は既存薬をベースにした開発、治験の完全廃止は実態と異なり、AIを用いた新薬開発の取り組みはAI創薬です。", "id": 492}, {"category": "生産・テクノロジー", "question": "液体の電解質を使わず、より安全性やエネルギー密度の向上が期待される次世代の電池を何と呼ぶか。", "choices": ["リチウムイオン電池", "ニッケル水素電池", "鉛蓄電池", "全固体電池"], "correct": 3, "explanation": "電解質を固体化した次世代電池は全固体電池と呼ばれる。", "wrongNote": "リチウムイオン電池は現在広く使われている液体電解質を用いる電池、鉛蓄電池やニッケル水素電池はより旧来型の電池であり、次世代の固体電解質電池は全固体電池です。", "id": 493}, {"category": "生産・テクノロジー", "question": "水素を製造から輸送、利用までつなげる一連の流れを構築する取り組みを何と呼ぶか。", "choices": ["水素サプライチェーンの構築", "水素利用の全面禁止", "水素の即時廃止", "水素製造の停止"], "correct": 0, "explanation": "水素の製造・輸送・利用をつなぐ体制の構築は水素サプライチェーンの構築と呼ばれる。", "wrongNote": "水素の即時廃止や全面禁止、製造停止は実際の政策動向とは逆であり、進められているのは水素サプライチェーンの構築です。", "id": 494}, {"category": "生産・テクノロジー", "question": "回収した二酸化炭素を炭素資源として再利用し、化学品や燃料などを製造する技術を何と呼ぶか。", "choices": ["カーボンリサイクル", "カーボンニュートラル", "カーボンオフセット", "カーボンフットプリント"], "correct": 0, "explanation": "回収したCO2を資源として再利用する技術はカーボンリサイクルと呼ばれる。", "wrongNote": "カーボンオフセットは排出量を他の削減活動で相殺する仕組み、カーボンニュートラルは排出実質ゼロの状態、カーボンフットプリントは排出量の可視化指標であり、CO2を資源として再利用する技術はカーボンリサイクルです。", "id": 495}, {"category": "生産・テクノロジー", "question": "生成AIの普及に伴い、AI処理を行うデータセンターで急増が懸念されている資源はどれか。", "choices": ["水産資源", "森林資源", "農業用地", "電力（消費電力）"], "correct": 3, "explanation": "AI処理の増加に伴いデータセンターの電力消費が急増し課題となっている。", "wrongNote": "水産資源や農業用地、森林資源はデータセンターの主要な課題ではなく、AI普及に伴い懸念されている資源は電力（消費電力）です。", "id": 496}, {"category": "生産・テクノロジー", "question": "半導体の回路線幅を極めて微細に加工するために不可欠とされる、先端露光技術を何と呼ぶか。", "choices": ["マイクロ波露光", "可視光露光", "EUV（極端紫外線）露光", "赤外線露光"], "correct": 2, "explanation": "最先端の微細化にはEUV（極端紫外線）露光技術が不可欠とされる。", "wrongNote": "可視光露光は従来のより粗い加工に用いられる方式、赤外線露光やマイクロ波露光という技術は一般的でなく、最先端の微細化に不可欠な技術はEUV露光です。", "id": 497}, {"category": "生産・テクノロジー", "question": "量子力学の原理を応用し、通信内容の盗聴が極めて困難とされる通信技術を何と呼ぶか。", "choices": ["5G通信", "衛星通信", "光ファイバー通信", "量子暗号通信"], "correct": 3, "explanation": "量子力学の性質を利用し盗聴が極めて困難な通信技術は量子暗号通信と呼ばれる。", "wrongNote": "光ファイバー通信や衛星通信、5G通信は既存の通信インフラ技術であり、量子力学の原理を応用した盗聴困難な通信技術は量子暗号通信です。", "id": 498}, {"category": "生産・テクノロジー", "question": "物理的な設備・機器とデジタル空間の情報処理を連携させ、現実世界とサイバー空間を統合したシステムを何と呼ぶか。", "choices": ["クローズドシステム", "スタンドアロンシステム", "レガシーシステム", "サイバーフィジカルシステム（CPS）"], "correct": 3, "explanation": "現実世界とサイバー空間を統合するシステムはサイバーフィジカルシステム（CPS）と呼ばれる。", "wrongNote": "スタンドアロンシステムは単独稼働のシステム、レガシーシステムは旧来型のシステム、クローズドシステムは外部と接続しないシステムを指し、現実とサイバー空間の統合システムはCPSです。", "id": 499}, {"category": "生産・テクノロジー", "question": "独自の高い技術力を持つ製品や技術が、時間の経過とともに他社でも作れる一般的な商品になっていく現象を何と呼ぶか。", "choices": ["ブランド化の進展", "コモディティ化", "差別化の強化", "高付加価値化"], "correct": 1, "explanation": "独自技術が一般化し価格競争に陥りやすくなる現象はコモディティ化と呼ばれる。", "wrongNote": "差別化の強化や高付加価値化、ブランド化の進展はコモディティ化とは逆方向の動きであり、技術が一般化していく現象はコモディティ化です。", "id": 500}]</script>
<script>
(function(){
  const ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
  const CATEGORIES = [...new Set(ALL_QUESTIONS.map(q=>q.category))];

  let activeCategory = 'すべて';
  let pool = [];        // current filtered/ordered question list
  let idx = 0;           // pointer within pool
  const answeredGlobal = {};  // id -> chosen index, persists across filters/jumps for the whole session

  const chipRow = document.getElementById('chipRow');
  const quizArea = document.getElementById('quizArea');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct = document.getElementById('progressPct');
  const filterCount = document.getElementById('filterCount');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const jumpForm = document.getElementById('jumpForm');
  const jumpInput = document.getElementById('jumpInput');
  const reviewList = document.getElementById('reviewList');
  const reviewCount = document.getElementById('reviewCount');

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildChips(){
    const cats = ['すべて', ...CATEGORIES];
    chipRow.innerHTML = '';
    cats.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip' + (c===activeCategory ? ' active':'');
      b.textContent = c;
      b.onclick = ()=>{ activeCategory = c; initPool(false); };
      chipRow.appendChild(b);
    });
  }

  function initPool(doShuffle, startIdx){
    const base = activeCategory==='すべて' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q=>q.category===activeCategory);
    pool = doShuffle ? shuffle(base) : base.slice();
    idx = startIdx || 0;
    buildChips();
    filterCount.textContent = activeCategory + '（全' + pool.length + '問）';
    render();
  }

  shuffleBtn.onclick = ()=> initPool(true);

  jumpForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const n = parseInt(jumpInput.value, 10);
    if(!n || n < 1 || n > ALL_QUESTIONS.length) return;
    activeCategory = 'すべて';
    initPool(false, n-1);
    jumpInput.value = '';
    quizArea.scrollIntoView({behavior:'smooth', block:'start'});
  });

  function updateScoreHeader(){
    const ids = Object.keys(answeredGlobal);
    const total = ids.length;
    const correct = ids.filter(id => answeredGlobal[id] === ALL_QUESTIONS[Number(id)-1].correct).length;
    scoreCorrect.textContent = correct;
    scoreTotal.textContent = total;
  }

  function renderReviewPanel(){
    const wrongIds = ALL_QUESTIONS
      .filter(q => answeredGlobal[q.id] !== undefined && answeredGlobal[q.id] !== q.correct)
      .map(q => q.id);
    reviewCount.textContent = wrongIds.length + '問';
    if(wrongIds.length === 0){
      reviewList.innerHTML = '<div class="reviewempty">まだ間違えた問題はありません。</div>';
      return;
    }
    const chips = wrongIds.map(id => `<span class="rnum" data-jump="${id}">Q${id}</span>`).join('');
    const plain = 'Q' + wrongIds.join(' / Q');
    reviewList.innerHTML = `<div class="reviewlist">${chips}</div><div class="reviewplain">${plain}</div>`;
    reviewList.querySelectorAll('.rnum').forEach(el=>{
      el.addEventListener('click', ()=>{
        const n = parseInt(el.dataset.jump, 10);
        activeCategory = 'すべて';
        initPool(false, n-1);
        quizArea.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function updateProgress(){
    const total = pool.length;
    const shown = Math.min(idx+1, total);
    progressLabel.textContent = '問 ' + shown + ' / ' + total;
    const pct = total ? Math.round((idx/total)*100) : 0;
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  const stampCorrectSVG = `
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.92"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.35" transform="rotate(6 50 50)"/>
      <text x="50" y="59" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="30" font-weight="800" fill="#2E6B4F">正</text>
    </svg>`;
  const stampWrongSVG = `
    <svg viewBox="0 0 100 100">
      <rect x="14" y="14" width="72" height="72" rx="6" fill="none" stroke="#B23A2C" stroke-width="6" opacity="0.9" transform="rotate(-4 50 50)"/>
      <line x1="26" y1="26" x2="74" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
      <line x1="74" y1="26" x2="26" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
    </svg>`;

  function render(){
    updateScoreHeader();
    updateProgress();
    renderReviewPanel();

    if(pool.length===0){
      quizArea.innerHTML = '<div class="card"><p style="text-align:center;color:var(--ink-soft);">この分野の問題がありません。</p></div>';
      return;
    }

    if(idx >= pool.length){
      renderDone();
      return;
    }

    const q = pool[idx];
    const chosen = answeredGlobal[q.id];
    const isLocked = chosen !== undefined;

    const letters = ['A','B','C','D'];
    const choicesHtml = q.choices.map((c,i)=>{
      let cls = 'choice';
      if(isLocked){
        cls += ' locked';
        if(i===chosen && i===q.correct) cls += ' selected-correct';
        else if(i===chosen && i!==q.correct) cls += ' selected-wrong';
        else if(i===q.correct) cls += ' reveal-correct';
      }
      return `<div class="${cls}" data-i="${i}">
        <span class="mark">${letters[i]}</span>
        <span>${c}</span>
      </div>`;
    }).join('');

    let stampHtml = '';
    if(isLocked){
      const wasCorrect = chosen === q.correct;
      stampHtml = `<div class="stamp show">${wasCorrect ? stampCorrectSVG : stampWrongSVG}</div>`;
    }

    quizArea.innerHTML = `
      <div class="card">
        ${stampHtml}
        <div class="qhead">
          <div class="qnum">${String(q.id).padStart(3,'0')}</div>
          <div class="qmeta"><div class="qcat">${q.category}</div></div>
        </div>
        <div class="qtext">${q.question}</div>
        <div class="choices">${choicesHtml}</div>
        <div class="explain ${isLocked ? 'show':''}">
          <div class="explain-inner"><b>${letters[q.correct]}が正解。</b>${q.explanation}</div>
        </div>
        <div class="wrongnote ${isLocked ? 'show':''}">
          <div class="wrongnote-inner"><span class="label">他の選択肢について</span>${q.wrongNote || ''}</div>
        </div>
        <div class="navrow">
          <button class="navbtn ghost" id="prevBtn" ${idx===0 ? 'disabled':''}>戻る</button>
          <button class="navbtn" id="nextBtn" ${isLocked ? '' : 'disabled'}>${idx===pool.length-1 ? '結果を見る':'次の問題'}</button>
        </div>
      </div>
    `;

    quizArea.querySelectorAll('.choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(answeredGlobal[q.id]!==undefined) return;
        const chosenI = parseInt(el.dataset.i,10);
        answeredGlobal[q.id] = chosenI;
        render();
      });
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ idx++; render(); });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
  }

  function renderDone(){
    const total = pool.length;
    const poolCorrect = pool.filter(q => answeredGlobal[q.id] === q.correct).length;
    const catStats = {};
    pool.forEach(q=>{
      if(!catStats[q.category]) catStats[q.category] = {correct:0,total:0};
      catStats[q.category].total++;
      if(answeredGlobal[q.id]===q.correct) catStats[q.category].correct++;
    });
    const rows = Object.keys(catStats).map(c=>{
      const s = catStats[c];
      const pct = s.total ? Math.round((s.correct/s.total)*100) : 0;
      return `<div class="breakdown-row">
        <div class="bname">${c}</div>
        <div class="btrack"><div class="bfill" style="width:${pct}%"></div></div>
        <div class="bnum">${s.correct}/${s.total}</div>
      </div>`;
    }).join('');

    quizArea.innerHTML = `
      <div class="card done">
        <div class="qcat" style="margin-bottom:8px;">RESULT</div>
        <div class="bigscore">${poolCorrect}<span> / ${total}</span></div>
        <div class="breakdown">${rows}</div>
        <div class="navrow" style="justify-content:center;padding-left:0;margin-top:28px;">
          <button class="navbtn" id="retryBtn">もう一度解く</button>
        </div>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=> initPool(false));
    progressFill.style.width='100%';
    progressPct.textContent='100%';
  }

  initPool(false);
})();
</script>
</body>
</html>
