想空間上の自分の分身、インフルエンサーは影響力のある個人、アンバサダーはブランドの発信に協力する人物を指し、架空の典型的な顧客像はペルソナです。"}, {"id": 225, "question": "自社の新製品が既存の自社製品の売上を奪ってしまう現象を何と呼ぶか。", "choices": ["コモディティ化", "カニバリゼーション", "ブランドスイッチ", "ロイヤルティ低下"], "category": "マーケティング・販売", "correct": 1, "explanation": "自社製品同士の共食い現象。", "wrongNote": "コモディティ化は差別化が失われる現象、ブランドスイッチは他ブランドへの乗り換え、ロイヤルティ低下は忠誠度の低下を指し、自社製品同士が売上を奪い合う現象はカニバリゼーションです。"}, {"id": 226, "question": "顧客ニーズの調査から出発して製品を開発する考え方を何と呼ぶか。", "choices": ["マーケットイン", "プロダクトアウト", "プロダクトライフサイクル", "バリュープロポジション"], "category": "マーケティング・販売", "correct": 0, "explanation": "顧客ニーズ起点の開発。", "wrongNote": "プロダクトアウトは自社の技術・シーズを起点とする考え方、プロダクトライフサイクルは製品の段階変化、バリュープロポジションは提供価値の明確化を指し、顧客ニーズ起点の考え方はマーケットインです。"}, {"id": 227, "question": "自社の技術やシーズを起点に製品を開発し、市場に投入する考え方を何と呼ぶか。", "choices": ["マーケットイン", "カスタマージャーニー", "プロダクトアウト", "STP"], "category": "マーケティング・販売", "correct": 2, "explanation": "自社シーズ起点の開発。", "wrongNote": "マーケットインは顧客ニーズを起点とする考え方、カスタマージャーニーは顧客の行動プロセス、STPは市場細分化の枠組みを指し、自社の技術やシーズを起点とするのはプロダクトアウトです。"}, {"id": 228, "question": "社会課題の解決と自社の利益向上を結びつけたマーケティング手法を何と呼ぶか。", "choices": ["アンブッシュマーケティング", "ゲリラマーケティング", "コーズマーケティング", "バズマーケティング"], "category": "マーケティング・販売", "correct": 2, "explanation": "社会貢献と利益を結びつける手法。", "wrongNote": "ゲリラマーケティングは低予算で意表を突く手法、バズマーケティングは話題性を利用した手法、アンブッシュマーケティングはスポンサーでないのに関連付けて訴求する手法であり、社会課題解決と利益向上を結びつけるのはコーズマーケティングです。"}, {"id": 229, "question": "ブランドの世界観を体現する旗艦店を何と呼ぶか。", "choices": ["フラッグシップストア", "ポップアップストア", "アンテナショップ", "アウトレットストア"], "category": "マーケティング・販売", "correct": 0, "explanation": "ブランド世界観を体現する旗艦店。", "wrongNote": "アウトレットストアは在庫処分等を目的とした店舗、ポップアップストアは期間限定の店舗、アンテナショップは情報発信・テスト販売の拠点を指し、ブランドの世界観を体現する旗艦店はフラッグシップストアです。"}, {"id": 230, "question": "小売業者が独自に企画・販売する自主企画商品を何と呼ぶか。", "choices": ["PB", "NB", "OEMブランド", "ジェネリックブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "小売独自の企画商品。", "wrongNote": "NBはメーカーの全国的なブランド、OEMブランドは受託製造による別のブランド展開、ジェネリックブランドはノーブランドに近い廉価商品を指し、小売独自の企画商品はPBです。"}, {"id": 231, "question": "メーカーが全国的に展開する、広く知られたブランドを何と呼ぶか。", "choices": ["NB", "PB", "ローカルブランド", "コーポレートブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "メーカーの全国的ブランド。", "wrongNote": "PBは小売独自の企画商品、ローカルブランドは地域限定のブランド、コーポレートブランドは企業そのものを示すブランドを指し、メーカーが全国的に展開するブランドはNBです。"}, {"id": 232, "question": "小売店の店頭で消費者の購買を促すためにメーカーが行う販促活動を何と呼ぶか。", "choices": ["トレードマーケティング", "デジタルマーケティング", "リレーションシップマーケティング", "コーポレートマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "店頭での購買促進活動。", "wrongNote": "デジタルマーケティングはデジタル技術活用のマーケティング全般、コーポレートマーケティングは企業ブランド全体の訴求、リレーションシップマーケティングは関係構築全般を指し、店頭での購買促進活動はトレードマーケティングです。"}, {"id": 233, "question": "小売業者が保有する購買データや店舗媒体を活用した広告事業を何と呼ぶか。", "choices": ["リテールメディア", "オウンドメディア", "マスメディア", "トリプルメディア"], "category": "マーケティング・販売", "correct": 0, "explanation": "小売の購買データ・媒体を活用した広告。", "wrongNote": "マスメディアはテレビ・新聞等の媒体、トリプルメディアはペイド・オウンド・アーンドの総称、オウンドメディアは自社保有の情報発信媒体を指し、小売の購買データや店舗媒体を活用した広告事業はリテールメディアです。"}, {"id": 234, "question": "企業が顧客の継続利用や再来店を促すために設けるポイント制度などの仕組みを何と呼ぶか。", "choices": ["インセンティブプログラム", "パートナープログラム", "ロイヤルティプログラム", "アフィリエイトプログラム"], "category": "マーケティング・販売", "correct": 2, "explanation": "継続利用を促す仕組み。", "wrongNote": "アフィリエイトプログラムは成果報酬型広告の仕組み、パートナープログラムは提携企業向けの制度、インセンティブプログラムは主に従業員・販売員向けの制度を指し、顧客の継続利用を促す仕組みはロイヤルティプログラムです。"}, {"id": 235, "question": "サブスクリプションサービスなどにおいて、一定期間内に解約した顧客の割合を何と呼ぶか。", "choices": ["コンバージョン率", "アクティブ率", "チャーンレート", "リテンション率"], "category": "マーケティング・販売", "correct": 2, "explanation": "一定期間の解約率。", "wrongNote": "コンバージョン率は目的行動の達成率、リテンション率は継続利用率で解約率とは逆の視点、アクティブ率は利用中ユーザーの割合を指し、一定期間内の解約率を示すのはチャーンレートです。"}, {"id": 236, "question": "見込み顧客が認知から購入に至るまでの人数の絞り込みを、逆三角形で表したモデルを何と呼ぶか。", "choices": ["サプライチェーン", "プロダクトライフサイクル", "マーケティングファネル", "バリューチェーン"], "category": "マーケティング・販売", "correct": 2, "explanation": "認知から購入への絞り込みモデル。", "wrongNote": "バリューチェーンやサプライチェーンは企業側の活動連鎖、プロダクトライフサイクルは製品の段階変化を指し、認知から購入への絞り込みを逆三角形で表すのはマーケティングファネルです。"}, {"id": 237, "question": "消費者の購買行動を「注意・関心・欲求・記憶・行動」の順で説明する伝統的な購買行動モデルの略称はどれか。", "choices": ["AIDMA", "AISAS", "DAGMAR", "SIPS"], "category": "マーケティング・販売", "correct": 0, "explanation": "伝統的な購買行動モデル。", "wrongNote": "AISASはインターネット時代の購買行動モデル、SIPSはSNS時代の購買行動モデル、DAGMARは広告効果測定のモデルを指し、注意・関心・欲求・記憶・行動の順で説明する伝統的モデルはAIDMAです。"}, {"id": 238, "question": "インターネット時代の購買行動を「注意・関心・検索・行動・共有」の順で説明するモデルの略称はどれか。", "choices": ["RFM", "AIDMA", "STP", "AISAS"], "category": "マーケティング・販売", "correct": 3, "explanation": "インターネット時代の購買行動モデル。", "wrongNote": "AIDMAは伝統的な購買行動モデル、RFMは顧客分析の指標、STPは市場細分化の枠組みを指し、注意・関心・検索・行動・共有の順で説明するのはAISASです。"}, {"id": 239, "question": "オンラインとオフラインの購買体験の垣根をなくし、一体として顧客体験を設計する考え方を何と呼ぶか。", "choices": ["EC", "OMO", "POS", "O2O"], "category": "マーケティング・販売", "correct": 1, "explanation": "オンラインとオフラインを融合させる考え方。", "wrongNote": "O2Oはオンラインからオフラインへの送客を指す考え方、ECは電子商取引そのもの、POSは販売時点情報管理を指し、オンラインとオフラインを一体として捉える考え方はOMOです。"}, {"id": 240, "question": "インターネットやデジタル技術を活用したマーケティング活動全般を何と呼ぶか。", "choices": ["マスマーケティング", "ソーシャルマーケティング", "デジタルマーケティング", "ダイレクトマーケティング"], "category": "マーケティング・販売", "correct": 2, "explanation": "デジタル技術活用のマーケティング全般。", "wrongNote": "マスマーケティングは不特定多数への一律的な訴求、ダイレクトマーケティングは個別・直接的な訴求手法、ソーシャルマーケティングは社会的課題の解決を目的とした手法を指し、デジタル技術活用のマーケティング全般はデジタルマーケティングです。"}, {"id": 241, "question": "顧客ごとの属性や行動履歴に基づき、個別最適化した情報を提供する手法を何と呼ぶか。", "choices": ["セグメンテーション", "ターゲティング", "パーソナライゼーション", "ポジショニング"], "category": "マーケティング・販売", "correct": 2, "explanation": "個別最適化した情報提供。", "wrongNote": "セグメンテーションは市場細分化、ポジショニングは自社の立ち位置の明確化、ターゲティングは狙う市場の選定を指し、顧客ごとに個別最適化した情報提供はパーソナライゼーションです。"}, {"id": 242, "question": "ブランドイメージや事業内容の変化に合わせて、ブランドの再構築を行うことを何と呼ぶか。", "choices": ["リストラクチャリング", "リブランディング", "リストラ", "リエンジニアリング"], "category": "マーケティング・販売", "correct": 1, "explanation": "ブランドの再構築。", "wrongNote": "リストラクチャリングは事業の再構築、リエンジニアリングは業務プロセスの抜本的見直し、リストラは人員整理を指す俗称であり、ブランドの再構築を指すのはリブランディングです。"}, {"id": 243, "question": "小売店のレジで販売時点の商品情報・売上情報を記録するシステムを何と呼ぶか。", "choices": ["CRMシステム", "SCMシステム", "POSシステム", "ERPシステム"], "category": "マーケティング・販売", "correct": 2, "explanation": "販売時点情報管理システム。", "wrongNote": "CRMシステムは顧客関係管理システム、SCMシステムは供給網管理システム、ERPシステムは統合基幹業務システムを指し、レジでの販売時点情報を記録するのはPOSシステムです。"}, {"id": 244, "question": "消費者が商品・サービスを選択・購入する一連の心理的・行動的プロセスを研究する分野を何と呼ぶか。", "choices": ["消費者行動論", "労働経済学", "経営組織論", "財務会計論"], "category": "マーケティング・販売", "correct": 0, "explanation": "購買の心理・行動プロセスの研究。", "wrongNote": "経営組織論は組織構造・行動の研究、財務会計論は財務諸表や会計処理の研究、労働経済学は労働市場の研究を指し、消費者の選択・購入プロセスを研究する分野は消費者行動論です。"}, {"id": 245, "question": "環境や社会に配慮した消費行動を何と呼ぶか。", "choices": ["見栄消費", "エシカル消費", "衝動消費", "代理消費"], "category": "マーケティング・販売", "correct": 1, "explanation": "環境・社会に配慮した消費行動。", "wrongNote": "衝動消費は計画性のない消費行動、見栄消費は他者の目を意識した消費、代理消費は他者のために行う消費を指し、環境や社会に配慮した消費行動はエシカル消費です。"}, {"id": 246, "question": "訪日外国人による消費が、モノの購入中心から体験型の消費へとシフトしている傾向を何と呼ぶか。", "choices": ["アウトバウンド消費の拡大", "インバウンド消費の消滅", "コト消費からモノ消費へのシフト", "モノ消費からコト消費へのシフト"], "category": "マーケティング・販売", "correct": 3, "explanation": "近年のインバウンド消費の傾向。", "wrongNote": "実際にはコト消費からモノ消費への逆行や消費の消滅が起きているわけではなく、日本人の海外消費であるアウトバウンド消費とも異なる、モノ消費からコト消費へのシフトが指摘されています。"}, {"id": 247, "question": "商品やサービスに関する消費者同士の情報共有・評判の広がりを活用したマーケティング手法を何と呼ぶか。", "choices": ["プッシュ型マーケティング", "マスマーケティング", "B2Bマーケティング", "クチコミマーケティング"], "category": "マーケティング・販売", "correct": 3, "explanation": "消費者間の情報共有を活用。", "wrongNote": "マスマーケティングは不特定多数への一律的な訴求、プッシュ型マーケティングは企業側からの一方的な発信、B2Bマーケティングは企業間取引向けの手法を指し、消費者同士の情報共有を活用するのはクチコミマーケティングです。"}, {"id": 248, "question": "広告・販売促進・人的販売・パブリシティなどを組み合わせた企業のコミュニケーション施策全体を何と呼ぶか。", "choices": ["プロダクトミックス", "プライスミックス", "プロモーションミックス", "プレイスミックス"], "category": "マーケティング・販売", "correct": 2, "explanation": "広告・販促等の組み合わせ。", "wrongNote": "プロダクトミックスは製品ラインの組み合わせを指す言葉であり、プライスミックスやプレイスミックスは一般的な用語として定着しておらず、広告・販促等を組み合わせたコミュニケーション施策全体はプロモーションミックスです。"}, {"id": 249, "question": "日本における伝統的な「4大マスメディア」に含まれないものはどれか。", "choices": ["ラジオ", "SNS", "テレビ", "新聞"], "category": "マーケティング・販売", "correct": 1, "explanation": "伝統的な4大マスメディアはテレビ・新聞・ラジオ・雑誌。", "wrongNote": "テレビ・新聞・ラジオは伝統的な4大マスメディアの構成要素（残る一つは雑誌）であり、SNSはインターネット時代の比較的新しいメディアです。"}, {"id": 250, "question": "広告であることを明示しつつ、掲載媒体のコンテンツと自然になじむ形式で配信される広告を何と呼ぶか。", "choices": ["バナー広告", "純広告", "マス広告", "ネイティブ広告"], "category": "マーケティング・販売", "correct": 3, "explanation": "コンテンツに自然になじむ広告形式。  --- # 第6章：生産・テクノロジー（Q251〜Q300）", "wrongNote": "バナー広告は画像形式の表示型広告、純広告は掲載枠を買い切る形式の広告、マス広告はテレビ・新聞等の広告全般を指し、コンテンツに自然になじむ形式で配信されるのはネイティブ広告です。"}, {"id": 251, "question": "トヨタ自動車が確立した、必要なものを必要な時に必要な量だけ生産する仕組みを何と呼ぶか。", "choices": ["大量生産方式", "ジャストインタイム方式", "見込み生産方式", "受注生産方式"], "category": "生産・テクノロジー", "correct": 1, "explanation": "必要な物を必要な時に必要な量だけ生産。", "wrongNote": "大量生産方式は画一的な大量製造を指す考え方、見込み生産方式は需要予測に基づく生産、受注生産方式は注文を受けてから生産を開始する方式であり、必要な時に必要な量だけ生産する仕組みはジャストインタイム方式です。"}, {"id": 252, "question": "生産ラインで異常が発生した際に自動的に機械を止める仕組みを、トヨタ生産方式では何と呼ぶか。", "choices": ["自働化", "平準化", "標準化", "見える化"], "category": "生産・テクノロジー", "correct": 0, "explanation": "異常時に機械が自動停止する仕組み。", "wrongNote": "標準化は作業手順の統一、平準化は生産量・種類の均一化、見える化は状況を可視化する取り組みを指し、異常発生時に機械を自動停止させる仕組みは自働化です。"}, {"id": 253, "question": "後工程が前工程に必要な部品の種類・数量を伝える指示票を用いた生産管理手法を何と呼ぶか。", "choices": ["カンバン方式", "POSシステム", "SCMシステム", "ERPシステム"], "category": "生産・テクノロジー", "correct": 0, "explanation": "後工程から前工程への指示票を用いる。", "wrongNote": "POSシステムは販売時点の情報管理、ERPシステムは統合基幹業務システム、SCMシステムは供給網管理システムを指し、指示票を用いて必要な部品を伝える生産管理手法はカンバン方式です。"}, {"id": 254, "question": "業務プロセスを継続的に改善するための「計画・実行・評価・改善」のサイクルを何と呼ぶか。", "choices": ["QCDサイクル", "PDCAサイクル", "KGIサイクル", "SDGsサイクル"], "category": "生産・テクノロジー", "correct": 1, "explanation": "計画・実行・評価・改善の継続的改善サイクル。", "wrongNote": "QCD（品質・コスト・納期）は管理の視点であり循環サイクルとして一般的に呼ばれるものではなく、SDGsサイクルやKGIサイクルも一般的な用語ではないため、計画・実行・評価・改善のサイクルはPDCAサイクルと呼ばれます。"}, {"id": 255, "question": "現場の従業員が小集団で品質改善活動を自主的に行う取り組みを何と呼ぶか。", "choices": ["プロジェクトチーム", "タスクフォース", "コミッティ", "QCサークル"], "category": "生産・テクノロジー", "correct": 3, "explanation": "現場主導の品質改善活動。", "wrongNote": "プロジェクトチームやタスクフォースは特定課題に対応する一時的な組織、コミッティは委員会組織を指し、現場の小集団による自主的な品質改善活動はQCサークルです。"}, {"id": 256, "question": "発注から納品までにかかる時間を何と呼ぶか。", "choices": ["サイクルタイム", "リードタイム", "ダウンタイム", "タクトタイム"], "category": "生産・テクノロジー", "correct": 1, "explanation": "発注から納品までの時間。", "wrongNote": "サイクルタイムは1単位を生産するのにかかる時間、タクトタイムは生産ラインの目標周期時間、ダウンタイムは機械が停止している時間を指し、発注から納品までの時間はリードタイムです。"}, {"id": 257, "question": "投入した原材料のうち、良品として完成した割合を何と呼ぶか。", "choices": ["良品率とは無関係な指標", "生産性", "歩留まり", "稼働率"], "category": "生産・テクノロジー", "correct": 2, "explanation": "投入量に対する良品の割合。", "wrongNote": "稼働率は設備が実際に稼働している割合、生産性は投入資源に対する産出の効率を示す指標であり、投入量に対する良品の割合は歩留まりです。"}, {"id": 258, "question": "製品の設計・製造工程を自社で保有せず、他社に製造を委託する事業形態を何と呼ぶか。", "choices": ["インテグレーテッド・デバイス・メーカー", "垂直統合型メーカー", "コングロマリット", "ファブレス"], "category": "生産・テクノロジー", "correct": 3, "explanation": "製造工程を自社で持たない事業形態。", "wrongNote": "インテグレーテッド・デバイス・メーカーや垂直統合型メーカーは自社内で設計から製造まで一貫して行う企業、コングロマリットは異業種を傘下に持つ複合企業を指し、製造工程を自社で持たない事業形態はファブレスです。"}, {"id": 259, "question": "電子機器の製造を専門に受託する企業を何と呼ぶか。", "choices": ["EMS", "SI", "VC", "ISP"], "category": "生産・テクノロジー", "correct": 0, "explanation": "電子機器の受託製造サービス。", "wrongNote": "VCはベンチャーキャピタル、SIはシステムインテグレーター、ISPはインターネット接続業者を指し、電子機器の受託製造を専門とする企業はEMSです。"}, {"id": 260, "question": "半導体製造工程のうち、シリコンウエハーに回路を形成する工程を何と呼ぶか。", "choices": ["後工程", "出荷工程", "前工程", "検査工程のみ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "ウエハーへの回路形成工程。", "wrongNote": "後工程は切断やパッケージングを行う工程、検査工程や出荷工程はより限定的な範囲を指し、ウエハーに回路を形成する工程は前工程です。"}, {"id": 261, "question": "半導体製造工程のうち、ウエハーを切り分けてパッケージに封入する工程を何と呼ぶか。", "choices": ["後工程", "前工程", "R&D工程", "設計工程"], "category": "生産・テクノロジー", "correct": 0, "explanation": "切断・パッケージング工程。", "wrongNote": "前工程は回路を形成する工程、設計工程やR&D工程は製造前段階の工程を指し、ウエハーの切断・パッケージングは後工程です。"}, {"id": 262, "question": "IoTセンサーやAIを活用し、生産効率を高めた工場を何と呼ぶか。", "choices": ["レガシーファクトリー", "アウトソース工場", "スマートファクトリー", "OEM工場"], "category": "生産・テクノロジー", "correct": 2, "explanation": "IoT・AI活用で効率化した工場。", "wrongNote": "レガシーファクトリーは旧来型の工場を指す対比語、アウトソース工場やOEM工場は外部委託先を指す言葉であり、IoT・AIを活用し効率化した工場はスマートファクトリーです。"}, {"id": 263, "question": "デジタル技術を活用してビジネスモデルや組織そのものを変革する取り組みを何と呼ぶか。", "choices": ["BPR", "DX", "ERP", "TQM"], "category": "生産・テクノロジー", "correct": 1, "explanation": "デジタル技術によるビジネス変革。", "wrongNote": "BPRは業務プロセスの再設計、TQMは総合的品質管理、ERPは統合基幹業務システムを指し、デジタル技術によるビジネスモデル・組織の変革はDXです。"}, {"id": 264, "question": "人間の学習能力を模した仕組みで、大量のデータからパターンを学習するAI技術を何と呼ぶか。", "choices": ["リレーショナルデータベース", "クラウドコンピューティング", "機械学習", "エッジコンピューティング"], "category": "生産・テクノロジー", "correct": 2, "explanation": "データからパターンを学習するAI技術。", "wrongNote": "リレーショナルデータベースはデータ管理の仕組み、クラウドコンピューティングは計算資源の提供形態、エッジコンピューティングは端末側での処理形態を指し、データからパターンを学習するAI技術は機械学習です。"}, {"id": 265, "question": "多層のニューラルネットワークを用いて高度な特徴抽出を行う機械学習の一分野を何と呼ぶか。", "choices": ["ウォーターフォール開発", "ディープラーニング", "アジャイル開発", "リグレッションテスト"], "category": "生産・テクノロジー", "correct": 1, "explanation": "多層ニューラルネットワークを用いる手法。", "wrongNote": "リグレッションテストはソフトウェアの回帰テスト、ウォーターフォール開発やアジャイル開発は開発手法の分類を指し、多層ニューラルネットワークを用いる機械学習の一分野はディープラーニングです。"}, {"id": 266, "question": "テキストや画像などのコンテンツを新たに生成できるAIを何と呼ぶか。", "choices": ["RPA", "OCR", "ERP", "生成AI"], "category": "生産・テクノロジー", "correct": 3, "explanation": "新たなコンテンツを生成できるAI。", "wrongNote": "RPAは定型業務を自動化するツール、OCRは文字認識技術、ERPは統合基幹業務システムを指し、新たなコンテンツを生成できるAIは生成AIです。"}, {"id": 267, "question": "インターネット経由でサーバーやストレージなどの計算資源を必要な分だけ利用できる仕組みを何と呼ぶか。", "choices": ["クラウドコンピューティング", "オンプレミス", "スタンドアロン", "メインフレーム"], "category": "生産・テクノロジー", "correct": 0, "explanation": "計算資源をネット経由で利用。", "wrongNote": "オンプレミスは自社内に設備を保有する形態、メインフレームは大型汎用コンピューター、スタンドアロンはネットワークに接続しない単独稼働形態を指し、計算資源をネット経由で利用する仕組みはクラウドコンピューティングです。"}, {"id": 268, "question": "従来のデータベースでは扱いきれないほど大量かつ多様なデータを何と呼ぶか。", "choices": ["メタデータ", "スモールデータ", "ビッグデータ", "マスターデータ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "大量かつ多様なデータ。", "wrongNote": "スモールデータは少量の限定的なデータ、メタデータはデータに関する付随情報、マスターデータは基幹となる基礎データを指し、従来のデータベースでは扱いきれない大量多様なデータはビッグデータです。"}, {"id": 269, "question": "現行の4Gに比べ、高速大容量・低遅延・多数同時接続を特徴とする移動通信規格を何と呼ぶか。", "choices": ["5G", "Wi-Fi 6", "NFC", "Bluetooth"], "category": "生産・テクノロジー", "correct": 0, "explanation": "高速・大容量・低遅延・多接続が特徴。", "wrongNote": "Wi-Fi 6は無線LANの規格、Bluetoothは近距離無線通信の規格、NFCは近接無線通信の規格を指し、高速大容量・低遅延・多数同時接続を特徴とする移動通信規格は5Gです。"}, {"id": 270, "question": "完全自動運転を指す、自動運転レベル分類における最高段階はどれか。", "choices": ["レベル5", "レベル1", "レベル3", "レベル2"], "category": "生産・テクノロジー", "correct": 0, "explanation": "完全自動運転の段階。", "wrongNote": "レベル1は運転支援の初期段階、レベル2は部分的な自動運転、レベル3は条件付き自動運転を指し、完全自動運転を意味する最高段階はレベル5です。"}, {"id": 271, "question": "太陽光や風力など、資源が枯渇しないエネルギー源を何と呼ぶか。", "choices": ["化石エネルギー", "原子力エネルギー", "再生可能エネルギー", "非再生エネルギー"], "category": "生産・テクノロジー", "correct": 2, "explanation": "太陽光・風力など枯渇しないエネルギー。", "wrongNote": "化石エネルギーは枯渇性のエネルギー、原子力エネルギーはウラン等を用いるエネルギー、非再生エネルギーはむしろ枯渇性エネルギーを指す総称であり、資源が枯渇しないエネルギー源は再生可能エネルギーです。"}, {"id": 272, "question": "電気を化学エネルギーなどの形で蓄え、必要な時に取り出せる装置を何と呼ぶか。", "choices": ["蓄電池", "コンデンサー", "トランス", "インバーター"], "category": "生産・テクノロジー", "correct": 0, "explanation": "電気を蓄え必要時に取り出す装置。", "wrongNote": "コンデンサーは電荷を蓄える電子部品、トランスは電圧を変換する機器、インバーターは直流と交流を変換する機器を指し、電気を化学エネルギー等の形で蓄える装置は蓄電池です。"}, {"id": 273, "question": "燃焼させても水しか生成しないクリーンなエネルギー源として注目される元素を用いたエネルギーを何と呼ぶか。", "choices": ["石炭エネルギー", "バイオマスエネルギー", "水素エネルギー", "天然ガスエネルギー"], "category": "生産・テクノロジー", "correct": 2, "explanation": "燃焼時に水のみ生成するクリーンエネルギー。", "wrongNote": "石炭エネルギーや天然ガスエネルギーは化石燃料由来のエネルギー、バイオマスエネルギーは生物由来資源のエネルギーを指し、燃焼させても水しか生成しないクリーンなエネルギー源は水素エネルギーです。"}, {"id": 274, "question": "廃棄物を出さず資源を循環させ続ける経済モデルを何と呼ぶか。", "choices": ["ギグエコノミー", "サーキュラーエコノミー", "シェアリングエコノミー", "リニアエコノミー"], "category": "生産・テクノロジー", "correct": 1, "explanation": "資源循環型の経済モデル。", "wrongNote": "リニアエコノミーは資源を使い捨てる従来型の経済、シェアリングエコノミーは資産等を共有する経済、ギグエコノミーは単発の仕事を請け負う働き方を指し、資源を循環させ続ける経済モデルはサーキュラーエコノミーです。"}, {"id": 275, "question": "3次元のデジタルデータをもとに、材料を積層して立体物を造形する技術を何と呼ぶか。", "choices": ["CNC加工", "3Dプリンティング", "プレス加工", "射出成形"], "category": "生産・テクノロジー", "correct": 1, "explanation": "材料の積層による造形技術。", "wrongNote": "CNC加工は数値制御による切削加工、射出成形は金型に材料を流し込む成形法、プレス加工は金属板等を型で成形する加工法を指し、材料を積層して造形する技術は3Dプリンティングです。"}, {"id": 276, "question": "地政学リスクの高まりにより、特定国・地域への依存を減らし供給網を分散させる動きを何と呼ぶか。", "choices": ["サプライチェーンの多元化", "サプライチェーンの廃止", "サプライチェーンの国有化", "サプライチェーンの一極集中化"], "category": "生産・テクノロジー", "correct": 0, "explanation": "地政学リスクへの対応策。", "wrongNote": "供給網の一極集中化はむしろ逆方向の動きであり、供給網自体の廃止や国有化が進んでいるわけでもなく、特定国への依存を減らし分散させる動きはサプライチェーンの多元化です。"}, {"id": 277, "question": "電気のみを動力源とし、内燃機関を搭載しない自動車を何と呼ぶか。", "choices": ["FCV", "HV", "BEV", "PHV"], "category": "生産・テクノロジー", "correct": 2, "explanation": "内燃機関を持たない電気自動車。", "wrongNote": "HVはエンジンとモーターを併用する車、PHVは外部充電可能なハイブリッド車、FCVは水素を用いる燃料電池車を指し、電気のみを動力源とする車はBEVです。"}, {"id": 278, "question": "ガソリンエンジンと電気モーターを組み合わせた自動車を何と呼ぶか。", "choices": ["FCV", "BEV", "HV", "ICEのみ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "エンジンとモーターを組み合わせた車。", "wrongNote": "BEVは電気のみを動力源とする車、FCVは水素を用いる燃料電池車、内燃機関のみの車はエンジンだけで走る従来車を指し、エンジンとモーターを組み合わせた車はHVです。"}, {"id": 279, "question": "人手に頼っていた作業を機械やソフトウェアに置き換え、効率化を図ることを何と呼ぶか。", "choices": ["オートメーション", "カーブアウト", "アウトソーシング", "インソーシング"], "category": "生産・テクノロジー", "correct": 0, "explanation": "機械・ソフトウェアによる作業の置き換え。", "wrongNote": "アウトソーシングは業務の外部委託、インソーシングは内製化、カーブアウトは事業の切り出しを指し、人手作業を機械やソフトウェアに置き換えることはオートメーションです。"}, {"id": 280, "question": "工場のロボット導入時に、機械の選定・設置・稼働までを一括して請け負う専門業者を何と呼ぶか。", "choices": ["EMS", "ロボットSIer", "サプライヤー", "ファブレス企業"], "category": "生産・テクノロジー", "correct": 1, "explanation": "ロボット導入を一括で請け負う専門業者。", "wrongNote": "EMSは電子機器の受託製造企業、ファブレス企業は製造工程を持たない企業、サプライヤーは部品・材料の供給企業を指し、ロボット導入を一括で請け負う専門業者はロボットSIerです。"}, {"id": 281, "question": "現実の設備や製品をデジタル空間上に再現し、シミュレーションに活用する技術を何と呼ぶか。", "choices": ["デジタルツイン", "拡張現実のみ", "メタデータ管理", "バーチャルリアリティのみ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "現実設備をデジタル空間上に再現。", "wrongNote": "バーチャルリアリティや拡張現実は仮想体験の技術そのものを指す言葉であり、メタデータ管理はデータの付随情報管理を指すため、現実設備をデジタル空間上に再現しシミュレーションに使う技術はデジタルツインです。"}, {"id": 282, "question": "コンピューターシステムやネットワークを不正アクセスや攻撃から守る取り組みを何と呼ぶか。", "choices": ["サイバーセキュリティ", "ペネトレーションテスト", "クラウドファースト", "VPN構築"], "category": "生産・テクノロジー", "correct": 0, "explanation": "不正アクセス等からシステムを守る取り組み。", "wrongNote": "クラウドファーストはシステム導入の方針、ペネトレーションテストは疑似攻撃によるぜい弱性診断の手法、VPN構築は対策の一つの手段であり、不正アクセス等からシステムを守る取り組み全体を指すのはサイバーセキュリティです。"}, {"id": 283, "question": "インターネット経由でソフトウェアを利用できるサービス提供形態を何と呼ぶか。", "choices": ["IaaS", "DaaS", "PaaS", "SaaS"], "category": "生産・テクノロジー", "correct": 3, "explanation": "ソフトウェアをネット経由で利用するサービス。", "wrongNote": "PaaSは開発基盤の提供、IaaSはインフラの提供、DaaSはデスクトップ環境の提供を指すサービス形態であり、ソフトウェアをネット経由で提供する形態はSaaSです。"}, {"id": 284, "question": "インターネット経由でアプリケーション開発・実行のための基盤環境を提供するサービス形態を何と呼ぶか。", "choices": ["PaaS", "FaaS", "SaaS", "IaaS"], "category": "生産・テクノロジー", "correct": 0, "explanation": "アプリ開発・実行基盤の提供サービス。", "wrongNote": "SaaSはソフトウェアの提供、IaaSはインフラの提供、FaaSは関数単位の実行環境提供を指すサービス形態であり、開発・実行基盤を提供する形態はPaaSです。"}, {"id": 285, "question": "サーバーやネットワークなどのITインフラをインターネット経由で提供するサービス形態を何と呼ぶか。", "choices": ["PaaS", "BaaS", "SaaS", "IaaS"], "category": "生産・テクノロジー", "correct": 3, "explanation": "ITインフラの提供サービス。", "wrongNote": "SaaSはソフトウェアの提供、PaaSは開発基盤の提供、BaaSはバックエンド機能の提供を指すサービス形態であり、ITインフラを提供する形態はIaaSです。"}, {"id": 286, "question": "自社の技術やアイデアだけでなく、社外の技術・知見を積極的に取り込んで革新を生み出す考え方を何と呼ぶか。", "choices": ["リバースイノベーション", "オープンイノベーション", "クローズドイノベーション", "インクリメンタルイノベーション"], "category": "生産・テクノロジー", "correct": 1, "explanation": "社外の技術・知見を取り込む考え方。", "wrongNote": "クローズドイノベーションは自社内で完結させる革新、リバースイノベーションは新興国発の技術が広がる現象、インクリメンタルイノベーションは漸進的な改良を指し、社外の技術・知見を取り込む考え方はオープンイノベーションです。"}, {"id": 287, "question": "企業が新製品・新技術の創出のために行う研究開発活動の略称はどれか。", "choices": ["R&D", "PMI", "IPO", "M&A"], "category": "生産・テクノロジー", "correct": 0, "explanation": "研究開発（Research and Development）。", "wrongNote": "M&Aは合併・買収、IPOは新規株式公開、PMIは統合プロセスを指す略称であり、研究開発活動を指す略称はR&Dです。"}, {"id": 288, "question": "プログラミングの専門知識がなくてもアプリケーションを開発できる開発手法を何と呼ぶか。", "choices": ["ノーコード／ローコード開発", "ウォーターフォール開発", "スクラッチ開発", "オフショア開発"], "category": "生産・テクノロジー", "correct": 0, "explanation": "専門知識不要の開発手法。", "wrongNote": "ウォーターフォール開発は工程を順に進める従来型の開発手法、スクラッチ開発はゼロからのプログラミング、オフショア開発は海外への開発委託を指し、専門知識不要で開発できる手法はノーコード／ローコード開発です。"}, {"id": 289, "question": "インターネット上に構築された、アバターを介して活動できる仮想空間を何と呼ぶか。", "choices": ["エクストラネット", "イントラネット", "ダークウェブ", "メタバース"], "category": "生産・テクノロジー", "correct": 3, "explanation": "アバターを介した仮想空間。", "wrongNote": "イントラネットは組織内のネットワーク、エクストラネットは組織間を結ぶネットワーク、ダークウェブは匿名性の高い特殊なネットワーク領域を指し、アバターを介した仮想空間はメタバースです。"}, {"id": 290, "question": "取引履歴を分散した複数のコンピューターで共有・検証し、改ざんを困難にする技術を何と呼ぶか。", "choices": ["ブロックチェーン", "VPN", "ファイアウォール", "クラウドストレージ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "分散台帳による改ざん耐性技術。", "wrongNote": "クラウドストレージはデータ保存サービス、VPNは仮想的な専用通信網、ファイアウォールは不正アクセスを防ぐ仕組みを指し、分散して取引履歴を共有・検証する技術はブロックチェーンです。"}, {"id": 291, "question": "従来のコンピューターでは膨大な時間がかかる計算を、量子力学の原理を用いて高速に処理する次世代コンピューターを何と呼ぶか。", "choices": ["スーパーコンピュータ", "メインフレーム", "量子コンピュータ", "アナログコンピュータ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "量子力学を応用した次世代コンピューター。", "wrongNote": "スーパーコンピュータは従来型の原理に基づく高性能計算機、メインフレームは大型汎用コンピューター、アナログコンピュータは連続量を扱う旧来の計算機を指し、量子力学の原理を用いる次世代コンピューターは量子コンピュータです。"}, {"id": 292, "question": "遠隔操作や自律飛行が可能な、空撮や物流などに活用される無人航空機を何と呼ぶか。", "choices": ["VTOL機", "ドローン", "AMR", "AGV"], "category": "生産・テクノロジー", "correct": 1, "explanation": "遠隔・自律飛行が可能な無人航空機。", "wrongNote": "AGVやAMRは主に地上を自律走行する搬送機器、VTOL機は垂直離着陸が可能な航空機を指す別の概念であり、遠隔操作や自律飛行が可能な無人航空機を指す一般的な呼称はドローンです。"}, {"id": 293, "question": "半導体の回路線幅を微細化することで得られる一般的なメリットとして正しいものはどれか。", "choices": ["製造コストが必ず下がる", "処理性能の向上と消費電力の低減", "チップサイズが必ず大きくなる", "発熱量が必ず増加する"], "category": "生産・テクノロジー", "correct": 1, "explanation": "微細化の一般的メリット。", "wrongNote": "微細化によって製造コストが必ず下がる、発熱量が必ず増加する、チップサイズが必ず大きくなるとは限らず、一般的なメリットとして処理性能の向上と消費電力の低減が挙げられます。"}, {"id": 294, "question": "世界最大級の半導体受託製造企業として知られる台湾の企業はどれか。", "choices": ["サムスン電子", "インテル", "TSMC", "クアルコム"], "category": "生産・テクノロジー", "correct": 2, "explanation": "世界最大級の半導体ファウンドリー。", "wrongNote": "サムスン電子は自社製品も手がける総合半導体企業、インテルは自社設計製造中心の企業、クアルコムは設計中心のファブレス企業を指し、受託製造専門で世界最大級とされるのはTSMCです。"}, {"id": 295, "question": "工場やオフィスにおいて、機械化・自動化により従業員一人当たりの産出量を高めることを何と呼ぶか。", "choices": ["稼働率低下", "リードタイム延長", "生産性低下", "生産性向上"], "category": "生産・テクノロジー", "correct": 3, "explanation": "一人当たり産出量の向上。", "wrongNote": "生産性の低下や稼働率の低下、リードタイムの延長はいずれも効率化とは逆方向の変化であり、機械化・自動化による産出量向上を指すのは生産性向上です。"}, {"id": 296, "question": "ITを活用して電力の需給を最適に制御する次世代の送配電網を何と呼ぶか。", "choices": ["スマートグリッド", "スーパーグリッド", "デジタルグリッド", "マイクログリッド"], "category": "生産・テクノロジー", "correct": 0, "explanation": "ITで電力需給を最適制御する送配電網。", "wrongNote": "マイクログリッドは局所的な電力網、スーパーグリッドは広域を結ぶ送電網、デジタルグリッドは特定の技術方式を指す関連概念であり、ITで電力需給全体を最適制御する次世代送配電網はスマートグリッドです。"}, {"id": 297, "question": "工程能力や品質のばらつきを統計的に管理し、不良品の発生を抑える手法の総称を何と呼ぶか。", "choices": ["統計的品質管理", "人事評価制度", "財務会計", "マーケティングリサーチ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "ばらつきを統計的に管理する手法。", "wrongNote": "財務会計やマーケティングリサーチ、人事評価制度はいずれも品質管理とは異なる分野であり、工程能力や品質のばらつきを統計的に管理する手法は統計的品質管理（SQC）です。"}, {"id": 298, "question": "製造業において、需要変動に応じて生産計画を柔軟に組み替える能力を何と呼ぶか。", "choices": ["ロット生産の廃止", "固定生産方式", "生産の柔軟性", "需要無視の生産方式"], "category": "生産・テクノロジー", "correct": 2, "explanation": "需要変動への対応力。", "wrongNote": "固定生産方式は生産計画を変えない方式、ロット生産の廃止は特定の生産方式を否定する話、需要無視の生産方式は非現実的な選択肢であり、需要変動に応じて計画を柔軟に組み替える能力は生産の柔軟性です。"}, {"id": 299, "question": "複数の工程を経て製品が完成するまでの、工場内での物の流れ全体を管理する考え方を何と呼ぶか。", "choices": ["労務管理のみ", "生産管理", "株主管理", "財務管理"], "category": "生産・テクノロジー", "correct": 1, "explanation": "工程全体の物の流れを管理する考え方。", "wrongNote": "財務管理は資金に関する管理、労務管理のみでは範囲が限定的、株主管理は株主対応に関する業務を指し、工場内での物の流れ全体を管理する考え方は生産管理です。"}, {"id": 300, "question": "AIやロボットの活用が進む中で、人間にしかできない創造的・対人的業務へのシフトが求められている労働市場の変化を何と呼ぶか。", "choices": ["賃金の一律引き上げ", "労働時間の完全撤廃", "労働のシフト", "完全失業"], "category": "生産・テクノロジー", "correct": 2, "explanation": "創造的・対人的業務への人材シフトが求められている。", "wrongNote": "完全失業という極端な状態や、賃金の一律引き上げ、労働時間の完全撤廃が直接的な帰結として求められているわけではなく、創造的・対人的業務への人材シフトが指摘されています。"}]</script>
<script>
(function(){
  const ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
  const CATEGORIES = [...new Set(ALL_QUESTIONS.map(q=>q.category))];

  let activeCategory = 'すべて';
  let pool = [];        // current filtered/ordered question list
  let idx = 0;           // pointer within pool
  const answeredGlobal = {};  // id -> chosen index, persists across filters/jumps for the whole session

  const chipRow = document.getElementById('chipRow');
  const quizArea = document.getElementById('quizArea');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct = document.getElementById('progressPct');
  const filterCount = document.getElementById('filterCount');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const jumpForm = document.getElementById('jumpForm');
  const jumpInput = document.getElementById('jumpInput');
  const reviewList = document.getElementById('reviewList');
  const reviewCount = document.getElementById('reviewCount');

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildChips(){
    const cats = ['すべて', ...CATEGORIES];
    chipRow.innerHTML = '';
    cats.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip' + (c===activeCategory ? ' active':'');
      b.textContent = c;
      b.onclick = ()=>{ activeCategory = c; initPool(false); };
      chipRow.appendChild(b);
    });
  }

  function initPool(doShuffle, startIdx){
    const base = activeCategory==='すべて' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q=>q.category===activeCategory);
    pool = doShuffle ? shuffle(base) : base.slice();
    idx = startIdx || 0;
    buildChips();
    filterCount.textContent = activeCategory + '（全' + pool.length + '問）';
    render();
  }

  shuffleBtn.onclick = ()=> initPool(true);

  jumpForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const n = parseInt(jumpInput.value, 10);
    if(!n || n < 1 || n > ALL_QUESTIONS.length) return;
    activeCategory = 'すべて';
    initPool(false, n-1);
    jumpInput.value = '';
    quizArea.scrollIntoView({behavior:'smooth', block:'start'});
  });

  function updateScoreHeader(){
    const ids = Object.keys(answeredGlobal);
    const total = ids.length;
    const correct = ids.filter(id => answeredGlobal[id] === ALL_QUESTIONS[Number(id)-1].correct).length;
    scoreCorrect.textContent = correct;
    scoreTotal.textContent = total;
  }

  function renderReviewPanel(){
    const wrongIds = ALL_QUESTIONS
      .filter(q => answeredGlobal[q.id] !== undefined && answeredGlobal[q.id] !== q.correct)
      .map(q => q.id);
    reviewCount.textContent = wrongIds.length + '問';
    if(wrongIds.length === 0){
      reviewList.innerHTML = '<div class="reviewempty">まだ間違えた問題はありません。</div>';
      return;
    }
    const chips = wrongIds.map(id => `<span class="rnum" data-jump="${id}">Q${id}</span>`).join('');
    const plain = 'Q' + wrongIds.join(' / Q');
    reviewList.innerHTML = `<div class="reviewlist">${chips}</div><div class="reviewplain">${plain}</div>`;
    reviewList.querySelectorAll('.rnum').forEach(el=>{
      el.addEventListener('click', ()=>{
        const n = parseInt(el.dataset.jump, 10);
        activeCategory = 'すべて';
        initPool(false, n-1);
        quizArea.scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  function updateProgress(){
    const total = pool.length;
    const shown = Math.min(idx+1, total);
    progressLabel.textContent = '問 ' + shown + ' / ' + total;
    const pct = total ? Math.round((idx/total)*100) : 0;
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  const stampCorrectSVG = `
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.92"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.35" transform="rotate(6 50 50)"/>
      <text x="50" y="59" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="30" font-weight="800" fill="#2E6B4F">正</text>
    </svg>`;
  const stampWrongSVG = `
    <svg viewBox="0 0 100 100">
      <rect x="14" y="14" width="72" height="72" rx="6" fill="none" stroke="#B23A2C" stroke-width="6" opacity="0.9" transform="rotate(-4 50 50)"/>
      <line x1="26" y1="26" x2="74" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
      <line x1="74" y1="26" x2="26" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
    </svg>`;

  function render(){
    updateScoreHeader();
    updateProgress();
    renderReviewPanel();

    if(pool.length===0){
      quizArea.innerHTML = '<div class="card"><p style="text-align:center;color:var(--ink-soft);">この分野の問題がありません。</p></div>';
      return;
    }

    if(idx >= pool.length){
      renderDone();
      return;
    }

    const q = pool[idx];
    const chosen = answeredGlobal[q.id];
    const isLocked = chosen !== undefined;

    const letters = ['A','B','C','D'];
    const choicesHtml = q.choices.map((c,i)=>{
      let cls = 'choice';
      if(isLocked){
        cls += ' locked';
        if(i===chosen && i===q.correct) cls += ' selected-correct';
        else if(i===chosen && i!==q.correct) cls += ' selected-wrong';
        else if(i===q.correct) cls += ' reveal-correct';
      }
      return `<div class="${cls}" data-i="${i}">
        <span class="mark">${letters[i]}</span>
        <span>${c}</span>
      </div>`;
    }).join('');

    let stampHtml = '';
    if(isLocked){
      const wasCorrect = chosen === q.correct;
      stampHtml = `<div class="stamp show">${wasCorrect ? stampCorrectSVG : stampWrongSVG}</div>`;
    }

    quizArea.innerHTML = `
      <div class="card">
        ${stampHtml}
        <div class="qhead">
          <div class="qnum">${String(q.id).padStart(3,'0')}</div>
          <div class="qmeta"><div class="qcat">${q.category}</div></div>
        </div>
        <div class="qtext">${q.question}</div>
        <div class="choices">${choicesHtml}</div>
        <div class="explain ${isLocked ? 'show':''}">
          <div class="explain-inner"><b>${letters[q.correct]}が正解。</b>${q.explanation}</div>
        </div>
        <div class="wrongnote ${isLocked ? 'show':''}">
          <div class="wrongnote-inner"><span class="label">他の選択肢について</span>${q.wrongNote || ''}</div>
        </div>
        <div class="navrow">
          <button class="navbtn ghost" id="prevBtn" ${idx===0 ? 'disabled':''}>戻る</button>
          <button class="navbtn" id="nextBtn" ${isLocked ? '' : 'disabled'}>${idx===pool.length-1 ? '結果を見る':'次の問題'}</button>
        </div>
      </div>
    `;

    quizArea.querySelectorAll('.choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(answeredGlobal[q.id]!==undefined) return;
        const chosenI = parseInt(el.dataset.i,10);
        answeredGlobal[q.id] = chosenI;
        render();
      });
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ idx++; render(); });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
  }

  function renderDone(){
    const total = pool.length;
    const poolCorrect = pool.filter(q => answeredGlobal[q.id] === q.correct).length;
    const catStats = {};
    pool.forEach(q=>{
      if(!catStats[q.category]) catStats[q.category] = {correct:0,total:0};
      catStats[q.category].total++;
      if(answeredGlobal[q.id]===q.correct) catStats[q.category].correct++;
    });
    const rows = Object.keys(catStats).map(c=>{
      const s = catStats[c];
      const pct = s.total ? Math.round((s.correct/s.total)*100) : 0;
      return `<div class="breakdown-row">
        <div class="bname">${c}</div>
        <div class="btrack"><div class="bfill" style="width:${pct}%"></div></div>
        <div class="bnum">${s.correct}/${s.total}</div>
      </div>`;
    }).join('');

    quizArea.innerHTML = `
      <div class="card done">
        <div class="qcat" style="margin-bottom:8px;">RESULT</div>
        <div class="bigscore">${poolCorrect}<span> / ${total}</span></div>
        <div class="breakdown">${rows}</div>
        <div class="navrow" style="justify-content:center;padding-left:0;margin-top:28px;">
          <button class="navbtn" id="retryBtn">もう一度解く</button>
        </div>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=> initPool(false));
    progressFill.style.width='100%';
    progressPct.textContent='100%';
  }

  initPool(false);
})();
</script>
</body>
</html>
