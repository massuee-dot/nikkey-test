想空間上の自分の分身、インフルエンサーは影響力のある個人、アンバサダーはブランドの発信に協力する人物を指し、架空の典型的な顧客像はペルソナです。"}, {"id": 225, "question": "自社の新製品が既存の自社製品の売上を奪ってしまう現象を何と呼ぶか。", "choices": ["コモディティ化", "カニバリゼーション", "ブランドスイッチ", "ロイヤルティ低下"], "category": "マーケティング・販売", "correct": 1, "explanation": "自社製品同士の共食い現象。", "wrongNote": "コモディティ化は差別化が失われる現象、ブランドスイッチは他ブランドへの乗り換え、ロイヤルティ低下は忠誠度の低下を指し、自社製品同士が売上を奪い合う現象はカニバリゼーションです。"}, {"id": 226, "question": "顧客ニーズの調査から出発して製品を開発する考え方を何と呼ぶか。", "choices": ["マーケットイン", "プロダクトアウト", "プロダクトライフサイクル", "バリュープロポジション"], "category": "マーケティング・販売", "correct": 0, "explanation": "顧客ニーズ起点の開発。", "wrongNote": "プロダクトアウトは自社の技術・シーズを起点とする考え方、プロダクトライフサイクルは製品の段階変化、バリュープロポジションは提供価値の明確化を指し、顧客ニーズ起点の考え方はマーケットインです。"}, {"id": 227, "question": "自社の技術やシーズを起点に製品を開発し、市場に投入する考え方を何と呼ぶか。", "choices": ["マーケットイン", "カスタマージャーニー", "プロダクトアウト", "STP"], "category": "マーケティング・販売", "correct": 2, "explanation": "自社シーズ起点の開発。", "wrongNote": "マーケットインは顧客ニーズを起点とする考え方、カスタマージャーニーは顧客の行動プロセス、STPは市場細分化の枠組みを指し、自社の技術やシーズを起点とするのはプロダクトアウトです。"}, {"id": 228, "question": "社会課題の解決と自社の利益向上を結びつけたマーケティング手法を何と呼ぶか。", "choices": ["アンブッシュマーケティング", "ゲリラマーケティング", "コーズマーケティング", "バズマーケティング"], "category": "マーケティング・販売", "correct": 2, "explanation": "社会貢献と利益を結びつける手法。", "wrongNote": "ゲリラマーケティングは低予算で意表を突く手法、バズマーケティングは話題性を利用した手法、アンブッシュマーケティングはスポンサーでないのに関連付けて訴求する手法であり、社会課題解決と利益向上を結びつけるのはコーズマーケティングです。"}, {"id": 229, "question": "ブランドの世界観を体現する旗艦店を何と呼ぶか。", "choices": ["フラッグシップストア", "ポップアップストア", "アンテナショップ", "アウトレットストア"], "category": "マーケティング・販売", "correct": 0, "explanation": "ブランド世界観を体現する旗艦店。", "wrongNote": "アウトレットストアは在庫処分等を目的とした店舗、ポップアップストアは期間限定の店舗、アンテナショップは情報発信・テスト販売の拠点を指し、ブランドの世界観を体現する旗艦店はフラッグシップストアです。"}, {"id": 230, "question": "小売業者が独自に企画・販売する自主企画商品を何と呼ぶか。", "choices": ["PB", "NB", "OEMブランド", "ジェネリックブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "小売独自の企画商品。", "wrongNote": "NBはメーカーの全国的なブランド、OEMブランドは受託製造による別のブランド展開、ジェネリックブランドはノーブランドに近い廉価商品を指し、小売独自の企画商品はPBです。"}, {"id": 231, "question": "メーカーが全国的に展開する、広く知られたブランドを何と呼ぶか。", "choices": ["NB", "PB", "ローカルブランド", "コーポレートブランド"], "category": "マーケティング・販売", "correct": 0, "explanation": "メーカーの全国的ブランド。", "wrongNote": "PBは小売独自の企画商品、ローカルブランドは地域限定のブランド、コーポレートブランドは企業そのものを示すブランドを指し、メーカーが全国的に展開するブランドはNBです。"}, {"id": 232, "question": "小売店の店頭で消費者の購買を促すためにメーカーが行う販促活動を何と呼ぶか。", "choices": ["トレードマーケティング", "デジタルマーケティング", "リレーションシップマーケティング", "コーポレートマーケティング"], "category": "マーケティング・販売", "correct": 0, "explanation": "店頭での購買促進活動。", "wrongNote": "デジタルマーケティングはデジタル技術活用のマーケティング全般、コーポレートマーケティングは企業ブランド全体の訴求、リレーションシップマーケティングは関係構築全般を指し、店頭での購買促進活動はトレードマーケティングです。"}, {"id": 233, "question": "小売業者が保有する購買データや店舗媒体を活用した広告事業を何と呼ぶか。", "choices": ["リテールメディア", "オウンドメディア", "マスメディア", "トリプルメディア"], "category": "マーケティング・販売", "correct": 0, "explanation": "小売の購買データ・媒体を活用した広告。", "wrongNote": "マスメディアはテレビ・新聞等の媒体、トリプルメディアはペイド・オウンド・アーンドの総称、オウンドメディアは自社保有の情報発信媒体を指し、小売の購買データや店舗媒体を活用した広告事業はリテールメディアです。"}, {"id": 234, "question": "企業が顧客の継続利用や再来店を促すために設けるポイント制度などの仕組みを何と呼ぶか。", "choices": ["インセンティブプログラム", "パートナープログラム", "ロイヤルティプログラム", "アフィリエイトプログラム"], "category": "マーケティング・販売", "correct": 2, "explanation": "継続利用を促す仕組み。", "wrongNote": "アフィリエイトプログラムは成果報酬型広告の仕組み、パートナープログラムは提携企業向けの制度、インセンティブプログラムは主に従業員・販売員向けの制度を指し、顧客の継続利用を促す仕組みはロイヤルティプログラムです。"}, {"id": 235, "question": "サブスクリプションサービスなどにおいて、一定期間内に解約した顧客の割合を何と呼ぶか。", "choices": ["コンバージョン率", "アクティブ率", "チャーンレート", "リテンション率"], "category": "マーケティング・販売", "correct": 2, "explanation": "一定期間の解約率。", "wrongNote": "コンバージョン率は目的行動の達成率、リテンション率は継続利用率で解約率とは逆の視点、アクティブ率は利用中ユーザーの割合を指し、一定期間内の解約率を示すのはチャーンレートです。"}, {"id": 236, "question": "見込み顧客が認知から購入に至るまでの人数の絞り込みを、逆三角形で表したモデルを何と呼ぶか。", "choices": ["サプライチェーン", "プロダクトライフサイクル", "マーケティングファネル", "バリューチェーン"], "category": "マーケティング・販売", "correct": 2, "explanation": "認知から購入への絞り込みモデル。", "wrongNote": "バリューチェーンやサプライチェーンは企業側の活動連鎖、プロダクトライフサイクルは製品の段階変化を指し、認知から購入への絞り込みを逆三角形で表すのはマーケティングファネルです。"}, {"id": 237, "question": "消費者の購買行動を「注意・関心・欲求・記憶・行動」の順で説明する伝統的な購買行動モデルの略称はどれか。", "choices": ["AIDMA", "AISAS", "DAGMAR", "SIPS"], "category": "マーケティング・販売", "correct": 0, "explanation": "伝統的な購買行動モデル。", "wrongNote": "AISASはインターネット時代の購買行動モデル、SIPSはSNS時代の購買行動モデル、DAGMARは広告効果測定のモデルを指し、注意・関心・欲求・記憶・行動の順で説明する伝統的モデルはAIDMAです。"}, {"id": 238, "question": "インターネット時代の購買行動を「注意・関心・検索・行動・共有」の順で説明するモデルの略称はどれか。", "choices": ["RFM", "AIDMA", "STP", "AISAS"], "category": "マーケティング・販売", "correct": 3, "explanation": "インターネット時代の購買行動モデル。", "wrongNote": "AIDMAは伝統的な購買行動モデル、RFMは顧客分析の指標、STPは市場細分化の枠組みを指し、注意・関心・検索・行動・共有の順で説明するのはAISASです。"}, {"id": 239, "question": "オンラインとオフラインの購買体験の垣根をなくし、一体として顧客体験を設計する考え方を何と呼ぶか。", "choices": ["EC", "OMO", "POS", "O2O"], "category": "マーケティング・販売", "correct": 1, "explanation": "オンラインとオフラインを融合させる考え方。", "wrongNote": "O2Oはオンラインからオフラインへの送客を指す考え方、ECは電子商取引そのもの、POSは販売時点情報管理を指し、オンラインとオフラインを一体として捉える考え方はOMOです。"}, {"id": 240, "question": "インターネットやデジタル技術を活用したマーケティング活動全般を何と呼ぶか。", "choices": ["マスマーケティング", "ソーシャルマーケティング", "デジタルマーケティング", "ダイレクトマーケティング"], "category": "マーケティング・販売", "correct": 2, "explanation": "デジタル技術活用のマーケティング全般。", "wrongNote": "マスマーケティングは不特定多数への一律的な訴求、ダイレクトマーケティングは個別・直接的な訴求手法、ソーシャルマーケティングは社会的課題の解決を目的とした手法を指し、デジタル技術活用のマーケティング全般はデジタルマーケティングです。"}, {"id": 241, "question": "顧客ごとの属性や行動履歴に基づき、個別最適化した情報を提供する手法を何と呼ぶか。", "choices": ["セグメンテーション", "ターゲティング", "パーソナライゼーション", "ポジショニング"], "category": "マーケティング・販売", "correct": 2, "explanation": "個別最適化した情報提供。", "wrongNote": "セグメンテーションは市場細分化、ポジショニングは自社の立ち位置の明確化、ターゲティングは狙う市場の選定を指し、顧客ごとに個別最適化した情報提供はパーソナライゼーションです。"}, {"id": 242, "question": "ブランドイメージや事業内容の変化に合わせて、ブランドの再構築を行うことを何と呼ぶか。", "choices": ["リストラクチャリング", "リブランディング", "リストラ", "リエンジニアリング"], "category": "マーケティング・販売", "correct": 1, "explanation": "ブランドの再構築。", "wrongNote": "リストラクチャリングは事業の再構築、リエンジニアリングは業務プロセスの抜本的見直し、リストラは人員整理を指す俗称であり、ブランドの再構築を指すのはリブランディングです。"}, {"id": 243, "question": "小売店のレジで販売時点の商品情報・売上情報を記録するシステムを何と呼ぶか。", "choices": ["CRMシステム", "SCMシステム", "POSシステム", "ERPシステム"], "category": "マーケティング・販売", "correct": 2, "explanation": "販売時点情報管理システム。", "wrongNote": "CRMシステムは顧客関係管理システム、SCMシステムは供給網管理システム、ERPシステムは統合基幹業務システムを指し、レジでの販売時点情報を記録するのはPOSシステムです。"}, {"id": 244, "question": "消費者が商品・サービスを選択・購入する一連の心理的・行動的プロセスを研究する分野を何と呼ぶか。", "choices": ["消費者行動論", "労働経済学", "経営組織論", "財務会計論"], "category": "マーケティング・販売", "correct": 0, "explanation": "購買の心理・行動プロセスの研究。", "wrongNote": "経営組織論は組織構造・行動の研究、財務会計論は財務諸表や会計処理の研究、労働経済学は労働市場の研究を指し、消費者の選択・購入プロセスを研究する分野は消費者行動論です。"}, {"id": 245, "question": "環境や社会に配慮した消費行動を何と呼ぶか。", "choices": ["見栄消費", "エシカル消費", "衝動消費", "代理消費"], "category": "マーケティング・販売", "correct": 1, "explanation": "環境・社会に配慮した消費行動。", "wrongNote": "衝動消費は計画性のない消費行動、見栄消費は他者の目を意識した消費、代理消費は他者のために行う消費を指し、環境や社会に配慮した消費行動はエシカル消費です。"}, {"id": 246, "question": "訪日外国人による消費が、モノの購入中心から体験型の消費へとシフトしている傾向を何と呼ぶか。", "choices": ["アウトバウンド消費の拡大", "インバウンド消費の消滅", "コト消費からモノ消費へのシフト", "モノ消費からコト消費へのシフト"], "category": "マーケティング・販売", "correct": 3, "explanation": "近年のインバウンド消費の傾向。", "wrongNote": "実際にはコト消費からモノ消費への逆行や消費の消滅が起きているわけではなく、日本人の海外消費であるアウトバウンド消費とも異なる、モノ消費からコト消費へのシフトが指摘されています。"}, {"id": 247, "question": "商品やサービスに関する消費者同士の情報共有・評判の広がりを活用したマーケティング手法を何と呼ぶか。", "choices": ["プッシュ型マーケティング", "マスマーケティング", "B2Bマーケティング", "クチコミマーケティング"], "category": "マーケティング・販売", "correct": 3, "explanation": "消費者間の情報共有を活用。", "wrongNote": "マスマーケティングは不特定多数への一律的な訴求、プッシュ型マーケティングは企業側からの一方的な発信、B2Bマーケティングは企業間取引向けの手法を指し、消費者同士の情報共有を活用するのはクチコミマーケティングです。"}, {"id": 248, "question": "広告・販売促進・人的販売・パブリシティなどを組み合わせた企業のコミュニケーション施策全体を何と呼ぶか。", "choices": ["プロダクトミックス", "プライスミックス", "プロモーションミックス", "プレイスミックス"], "category": "マーケティング・販売", "correct": 2, "explanation": "広告・販促等の組み合わせ。", "wrongNote": "プロダクトミックスは製品ラインの組み合わせを指す言葉であり、プライスミックスやプレイスミックスは一般的な用語として定着しておらず、広告・販促等を組み合わせたコミュニケーション施策全体はプロモーションミックスです。"}, {"id": 249, "question": "日本における伝統的な「4大マスメディア」に含まれないものはどれか。", "choices": ["ラジオ", "SNS", "テレビ", "新聞"], "category": "マーケティング・販売", "correct": 1, "explanation": "伝統的な4大マスメディアはテレビ・新聞・ラジオ・雑誌。", "wrongNote": "テレビ・新聞・ラジオは伝統的な4大マスメディアの構成要素（残る一つは雑誌）であり、SNSはインターネット時代の比較的新しいメディアです。"}, {"id": 250, "question": "広告であることを明示しつつ、掲載媒体のコンテンツと自然になじむ形式で配信される広告を何と呼ぶか。", "choices": ["バナー広告", "純広告", "マス広告", "ネイティブ広告"], "category": "マーケティング・販売", "correct": 3, "explanation": "コンテンツに自然になじむ広告形式。  --- # 第6章：生産・テクノロジー（Q251〜Q300）", "wrongNote": "バナー広告は画像形式の表示型広告、純広告は掲載枠を買い切る形式の広告、マス広告はテレビ・新聞等の広告全般を指し、コンテンツに自然になじむ形式で配信されるのはネイティブ広告です。"}, {"id": 251, "question": "トヨタ自動車が確立した、必要なものを必要な時に必要な量だけ生産する仕組みを何と呼ぶか。", "choices": ["大量生産方式", "ジャストインタイム方式", "見込み生産方式", "受注生産方式"], "category": "生産・テクノロジー", "correct": 1, "explanation": "必要な物を必要な時に必要な量だけ生産。", "wrongNote": "大量生産方式は画一的な大量製造を指す考え方、見込み生産方式は需要予測に基づく生産、受注生産方式は注文を受けてから生産を開始する方式であり、必要な時に必要な量だけ生産する仕組みはジャストインタイム方式です。"}, {"id": 252, "question": "生産ラインで異常が発生した際に自動的に機械を止める仕組みを、トヨタ生産方式では何と呼ぶか。", "choices": ["自働化", "平準化", "標準化", "見える化"], "category": "生産・テクノロジー", "correct": 0, "explanation": "異常時に機械が自動停止する仕組み。", "wrongNote": "標準化は作業手順の統一、平準化は生産量・種類の均一化、見える化は状況を可視化する取り組みを指し、異常発生時に機械を自動停止させる仕組みは自働化です。"}, {"id": 253, "question": "後工程が前工程に必要な部品の種類・数量を伝える指示票を用いた生産管理手法を何と呼ぶか。", "choices": ["カンバン方式", "POSシステム", "SCMシステム", "ERPシステム"], "category": "生産・テクノロジー", "correct": 0, "explanation": "後工程から前工程への指示票を用いる。", "wrongNote": "POSシステムは販売時点の情報管理、ERPシステムは統合基幹業務システム、SCMシステムは供給網管理システムを指し、指示票を用いて必要な部品を伝える生産管理手法はカンバン方式です。"}, {"id": 254, "question": "業務プロセスを継続的に改善するための「計画・実行・評価・改善」のサイクルを何と呼ぶか。", "choices": ["QCDサイクル", "PDCAサイクル", "KGIサイクル", "SDGsサイクル"], "category": "生産・テクノロジー", "correct": 1, "explanation": "計画・実行・評価・改善の継続的改善サイクル。", "wrongNote": "QCD（品質・コスト・納期）は管理の視点であり循環サイクルとして一般的に呼ばれるものではなく、SDGsサイクルやKGIサイクルも一般的な用語ではないため、計画・実行・評価・改善のサイクルはPDCAサイクルと呼ばれます。"}, {"id": 255, "question": "現場の従業員が小集団で品質改善活動を自主的に行う取り組みを何と呼ぶか。", "choices": ["プロジェクトチーム", "タスクフォース", "コミッティ", "QCサークル"], "category": "生産・テクノロジー", "correct": 3, "explanation": "現場主導の品質改善活動。", "wrongNote": "プロジェクトチームやタスクフォースは特定課題に対応する一時的な組織、コミッティは委員会組織を指し、現場の小集団による自主的な品質改善活動はQCサークルです。"}, {"id": 256, "question": "発注から納品までにかかる時間を何と呼ぶか。", "choices": ["サイクルタイム", "リードタイム", "ダウンタイム", "タクトタイム"], "category": "生産・テクノロジー", "correct": 1, "explanation": "発注から納品までの時間。", "wrongNote": "サイクルタイムは1単位を生産するのにかかる時間、タクトタイムは生産ラインの目標周期時間、ダウンタイムは機械が停止している時間を指し、発注から納品までの時間はリードタイムです。"}, {"id": 257, "question": "投入した原材料のうち、良品として完成した割合を何と呼ぶか。", "choices": ["良品率とは無関係な指標", "生産性", "歩留まり", "稼働率"], "category": "生産・テクノロジー", "correct": 2, "explanation": "投入量に対する良品の割合。", "wrongNote": "稼働率は設備が実際に稼働している割合、生産性は投入資源に対する産出の効率を示す指標であり、投入量に対する良品の割合は歩留まりです。"}, {"id": 258, "question": "製品の設計・製造工程を自社で保有せず、他社に製造を委託する事業形態を何と呼ぶか。", "choices": ["インテグレーテッド・デバイス・メーカー", "垂直統合型メーカー", "コングロマリット", "ファブレス"], "category": "生産・テクノロジー", "correct": 3, "explanation": "製造工程を自社で持たない事業形態。", "wrongNote": "インテグレーテッド・デバイス・メーカーや垂直統合型メーカーは自社内で設計から製造まで一貫して行う企業、コングロマリットは異業種を傘下に持つ複合企業を指し、製造工程を自社で持たない事業形態はファブレスです。"}, {"id": 259, "question": "電子機器の製造を専門に受託する企業を何と呼ぶか。", "choices": ["EMS", "SI", "VC", "ISP"], "category": "生産・テクノロジー", "correct": 0, "explanation": "電子機器の受託製造サービス。", "wrongNote": "VCはベンチャーキャピタル、SIはシステムインテグレーター、ISPはインターネット接続業者を指し、電子機器の受託製造を専門とする企業はEMSです。"}, {"id": 260, "question": "半導体製造工程のうち、シリコンウエハーに回路を形成する工程を何と呼ぶか。", "choices": ["後工程", "出荷工程", "前工程", "検査工程のみ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "ウエハーへの回路形成工程。", "wrongNote": "後工程は切断やパッケージングを行う工程、検査工程や出荷工程はより限定的な範囲を指し、ウエハーに回路を形成する工程は前工程です。"}, {"id": 261, "question": "半導体製造工程のうち、ウエハーを切り分けてパッケージに封入する工程を何と呼ぶか。", "choices": ["後工程", "前工程", "R&D工程", "設計工程"], "category": "生産・テクノロジー", "correct": 0, "explanation": "切断・パッケージング工程。", "wrongNote": "前工程は回路を形成する工程、設計工程やR&D工程は製造前段階の工程を指し、ウエハーの切断・パッケージングは後工程です。"}, {"id": 262, "question": "IoTセンサーやAIを活用し、生産効率を高めた工場を何と呼ぶか。", "choices": ["レガシーファクトリー", "アウトソース工場", "スマートファクトリー", "OEM工場"], "category": "生産・テクノロジー", "correct": 2, "explanation": "IoT・AI活用で効率化した工場。", "wrongNote": "レガシーファクトリーは旧来型の工場を指す対比語、アウトソース工場やOEM工場は外部委託先を指す言葉であり、IoT・AIを活用し効率化した工場はスマートファクトリーです。"}, {"id": 263, "question": "デジタル技術を活用してビジネスモデルや組織そのものを変革する取り組みを何と呼ぶか。", "choices": ["BPR", "DX", "ERP", "TQM"], "category": "生産・テクノロジー", "correct": 1, "explanation": "デジタル技術によるビジネス変革。", "wrongNote": "BPRは業務プロセスの再設計、TQMは総合的品質管理、ERPは統合基幹業務システムを指し、デジタル技術によるビジネスモデル・組織の変革はDXです。"}, {"id": 264, "question": "人間の学習能力を模した仕組みで、大量のデータからパターンを学習するAI技術を何と呼ぶか。", "choices": ["リレーショナルデータベース", "クラウドコンピューティング", "機械学習", "エッジコンピューティング"], "category": "生産・テクノロジー", "correct": 2, "explanation": "データからパターンを学習するAI技術。", "wrongNote": "リレーショナルデータベースはデータ管理の仕組み、クラウドコンピューティングは計算資源の提供形態、エッジコンピューティングは端末側での処理形態を指し、データからパターンを学習するAI技術は機械学習です。"}, {"id": 265, "question": "多層のニューラルネットワークを用いて高度な特徴抽出を行う機械学習の一分野を何と呼ぶか。", "choices": ["ウォーターフォール開発", "ディープラーニング", "アジャイル開発", "リグレッションテスト"], "category": "生産・テクノロジー", "correct": 1, "explanation": "多層ニューラルネットワークを用いる手法。", "wrongNote": "リグレッションテストはソフトウェアの回帰テスト、ウォーターフォール開発やアジャイル開発は開発手法の分類を指し、多層ニューラルネットワークを用いる機械学習の一分野はディープラーニングです。"}, {"id": 266, "question": "テキストや画像などのコンテンツを新たに生成できるAIを何と呼ぶか。", "choices": ["RPA", "OCR", "ERP", "生成AI"], "category": "生産・テクノロジー", "correct": 3, "explanation": "新たなコンテンツを生成できるAI。", "wrongNote": "RPAは定型業務を自動化するツール、OCRは文字認識技術、ERPは統合基幹業務システムを指し、新たなコンテンツを生成できるAIは生成AIです。"}, {"id": 267, "question": "インターネット経由でサーバーやストレージなどの計算資源を必要な分だけ利用できる仕組みを何と呼ぶか。", "choices": ["クラウドコンピューティング", "オンプレミス", "スタンドアロン", "メインフレーム"], "category": "生産・テクノロジー", "correct": 0, "explanation": "計算資源をネット経由で利用。", "wrongNote": "オンプレミスは自社内に設備を保有する形態、メインフレームは大型汎用コンピューター、スタンドアロンはネットワークに接続しない単独稼働形態を指し、計算資源をネット経由で利用する仕組みはクラウドコンピューティングです。"}, {"id": 268, "question": "従来のデータベースでは扱いきれないほど大量かつ多様なデータを何と呼ぶか。", "choices": ["メタデータ", "スモールデータ", "ビッグデータ", "マスターデータ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "大量かつ多様なデータ。", "wrongNote": "スモールデータは少量の限定的なデータ、メタデータはデータに関する付随情報、マスターデータは基幹となる基礎データを指し、従来のデータベースでは扱いきれない大量多様なデータはビッグデータです。"}, {"id": 269, "question": "現行の4Gに比べ、高速大容量・低遅延・多数同時接続を特徴とする移動通信規格を何と呼ぶか。", "choices": ["5G", "Wi-Fi 6", "NFC", "Bluetooth"], "category": "生産・テクノロジー", "correct": 0, "explanation": "高速・大容量・低遅延・多接続が特徴。", "wrongNote": "Wi-Fi 6は無線LANの規格、Bluetoothは近距離無線通信の規格、NFCは近接無線通信の規格を指し、高速大容量・低遅延・多数同時接続を特徴とする移動通信規格は5Gです。"}, {"id": 270, "question": "完全自動運転を指す、自動運転レベル分類における最高段階はどれか。", "choices": ["レベル5", "レベル1", "レベル3", "レベル2"], "category": "生産・テクノロジー", "correct": 0, "explanation": "完全自動運転の段階。", "wrongNote": "レベル1は運転支援の初期段階、レベル2は部分的な自動運転、レベル3は条件付き自動運転を指し、完全自動運転を意味する最高段階はレベル5です。"}, {"id": 271, "question": "太陽光や風力など、資源が枯渇しないエネルギー源を何と呼ぶか。", "choices": ["化石エネルギー", "原子力エネルギー", "再生可能エネルギー", "非再生エネルギー"], "category": "生産・テクノロジー", "correct": 2, "explanation": "太陽光・風力など枯渇しないエネルギー。", "wrongNote": "化石エネルギーは枯渇性のエネルギー、原子力エネルギーはウラン等を用いるエネルギー、非再生エネルギーはむしろ枯渇性エネルギーを指す総称であり、資源が枯渇しないエネルギー源は再生可能エネルギーです。"}, {"id": 272, "question": "電気を化学エネルギーなどの形で蓄え、必要な時に取り出せる装置を何と呼ぶか。", "choices": ["蓄電池", "コンデンサー", "トランス", "インバーター"], "category": "生産・テクノロジー", "correct": 0, "explanation": "電気を蓄え必要時に取り出す装置。", "wrongNote": "コンデンサーは電荷を蓄える電子部品、トランスは電圧を変換する機器、インバーターは直流と交流を変換する機器を指し、電気を化学エネルギー等の形で蓄える装置は蓄電池です。"}, {"id": 273, "question": "燃焼させても水しか生成しないクリーンなエネルギー源として注目される元素を用いたエネルギーを何と呼ぶか。", "choices": ["石炭エネルギー", "バイオマスエネルギー", "水素エネルギー", "天然ガスエネルギー"], "category": "生産・テクノロジー", "correct": 2, "explanation": "燃焼時に水のみ生成するクリーンエネルギー。", "wrongNote": "石炭エネルギーや天然ガスエネルギーは化石燃料由来のエネルギー、バイオマスエネルギーは生物由来資源のエネルギーを指し、燃焼させても水しか生成しないクリーンなエネルギー源は水素エネルギーです。"}, {"id": 274, "question": "廃棄物を出さず資源を循環させ続ける経済モデルを何と呼ぶか。", "choices": ["ギグエコノミー", "サーキュラーエコノミー", "シェアリングエコノミー", "リニアエコノミー"], "category": "生産・テクノロジー", "correct": 1, "explanation": "資源循環型の経済モデル。", "wrongNote": "リニアエコノミーは資源を使い捨てる従来型の経済、シェアリングエコノミーは資産等を共有する経済、ギグエコノミーは単発の仕事を請け負う働き方を指し、資源を循環させ続ける経済モデルはサーキュラーエコノミーです。"}, {"id": 275, "question": "3次元のデジタルデータをもとに、材料を積層して立体物を造形する技術を何と呼ぶか。", "choices": ["CNC加工", "3Dプリンティング", "プレス加工", "射出成形"], "category": "生産・テクノロジー", "correct": 1, "explanation": "材料の積層による造形技術。", "wrongNote": "CNC加工は数値制御による切削加工、射出成形は金型に材料を流し込む成形法、プレス加工は金属板等を型で成形する加工法を指し、材料を積層して造形する技術は3Dプリンティングです。"}, {"id": 276, "question": "地政学リスクの高まりにより、特定国・地域への依存を減らし供給網を分散させる動きを何と呼ぶか。", "choices": ["サプライチェーンの多元化", "サプライチェーンの廃止", "サプライチェーンの国有化", "サプライチェーンの一極集中化"], "category": "生産・テクノロジー", "correct": 0, "explanation": "地政学リスクへの対応策。", "wrongNote": "供給網の一極集中化はむしろ逆方向の動きであり、供給網自体の廃止や国有化が進んでいるわけでもなく、特定国への依存を減らし分散させる動きはサプライチェーンの多元化です。"}, {"id": 277, "question": "電気のみを動力源とし、内燃機関を搭載しない自動車を何と呼ぶか。", "choices": ["FCV", "HV", "BEV", "PHV"], "category": "生産・テクノロジー", "correct": 2, "explanation": "内燃機関を持たない電気自動車。", "wrongNote": "HVはエンジンとモーターを併用する車、PHVは外部充電可能なハイブリッド車、FCVは水素を用いる燃料電池車を指し、電気のみを動力源とする車はBEVです。"}, {"id": 278, "question": "ガソリンエンジンと電気モーターを組み合わせた自動車を何と呼ぶか。", "choices": ["FCV", "BEV", "HV", "ICEのみ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "エンジンとモーターを組み合わせた車。", "wrongNote": "BEVは電気のみを動力源とする車、FCVは水素を用いる燃料電池車、内燃機関のみの車はエンジンだけで走る従来車を指し、エンジンとモーターを組み合わせた車はHVです。"}, {"id": 279, "question": "人手に頼っていた作業を機械やソフトウェアに置き換え、効率化を図ることを何と呼ぶか。", "choices": ["オートメーション", "カーブアウト", "アウトソーシング", "インソーシング"], "category": "生産・テクノロジー", "correct": 0, "explanation": "機械・ソフトウェアによる作業の置き換え。", "wrongNote": "アウトソーシングは業務の外部委託、インソーシングは内製化、カーブアウトは事業の切り出しを指し、人手作業を機械やソフトウェアに置き換えることはオートメーションです。"}, {"id": 280, "question": "工場のロボット導入時に、機械の選定・設置・稼働までを一括して請け負う専門業者を何と呼ぶか。", "choices": ["EMS", "ロボットSIer", "サプライヤー", "ファブレス企業"], "category": "生産・テクノロジー", "correct": 1, "explanation": "ロボット導入を一括で請け負う専門業者。", "wrongNote": "EMSは電子機器の受託製造企業、ファブレス企業は製造工程を持たない企業、サプライヤーは部品・材料の供給企業を指し、ロボット導入を一括で請け負う専門業者はロボットSIerです。"}, {"id": 281, "question": "現実の設備や製品をデジタル空間上に再現し、シミュレーションに活用する技術を何と呼ぶか。", "choices": ["デジタルツイン", "拡張現実のみ", "メタデータ管理", "バーチャルリアリティのみ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "現実設備をデジタル空間上に再現。", "wrongNote": "バーチャルリアリティや拡張現実は仮想体験の技術そのものを指す言葉であり、メタデータ管理はデータの付随情報管理を指すため、現実設備をデジタル空間上に再現しシミュレーションに使う技術はデジタルツインです。"}, {"id": 282, "question": "コンピューターシステムやネットワークを不正アクセスや攻撃から守る取り組みを何と呼ぶか。", "choices": ["サイバーセキュリティ", "ペネトレーションテスト", "クラウドファースト", "VPN構築"], "category": "生産・テクノロジー", "correct": 0, "explanation": "不正アクセス等からシステムを守る取り組み。", "wrongNote": "クラウドファーストはシステム導入の方針、ペネトレーションテストは疑似攻撃によるぜい弱性診断の手法、VPN構築は対策の一つの手段であり、不正アクセス等からシステムを守る取り組み全体を指すのはサイバーセキュリティです。"}, {"id": 283, "question": "インターネット経由でソフトウェアを利用できるサービス提供形態を何と呼ぶか。", "choices": ["IaaS", "DaaS", "PaaS", "SaaS"], "category": "生産・テクノロジー", "correct": 3, "explanation": "ソフトウェアをネット経由で利用するサービス。", "wrongNote": "PaaSは開発基盤の提供、IaaSはインフラの提供、DaaSはデスクトップ環境の提供を指すサービス形態であり、ソフトウェアをネット経由で提供する形態はSaaSです。"}, {"id": 284, "question": "インターネット経由でアプリケーション開発・実行のための基盤環境を提供するサービス形態を何と呼ぶか。", "choices": ["PaaS", "FaaS", "SaaS", "IaaS"], "category": "生産・テクノロジー", "correct": 0, "explanation": "アプリ開発・実行基盤の提供サービス。", "wrongNote": "SaaSはソフトウェアの提供、IaaSはインフラの提供、FaaSは関数単位の実行環境提供を指すサービス形態であり、開発・実行基盤を提供する形態はPaaSです。"}, {"id": 285, "question": "サーバーやネットワークなどのITインフラをインターネット経由で提供するサービス形態を何と呼ぶか。", "choices": ["PaaS", "BaaS", "SaaS", "IaaS"], "category": "生産・テクノロジー", "correct": 3, "explanation": "ITインフラの提供サービス。", "wrongNote": "SaaSはソフトウェアの提供、PaaSは開発基盤の提供、BaaSはバックエンド機能の提供を指すサービス形態であり、ITインフラを提供する形態はIaaSです。"}, {"id": 286, "question": "自社の技術やアイデアだけでなく、社外の技術・知見を積極的に取り込んで革新を生み出す考え方を何と呼ぶか。", "choices": ["リバースイノベーション", "オープンイノベーション", "クローズドイノベーション", "インクリメンタルイノベーション"], "category": "生産・テクノロジー", "correct": 1, "explanation": "社外の技術・知見を取り込む考え方。", "wrongNote": "クローズドイノベーションは自社内で完結させる革新、リバースイノベーションは新興国発の技術が広がる現象、インクリメンタルイノベーションは漸進的な改良を指し、社外の技術・知見を取り込む考え方はオープンイノベーションです。"}, {"id": 287, "question": "企業が新製品・新技術の創出のために行う研究開発活動の略称はどれか。", "choices": ["R&D", "PMI", "IPO", "M&A"], "category": "生産・テクノロジー", "correct": 0, "explanation": "研究開発（Research and Development）。", "wrongNote": "M&Aは合併・買収、IPOは新規株式公開、PMIは統合プロセスを指す略称であり、研究開発活動を指す略称はR&Dです。"}, {"id": 288, "question": "プログラミングの専門知識がなくてもアプリケーションを開発できる開発手法を何と呼ぶか。", "choices": ["ノーコード／ローコード開発", "ウォーターフォール開発", "スクラッチ開発", "オフショア開発"], "category": "生産・テクノロジー", "correct": 0, "explanation": "専門知識不要の開発手法。", "wrongNote": "ウォーターフォール開発は工程を順に進める従来型の開発手法、スクラッチ開発はゼロからのプログラミング、オフショア開発は海外への開発委託を指し、専門知識不要で開発できる手法はノーコード／ローコード開発です。"}, {"id": 289, "question": "インターネット上に構築された、アバターを介して活動できる仮想空間を何と呼ぶか。", "choices": ["エクストラネット", "イントラネット", "ダークウェブ", "メタバース"], "category": "生産・テクノロジー", "correct": 3, "explanation": "アバターを介した仮想空間。", "wrongNote": "イントラネットは組織内のネットワーク、エクストラネットは組織間を結ぶネットワーク、ダークウェブは匿名性の高い特殊なネットワーク領域を指し、アバターを介した仮想空間はメタバースです。"}, {"id": 290, "question": "取引履歴を分散した複数のコンピューターで共有・検証し、改ざんを困難にする技術を何と呼ぶか。", "choices": ["ブロックチェーン", "VPN", "ファイアウォール", "クラウドストレージ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "分散台帳による改ざん耐性技術。", "wrongNote": "クラウドストレージはデータ保存サービス、VPNは仮想的な専用通信網、ファイアウォールは不正アクセスを防ぐ仕組みを指し、分散して取引履歴を共有・検証する技術はブロックチェーンです。"}, {"id": 291, "question": "従来のコンピューターでは膨大な時間がかかる計算を、量子力学の原理を用いて高速に処理する次世代コンピューターを何と呼ぶか。", "choices": ["スーパーコンピュータ", "メインフレーム", "量子コンピュータ", "アナログコンピュータ"], "category": "生産・テクノロジー", "correct": 2, "explanation": "量子力学を応用した次世代コンピューター。", "wrongNote": "スーパーコンピュータは従来型の原理に基づく高性能計算機、メインフレームは大型汎用コンピューター、アナログコンピュータは連続量を扱う旧来の計算機を指し、量子力学の原理を用いる次世代コンピューターは量子コンピュータです。"}, {"id": 292, "question": "遠隔操作や自律飛行が可能な、空撮や物流などに活用される無人航空機を何と呼ぶか。", "choices": ["VTOL機", "ドローン", "AMR", "AGV"], "category": "生産・テクノロジー", "correct": 1, "explanation": "遠隔・自律飛行が可能な無人航空機。", "wrongNote": "AGVやAMRは主に地上を自律走行する搬送機器、VTOL機は垂直離着陸が可能な航空機を指す別の概念であり、遠隔操作や自律飛行が可能な無人航空機を指す一般的な呼称はドローンです。"}, {"id": 293, "question": "半導体の回路線幅を微細化することで得られる一般的なメリットとして正しいものはどれか。", "choices": ["製造コストが必ず下がる", "処理性能の向上と消費電力の低減", "チップサイズが必ず大きくなる", "発熱量が必ず増加する"], "category": "生産・テクノロジー", "correct": 1, "explanation": "微細化の一般的メリット。", "wrongNote": "微細化によって製造コストが必ず下がる、発熱量が必ず増加する、チップサイズが必ず大きくなるとは限らず、一般的なメリットとして処理性能の向上と消費電力の低減が挙げられます。"}, {"id": 294, "question": "世界最大級の半導体受託製造企業として知られる台湾の企業はどれか。", "choices": ["サムスン電子", "インテル", "TSMC", "クアルコム"], "category": "生産・テクノロジー", "correct": 2, "explanation": "世界最大級の半導体ファウンドリー。", "wrongNote": "サムスン電子は自社製品も手がける総合半導体企業、インテルは自社設計製造中心の企業、クアルコムは設計中心のファブレス企業を指し、受託製造専門で世界最大級とされるのはTSMCです。"}, {"id": 295, "question": "工場やオフィスにおいて、機械化・自動化により従業員一人当たりの産出量を高めることを何と呼ぶか。", "choices": ["稼働率低下", "リードタイム延長", "生産性低下", "生産性向上"], "category": "生産・テクノロジー", "correct": 3, "explanation": "一人当たり産出量の向上。", "wrongNote": "生産性の低下や稼働率の低下、リードタイムの延長はいずれも効率化とは逆方向の変化であり、機械化・自動化による産出量向上を指すのは生産性向上です。"}, {"id": 296, "question": "ITを活用して電力の需給を最適に制御する次世代の送配電網を何と呼ぶか。", "choices": ["スマートグリッド", "スーパーグリッド", "デジタルグリッド", "マイクログリッド"], "category": "生産・テクノロジー", "correct": 0, "explanation": "ITで電力需給を最適制御する送配電網。", "wrongNote": "マイクログリッドは局所的な電力網、スーパーグリッドは広域を結ぶ送電網、デジタルグリッドは特定の技術方式を指す関連概念であり、ITで電力需給全体を最適制御する次世代送配電網はスマートグリッドです。"}, {"id": 297, "question": "工程能力や品質のばらつきを統計的に管理し、不良品の発生を抑える手法の総称を何と呼ぶか。", "choices": ["統計的品質管理", "人事評価制度", "財務会計", "マーケティングリサーチ"], "category": "生産・テクノロジー", "correct": 0, "explanation": "ばらつきを統計的に管理する手法。", "wrongNote": "財務会計やマーケティングリサーチ、人事評価制度はいずれも品質管理とは異なる分野であり、工程能力や品質のばらつきを統計的に管理する手法は統計的品質管理（SQC）です。"}, {"id": 298, "question": "製造業において、需要変動に応じて生産計画を柔軟に組み替える能力を何と呼ぶか。", "choices": ["ロット生産の廃止", "固定生産方式", "生産の柔軟性", "需要無視の生産方式"], "category": "生産・テクノロジー", "correct": 2, "explanation": "需要変動への対応力。", "wrongNote": "固定生産方式は生産計画を変えない方式、ロット生産の廃止は特定の生産方式を否定する話、需要無視の生産方式は非現実的な選択肢であり、需要変動に応じて計画を柔軟に組み替える能力は生産の柔軟性です。"}, {"id": 299, "question": "複数の工程を経て製品が完成するまでの、工場内での物の流れ全体を管理する考え方を何と呼ぶか。", "choices": ["労務管理のみ", "生産管理", "株主管理", "財務管理"], "category": "生産・テクノロジー", "correct": 1, "explanation": "工程全体の物の流れを管理する考え方。", "wrongNote": "財務管理は資金に関する管理、労務管理のみでは範囲が限定的、株主管理は株主対応に関する業務を指し、工場内での物の流れ全体を管理する考え方は生産管理です。"}, {"id": 300, "question": "AIやロボットの活用が進む中で、人間にしかできない創造的・対人的業務へのシフトが求められている労働市場の変化を何と呼ぶか。", "choices": ["賃金の一律引き上げ", "労働時間の完全撤廃", "労働のシフト", "完全失業"], "category": "生産・テクノロジー", "correct": 2, "explanation": "創造的・対人的業務への人材シフトが求められている。", "wrongNote": "完全失業という極端な状態や、賃金の一律引き上げ、労働時間の完全撤廃が直接的な帰結として求められているわけではなく、創造的・対人的業務への人材シフトが指摘されています。"}, {"category": "経営環境", "question": "日経TESTの入門解説にあるたとえで、GDPは企業の会計でいう何の合計に相当するとされているか。", "choices": ["当期純利益", "売上高", "粗利（売上総利益）", "営業利益"], "correct": 2, "explanation": "会社の粗利（付加価値）の国全体の合計がGDPに相当するとされる。", "wrongNote": "売上高はコストを差し引く前の総額、営業利益や当期純利益はさらに費用を差し引いた段階の利益であり、付加価値の合計として対応するのは粗利です。", "id": 301}, {"category": "経営環境", "question": "会社の粗利のうち、人件費に回される割合を示す指標を何と呼ぶか。", "choices": ["自己資本比率", "配当性向", "付加価値率", "労働分配率"], "correct": 3, "explanation": "粗利（付加価値）に占める人件費の割合を示す。", "wrongNote": "自己資本比率は財務の安全性指標、配当性向は利益に占める配当の割合、付加価値率は売上高に占める付加価値の割合であり、粗利のうち人件費に回る割合を示すのは労働分配率です。", "id": 302}, {"category": "経営環境", "question": "社会保険料のうち、会社が負担する分を計上する費用項目を何と呼ぶか。", "choices": ["福利厚生費", "法定福利費", "租税公課", "雑給"], "correct": 1, "explanation": "社会保険料の会社負担分は法定福利費として計上される。", "wrongNote": "福利厚生費は法定外の任意の福利厚生に関する費用、雑給は臨時雇用者への給与、租税公課は税金や公的な手数料を指し、社会保険料の会社負担分は法定福利費に区分されます。", "id": 303}, {"category": "経営環境", "question": "パートで働く配偶者の年収が一定額を超えると社会保険料の負担が生じ、手取りが急に減る現象を指して近年議論されている問題を何と呼ぶか。", "choices": ["逆進性問題", "扶養控除ギャップ", "年収の壁", "103万円ショック"], "correct": 2, "explanation": "一定の年収を境に社会保険料負担が生じ手取りが減る現象が「年収の壁」として議論されている。", "wrongNote": "103万円ショックや扶養控除ギャップ、逆進性問題という呼称は一般的ではなく、この問題は「年収の壁」という呼び方で広く議論されています。", "id": 304}, {"category": "経営環境", "question": "米国経済の状況を理解するうえで、最近特に注目されている代表的な経済指標の組み合わせとして正しいものはどれか。", "choices": ["貿易収支", "雇用統計と政策金利（FF金利）", "不動産価格指数", "消費者信頼感指数"], "correct": 1, "explanation": "米国経済は雇用と金利の動向が景気判断の勘どころとされる。", "wrongNote": "不動産価格や貿易収支、消費者信頼感指数も参考指標にはなりますが、米国経済理解の勘どころとして特に重視されるのは雇用統計と政策金利の動向です。", "id": 305}, {"category": "経営環境", "question": "中国経済の現状を理解するうえで、近年特に重視されているポイントはどれか。", "choices": ["農業生産高", "観光収支", "不動産市場の動向", "為替相場の変動"], "correct": 2, "explanation": "不動産市場の低迷が中国経済の重要な論点とされている。", "wrongNote": "為替相場や農業生産高、観光収支も経済指標の一部ではありますが、中国経済理解の勘どころとして特に重視されているのは不動産市場の動向です。", "id": 306}, {"category": "経営環境", "question": "欧州経済の金融政策を担う中央銀行の略称として正しいものはどれか。", "choices": ["FRB", "PBOC", "BOE", "ECB"], "correct": 3, "explanation": "欧州中央銀行（ECB）がユーロ圏の金融政策を担う。", "wrongNote": "FRBは米国、BOEは英国、PBOCは中国の中央銀行を指し、ユーロ圏の金融政策を担うのはECBです。", "id": 307}, {"category": "経営環境", "question": "東南アジア諸国連合の略称として正しいものはどれか。", "choices": ["BRICS", "ASEAN", "OECD", "APEC"], "correct": 1, "explanation": "東南アジア10カ国の地域協力機構はASEANと呼ばれる。", "wrongNote": "APECはアジア太平洋地域の経済協力の枠組み、OECDは主に先進国の経済協力機構、BRICSは新興国のグループを指し、東南アジアの地域機構はASEANです。", "id": 308}, {"category": "経営環境", "question": "インドやアフリカ諸国など、今後の成長が期待される新興・途上国全体を指して近年使われる呼称はどれか。", "choices": ["先進7カ国", "新興先進国", "グローバルサウス", "第一世界"], "correct": 2, "explanation": "南半球を中心とした新興・途上国全体を指す呼称としてグローバルサウスが用いられる。", "wrongNote": "先進7カ国はG7を指す言葉、新興先進国や第一世界という呼称は一般的ではなく、新興・途上国全体を指す近年の呼称はグローバルサウスです。", "id": 309}, {"category": "経営環境", "question": "人口の規模について、近年インドが中国を上回り世界一となったとされる分野はどれか。", "choices": ["国土面積", "国防予算", "GDP総額", "総人口"], "correct": 3, "explanation": "インドの総人口が中国を上回り世界最多になったとされる。", "wrongNote": "国土面積やGDP総額、国防予算では依然として中国が上回っており、インドが世界一となったのは総人口です。", "id": 310}, {"category": "経営環境", "question": "アフリカ大陸の経済的なポテンシャルとして近年注目されている要因はどれか。", "choices": ["製造業の完全な空洞化", "若年層を中心とした人口の増加", "人口の急速な減少", "資源価格の恒常的な下落"], "correct": 1, "explanation": "若年人口の多さがアフリカの成長ポテンシャルとして注目されている。", "wrongNote": "人口の急速な減少や資源価格の恒常的な下落、製造業の完全な空洞化はアフリカ経済の実態とは異なり、注目されているのは若年層を中心とした人口の増加です。", "id": 311}, {"category": "経営環境", "question": "多角的貿易交渉の停滞が指摘されているWTOのラウンド交渉を何と呼ぶか。", "choices": ["東京ラウンド", "ウルグアイ・ラウンド", "ケネディ・ラウンド", "ドーハ・ラウンド"], "correct": 3, "explanation": "2001年に始まったドーハ・ラウンドは交渉が長期化・停滞しているとされる。", "wrongNote": "ウルグアイ・ラウンドやケネディ・ラウンド、東京ラウンドはいずれも過去に妥結した交渉であり、現在停滞が指摘されているのはドーハ・ラウンドです。", "id": 312}, {"category": "経営環境", "question": "日中韓とASEAN、オーストラリア、ニュージーランドなど15カ国が参加する広域経済連携協定を何と呼ぶか。", "choices": ["MERCOSUR", "USMCA", "RCEP", "CPTPP"], "correct": 2, "explanation": "地域的な包括的経済連携（RCEP）は2022年に発効した。", "wrongNote": "CPTPPは環太平洋地域の別の経済連携協定、USMCAは米国・メキシコ・カナダ協定、MERCOSURは南米の経済共同体であり、日中韓とASEAN等が参加する協定はRCEPです。", "id": 313}, {"category": "経営環境", "question": "世界の総人口が到達したとされる、近年報じられた大きな節目の数値はどれか。", "choices": ["約50億人", "約30億人", "約80億人", "約100億人"], "correct": 2, "explanation": "世界人口は2022年に80億人を突破したとされる。", "wrongNote": "50億人は1980年代後半頃、30億人は1960年代頃の水準であり、100億人はまだ到達していない将来的な予測値であるため、近年到達した節目は約80億人です。", "id": 314}, {"category": "経営環境", "question": "日本の人口動態に関する近年の傾向として正しいものはどれか。", "choices": ["総人口が増加を続けている", "出生数が長期的に増加している", "生産年齢人口の比率が上昇している", "総人口が減少局面に入っている"], "correct": 3, "explanation": "日本の総人口は2008年頃をピークに減少局面に入っている。", "wrongNote": "総人口の増加や生産年齢人口比率の上昇、出生数の長期的増加は実態と逆であり、実際には総人口の減少局面に入っています。", "id": 315}, {"category": "経営環境", "question": "総人口に占める15〜64歳の人口の推移について、近年の日本の傾向として正しいものはどれか。", "choices": ["長期的に低下傾向にある", "長期的に上昇傾向にある", "一貫して横ばいである", "統計として公表されていない"], "correct": 0, "explanation": "少子高齢化に伴い、生産年齢人口の割合は長期的に低下している。", "wrongNote": "上昇傾向や横ばいという説明は実態と異なり、統計自体は継続して公表されているため、正しくは生産年齢人口の割合は長期的に低下傾向にあります。", "id": 316}, {"category": "経営環境", "question": "急激な円安が輸入企業に与える一般的な影響として正しいものはどれか。", "choices": ["輸入コストが上昇し、収益を圧迫しやすい", "必ず株価が上昇する", "輸入コストが低下し、収益が改善しやすい", "為替相場は輸入企業の収益に影響しない"], "correct": 0, "explanation": "円安は輸入コストの上昇を通じて輸入企業の収益を圧迫しやすい。", "wrongNote": "輸入コストが低下するのは円高の場合であり、為替が収益に無関係というのも誤りで、株価の動きも一律には決まらないため、円安は輸入企業にとってコスト増要因となりやすい点が正しい説明です。", "id": 317}, {"category": "経営環境", "question": "二国間の金利差が為替レートに影響を与えるという考え方に基づき、一般に高金利通貨に起こりやすい動きはどれか。", "choices": ["必ず物価が下落する", "資金が流入しやすく、通貨高になりやすい", "資金が流出しやすく、通貨安になりやすい", "金利は為替レートに影響しない"], "correct": 1, "explanation": "高金利通貨は投資資金を引き付けやすく、通貨高につながりやすい。", "wrongNote": "資金の流出や通貨安、金利と為替の無関係という説明は逆であり、物価の下落が必ず起きるわけでもないため、高金利通貨は資金流入により通貨高になりやすいという点が正しい説明です。", "id": 318}, {"category": "経営環境", "question": "景気を下支えするために、政府が公共事業や減税などを通じて需要を刺激する政策を何と呼ぶか。", "choices": ["財政均衡政策", "拡張的財政政策", "量的引き締め", "緊縮財政政策"], "correct": 1, "explanation": "公共事業や減税による需要刺激策は拡張的財政政策と呼ばれる。", "wrongNote": "緊縮財政政策や財政均衡政策は歳出削減・増税など需要を抑制する方向の政策、量的引き締めは金融政策の手段であり、需要を刺激する政府の政策は拡張的財政政策です。", "id": 319}, {"category": "経営環境", "question": "中央銀行が金融緩和を行った際、その効果が実体経済に波及していく経路を何と呼ぶか。", "choices": ["財政ファイナンスの経路", "財政政策の乗数効果", "為替介入の経路", "金融政策の波及（トランスミッション）経路"], "correct": 3, "explanation": "金融政策の効果が金利・為替・資産価格等を通じて実体経済に波及する経路を指す。", "wrongNote": "財政政策の乗数効果は政府支出の波及効果に関する概念、為替介入や財政ファイナンスは金融政策とは異なる手段であり、金融緩和の効果が実体経済に及ぶ経路は金融政策の波及経路と呼ばれます。", "id": 320}, {"category": "経営環境", "question": "多くの中央銀行が物価安定の目標として掲げている、消費者物価上昇率の代表的な数値はどれか。", "choices": ["2％", "5％", "0％", "10％"], "correct": 0, "explanation": "日銀や欧米の中央銀行の多くが2％の物価安定目標を掲げている。", "wrongNote": "0％では緩やかなデフレ状態に近く、5％や10％は目標としては高すぎるため、多くの中央銀行が掲げる物価目標は2％です。", "id": 321}, {"category": "経営環境", "question": "国際収支のうち、海外投資からの配当・利子等の受け取りと支払いを示す区分を何と呼ぶか。", "choices": ["貿易収支", "第一次所得収支", "資本移転等収支", "第二次所得収支"], "correct": 1, "explanation": "海外investmentからの配当・利子等は第一次所得収支に計上される。", "wrongNote": "貿易収支は財の輸出入、第二次所得収支は無償の資金移転、資本移転等収支は対価を伴わない資本の移転を指し、投資収益の受け払いを示すのは第一次所得収支です。", "id": 322}, {"category": "経営環境", "question": "経常収支が継続的に黒字であることが一般に意味することとして正しいものはどれか。", "choices": ["国内景気が必ず好調である", "財政収支が必ず黒字である", "為替レートが必ず固定されている", "海外との取引全体で純粋な資金の受け取りが支払いを上回っている"], "correct": 3, "explanation": "経常収支黒字は海外との取引全体で受け取りが支払いを上回っている状態を示す。", "wrongNote": "財政収支の黒字や為替の固定、国内景気の好調とは直接結びつく話ではないため、経常収支黒字が意味するのは海外との取引全体での純受取超過です。", "id": 323}, {"category": "経営環境", "question": "物価変動の影響も考慮したうえで、円の対外的な購買力の変化を総合的に示す指標を何と呼ぶか。", "choices": ["貿易収支比率", "実質実効為替レート", "経常収支比率", "名目為替レート"], "correct": 1, "explanation": "複数通貨に対する為替レートを物価変動も加味して指数化したものが実質実効為替レート。", "wrongNote": "名目為替レートは物価調整を行わない単純なレート、貿易収支比率や経常収支比率は別の統計指標であり、対外的な購買力の変化を総合的に示すのは実質実効為替レートです。", "id": 324}, {"category": "経営環境", "question": "自国産業の保護を目的に関税の引き上げなどを行う動きを何と呼ぶか。", "choices": ["多角主義", "保護主義", "自由貿易主義", "地域主義"], "correct": 1, "explanation": "自国産業保護のための関税引き上げ等は保護主義的な動きとされる。", "wrongNote": "自由貿易主義は貿易障壁の撤廃を志向する立場、多角主義は多国間での貿易ルール構築を志向する立場、地域主義は特定地域内での連携を指し、関税引き上げによる自国産業保護は保護主義です。", "id": 325}, {"category": "経営環境", "question": "WTOのような多国間の枠組みと、特定の国同士で結ぶ協定との違いに関する説明として正しいものはどれか。", "choices": ["WTOのルールは特定の二国間にのみ適用される", "多国間の枠組みも二国間協定もまったく同じ効力を持つ", "二国間協定の方が常に多くの国に適用される", "多国間の枠組みは幅広い加盟国に共通ルールを適用し、二国間協定は当事国間のみに適用される"], "correct": 3, "explanation": "WTOは多数国間の共通ルール、二国間協定は当事国間のみのルールという違いがある。", "wrongNote": "両者が同じ効力を持つわけではなく、二国間協定の方が適用国が多いというのも誤りで、WTOのルールは加盟国全体に及ぶため、共通ルールの適用範囲の違いが両者の主な違いです。", "id": 326}, {"category": "経営環境", "question": "生産年齢人口の増加が経済成長を後押ししやすい局面を何と呼ぶか。", "choices": ["人口ボーナス期", "人口オーナス期", "人口転換期", "人口停滞期"], "correct": 0, "explanation": "生産年齢人口の増加が成長を後押しする局面は人口ボーナス期と呼ばれる。", "wrongNote": "人口オーナス期は逆に高齢化等が成長の重荷となる局面を指し、人口停滞期や人口転換期という呼び方は一般的ではないため、成長を後押しする局面は人口ボーナス期です。", "id": 327}, {"category": "経営環境", "question": "総人口に占める65歳以上人口の割合を示す指標を何と呼ぶか。", "choices": ["高齢化率", "生産年齢人口率", "従属人口指数", "出生率"], "correct": 0, "explanation": "65歳以上人口の総人口に占める割合を高齢化率と呼ぶ。", "wrongNote": "生産年齢人口率は15〜64歳人口の割合、従属人口指数は生産年齢人口に対する非生産年齢人口の比率、出生率は出生数に関する指標であり、65歳以上の割合を示すのは高齢化率です。", "id": 328}, {"category": "経営環境", "question": "日本で近年本格的に議論が進められている、現役世代の社会保険料負担の重さを背景とした改革を何と呼ぶか。", "choices": ["産業構造改革", "財政投融資改革", "金融システム改革", "社会保障改革"], "correct": 3, "explanation": "社会保険料負担の重さを背景に社会保障改革の議論が進められている。", "wrongNote": "財政投融資改革や産業構造改革、金融システム改革は別分野の改革を指す言葉であり、社会保険料負担を背景とした改革は社会保障改革と呼ばれます。", "id": 329}, {"category": "経営環境", "question": "名目GDPの規模で世界順位が近年注目されている国の組み合わせとして正しいものはどれか。", "choices": ["日本が世界1位である", "米国・中国・日本が上位に位置する", "米国が世界で唯一のGDP1兆ドル超国である", "中国のGDPは日本を下回っている"], "correct": 1, "explanation": "名目GDPでは米国・中国が上位2カ国となっており、日本も上位圏に位置する。", "wrongNote": "日本が世界1位という事実はなく、GDP1兆ドル超の国は複数存在し、中国のGDPは日本を上回っているため、正しくは米中日が上位に位置するという説明です。", "id": 330}, {"category": "経営環境", "question": "新興国への投資に伴う、政治・経済情勢の不安定さに起因するリスクを何と呼ぶか。", "choices": ["金利リスク", "信用リスク", "為替リスク", "カントリーリスク"], "correct": 3, "explanation": "投資先国の政治・経済情勢に起因するリスクをカントリーリスクと呼ぶ。", "wrongNote": "信用リスクは取引相手の債務不履行リスク、為替リスクや金利リスクはより限定的なリスクを指し、国全体の情勢に起因するリスクはカントリーリスクです。", "id": 331}, {"category": "経営環境", "question": "特定の国への部材調達の依存を減らし、複数国に生産拠点を分散させる動きを表す近年の考え方はどれか。", "choices": ["チャイナ・プラスワン", "チャイナ・リスクオフ", "ワンチャイナ政策", "デカップリング"], "correct": 0, "explanation": "中国以外にも生産拠点を確保する動きはチャイナ・プラスワンと呼ばれる。", "wrongNote": "ワンチャイナ政策は外交上の原則を指す言葉、デカップリングは経済的な分断を指すより広い概念であり、供給網の分散を指す近年の代表的な考え方はチャイナ・プラスワンです。", "id": 332}, {"category": "経営環境", "question": "日本と世界の景気動向が企業業績や家計の所得に波及していく関係について、日経TEST公式テキストが強調している考え方として正しいものはどれか。", "choices": ["経済の各要素はそれぞれ独立して動く", "景気と企業業績はまったく無関係である", "景気・GDP・企業業績・家計の手取りなど経済の各要素は互いにつながっている", "GDPが増えても家計の所得には影響しない"], "correct": 2, "explanation": "景気、GDP、企業業績、手取りなどはすべてつながっているという「仕組み」の理解が重視されている。", "wrongNote": "景気と企業業績が無関係、GDPの増減が家計所得に影響しない、各要素が独立して動くといった説明はいずれも誤りであり、経済の各要素は相互につながっているという理解が強調されています。", "id": 333}, {"category": "経営環境", "question": "日本経済の課題を「自分ごと化」して理解する際、原価率の上昇要因として挙げられるものはどれか。", "choices": ["法人税率の引き上げ", "消費税率の引き下げ", "原油価格の上昇や円安、地政学リスク", "労働分配率の上昇"], "correct": 2, "explanation": "原油価格の上昇や円安、地政学リスクはコスト増を通じて原価率を押し上げる要因となる。", "wrongNote": "法人税率や労働分配率、消費税率は原価そのものの水準を直接左右する要因ではなく、原価率上昇の主な要因としては原油価格や円安、地政学リスクが挙げられます。", "id": 334}, {"category": "経営環境", "question": "国全体で見た付加価値（粗利）の合計が増えないと起こりやすいこととして、テキストが示している考え方はどれか。", "choices": ["物価が必ず下落する", "失業率が必ず低下する", "給料も増えにくくなる", "GDPと給料は無関係である"], "correct": 2, "explanation": "付加価値の合計であるGDPが増えないと、そこから支払われる給料も増えにくいという関係が示されている。", "wrongNote": "物価の必ずの下落や失業率の必ずの低下、GDPと給料が無関係という説明はテキストの考え方とは異なり、GDPが増えないと給料も増えにくいという関係が示されています。", "id": 335}, {"category": "企業戦略", "question": "自動車業界で使われる、ソフトウエアによって車両の機能や性能を制御・更新する新しい車両の考え方を何と呼ぶか。", "choices": ["BEV", "FCV", "SDV（ソフトウエア定義車両）", "HV"], "correct": 2, "explanation": "ソフトウエアの更新によって機能が進化する車両のコンセプトをSDVと呼ぶ。", "wrongNote": "BEV・HV・FCVはいずれも動力源の違いによる自動車の分類であり、ソフトウエアによる制御・更新を軸にした考え方を指すのはSDVです。", "id": 336}, {"category": "企業戦略", "question": "半導体産業において、自社で工場を持たず設計に特化する企業に対し、製造だけを専門に受託する企業を何と呼ぶか。", "choices": ["ファウンドリ", "IDM", "ファブレス", "OSAT"], "correct": 0, "explanation": "製造工程を専門に受託する企業はファウンドリと呼ばれる。", "wrongNote": "ファブレスは設計に特化し製造工程を持たない企業、IDMは設計から製造まで一貫して行う企業、OSATは後工程（組立・検査）を専門に受託する企業を指し、製造受託専門はファウンドリです。", "id": 337}, {"category": "企業戦略", "question": "移動体通信事業者から回線を借りて独自のサービスを提供する事業者を何と呼ぶか。", "choices": ["ISP", "MNO", "SIer", "MVNO"], "correct": 3, "explanation": "回線設備を自社で持たず、大手キャリアから借りてサービスを提供する事業者をMVNOと呼ぶ。", "wrongNote": "MNOは自社で通信インフラを保有する事業者、ISPはインターネット接続業者、SIerはシステム構築を請け負う業者を指し、回線を借りてサービス展開する事業者はMVNOです。", "id": 338}, {"category": "企業戦略", "question": "資源開発から物流、金融まで幅広い事業を手がける、日本に特徴的な業態の企業群を何と呼ぶか。", "choices": ["総合商社", "専門商社", "持株会社", "投資ファンド"], "correct": 0, "explanation": "資源からインフラ、金融まで多角的に事業を展開する日本特有の業態は総合商社と呼ばれる。", "wrongNote": "専門商社は特定分野に特化した商社、持株会社や投資ファンドは事業形態の異なる別の主体であり、幅広い事業を手がける日本特有の業態は総合商社です。", "id": 339}, {"category": "企業戦略", "question": "総合商社が近年重視している投資分野として、資源に加えて挙げられるものはどれか。", "choices": ["再生可能エネルギーやデジタル分野などの非資源事業", "国内小売事業のみへの集中", "不動産賃貸業のみへの集中", "資源事業のみへの集中"], "correct": 0, "explanation": "資源価格変動リスクを分散するため、非資源分野への投資が重視されている。", "wrongNote": "資源事業のみへの集中や国内小売・不動産賃貸のみへの集中は近年の傾向とは異なり、総合商社は再生可能エネルギーやデジタルなどの非資源分野への投資も重視しています。", "id": 340}, {"category": "企業戦略", "question": "後発医薬品として、新薬の特許切れ後に製造販売される医薬品を何と呼ぶか。", "choices": ["ジェネリック医薬品", "OTC医薬品", "バイオシミラー医薬品", "医療用先発医薬品"], "correct": 0, "explanation": "特許切れ後に製造される後発医薬品はジェネリック医薬品と呼ばれる。", "wrongNote": "バイオシミラーはバイオ医薬品の後発品を指すより限定的な呼称、OTC医薬品は薬局等で購入できる一般用医薬品、医療用先発医薬品は特許保護下にある新薬を指し、特許切れ後の後発品全般はジェネリック医薬品です。", "id": 341}, {"category": "企業戦略", "question": "建設業界で人手不足への対応として近年焦点となっている、時間外労働の上限規制適用に伴う課題を何と呼ぶか。", "choices": ["高齢化問題", "少子化問題", "2024年問題", "2025年問題"], "correct": 2, "explanation": "建設業やトラック運送業などで時間外労働規制が猶予期間を経て適用されたことに伴う課題は2024年問題と呼ばれる。", "wrongNote": "2025年問題は医療・介護分野の高齢化課題を指す別の言葉であり、少子化問題や高齢化問題はより広い概念であるため、規制適用に伴う課題は2024年問題と呼ばれます。", "id": 342}, {"category": "企業戦略", "question": "トラック運送業界で、ドライバーの時間外労働規制強化に伴い懸念されている問題として正しいものはどれか。", "choices": ["規制強化による賃金の一律引き下げ", "運送需要の急激な消滅", "輸送能力の不足（物流の停滞）", "燃料価格の恒常的な下落"], "correct": 2, "explanation": "労働時間規制の強化により輸送能力が不足する懸念が物流の2024年問題として指摘されている。", "wrongNote": "燃料価格の下落や運送需要の消滅、賃金の一律引き下げは実態とは異なる説明であり、懸念されているのは規制強化に伴う輸送能力の不足です。", "id": 343}, {"category": "企業戦略", "question": "工作機械業界の受注動向が景気の先行指標として注目される理由として正しいものはどれか。", "choices": ["為替レートを直接決定するため", "財政収支と連動するため", "設備投資の動きを反映し、企業の生産活動の先行きを示唆するため", "消費者物価の動きを直接示すため"], "correct": 2, "explanation": "工作機械の受注は企業の設備投資意欲を映すため、景気の先行指標として注目される。", "wrongNote": "消費者物価や為替レート、財政収支を直接示す指標ではなく、工作機械受注が注目されるのは企業の設備投資動向を映す先行指標としての性質です。", "id": 344}, {"category": "企業戦略", "question": "スタートアップ企業が事業拡大の段階に応じて資金調達を行う際、事業が軌道に乗り始めた段階で行う調達ラウンドを一般に何と呼ぶか。", "choices": ["シリーズA", "IPO", "ブリッジファイナンス", "シード"], "correct": 0, "explanation": "創業初期のシード段階の後、事業が軌道に乗り始めた段階の調達はシリーズAと呼ばれることが多い。", "wrongNote": "シードはさらに前段階の調達、IPOは株式上場による資金調達、ブリッジファイナンスは次のラウンドまでのつなぎ資金であり、軌道に乗り始めた段階の調達は一般にシリーズAと呼ばれます。", "id": 345}, {"category": "企業戦略", "question": "経営者の高齢化が進む中小企業で、後継者不在により事業継続が困難になる問題を何と呼ぶか。", "choices": ["労働生産性問題", "事業再生問題", "過剰債務問題", "事業承継問題"], "correct": 3, "explanation": "後継者不在により事業を続けられなくなる問題は事業承継問題として指摘されている。", "wrongNote": "事業再生問題は経営不振企業の立て直しに関する課題、労働生産性問題や過剰債務問題は別の経営課題であり、後継者不在による事業継続の困難は事業承継問題です。", "id": 346}, {"category": "企業戦略", "question": "マイケル・ポーターが提唱した、企業が競争優位を築くための3つの基本戦略に含まれないものはどれか。", "choices": ["垂直統合戦略", "コストリーダーシップ戦略", "集中戦略", "差別化戦略"], "correct": 0, "explanation": "3つの基本戦略はコストリーダーシップ・差別化・集中戦略。", "wrongNote": "コストリーダーシップ戦略・差別化戦略・集中戦略はいずれもポーターの3つの基本戦略に含まれ、垂直統合戦略はこの枠組みには含まれない別の戦略概念です。", "id": 347}, {"category": "企業戦略", "question": "企業が既存事業の内部成長だけでなく、M&Aによって外部から成長を取り込む手法を何と呼ぶか。", "choices": ["自然成長", "インオーガニック成長", "ゼロサム成長", "オーガニック成長"], "correct": 1, "explanation": "M&Aなど外部の経営資源を取り込む成長はインオーガニック成長と呼ばれる。", "wrongNote": "オーガニック成長は既存事業の内部努力による成長を指し、ゼロサム成長や自然成長という呼称は一般的ではないため、M&Aによる外部成長はインオーガニック成長と呼ばれます。", "id": 348}, {"category": "企業戦略", "question": "国境をまたいで行われるM&Aを何と呼ぶか。", "choices": ["クロスボーダーM&A", "ドメスティックM&A", "インバウンドM&A", "アウトバウンドM&A"], "correct": 0, "explanation": "国境を越えて行われるM&AをクロスボーダーM&Aと呼ぶ。", "wrongNote": "ドメスティックM&Aは国内企業同士のM&A、インバウンド・アウトバウンドM&Aはクロスボーダーの中でも方向性を示す下位区分であり、国境をまたぐM&A全体を指す言葉はクロスボーダーM&Aです。", "id": 349}, {"category": "企業戦略", "question": "買収対象企業の経営陣の合意を得たうえで進められるTOBを何と呼ぶか。", "choices": ["友好的TOB", "強制TOB", "敵対的TOB", "義務的TOB"], "correct": 0, "explanation": "対象企業経営陣の同意を得て進められるTOBは友好的TOBと呼ばれる。", "wrongNote": "敵対的TOBは経営陣の同意を得ずに進めるTOB、強制TOB・義務的TOBは一定条件下で発生するTOBに関する別の概念であり、経営陣の合意を得たものは友好的TOBです。", "id": 350}, {"category": "企業戦略", "question": "経営陣が自社を非公開化する目的で行うMBOが用いられる典型的な場面として正しいものはどれか。", "choices": ["株主総会の権限を強化したい場合", "会社を清算し事業を終了させたい場合", "株式を新規に上場させたい場合", "株式市場からのプレッシャーを避け、中長期的な経営改革を進めたい場合"], "correct": 3, "explanation": "短期的な株主からの圧力を避け、中長期の改革を進めるためにMBOで非公開化する事例が見られる。", "wrongNote": "新規上場や会社清算、株主総会権限の強化はMBOの典型的な目的とは異なり、MBOは市場からのプレッシャーを避けて経営改革を進める場面で活用されます。", "id": 351}, {"category": "企業戦略", "question": "電機業界の事業再編で見られる、収益性の低い事業を売却し、強みのある分野に経営資源を集中させる動きを一般に何と呼ぶか。", "choices": ["水平統合", "垂直統合", "コングロマリット化", "選択と集中"], "correct": 3, "explanation": "不採算事業の整理と強み分野への集中は選択と集中と呼ばれる。", "wrongNote": "水平統合や垂直統合、コングロマリット化はそれぞれ異なる方向性の戦略であり、不採算事業の整理と強み分野への集中を指す一般的な呼称は選択と集中です。", "id": 352}, {"category": "企業戦略", "question": "アパレル業界で、企画から製造、小売までを自社で一貫して手がけるビジネスモデルを何と呼ぶか。", "choices": ["ODM", "SPA（製造小売業）", "フランチャイズ", "OEM"], "correct": 1, "explanation": "企画・製造・小売を一貫して自社で行うモデルはSPAと呼ばれる。", "wrongNote": "OEM・ODMは他社ブランド向けの受託製造、フランチャイズは商標・ノウハウ提供による展開手法であり、企画から小売までの一貫体制はSPAと呼ばれます。", "id": 353}, {"category": "企業戦略", "question": "ソフトウエア産業で、自社サーバーではなくクラウド上でシステムを利用する動きが進んでいることを何と呼ぶか。", "choices": ["レガシー化", "スタンドアロン化", "オンプレミス化", "クラウドシフト"], "correct": 3, "explanation": "自社設備からクラウドサービス利用への移行はクラウドシフトと呼ばれる。", "wrongNote": "オンプレミス化は逆に自社設備での運用に戻す動き、レガシー化やスタンドアロン化は旧来型・単独稼働型のシステムを指す言葉であり、クラウド利用への移行はクラウドシフトです。", "id": 354}, {"category": "企業戦略", "question": "評価額10億ドルを超える未上場企業の数について、日本の状況として指摘されている傾向はどれか。", "choices": ["日本は世界で最もユニコーン企業数が多い", "日本にはユニコーン企業が1社も存在しない", "日本のユニコーン企業数は米国と同水準である", "米国や中国と比べて日本のユニコーン企業数は少ない"], "correct": 3, "explanation": "日本のユニコーン企業数は米中に比べて少ないことが課題として指摘されている。", "wrongNote": "世界最多という説明や1社も存在しないという説明、米国と同水準という説明はいずれも実態と異なり、日本のユニコーン企業数は米中と比べて少ない水準にとどまっています。", "id": 355}, {"category": "企業戦略", "question": "中小企業基本法上、製造業における中小企業の定義に用いられる基準として正しい組み合わせはどれか。", "choices": ["本社所在地", "上場の有無", "売上高", "資本金の額または出資の総額と、常時使用する従業員数"], "correct": 3, "explanation": "業種ごとに資本金基準と従業員数基準が定められている。", "wrongNote": "売上高や本社所在地、上場の有無は中小企業の法的な定義基準ではなく、実際には資本金（出資額）と従業員数の基準によって判定されます。", "id": 356}, {"category": "企業戦略", "question": "経営が悪化した企業が、裁判所を通さず金融機関等の債権者と private に交渉して再建を図る手法を何と呼ぶか。", "choices": ["破産手続き", "法的整理", "特別清算", "私的整理（事業再生ADR等）"], "correct": 3, "explanation": "裁判所の手続きによらず債権者と協議して進める再建は私的整理と呼ばれる。", "wrongNote": "法的整理・破産手続き・特別清算はいずれも裁判所の手続きを通じて進められる整理方法であり、裁判所を通さない交渉による再建は私的整理です。", "id": 357}, {"category": "企業戦略", "question": "民事再生と会社更生の違いに関する説明として正しいものはどれか。", "choices": ["民事再生は経営陣がそのまま経営を続けやすいが、会社更生では管財人が経営権を持つのが原則", "民事再生では必ず会社が解散する", "会社更生は中小企業のみが利用できる手続きである", "民事再生と会社更生はまったく同じ手続きである"], "correct": 0, "explanation": "民事再生は経営陣主導、会社更生は管財人主導という違いがある。", "wrongNote": "両者は同一の手続きではなく、会社更生は主に大企業で利用されることが多く、民事再生でも会社の解散が前提ではないため、経営権の扱いの違いが両者の主な相違点です。", "id": 358}, {"category": "企業戦略", "question": "投資ファンドが企業の一事業部門を買収し、独立した会社として成長させる投資手法が近年増えている動きを何と呼ぶか。", "choices": ["カーブアウト投資", "グリーンフィールド投資", "エンジェル投資", "ポートフォリオ投資"], "correct": 0, "explanation": "事業部門を切り出して投資対象とする手法はカーブアウト投資と呼ばれる。", "wrongNote": "グリーンフィールド投資は新規拠点をゼロから設立する投資、ポートフォリオ投資は証券への分散投資、エンジェル投資は個人による創業初期投資を指し、事業部門の切り出し投資はカーブアウト投資です。", "id": 359}, {"category": "企業戦略", "question": "製造業がモノの販売だけでなく、保守・運用支援などのサービス提供による収益拡大を図る動きを何と呼ぶか。", "choices": ["製造業の空洞化", "製造業の水平分業化", "製造業のサービス化（サービタイゼーション）", "製造業のコモディティ化"], "correct": 2, "explanation": "モノ売りからコト売りへの転換は製造業のサービス化（サービタイゼーション）と呼ばれる。", "wrongNote": "製造業の空洞化は生産拠点の海外移転による国内産業の縮小、水平分業化やコモディティ化は別の産業構造の変化を指し、サービス提供による収益拡大の動きはサービタイゼーションです。", "id": 360}, {"category": "企業戦略", "question": "半導体・電子部品業界において、部品の高性能化・小型化を支える技術トレンドとして重要視されているものはどれか。", "choices": ["微細化・高集積化", "汎用化・標準化のみへの一本化", "大型化・低集積化", "アナログ化"], "correct": 0, "explanation": "半導体の性能向上には回路の微細化・高集積化が重要な技術トレンドとなっている。", "wrongNote": "大型化・低集積化やアナログ化のみへの回帰は実際の技術トレンドとは逆であり、性能向上を支えるのは微細化・高集積化です。", "id": 361}, {"category": "企業戦略", "question": "通信業界で、5Gの次の世代として研究開発が進められている通信規格を一般に何と呼ぶか。", "choices": ["3G", "6G", "4G", "Wi-Fi 6"], "correct": 1, "explanation": "5Gの次世代規格として6Gの研究開発が各国で進められている。", "wrongNote": "4Gや3Gは5Gより前の世代の規格、Wi-Fi 6は無線LANの規格であり、5Gの次世代として研究が進むのは6Gです。", "id": 362}, {"category": "企業戦略", "question": "総合商社が近年強化している、脱炭素の流れを踏まえた事業分野として正しいものはどれか。", "choices": ["化石燃料販売のみへの集中", "国内農業のみへの集中", "再生可能エネルギー発電事業", "石炭火力発電事業のみへの集中"], "correct": 2, "explanation": "脱炭素の潮流を踏まえ、再生可能エネルギー分野への投資が強化されている。", "wrongNote": "石炭火力や化石燃料、国内農業のみへの集中は脱炭素の流れとは逆の方向性であり、強化されているのは再生可能エネルギー発電事業です。", "id": 363}, {"category": "企業戦略", "question": "造船・重機業界で近年受注が伸びている船舶分野として挙げられるものはどれか。", "choices": ["漁船のみへの特化", "LNG船など環境対応型・高付加価値船舶", "単純な貨物専用の小型船", "客船のみへの特化"], "correct": 1, "explanation": "環境規制強化を背景にLNG船など高付加価値船舶の需要が伸びている。", "wrongNote": "小型貨物船や客船・漁船のみへの特化は近年の受注トレンドとは異なり、伸びているのはLNG船など環境対応型・高付加価値船舶です。", "id": 364}, {"category": "企業戦略", "question": "企業が特定分野の技術やノウハウを持つ他社と提携し、自前主義にこだわらず外部資源を活用する経営の考え方を何と呼ぶか。", "choices": ["自前主義経営", "クローズドイノベーション", "垂直統合経営", "オープンイノベーション"], "correct": 3, "explanation": "社外の技術・知見を積極的に取り込む考え方はオープンイノベーションと呼ばれる。", "wrongNote": "クローズドイノベーションや自前主義経営、垂直統合経営は自社内で完結させる方向性の考え方であり、外部資源の活用を重視する考え方はオープンイノベーションです。", "id": 365}, {"category": "企業戦略", "question": "不動産業界において、賃貸オフィスの需要動向を左右する近年の働き方の変化として挙げられるものはどれか。", "choices": ["賃貸契約の完全な撤廃", "テレワークの普及によるオフィス需要への影響", "オフィスの完全な廃止の一般化", "出社率が常に100％である状態の継続"], "correct": 1, "explanation": "テレワークの普及がオフィス需要のあり方に影響を与えている。", "wrongNote": "出社率100％の継続やオフィスの完全廃止、賃貸契約の撤廃は実態とは異なり、影響要因として挙げられるのはテレワークの普及によるオフィス需要への影響です。", "id": 366}, {"category": "企業戦略", "question": "スタートアップ企業への投資を主な業務とする投資会社を何と呼ぶか。", "choices": ["メガバンク", "ベンチャーキャピタル", "政府系金融機関", "信用金庫"], "correct": 1, "explanation": "未上場のスタートアップへの出資を専門とする投資会社はベンチャーキャピタルと呼ばれる。", "wrongNote": "メガバンクや信用金庫は主に融資を行う金融機関、政府系金融機関のみという限定は不正確であり、スタートアップ投資を専門とするのはベンチャーキャピタルです。", "id": 367}, {"category": "会計・財務", "question": "貸借対照表において、資産・負債を「流動」と「固定」に分類する際の一般的な基準を何と呼ぶか。", "choices": ["1年基準（ワンイヤー・ルール）", "5年基準", "時価基準", "取得原価基準"], "correct": 0, "explanation": "決算日から1年以内に現金化・支払期限が来るかどうかで分類する基準を1年基準と呼ぶ。", "wrongNote": "5年基準という区分は一般的ではなく、取得原価基準や時価基準は資産の評価方法に関する別の考え方であり、流動・固定の分類基準は1年基準です。", "id": 368}, {"category": "会計・財務", "question": "キャッシュフロー計算書の作成方法のうち、税引前当期純利益に非資金損益項目などを加減して営業キャッシュフローを求める方式を何と呼ぶか。", "choices": ["定額法", "間接法", "定率法", "直接法"], "correct": 1, "explanation": "純利益を起点に調整を加えて営業キャッシュフローを算出する方式は間接法と呼ばれる。", "wrongNote": "直接法は主要な取引ごとに収入・支出を集計する方式、定額法・定率法は減価償却の方法を指し、純利益を起点に調整計算する方式は間接法です。", "id": 369}, {"category": "会計・財務", "question": "投下した資本に対してどれだけ効率的に利益を上げているかを示す経営指標を何と呼ぶか。", "choices": ["PER", "ROIC（投下資本利益率）", "配当利回り", "PBR"], "correct": 1, "explanation": "投下資本に対する税引後営業利益等の割合を示す指標がROIC。", "wrongNote": "PERやPBRは株価に関する指標、配当利回りは株価に対する配当の割合を示す指標であり、投下資本の効率性を示すのはROICです。", "id": 370}, {"category": "会計・財務", "question": "ROICがWACC（加重平均資本コスト）を上回っている状態が意味することとして正しいものはどれか。", "choices": ["財務の安全性が低下していることを示す", "必ず倒産リスクが高いことを示す", "資本コストを上回る収益を生み出し、企業価値の創造につながっている", "資本コストを下回る収益しか生んでおらず、企業価値を毀損している"], "correct": 2, "explanation": "ROICがWACCを上回るスプレッドは企業価値創造の目安とされる。", "wrongNote": "資本コストを下回る状態や財務の安全性低下、倒産リスクの高さとは異なり、ROICがWACCを上回ることは資本コストを上回る収益創出＝企業価値創造につながっていることを示します。", "id": 371}, {"category": "会計・財務", "question": "日本企業の間で任意適用が広がっている、国際的な会計基準の略称として正しいものはどれか。", "choices": ["US-GAAP", "SOX法", "IFRS", "JGAAP"], "correct": 2, "explanation": "国際財務報告基準（IFRS）を任意適用する日本企業が増えている。", "wrongNote": "JGAAPは日本基準、US-GAAPは米国基準を指し、SOX法は米国の内部統制に関する法律であるため、任意適用が広がっているのはIFRSです。", "id": 372}, {"category": "会計・財務", "question": "新しいリース会計基準の導入により、多くの企業でオペレーティングリースについて生じる主な変化として正しいものはどれか。", "choices": ["リース取引そのものが禁止される", "リース資産・負債が貸借対照表に計上される（オンバランス化）される", "損益計算書上の記載が一切不要になる", "リース料の支払いが不要になる"], "correct": 1, "explanation": "新基準では原則としてすべてのリースが資産・負債としてオンバランスされる。", "wrongNote": "リース取引の禁止やリース料支払いの不要化、損益計算書上の記載不要化は実際の改正内容とは異なり、主な変化はリース資産・負債のオンバランス化です。", "id": 373}, {"category": "会計・財務", "question": "企業が事業に必要な資金を調達する際に負担するコストの総称を何と呼ぶか。", "choices": ["配当性向", "自己資本比率", "流動比率", "資本コスト"], "correct": 3, "explanation": "株主資本コストと負債コストを加重平均したものなどを含め、資金調達に伴うコストを資本コストと呼ぶ。", "wrongNote": "流動比率や自己資本比率、配当性向は資本コストとは異なる別の財務指標であり、資金調達に伴うコスト全体を指すのは資本コストです。", "id": 374}, {"category": "会計・財務", "question": "将来生み出すキャッシュフローを現在価値に割り引くことで企業価値を評価する手法を何と呼ぶか。", "choices": ["時価総額法", "類似会社比較法", "DCF法（ディスカウント・キャッシュフロー法）", "純資産法"], "correct": 2, "explanation": "将来キャッシュフローを割り引いて企業価値を算定する手法をDCF法と呼ぶ。", "wrongNote": "類似会社比較法は同業他社の指標と比較する手法、純資産法は貸借対照表の純資産をもとにする手法であり、将来キャッシュフローの割引計算を用いるのはDCF法です。", "id": 375}, {"category": "会計・財務", "question": "同業他社のPERやEV/EBITDA倍率などを参考に企業価値を推計する手法を何と呼ぶか。", "choices": ["類似会社比較法（マルチプル法）", "DCF法", "純資産法", "配当割引モデル"], "correct": 0, "explanation": "同業他社の指標を参考に評価する手法は類似会社比較法（マルチプル法）と呼ばれる。", "wrongNote": "DCF法は将来キャッシュフローの割引計算、純資産法は貸借対照表ベースの評価、配当割引モデルは将来配当の割引計算を用いる手法であり、同業比較による評価は類似会社比較法です。", "id": 376}, {"category": "会計・財務", "question": "企業が自己資本と負債のバランスをどのように設計するかという財務戦略上の課題を何と呼ぶか。", "choices": ["流動性管理", "与信管理", "資本構成（キャピタル・ストラクチャー）の最適化", "在庫管理"], "correct": 2, "explanation": "自己資本と負債の最適な組み合わせを検討する財務戦略を資本構成の最適化と呼ぶ。", "wrongNote": "流動性管理や在庫管理、与信管理は別の財務・業務上の課題であり、自己資本と負債のバランス設計は資本構成の最適化と呼ばれます。", "id": 377}, {"category": "会計・財務", "question": "銀行融資のように金融機関を介して資金を調達する方法を何と呼ぶか。", "choices": ["自己金融", "直接金融", "内部留保調達", "間接金融"], "correct": 3, "explanation": "金融機関を介した資金調達は間接金融と呼ばれる。", "wrongNote": "直接金融は株式や社債の発行により投資家から直接資金を集める方法、自己金融や内部留保調達は自社内の資金を活用する方法であり、金融機関を介する調達は間接金融です。", "id": 378}, {"category": "会計・財務", "question": "株式や社債の発行を通じて投資家から直接資金を調達する方法を何と呼ぶか。", "choices": ["信用創造", "直接金融", "融資", "間接金融"], "correct": 1, "explanation": "証券市場を通じて投資家から直接調達する方法は直接金融と呼ばれる。", "wrongNote": "間接金融は金融機関を介した調達方法、信用創造は銀行が預金と貸出を通じて通貨量を増やす仕組み、融資は間接金融の一形態であり、投資家から直接資金を集める方法は直接金融です。", "id": 379}, {"category": "会計・財務", "question": "日経平均株価の算出方法の特徴として正しいものはどれか。", "choices": ["時価総額加重型の指数であり大型株の影響を強く受ける", "株価の値がさの大きい銘柄の影響を受けやすい修正平均型の指数である", "対象銘柄は常に固定され入れ替えが行われない", "配当を考慮せずに算出されることは一切ない"], "correct": 1, "explanation": "日経平均は株価水準（値がさ株）の影響を受けやすい修正平均型の指数である。", "wrongNote": "時価総額加重型はTOPIXの特徴であり、対象銘柄は定期的に入れ替えが行われ、配当を考慮しない単純な株価平均として算出されるため、日経平均の特徴は値がさ株の影響を受けやすい修正平均型である点です。", "id": 380}, {"category": "会計・財務", "question": "TOPIX（東証株価指数）の算出方法の特徴として正しいものはどれか。", "choices": ["時価総額加重型の指数であり、時価総額の大きい銘柄の影響を強く受ける", "株価水準の高い銘柄の影響を強く受ける修正平均型である", "対象銘柄がわずか10銘柄に限定されている", "算出に浮動株比率は考慮されない"], "correct": 0, "explanation": "TOPIXは時価総額加重型の指数であり、大型株の値動きの影響を強く受ける。", "wrongNote": "株価水準の高い銘柄の影響を受けやすいのは日経平均の特徴であり、対象銘柄は多数に上り、浮動株比率も考慮されるため、TOPIXの特徴は時価総額加重型である点です。", "id": 381}, {"category": "会計・財務", "question": "米国の代表的な株価指数のうち、工業株を中心とした30銘柄で構成される指数はどれか。", "choices": ["S&P500", "ラッセル2000", "NASDAQ総合指数", "NYダウ（ダウ工業株30種平均）"], "correct": 3, "explanation": "30銘柄で構成される伝統的な指数はNYダウと呼ばれる。", "wrongNote": "S&P500は500銘柄で構成される時価総額加重型指数、NASDAQ総合指数はハイテク企業が多いNASDAQ市場全体の指数、ラッセル2000は小型株中心の指数であり、30銘柄構成の指数はNYダウです。", "id": 382}, {"category": "会計・財務", "question": "生命保険と損害保険の違いに関する説明として正しいものはどれか。", "choices": ["生命保険と損害保険はまったく同じ商品である", "生命保険は人の生死等に関する保険、損害保険は偶発的な事故による財産上の損害を補償する保険", "損害保険は必ず一生涯にわたって契約が続く", "生命保険には保険料という概念が存在しない"], "correct": 1, "explanation": "生命保険は人に関する保険、損害保険は物や賠償責任に関する保険という違いがある。", "wrongNote": "両者が同一商品というのは誤りで、損害保険は多くが1年更新型であり、生命保険にも当然保険料が存在するため、正しい違いは対象（人か財産か）による分類です。", "id": 383}, {"category": "会計・財務", "question": "一般に、市場金利が上昇した場合、既発の固定利付債券の価格に生じる動きとして正しいものはどれか。", "choices": ["債券価格は金利と無関係である", "債券価格は上昇しやすい", "債券価格は下落しやすい", "債券価格は必ず一定である"], "correct": 2, "explanation": "金利上昇局面では、相対的に利回りの低い既発債券が売られやすく価格が下落する。", "wrongNote": "債券価格が上昇する、金利と無関係、常に一定という説明はいずれも誤りであり、金利上昇時には既発の固定利付債券の価格は下落しやすいという逆相関の関係があります。", "id": 384}, {"category": "会計・財務", "question": "多数の投資家から集めた資金を専門家が株式や債券などで運用する金融商品を何と呼ぶか。", "choices": ["国債", "普通預金", "投資信託", "定期預金"], "correct": 2, "explanation": "投資家から集めた資金をまとめて運用する商品は投資信託と呼ばれる。", "wrongNote": "普通預金・定期預金・国債はそれぞれ異なる金融商品であり、専門家がまとめて運用する仕組みを持つのは投資信託です。", "id": 385}, {"category": "会計・財務", "question": "多数の投資家から集めた資金でオフィスビルや商業施設などの不動産に投資し、賃料収入等を分配する金融商品を何と呼ぶか。", "choices": ["社債", "REIT（不動産投資信託）", "国債", "仕組み預金"], "correct": 1, "explanation": "不動産を投資対象とする投資信託はREITと呼ばれる。", "wrongNote": "国債・社債は債券の一種、仕組み預金はデリバティブを組み込んだ預金商品であり、不動産を裏付けとした投資信託はREITです。", "id": 386}, {"category": "会計・財務", "question": "銀行が預金を受け入れ、その一部を貸し出すことを繰り返すことで市中の通貨量が増加していく仕組みを何と呼ぶか。", "choices": ["直接金融", "財政ファイナンス", "信用創造", "量的緩和"], "correct": 2, "explanation": "預金と貸出の繰り返しにより通貨量が増える銀行の機能を信用創造と呼ぶ。", "wrongNote": "量的緩和や財政ファイナンスは中央銀行・政府の政策手段、直接金融は投資家から直接調達する仕組みであり、預金と貸出による通貨量増加の仕組みは信用創造です。", "id": 387}, {"category": "会計・財務", "question": "証券会社が新規発行される株式や債券を投資家に販売する業務を何と呼ぶか。", "choices": ["為替業務", "融資業務", "信託業務", "引受（アンダーライティング）業務"], "correct": 3, "explanation": "新規発行証券を引き受けて投資家に販売する業務を引受業務と呼ぶ。", "wrongNote": "融資業務は銀行が主に行う業務、為替業務や信託業務は別の金融機能を指し、新規証券の販売を担う業務は引受業務です。", "id": 388}, {"category": "会計・財務", "question": "地方銀行業界で近年進んでいる、経営基盤強化のための動きとして正しいものはどれか。", "choices": ["経営統合・再編", "融資業務からの完全撤退", "預金金利の恒常的な引き下げ停止", "支店数の一律無制限拡大"], "correct": 0, "explanation": "人口減少等を背景に地方銀行の経営統合・再編が進んでいる。", "wrongNote": "支店数の無制限拡大や融資業務からの完全撤退は実態と異なり、預金金利の動向も一律ではないため、地銀の主な動きとしては経営統合・再編が挙げられます。", "id": 389}, {"category": "会計・財務", "question": "株価が解散価値である1株当たり純資産を下回る状態（PBR1倍割れ）の企業に対し、東京証券取引所が求めている対応として正しいものはどれか。", "choices": ["上場廃止の即時強制", "配当の即時停止", "資本コストや株価を意識した経営の実現・開示", "株式分割の即時実施義務化"], "correct": 2, "explanation": "東証はPBR1倍割れ企業などに資本コストや株価を意識した経営の開示を要請している。", "wrongNote": "上場廃止の即時強制や株式分割の義務化、配当の即時停止は要請内容とは異なり、実際に求められているのは資本コストや株価を意識した経営の実現・開示です。", "id": 390}, {"category": "会計・財務", "question": "ROEを「売上高純利益率」「総資産回転率」「財務レバレッジ」の3要素に分解して分析する手法を何と呼ぶか。", "choices": ["バリューチェーン分析", "PPM分析", "損益分岐点分析", "デュポン分解（デュポン分析）"], "correct": 3, "explanation": "ROEを3要素に分解して分析する手法はデュポン分解と呼ばれる。", "wrongNote": "バリューチェーン分析やPPM分析は経営戦略のフレームワーク、損益分岐点分析はコスト構造の分析手法であり、ROEを3要素に分解する手法はデュポン分解です。", "id": 391}, {"category": "会計・財務", "question": "保有資産の収益性が著しく低下した兆候が見られた場合に行う会計処理を何と呼ぶか。", "choices": ["時価評価", "減損処理", "繰延処理", "減価償却"], "correct": 1, "explanation": "収益性の著しい低下が見られる場合に帳簿価額を切り下げる処理を減損処理と呼ぶ。", "wrongNote": "減価償却は通常の使用期間にわたる費用配分、時価評価や繰延処理は別の会計処理を指し、収益性低下時の評価減は減損処理です。", "id": 392}, {"category": "会計・財務", "question": "のれんの会計処理について、日本基準とIFRSの違いに関する説明として正しいものはどれか。", "choices": ["IFRSではのれんという概念自体が存在しない", "日本基準ではのれんを一切計上できない", "日本基準はのれんを規則的に償却するが、IFRSでは償却せず毎期の減損テストで評価する", "日本基準・IFRSともにのれんの償却は禁止されている"], "correct": 2, "explanation": "日本基準は規則的償却、IFRSは非償却・減損テストという違いがある。", "wrongNote": "両基準ともに償却禁止という説明やIFRSにのれんの概念がないという説明、日本基準でのれんを計上できないという説明はいずれも誤りであり、正しくは償却の有無に関する違いです。", "id": 393}, {"category": "会計・財務", "question": "営業利益率が業界内でも際立って高い企業の特徴として、ファブレス経営や直販モデルなどが挙げられる企業の例として知られるのはどれか。", "choices": ["装置産業として巨額の設備投資を必要とする企業", "センサー・計測機器メーカーなど高付加価値なニッチ市場に特化する企業", "規制産業として価格決定力を持たない企業", "汎用消費財を大量生産・薄利多売する企業"], "correct": 1, "explanation": "ファブレス経営や直販による高い粗利率で知られる企業は、高付加価値なニッチ市場に特化していることが多い。", "wrongNote": "大量生産・薄利多売型や巨額設備投資型、価格決定力を持たない規制産業型の企業は一般に高い営業利益率を実現しにくく、際立った高収益企業はニッチ市場特化型に多く見られます。", "id": 394}, {"category": "会計・財務", "question": "日常の事業活動を継続するために必要な短期的な資金（売掛金・棚卸資産等から買掛金等を差し引いたもの）を何と呼ぶか。", "choices": ["運転資本（ワーキングキャピタル）", "資本剰余金", "固定資本", "自己資本"], "correct": 0, "explanation": "日々の事業運営に必要な短期資金を運転資本と呼ぶ。", "wrongNote": "固定資本は設備投資等に関する資本、自己資本や資本剰余金は貸借対照表の純資産項目であり、日常事業に必要な短期資金は運転資本です。", "id": 395}, {"category": "会計・財務", "question": "将来の価格変動リスクをヘッジするために用いられる、原資産の価格に基づいて価値が決まる金融取引の総称を何と呼ぶか。", "choices": ["貸出取引", "預金取引", "デリバティブ取引", "現物取引"], "correct": 2, "explanation": "先物・オプション・スワップなど、原資産の価格に基づく取引の総称をデリバティブと呼ぶ。", "wrongNote": "現物取引・貸出取引・預金取引はそれぞれ別の基本的な金融取引であり、価格変動リスクをヘッジする派生的な取引の総称はデリバティブ取引です。", "id": 396}, {"category": "会計・財務", "question": "調達資金の使途を環境・社会課題の解決に限定せず、企業のサステナビリティ目標の達成度に応じて条件が変わる債券を何と呼ぶか。", "choices": ["サステナビリティ・リンク・ボンド", "グリーンボンド", "普通社債", "転換社債"], "correct": 0, "explanation": "目標達成度に応じて金利条件等が変動する債券はサステナビリティ・リンク・ボンドと呼ばれる。", "wrongNote": "グリーンボンドは調達資金の使途を環境事業に限定する債券、普通社債や転換社債は目標達成度と条件が連動しない一般的な債券であり、サステナビリティ目標達成度に条件が連動する債券はサステナビリティ・リンク・ボンドです。", "id": 397}, {"category": "会計・財務", "question": "財務情報だけでなく、ESGなど非財務情報も含めて経営状況を説明する企業の報告書を何と呼ぶか。", "choices": ["事業報告書", "統合報告書", "決算短信", "有価証券報告書"], "correct": 1, "explanation": "財務・非財務情報を統合して開示する報告書は統合報告書と呼ばれる。", "wrongNote": "有価証券報告書や決算短信、事業報告書は主に財務情報や法定開示を中心とした書類であり、非財務情報も含めた統合的な開示を行う報告書は統合報告書です。", "id": 398}, {"category": "会計・財務", "question": "企業の財務諸表が適正に作成されているかを独立した第三者の立場で確認する専門家を何と呼ぶか。", "choices": ["司法書士", "社会保険労務士", "税理士", "公認会計士（監査法人）"], "correct": 3, "explanation": "財務諸表監査を担う専門家・法人は公認会計士・監査法人である。", "wrongNote": "税理士は主に税務、司法書士は登記関連、社会保険労務士は労務関連の専門家であり、財務諸表の監査を担うのは公認会計士（監査法人）です。", "id": 399}, {"category": "法務・人事", "question": "コーポレートガバナンス・コードが採用している、詳細なルールで一律に縛るのではなく大枠の原則を示す手法を何と呼ぶか。", "choices": ["ルールベース・アプローチ", "ゼロベース・アプローチ", "トップダウン・アプローチ", "プリンシプルベース・アプローチ"], "correct": 3, "explanation": "詳細な規則ではなく大枠の原則を示す手法をプリンシプルベース・アプローチと呼ぶ。", "wrongNote": "ルールベース・アプローチは詳細な規則で一律に縛る手法であり、ゼロベース・アプローチやトップダウン・アプローチのみという表現は一般的でないため、大枠の原則を示す手法はプリンシプルベース・アプローチです。", "id": 400}, {"category": "法務・人事", "question": "企業が利益追求だけでなく、社会や環境に対して果たすべき責任を指す概念を何と呼ぶか。", "choices": ["PR", "CSR（企業の社会的責任）", "HR", "IR"], "correct": 1, "explanation": "企業の社会的責任はCSRと呼ばれる。", "wrongNote": "IRは投資家向け広報、PRは広報活動全般、HRは人事に関する略称であり、社会的責任を指す概念はCSRです。", "id": 401}, {"category": "法務・人事", "question": "投資家がESG要素を重視して投資判断を行う動きが広がる中、企業側に求められている対応として正しいものはどれか。", "choices": ["ESGに関する情報開示の禁止", "短期的な株主還元のみへの特化", "財務情報の開示をすべて取りやめること", "環境・社会・企業統治に関する情報開示や取り組みの強化"], "correct": 3, "explanation": "ESG投資の拡大を受け、企業には非財務情報の開示強化が求められている。", "wrongNote": "財務情報開示の取りやめや短期的株主還元のみへの特化、情報開示の禁止は求められている対応とは逆であり、正しくは環境・社会・統治に関する情報開示や取り組みの強化です。", "id": 402}, {"category": "法務・人事", "question": "環境・社会に配慮しつつ長期的に企業価値を高めていく経営の考え方を何と呼ぶか。", "choices": ["短期主義経営", "無方針経営", "株主至上主義経営", "サステナビリティ経営"], "correct": 3, "explanation": "環境・社会への配慮と長期的な企業価値向上を両立させる経営はサステナビリティ経営と呼ばれる。", "wrongNote": "短期主義経営や株主至上主義経営、無方針経営は持続可能性を重視する考え方とは異なり、環境・社会配慮と企業価値向上を両立させる経営はサステナビリティ経営です。", "id": 403}, {"category": "法務・人事", "question": "倒産手続きのうち、裁判所の関与を経て法律に基づいて進められる整理を何と呼ぶか。", "choices": ["任意整理", "内々整理", "法的整理", "私的整理"], "correct": 2, "explanation": "裁判所の関与のもと法律に基づき進める整理は法的整理と呼ばれる。", "wrongNote": "私的整理や任意整理は裁判所の手続きによらず債権者と直接交渉する方法であり、裁判所の関与を経る整理は法的整理です。", "id": 404}, {"category": "法務・人事", "question": "経営が悪化していなくても、後継者不在などを理由に事業をたたむことを何と呼ぶか。", "choices": ["破産", "倒産", "会社更生", "廃業"], "correct": 3, "explanation": "経営破綻を伴わずに事業をやめることは廃業と呼ばれる。", "wrongNote": "倒産・破産・会社更生はいずれも経営破綻に関連する手続きであり、経営破綻を伴わず事業をたたむことは廃業と呼ばれます。", "id": 405}, {"category": "法務・人事", "question": "事業承継の類型のうち、経営者の子や親族が後を継ぐ形態を何と呼ぶか。", "choices": ["M&Aによる承継", "従業員承継", "廃業", "親族内承継"], "correct": 3, "explanation": "経営者の親族が事業を継ぐ形態は親族内承継と呼ばれる。", "wrongNote": "従業員承継は社内の役員・従業員が継ぐ形態、M&Aによる承継は外部への売却による承継、廃業は事業自体をやめることを指し、親族が継ぐ場合は親族内承継です。", "id": 406}, {"category": "法務・人事", "question": "事業承継の際、後継者にかかる相続税・贈与税の負担を軽減するために設けられている制度を何と呼ぶか。", "choices": ["消費税インボイス制度", "事業承継税制（納税猶予制度）", "住宅ローン控除制度", "ふるさと納税制度"], "correct": 1, "explanation": "後継者の税負担を軽減する事業承継税制（納税猶予制度）が設けられている。", "wrongNote": "インボイス制度は消費税の仕入税額控除に関する制度、ふるさと納税制度や住宅ローン控除制度は事業承継とは異なる分野の税制であり、後継者の税負担軽減に関する制度は事業承継税制です。", "id": 407}, {"category": "法務・人事", "question": "かつて「下請法」と呼ばれていた法律が改正・改称されて2026年から適用される新しい名称として正しいものはどれか。", "choices": ["中小受託取引適正化法", "中小企業基本法", "独占禁止法", "下請取適正化法"], "correct": 0, "explanation": "旧下請法は改正され、中小受託取引適正化法として運用されることとなった。", "wrongNote": "独占禁止法や中小企業基本法は別の法律であり、下請取適正化法という略称は正式名称と異なるため、正しい新しい名称は中小受託取引適正化法です。", "id": 408}, {"category": "法務・人事", "question": "経済安全保障の観点から、政府の重要な情報にアクセスできる民間人材等の適格性をあらかじめ確認する制度を何と呼ぶか。", "choices": ["セキュリティ・クリアランス制度", "インボイス制度", "特定技能制度", "マイナンバー制度"], "correct": 0, "explanation": "重要情報にアクセスする人材の適格性を確認する制度をセキュリティ・クリアランス制度と呼ぶ。", "wrongNote": "マイナンバー制度は個人番号による行政手続きの効率化制度、特定技能制度は外国人労働者の在留資格、インボイス制度は消費税に関する制度であり、機密情報アクセス資格の確認制度はセキュリティ・クリアランス制度です。", "id": 409}, {"category": "法務・人事", "question": "従業員が職務上行った発明について、その権利の帰属や対価に関するルールを定めている法律はどれか。", "choices": ["著作権法", "特許法（職務発明制度）", "商標法", "労働基準法"], "correct": 1, "explanation": "職務発明に関するルールは特許法に定められている。", "wrongNote": "労働基準法は労働条件全般、著作権法は創作的表現の保護、商標法はマーク・名称の保護に関する法律であり、職務発明のルールを定めるのは特許法です。", "id": 410}, {"category": "法務・人事", "question": "社会人が新しい知識やスキルを学び直し、変化する仕事内容に対応できるようにすることを何と呼ぶか。", "choices": ["ジョブローテーション", "アウトプレースメント", "リスキリング", "OJT"], "correct": 2, "explanation": "職務内容の変化に対応するための学び直しはリスキリングと呼ばれる。", "wrongNote": "アウトプレースメントは再就職支援、ジョブローテーションは社内での配置転換、OJTは実務を通じた教育訓練を指し、学び直しによる能力再構築はリスキリングです。", "id": 411}, {"category": "法務・人事", "question": "日本企業でジョブ型雇用の導入が進む背景として指摘されている要因はどれか。", "choices": ["新卒一括採用をさらに拡大する狙い", "専門性の高い人材を確保し、処遇を職務内容に応じて明確化する狙い", "終身雇用をより強化する狙い", "年功序列賃金をより徹底する狙い"], "correct": 1, "explanation": "専門人材の確保と職務に応じた処遇の明確化がジョブ型雇用導入の狙いとされる。", "wrongNote": "終身雇用の強化や新卒一括採用の拡大、年功序列の徹底はジョブ型雇用の方向性とは逆であり、導入の狙いは専門人材確保と職務に応じた処遇明確化です。", "id": 412}, {"category": "法務・人事", "question": "日本の公的年金制度における「3階建て」構造のうち、全国民共通の基礎部分を担う制度はどれか。", "choices": ["企業年金", "国民年金", "個人年金保険", "厚生年金"], "correct": 1, "explanation": "全国民共通の基礎年金部分を担うのは国民年金。", "wrongNote": "厚生年金は会社員・公務員が加入する2階部分、企業年金や個人年金保険はさらに上乗せとなる3階部分にあたり、全国民共通の基礎部分は国民年金です。", "id": 413}, {"category": "法務・人事", "question": "加入者が自ら掛金を拠出し、自身で運用方法を選んで将来の給付を受け取る私的年金制度を何と呼ぶか。", "choices": ["iDeCo（個人型確定拠出年金）", "健康保険", "厚生年金", "国民年金"], "correct": 0, "explanation": "個人が拠出・運用を行う私的年金制度はiDeCoと呼ばれる。", "wrongNote": "国民年金や厚生年金は公的年金制度、健康保険は医療保険制度であり、個人が拠出・運用を行う私的年金はiDeCoです。", "id": 414}, {"category": "法務・人事", "question": "高年齢者雇用と年金制度の関係に関する近年の課題として指摘されているものはどれか。", "choices": ["高齢者の雇用を一律に禁止すること", "年金支給額を一律に廃止すること", "年金保険料の徴収を全面的に停止すること", "年金支給開始年齢と雇用確保年齢のギャップをどう埋めるか"], "correct": 3, "explanation": "年金支給開始年齢と雇用確保年齢との間のギャップをどう埋めるかが課題となっている。", "wrongNote": "年金支給額の一律廃止や高齢者雇用の一律禁止、保険料徴収の全面停止は実際の政策動向とは異なり、課題として指摘されているのは支給開始年齢と雇用確保年齢のギャップです。", "id": 415}, {"category": "法務・人事", "question": "フリーランスとして業務委託を受ける個人事業者の取引適正化を目的として2024年に施行された法律を何と呼ぶか。", "choices": ["下請法", "フリーランス新法（特定受託事業者に係る取引の適正化等に関する法律）", "職業安定法", "労働者派遣法"], "correct": 1, "explanation": "フリーランスとの取引適正化を目的とした新法が2024年に施行された。", "wrongNote": "労働者派遣法は派遣就業を規律する法律、下請法・職業安定法もそれぞれ別の取引・雇用に関する法律であり、フリーランスとの取引を対象とした新法はフリーランス新法です。", "id": 416}, {"category": "法務・人事", "question": "顧客等からの著しい迷惑行為から従業員を守るための企業の取り組みを一般に何と呼ぶか。", "choices": ["パワーハラスメント対策", "セクシュアルハラスメント対策", "カスタマーハラスメント対策", "マタニティハラスメント対策"], "correct": 2, "explanation": "顧客等からの迷惑行為への対応はカスタマーハラスメント対策と呼ばれる。", "wrongNote": "パワーハラスメント対策は職場内の上下関係を利用した嫌がらせへの対応、セクシュアルハラスメント対策やマタニティハラスメント対策もそれぞれ別の類型への対応であり、顧客等からの迷惑行為への対応はカスタマーハラスメント対策です。", "id": 417}, {"category": "法務・人事", "question": "企業の女性活躍推進の一環として、近年上場企業に開示が求められるようになっている情報はどれか。", "choices": ["従業員の血液型構成", "女性役員比率などの多様性に関する指標", "男性社員の平均身長", "従業員の出身地構成"], "correct": 1, "explanation": "女性役員比率など多様性に関する指標の開示が求められるようになっている。", "wrongNote": "男性社員の平均身長や血液型構成、出身地構成は開示が求められている情報ではなく、実際に求められているのは女性役員比率などの多様性指標です。", "id": 418}, {"category": "法務・人事", "question": "副業・兼業を行う労働者について、労働基準法上の労働時間の扱いに関する原則として正しいものはどれか。", "choices": ["副業の労働時間には労基法が適用されない", "副業は労働時間規制の対象外である", "本業と副業の労働時間は通算して管理される", "本業と副業の労働時間は一切通算されない"], "correct": 2, "explanation": "労働基準法上、複数事業所での労働時間は通算して管理する必要がある。", "wrongNote": "労働時間が一切通算されない、副業に労基法が適用されない、労働時間規制の対象外という説明はいずれも誤りであり、正しくは本業・副業の労働時間を通算して管理する原則です。", "id": 419}, {"category": "法務・人事", "question": "正社員と非正規雇用労働者の待遇差の合理性が争われた裁判で、最高裁判所が採用してきた基本的な判断枠組みはどれか。", "choices": ["職務内容・配置転換の範囲等の実態を踏まえ、個々の待遇ごとに不合理性を判断する枠組み", "正社員との待遇差は常に合理的とする枠組み", "非正規雇用労働者には一切の待遇差が認められないとする枠組み", "待遇差の合理性は一切審査しないとする枠組み"], "correct": 0, "explanation": "最高裁は職務内容等の実態を踏まえ、個々の手当・待遇ごとに不合理性を判断する枠組みを採用してきた。", "wrongNote": "一切の待遇差を認めない、常に合理的とする、審査しないという枠組みはいずれも実際の判例の考え方とは異なり、正しくは実態を踏まえて個別に不合理性を判断する枠組みです。", "id": 420}, {"category": "法務・人事", "question": "日本における労働組合の組織率（雇用者に占める組合員の割合）の近年の傾向として正しいものはどれか。", "choices": ["長期的に低下傾向が続いている", "一貫してほぼ100％である", "統計として公表されていない", "長期的に上昇傾向が続いている"], "correct": 0, "explanation": "労働組合の組織率は長期的に低下傾向が続いている。", "wrongNote": "上昇傾向やほぼ100％という説明、統計未公表という説明は実態と異なり、正しくは長期的な低下傾向が続いている点です。", "id": 421}, {"category": "法務・人事", "question": "上場企業のコーポレートガバナンス改革の一環として、東京証券取引所が求めている社外取締役に関する要請として正しいものはどれか。", "choices": ["社外取締役の人数に上限を設けること", "社外取締役の設置を一切禁止すること", "取締役全員を社内出身者のみとすること", "独立社外取締役を一定数以上（プライム市場では3分の1以上等）選任すること"], "correct": 3, "explanation": "プライム市場上場企業には独立社外取締役を3分の1以上選任することなどが求められている。", "wrongNote": "社外取締役の設置禁止や社内出身者のみとする方針、人数上限の設定は要請内容と異なり、実際に求められているのは独立社外取締役を一定割合以上選任することです。", "id": 422}, {"category": "法務・人事", "question": "機関投資家が投資先企業と建設的な対話を行い、中長期的な企業価値向上を促す行動原則を何と呼ぶか。", "choices": ["ディスクロージャー制度", "インベスターリレーションズ", "コーポレートガバナンス・コード", "スチュワードシップ・コード"], "correct": 3, "explanation": "機関投資家向けの行動原則はスチュワードシップ・コードと呼ばれる。", "wrongNote": "コーポレートガバナンス・コードは企業側に向けた原則であり、インベスターリレーションズやディスクロージャー制度は別の概念であるため、機関投資家向けの行動原則はスチュワードシップ・コードです。", "id": 423}, {"category": "法務・人事", "question": "会社法上、大会社等に義務付けられている、業務の適正性を確保するための体制を何と呼ぶか。", "choices": ["社外取締役会", "内部統制システム", "監査役会設置制度", "委員会設置制度"], "correct": 1, "explanation": "業務の適正性を確保する体制の構築は内部統制システムと呼ばれる。", "wrongNote": "社外取締役会や監査役会設置制度、委員会設置制度はガバナンス機構の一部を指す言葉であり、業務適正性確保のための体制全体を指すのは内部統制システムです。", "id": 424}, {"category": "法務・人事", "question": "インサイダー取引を行った者に対し、金融商品取引法に基づき課される行政上の金銭的な制裁を何と呼ぶか。", "choices": ["課徴金", "科料", "罰金", "延滞税"], "correct": 0, "explanation": "インサイダー取引には行政上の制裁として課徴金が課される（刑事罰の対象となる場合もある）。", "wrongNote": "罰金・科料は刑事罰の一種、延滞税は税金の納付遅延に対する制裁であり、金融商品取引法に基づく行政上の金銭的制裁は課徴金です。", "id": 425}, {"category": "法務・人事", "question": "デジタルプラットフォーム事業者と取引事業者との取引条件の開示等を求める法律を何と呼ぶか。", "choices": ["独占禁止法", "電気通信事業法", "消費者契約法", "デジタルプラットフォーム取引透明化法"], "correct": 3, "explanation": "プラットフォーム事業者の取引条件開示等を求める法律はデジタルプラットフォーム取引透明化法と呼ばれる。", "wrongNote": "独占禁止法や電気通信事業法、消費者契約法は関連する別の法律であり、プラットフォーム事業者に取引条件の開示等を求める法律はデジタルプラットフォーム取引透明化法です。", "id": 426}, {"category": "法務・人事", "question": "消費者が事業者による不当な勧誘によって誤認・困惑して契約した場合に、契約を取り消せる権利を定めている法律はどれか。", "choices": ["下請法", "独占禁止法", "特定商取引法", "消費者契約法"], "correct": 3, "explanation": "不当勧誘による契約の取消権は消費者契約法に定められている。", "wrongNote": "独占禁止法や下請法は事業者間の取引に関する法律、特定商取引法は訪問販売等の特定取引形態を規律する法律であり、不当勧誘による契約取消権を定めるのは消費者契約法です。", "id": 427}, {"category": "法務・人事", "question": "訪問販売等で契約後一定期間内であれば無条件で契約を解除できる制度を何と呼ぶか。", "choices": ["消費者契約取消制度", "瑕疵担保責任制度", "クーリングオフ制度", "中途解約制度"], "correct": 2, "explanation": "一定期間内に無条件で契約解除できる制度はクーリングオフ制度と呼ばれる。", "wrongNote": "消費者契約取消制度は不当勧誘等を理由とする取消しに関する制度、中途解約制度や瑕疵担保責任制度も別の法的制度であり、無条件解除ができる制度はクーリングオフ制度です。", "id": 428}, {"category": "法務・人事", "question": "使用者が労働者の生命・身体等の安全を確保しつつ労働できるよう配慮すべき義務を何と呼ぶか。", "choices": ["説明義務", "善管注意義務", "安全配慮義務", "忠実義務"], "correct": 2, "explanation": "労働契約に付随して使用者が負う安全確保の義務は安全配慮義務と呼ばれる。", "wrongNote": "善管注意義務や忠実義務は主に取締役が会社に対して負う義務、説明義務は契約締結時の情報提供義務であり、労働者の安全確保に関する使用者の義務は安全配慮義務です。", "id": 429}, {"category": "法務・人事", "question": "人手不足が深刻な業種において外国人労働者の受け入れを拡大する近年の政策動向として正しいものはどれか。", "choices": ["外国人労働者向けの在留資格をすべて廃止した", "特定技能制度の対象分野の拡大など、受け入れ拡大に向けた制度整備が進められている", "外国人労働者の受け入れを全面的に禁止する方針に転換した", "技能実習制度がそのまま無期限に維持されることが決定した"], "correct": 1, "explanation": "人手不足分野を中心に特定技能制度の対象拡大など受け入れ拡大の制度整備が進んでいる。", "wrongNote": "全面禁止への転換や技能実習制度の無期限維持決定、在留資格の全廃はいずれも実態と異なり、実際には特定技能制度の対象拡大など受け入れ拡大の方向で制度整備が進められています。", "id": 430}, {"category": "法務・人事", "question": "企業の内部通報制度に関して、通報者が特定されないよう配慮する目的として正しいものはどれか。", "choices": ["通報者への不利益な取り扱いを防ぎ、通報をしやすくするため", "通報内容の信頼性を高めるため", "会社の情報開示義務を軽減するため", "通報件数を意図的に減らすため"], "correct": 0, "explanation": "匿名性への配慮は、通報者が不利益を受けずに安心して通報できるようにするためのもの。", "wrongNote": "通報内容の信頼性向上や情報開示義務の軽減、通報件数の意図的な削減は匿名性配慮の目的とは異なり、正しくは通報者への不利益取り扱いを防ぐことです。", "id": 431}, {"category": "法務・人事", "question": "企業が自社の事業活動が人権に与える影響を特定・防止・軽減するために行う取り組みを何と呼ぶか。", "choices": ["財務デューデリジェンス", "法務デューデリジェンス", "M&Aデューデリジェンス", "人権デューデリジェンス"], "correct": 3, "explanation": "事業活動が人権に与える影響を評価・対応する取り組みは人権デューデリジェンスと呼ばれる。", "wrongNote": "M&Aデューデリジェンスや財務・法務デューデリジェンスはM&A等の取引前調査を指す言葉であり、人権への影響評価を指す取り組みは人権デューデリジェンスです。", "id": 432}, {"category": "マーケティング・販売", "question": "経営学者ドラッカーが示した、マーケティングの理想は販売を不要にすることだという考え方の前提となる、企業の目的についての主張はどれか。", "choices": ["企業の目的は競合に勝つことのみである", "企業の目的は顧客を創造することである", "企業の目的は株主還元を最大化することのみである", "企業の目的は利益を最大化することのみである"], "correct": 1, "explanation": "ドラッカーは企業の目的を「顧客の創造」であると位置づけた。", "wrongNote": "利益最大化のみ、競合に勝つことのみ、株主還元最大化のみといった説明はドラッカーの主張の核心とは異なり、彼が強調したのは顧客創造という目的です。", "id": 433}, {"category": "マーケティング・販売", "question": "コトラーが提唱した「マーケティング5.0」で強調されている考え方として正しいものはどれか。", "choices": ["製品中心のマス・マーケティングへの回帰", "価格競争のみに依存するマーケティング", "デジタル技術と人間中心の視点を融合させたマーケティング", "広告を一切使わないマーケティング"], "correct": 2, "explanation": "マーケティング5.0はテクノロジーと人間中心主義を融合させる考え方とされる。", "wrongNote": "製品中心のマス・マーケティングへの回帰や広告を使わない手法、価格競争への依存はマーケティング5.0の趣旨とは異なり、強調されているのはデジタル技術と人間中心の視点の融合です。", "id": 434}, {"category": "マーケティング・販売", "question": "インターネット広告の配信技術のうち、広告主側が広告枠を効率的に買い付けるためのプラットフォームを何と呼ぶか。", "choices": ["SSP", "CRM", "DSP（デマンドサイドプラットフォーム）", "CMS"], "correct": 2, "explanation": "広告主側の広告枠買い付けを支援する仕組みはDSPと呼ばれる。", "wrongNote": "SSPは媒体社側が広告枠を売るためのプラットフォーム、CMSはコンテンツ管理システム、CRMは顧客関係管理システムであり、広告主側の買い付け支援システムはDSPです。", "id": 435}, {"category": "マーケティング・販売", "question": "提携先のサイトに広告を掲載し、成果（購入等）が発生した場合に報酬が支払われる広告手法を何と呼ぶか。", "choices": ["マス広告", "交通広告", "純広告", "アフィリエイト広告"], "correct": 3, "explanation": "成果報酬型の広告手法はアフィリエイト広告と呼ばれる。", "wrongNote": "純広告は掲載枠を買い切る形式、マス広告はテレビ・新聞等の広告、交通広告は電車・バス等の広告であり、成果連動型の広告はアフィリエイト広告です。", "id": 436}, {"category": "マーケティング・販売", "question": "複数の媒体の広告枠を束ねて一括で広告を配信する仕組みを何と呼ぶか。", "choices": ["リスティング広告", "純広告", "アドネットワーク", "ネイティブ広告"], "correct": 2, "explanation": "複数媒体の広告枠を束ねて配信する仕組みはアドネットワークと呼ばれる。", "wrongNote": "純広告は特定の掲載枠を買い切る形式、リスティング広告は検索連動型広告、ネイティブ広告はコンテンツになじむ形式の広告であり、複数媒体を束ねる仕組みはアドネットワークです。", "id": 437}, {"category": "マーケティング・販売", "question": "同じ商品でも顧客の属性や購入条件に応じて異なる価格を設定する価格戦略を何と呼ぶか。", "choices": ["コストプラス価格戦略", "価格差別", "均一価格戦略", "名声価格戦略"], "correct": 1, "explanation": "顧客ごとに異なる価格を設定する戦略は価格差別と呼ばれる。", "wrongNote": "均一価格戦略は一律の価格設定、コストプラス価格戦略は原価に利益を上乗せする方式、名声価格戦略は高級イメージのための高価格設定であり、顧客属性等に応じた価格の使い分けは価格差別です。", "id": 438}, {"category": "マーケティング・販売", "question": "需要と供給の状況に応じて価格をリアルタイムに変動させる仕組みを何と呼ぶか。", "choices": ["均一価格戦略", "端数価格戦略", "上澄み吸収価格戦略", "ダイナミックプライシング"], "correct": 3, "explanation": "需給状況に応じて価格を変動させる仕組みはダイナミックプライシングと呼ばれる。", "wrongNote": "均一価格戦略は一律の価格設定、上澄み吸収価格戦略は新製品投入時の高価格設定、端数価格戦略は端数で割安感を演出する手法であり、需給に応じたリアルタイムの価格変動はダイナミックプライシングです。", "id": 439}, {"category": "マーケティング・販売", "question": "定額課金モデルを提供する企業が、顧客ごとの生涯価値を最大化するために重視する経営指標として正しいものはどれか。", "choices": ["自己資本比率", "PER（株価収益率）", "貿易収支", "LTV（顧客生涯価値）とチャーンレート（解約率）"], "correct": 3, "explanation": "サブスクリプション事業ではLTVとチャーンレートが重要な経営指標となる。", "wrongNote": "PERや自己資本比率、貿易収支はサブスクリプション事業の顧客収益性を直接測る指標ではなく、重視されるのはLTVとチャーンレートです。", "id": 440}, {"category": "マーケティング・販売", "question": "すべての商取引に占める電子商取引の割合を示す指標を何と呼ぶか。", "choices": ["EC浸透率", "デジタル化率", "オンライン比率", "EC化率"], "correct": 3, "explanation": "商取引全体に占める電子商取引の割合はEC化率と呼ばれる。", "wrongNote": "EC浸透率・デジタル化率・オンライン比率という用語は日経TESTで用いられる正式名称ではなく、商取引全体に占めるECの割合は一般にEC化率と呼ばれます。", "id": 441}, {"category": "マーケティング・販売", "question": "小売企業が実店舗とECの垣根をなくし、在庫情報の共有や店舗受け取りサービスなどを提供する取り組みの具体例として正しいものはどれか。", "choices": ["ネットで注文した商品を店舗で受け取れるサービス", "店舗のみで完結する現金決済", "在庫情報を店舗とECで別々に管理する運営", "ECサイトを一切持たない実店舗運営"], "correct": 0, "explanation": "オンラインとオフラインの購買体験を一体化する取り組みの一例として、店舗受け取りサービスなどが挙げられる。", "wrongNote": "店舗のみでの現金決済やECサイトを持たない運営、在庫情報を別管理する運営はオンラインとオフラインを融合させる方向性とは逆であり、具体例としてはネット注文の店舗受け取りサービスなどが挙げられます。", "id": 442}, {"category": "マーケティング・販売", "question": "D2Cブランドの多くが顧客との関係構築に活用している主なチャネルとして正しいものはどれか。", "choices": ["SNSを通じた直接的な情報発信とコミュニケーション", "新聞広告のみへの依存", "訪問販売のみへの依存", "テレビCMのみへの依存"], "correct": 0, "explanation": "D2Cブランドは中間流通を介さない分、SNSを通じた直接的な顧客との関係構築を重視することが多い。", "wrongNote": "テレビCMや新聞広告、訪問販売のみへの依存はD2Cブランドの一般的な特徴とは異なり、重視されるのはSNSを通じた直接的な情報発信とコミュニケーションです。", "id": 443}, {"category": "マーケティング・販売", "question": "食料品や日用品を中心に幅広い商品を扱う小売業態で、地域密着型の店舗展開が特徴とされる業態はどれか。", "choices": ["スーパーマーケット", "専門店", "ディスカウントストア", "百貨店"], "correct": 0, "explanation": "食料品・日用品を中心に地域密着で展開する業態はスーパーマーケットが代表的。", "wrongNote": "百貨店は高級品を中心とした大型店舗、専門店やディスカウントストアのみという限定は不正確であり、地域密着型の食品・日用品店の代表はスーパーマーケットです。", "id": 444}, {"category": "マーケティング・販売", "question": "コンビニエンスストア業界で、特定地域に集中して出店することで配送効率やブランド認知を高める戦略を何と呼ぶか。", "choices": ["ブルーオーシャン戦略", "垂直統合戦略", "ニッチ戦略", "ドミナント戦略"], "correct": 3, "explanation": "特定地域への集中出店戦略はドミナント戦略と呼ばれる。", "wrongNote": "ニッチ戦略は特定の小規模市場への特化、ブルーオーシャン戦略は競争のない市場開拓、垂直統合戦略はサプライチェーンの一貫化を指し、地域集中出店の戦略はドミナント戦略です。", "id": 445}, {"category": "マーケティング・販売", "question": "ドラッグストア業態が近年収益力を高めている要因として挙げられるものはどれか。", "choices": ["医薬品販売のみへの特化強化", "店舗数の一律削減", "営業時間の一律短縮", "調剤薬局機能や食品販売の強化による来店頻度の向上"], "correct": 3, "explanation": "調剤機能や食品取り扱いの強化により来店頻度が高まり収益力向上につながっているとされる。", "wrongNote": "医薬品販売のみへの特化強化や店舗数の削減、営業時間の短縮は収益力向上の要因とは異なり、実際には調剤・食品強化による来店頻度向上が要因として挙げられます。", "id": 446}, {"category": "マーケティング・販売", "question": "モノの所有よりも体験や思い出を重視する消費の傾向を発展させ、「意味」や特別な瞬間を重視する消費のあり方を指す近年の言葉として挙げられるものはどれか。", "choices": ["バーター消費", "モノ消費", "イミ消費・トキ消費", "代理消費"], "correct": 2, "explanation": "モノ消費・コト消費に続く概念として「意味」や特別な瞬間を重視するイミ消費・トキ消費が挙げられる。", "wrongNote": "モノ消費は所有そのものを重視する消費、バーター消費や代理消費は別の消費形態を指し、意味や瞬間を重視する近年の概念はイミ消費・トキ消費です。", "id": 447}, {"category": "マーケティング・販売", "question": "支払う費用に対して得られる価値の大きさを重視する消費者の考え方を何と呼ぶか。", "choices": ["トキ消費", "タイパ", "イミ消費", "コスパ（コストパフォーマンス）"], "correct": 3, "explanation": "費用対効果を重視する考え方はコストパフォーマンス（コスパ）と呼ばれる。", "wrongNote": "タイパは時間対効果、イミ消費やトキ消費は意味や瞬間を重視する消費傾向を指し、費用対効果を重視する考え方はコスパです。", "id": 448}, {"category": "マーケティング・販売", "question": "かけた時間に対して得られる満足度の大きさを重視する消費者の考え方を何と呼ぶか。", "choices": ["タイパ（タイムパフォーマンス）", "コスパ", "モノ消費", "コト消費"], "correct": 0, "explanation": "時間対効果を重視する考え方はタイムパフォーマンス（タイパ）と呼ばれる。", "wrongNote": "コスパは費用対効果、モノ消費やコト消費は所有・体験を重視する消費傾向を指し、時間対効果を重視する考え方はタイパです。", "id": 449}, {"category": "マーケティング・販売", "question": "高齢化の進展を背景に拡大が見込まれる消費市場を指す言葉として正しいものはどれか。", "choices": ["Z世代市場", "シニア市場", "ミレニアル市場", "α世代市場"], "correct": 1, "explanation": "高齢化に伴い拡大が見込まれる消費市場はシニア市場と呼ばれる。", "wrongNote": "Z世代市場やα世代市場、ミレニアル市場は若年層の消費市場を指す言葉であり、高齢化に伴い拡大が見込まれる市場はシニア市場です。", "id": 450}, {"category": "マーケティング・販売", "question": "1990年代後半以降に生まれ、SNSを通じた情報収集や発信を当たり前に行う世代を一般に何と呼ぶか。", "choices": ["バブル世代", "Z世代", "α世代", "団塊世代"], "correct": 1, "explanation": "1990年代後半以降生まれの世代はZ世代と呼ばれる。", "wrongNote": "団塊世代やバブル世代は日本の特定の高齢層を指す言葉、α世代はZ世代よりさらに後の世代を指すため、SNSを当たり前に使う世代はZ世代です。", "id": 451}, {"category": "マーケティング・販売", "question": "2010年代前半以降に生まれ、生まれたときからデジタル機器やAIが身近に存在する世代を何と呼ぶか。", "choices": ["α世代", "ミレニアル世代", "団塊ジュニア世代", "Z世代"], "correct": 0, "explanation": "2010年代前半以降生まれの世代はα世代と呼ばれる。", "wrongNote": "Z世代はα世代より前の世代、ミレニアル世代や団塊ジュニア世代はさらに古い世代を指すため、生まれた時からデジタルが身近な最も新しい世代はα世代です。", "id": 452}, {"category": "マーケティング・販売", "question": "日本経済新聞社系のメディアが毎年発表している、その年のヒット商品やサービスを番付形式でまとめたものを何と呼ぶか。", "choices": ["日経平均株価", "日経景気インデックス", "日経消費者物価指数", "日経MJヒット商品番付"], "correct": 3, "explanation": "日経MJが毎年発表するヒット商品のランキング形式のまとめはヒット商品番付と呼ばれる。", "wrongNote": "日経平均株価は株価指数、日経景気インデックスや日経消費者物価指数という名称の指標は一般的でなく、ヒット商品をまとめた企画は日経MJヒット商品番付です。", "id": 453}, {"category": "マーケティング・販売", "question": "消費者の購買行動を分析するうえで、話題になった映画や商品のヒット要因を理解しておくことが役立つとされる理由として正しいものはどれか。", "choices": ["ヒット商品はすべて政府主導で生み出されているため", "過去のヒット商品は今後も同じ売上を必ず記録するため", "映画の興行収入は日本のGDPを直接左右するため", "消費トレンドの担い手や新商品の動向を把握する手がかりになるため"], "correct": 3, "explanation": "ヒット商品・コンテンツの背景を知ることは消費トレンドの理解に役立つとされる。", "wrongNote": "過去のヒット商品が今後も同じ売上を記録する保証はなく、映画の興行収入がGDPを直接左右するわけでもなく、ヒット商品が政府主導で生まれるわけでもないため、正しい理由は消費トレンド把握の手がかりになる点です。", "id": 454}, {"category": "マーケティング・販売", "question": "マーケティングに関する理論家のうち、「マーケティング近視眼」という概念を提唱したことで知られるのは誰か。", "choices": ["マイケル・ポーター", "ピーター・ドラッカー", "セオドア・レビット", "フィリップ・コトラー"], "correct": 2, "explanation": "「マーケティング近視眼」はセオドア・レビットが提唱した概念。", "wrongNote": "マイケル・ポーターは競争戦略論、ピーター・ドラッカーは経営学一般、フィリップ・コトラーはマーケティングの体系化で知られる論者であり、マーケティング近視眼の提唱者はセオドア・レビットです。", "id": 455}, {"category": "マーケティング・販売", "question": "「マーケティング近視眼」の概念が指摘する、企業が陥りやすい誤りとして正しいものはどれか。", "choices": ["価格を必要以上に下げすぎること", "顧客ニーズを重視しすぎて製品開発を怠ること", "広告費を必要以上にかけすぎること", "自社の事業を製品軸で狭く定義し、顧客ニーズの変化を見失うこと"], "correct": 3, "explanation": "事業を製品軸で狭く捉え、顧客ニーズの本質を見失う誤りを指摘した概念。", "wrongNote": "顧客ニーズの重視しすぎや広告費のかけすぎ、価格の下げすぎはマーケティング近視眼が指摘する誤りとは異なり、正しくは事業を製品軸で狭く定義してしまう誤りです。", "id": 456}, {"category": "マーケティング・販売", "question": "顧客がブランドに対してどの程度の忠誠心・愛着を持っているかを測る考え方を何と呼ぶか。", "choices": ["ブランドエクイティ", "ブランドロイヤルティ", "ブランドポジショニング", "ブランドアイデンティティ"], "correct": 1, "explanation": "顧客のブランドへの忠誠心を測る考え方はブランドロイヤルティと呼ばれる。", "wrongNote": "ブランドエクイティはブランドの無形資産価値全般、ブランドアイデンティティはブランドが目指す自己像、ブランドポジショニングは市場内での位置づけを指し、忠誠心を測る考え方はブランドロイヤルティです。", "id": 457}, {"category": "マーケティング・販売", "question": "顧客が商品・サービスの利用を通じて得る体験全体の質を重視する考え方を何と呼ぶか。", "choices": ["カスタマージャーニー", "カスタマーサクセス", "カスタマーエクスペリエンス（CX）", "カスタマーサポート"], "correct": 2, "explanation": "利用体験全体の質を重視する考え方はカスタマーエクスペリエンス（CX）と呼ばれる。", "wrongNote": "カスタマーサクセスは顧客の成功支援に焦点を当てた活動、カスタマーサポートは問い合わせ対応、カスタマージャーニーは行動プロセスの可視化を指し、体験全体の質を指す概念はCXです。", "id": 458}, {"category": "マーケティング・販売", "question": "訪日外国人ではなく、海外の消費者がインターネットを通じて日本の商品を購入する取引を何と呼ぶか。", "choices": ["アウトバウンド消費", "国内EC", "越境EC", "インバウンド消費"], "correct": 2, "explanation": "海外の消費者がネット経由で購入する取引は越境ECと呼ばれる。", "wrongNote": "インバウンド消費は訪日中の消費、アウトバウンド消費は日本人の海外消費、国内ECは国内向けの電子商取引を指し、海外からのオンライン購入は越境ECです。", "id": 459}, {"category": "マーケティング・販売", "question": "小売業がAIなどを活用して将来の売れ行きを予測し、在庫の過不足を減らす取り組みを何と呼ぶか。", "choices": ["見込み生産の廃止", "在庫放棄", "需要予測（デマンドフォーキャスティング）", "一律発注方式"], "correct": 2, "explanation": "AI等を用いた将来の需要予測に基づく在庫最適化の取り組みが進んでいる。", "wrongNote": "在庫放棄や見込み生産の廃止、一律発注方式は在庫最適化の取り組みとは異なり、正しくはAI等を用いた需要予測です。", "id": 460}, {"category": "マーケティング・販売", "question": "サブスクリプションサービスにおいて、契約直後の顧客が製品の価値を実感できるよう支援し、早期解約を防ぐ取り組みを何と呼ぶか。", "choices": ["オンボーディング", "コンバージョン率", "チャーンレート", "リテンション率"], "correct": 0, "explanation": "契約初期の顧客支援により早期解約を防ぐ取り組みはオンボーディングと呼ばれる。", "wrongNote": "チャーンレートは解約率そのものを示す指標、リテンション率は継続利用率、コンバージョン率は目的行動達成率を示す指標であり、契約初期の支援施策はオンボーディングです。", "id": 461}, {"category": "マーケティング・販売", "question": "松・竹・梅のように3段階の価格帯を用意し、多くの顧客が真ん中の価格帯を選びやすくなる価格設定の傾向を何と呼ぶか。", "choices": ["上澄み吸収価格戦略", "市場浸透価格戦略", "松竹梅の法則（極端の回避性）", "端数価格効果"], "correct": 2, "explanation": "3段階の価格帯を提示すると真ん中が選ばれやすくなる傾向は松竹梅の法則（極端の回避性）と呼ばれる。", "wrongNote": "端数価格効果は端数表示による割安感の演出、上澄み吸収価格戦略や市場浸透価格戦略は新製品投入時の価格設定手法であり、3段階提示で真ん中が選ばれやすくなる傾向は松竹梅の法則です。", "id": 462}, {"category": "マーケティング・販売", "question": "Webサイトが訪問者の閲覧履歴等を記録する仕組みに対する規制強化の動きが、広告手法にどのような影響を与えているか。", "choices": ["広告費が一律に無料化される方向にある", "個人を特定しやすい広告配信の手法が制約を受けつつある", "個人情報の利用が完全に自由化されている", "広告配信の精度向上には一切影響しない"], "correct": 1, "explanation": "Cookie規制の強化により、個人を特定しやすい広告配信手法は制約を受けつつある。", "wrongNote": "広告配信精度への無影響や広告費の無料化、個人情報利用の完全自由化という説明は実態と異なり、正しくは個人特定型の広告配信が制約を受けつつある点です。", "id": 463}, {"category": "生産・テクノロジー", "question": "経済学者シュンペーターが経済発展の原動力として示した、新しい生産方法や製品、市場の組み合わせを生み出すことを何と呼んだか。", "choices": ["比較優位", "範囲の経済", "規模の経済", "新結合（イノベーション）"], "correct": 3, "explanation": "シュンペーターは経済発展の原動力を新結合（イノベーション）と呼んだ。", "wrongNote": "規模の経済・範囲の経済はコスト構造に関する概念、比較優位は貿易理論の概念であり、シュンペーターが示した経済発展の原動力は新結合（イノベーション）です。", "id": 464}, {"category": "生産・テクノロジー", "question": "新しい製品やサービスそのものを生み出す革新を何と呼ぶか。", "choices": ["組織イノベーション", "マーケティングイノベーション", "プロセスイノベーション", "プロダクトイノベーション"], "correct": 3, "explanation": "新製品・新サービスを生み出す革新はプロダクトイノベーションと呼ばれる。", "wrongNote": "プロセスイノベーションは生産工程の革新、マーケティングイノベーションや組織イノベーションはそれぞれ別領域の革新を指し、製品自体の革新はプロダクトイノベーションです。", "id": 465}, {"category": "生産・テクノロジー", "question": "製品そのものではなく、製造工程や業務プロセスを改善する革新を何と呼ぶか。", "choices": ["持続的イノベーション", "破壊的イノベーション", "プロセスイノベーション", "プロダクトイノベーション"], "correct": 2, "explanation": "工程・プロセスの改善に関する革新はプロセスイノベーションと呼ばれる。", "wrongNote": "プロダクトイノベーションは製品自体の革新、破壊的イノベーションや持続的イノベーションは革新の性質による分類であり、工程改善に関する革新はプロセスイノベーションです。", "id": 466}, {"category": "生産・テクノロジー", "question": "工場における人手作業を機械やロボットに置き換え、生産効率と品質を高める取り組みを何と呼ぶか。", "choices": ["在庫の無計画な積み増し", "品質検査の全廃", "生産の完全人力化", "生産の自動化・省人化"], "correct": 3, "explanation": "機械化・自動化による効率と品質の向上は自動化・省人化と呼ばれる。", "wrongNote": "完全人力化や無計画な在庫積み増し、品質検査の全廃は生産効率向上の取り組みとは逆であり、正しくは自動化・省人化です。", "id": 467}, {"category": "生産・テクノロジー", "question": "個々の顧客の要望に応じたカスタマイズ製品を、大量生産に近いコストで提供する生産方式を何と呼ぶか。", "choices": ["少量生産方式", "マスカスタマイゼーション", "受注生産方式", "大量生産方式"], "correct": 1, "explanation": "大量生産の効率性と個別対応を両立させる方式はマスカスタマイゼーションと呼ばれる。", "wrongNote": "大量生産方式は画一的な製造、少量生産方式や受注生産方式はそれぞれ別の生産形態を指し、個別対応と効率性を両立する方式はマスカスタマイゼーションです。", "id": 468}, {"category": "生産・テクノロジー", "question": "産油国を中心とする組織が協調して原油の生産量を調整し、価格に影響を与える枠組みを何と呼ぶか。", "choices": ["IAEA", "IEA", "OPECプラス", "WTO"], "correct": 2, "explanation": "OPEC加盟国とロシアなど非加盟産油国が協調減産等を行う枠組みはOPECプラスと呼ばれる。", "wrongNote": "IEAは国際エネルギー機関、IAEAは国際原子力機関、WTOは貿易ルールを扱う機関であり、産油国の協調減産の枠組みはOPECプラスです。", "id": 469}, {"category": "生産・テクノロジー", "question": "液化天然ガスの略称として正しいものはどれか。", "choices": ["LPG", "LNG", "GTL", "CNG"], "correct": 1, "explanation": "液化天然ガスはLNGと略される。", "wrongNote": "LPGは液化石油ガス、CNGは圧縮天然ガス、GTLは天然ガスから液体燃料を合成する技術を指し、液化天然ガスの略称はLNGです。", "id": 470}, {"category": "生産・テクノロジー", "question": "埋蔵量が少なく供給が特定国に偏りやすいことから、経済安全保障上重要視されている金属資源の総称を何と呼ぶか。", "choices": ["貴金属", "鉄鋼原料", "ベースメタル", "レアメタル・レアアース"], "correct": 3, "explanation": "供給が偏在しやすい希少金属はレアメタル・レアアースと呼ばれる。", "wrongNote": "貴金属やベースメタル、鉄鋼原料はそれぞれ別の金属資源の分類であり、供給偏在が経済安全保障上の課題とされる資源はレアメタル・レアアースです。", "id": 471}, {"category": "生産・テクノロジー", "question": "2015年に採択された、気候変動対策に関する国際的な枠組みを何と呼ぶか。", "choices": ["パリ協定", "モントリオール議定書", "京都議定書", "ラムサール条約"], "correct": 0, "explanation": "2015年に採択された気候変動対策の国際枠組みはパリ協定と呼ばれる。", "wrongNote": "京都議定書はパリ協定より前の枠組み、モントリオール議定書はオゾン層保護に関する条約、ラムサール条約は湿地保護に関する条約であり、2015年採択の枠組みはパリ協定です。", "id": 472}, {"category": "生産・テクノロジー", "question": "発電に用いるエネルギー源の組み合わせ・構成比率を何と呼ぶか。", "choices": ["送配電分離", "電源構成（エネルギーミックス）", "スマートグリッド", "電力自由化"], "correct": 1, "explanation": "発電エネルギー源の構成比率は電源構成（エネルギーミックス）と呼ばれる。", "wrongNote": "電力自由化や送配電分離、スマートグリッドは電力制度・技術に関する別の概念であり、エネルギー源の構成比率を指す言葉は電源構成です。", "id": 473}, {"category": "生産・テクノロジー", "question": "東日本大震災後、長期停止していた原子力発電所について、近年見られる動きとして正しいものはどれか。", "choices": ["原子力発電に関する政策議論は行われていない", "すべての原発が恒久的に廃止されることが決定した", "新設が完全に法律で禁止された", "安全審査を経たうえでの再稼働が進められている"], "correct": 3, "explanation": "安全審査をクリアした原発の再稼働が進められている。", "wrongNote": "恒久的廃止の決定や新設の法律による全面禁止、政策議論が行われていないという説明は実態と異なり、実際には安全審査を経た再稼働が進んでいます。", "id": 474}, {"category": "生産・テクノロジー", "question": "従来より小型で工場等での量産化により建設コストの低減が期待される、次世代の原
