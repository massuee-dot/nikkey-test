<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日経TEST 練習問題 300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF0EC;
    --paper-raised:#F7F8F4;
    --ink:#1B2A3F;
    --ink-soft:#54626F;
    --line:#C7CDC4;
    --line-soft:#DDE1D9;
    --seal-correct:#2E6B4F;
    --seal-correct-soft:#E4EFE6;
    --seal-wrong:#B23A2C;
    --seal-wrong-soft:#F3E4DF;
    --gold:#B98A2E;
    --gold-soft:#F1E6CC;
    --serif: 'Shippori Mincho', serif;
    --sans: 'Zen Kaku Gothic New', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(circle at 100% 0%, rgba(185,138,46,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:28px 16px 56px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* ---------- header ---------- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
  }
  header.top .title{
    font-family:var(--serif);
    font-weight:800;
    font-size:22px;
    letter-spacing:.02em;
  }
  header.top .title small{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.08em;
    margin-top:2px;
  }
  header.top .score{
    font-family:var(--mono);
    font-size:13px;
    text-align:right;
    color:var(--ink-soft);
  }
  header.top .score b{
    font-size:20px;
    color:var(--ink);
    font-weight:700;
  }

  /* ---------- category chips ---------- */
  .chiprow{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:700;
    padding:7px 13px;
    border-radius:999px;
    border:1.4px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .toolrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .toolrow .count{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .toolbtn{
    font-family:var(--sans);
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    background:none;
    border:1.4px solid var(--line);
    border-radius:8px;
    padding:6px 11px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .toolbtn:hover{border-color:var(--ink);color:var(--ink);}

  /* ---------- progress ---------- */
  .progress-wrap{margin-bottom:22px;}
  .progress-track{
    height:5px;
    background:var(--line-soft);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--ink));
    width:0%;
    transition:width .3s ease;
  }
  .progress-label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    display:flex;
    justify-content:space-between;
  }

  /* ---------- question card ---------- */
  .card{
    position:relative;
    background:var(--paper-raised);
    border:1.4px solid var(--line);
    border-radius:4px;
    padding:26px 24px 22px;
    box-shadow:0 1px 0 var(--line-soft);
  }
  .qhead{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:6px;
  }
  .qnum{
    font-family:var(--serif);
    font-weight:800;
    font-size:34px;
    color:var(--ink);
    line-height:1;
    flex:0 0 auto;
  }
  .qmeta{
    padding-top:6px;
  }
  .qcat{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.1em;
    color:var(--gold);
    font-weight:700;
    text-transform:uppercase;
  }
  .qtext{
    font-family:var(--sans);
    font-size:16.5px;
    font-weight:700;
    line-height:1.65;
    margin:10px 0 22px;
    padding-left:48px;
  }

  .choices{display:flex;flex-direction:column;gap:9px;padding-left:48px;}
  .choice{
    position:relative;
    display:flex;
    align-items:center;
    gap:12px;
    border:1.4px solid var(--line);
    background:var(--paper);
    border-radius:6px;
    padding:12px 14px;
    cursor:pointer;
    font-size:14.5px;
    line-height:1.5;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .choice:hover:not(.locked){border-color:var(--ink-soft);}
  .choice:active:not(.locked){transform:scale(.995);}
  .choice .mark{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .choice.selected-correct{
    background:var(--seal-correct-soft);
    border-color:var(--seal-correct);
  }
  .choice.selected-correct .mark{border-color:var(--seal-correct);color:var(--seal-correct);background:#fff;}
  .choice.selected-wrong{
    background:var(--seal-wrong-soft);
    border-color:var(--seal-wrong);
  }
  .choice.selected-wrong .mark{border-color:var(--seal-wrong);color:var(--seal-wrong);background:#fff;}
  .choice.reveal-correct:not(.selected-correct){
    border-color:var(--seal-correct);
    border-style:dashed;
  }
  .choice.locked{cursor:default;}

  /* ---------- stamp ---------- */
  .stamp{
    position:absolute;
    top:14px;
    right:16px;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    transform:scale(1.6) rotate(-14deg);
    pointer-events:none;
  }
  .stamp.show{
    animation:stampIn .38s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(1.9) rotate(-18deg);}
    55%{opacity:1; transform:scale(.92) rotate(-10deg);}
    75%{transform:scale(1.06) rotate(-12deg);}
    100%{opacity:1; transform:scale(1) rotate(-10deg);}
  }
  .stamp svg{width:100%;height:100%;}

  /* ---------- explanation ---------- */
  .explain{
    margin:18px 0 4px 48px;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .32s ease, opacity .32s ease, margin .32s ease;
  }
  .explain.show{
    max-height:220px;
    opacity:1;
  }
  .explain-inner{
    border-left:3px solid var(--gold);
    padding:4px 0 4px 14px;
    font-size:13.5px;
    line-height:1.7;
    color:var(--ink-soft);
  }
  .explain-inner b{color:var(--ink);font-weight:700;}

  /* ---------- footer nav ---------- */
  .navrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-left:48px;
  }
  .navbtn{
    font-family:var(--sans);
    font-weight:700;
    font-size:13.5px;
    padding:10px 20px;
    border-radius:7px;
    border:1.4px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .navbtn:disabled{opacity:.35;cursor:not-allowed;}
  .navbtn.ghost{
    background:none;
    color:var(--ink-soft);
    border-color:var(--line);
  }

  /* ---------- empty / done state ---------- */
  .done{
    text-align:center;
    padding:40px 20px;
  }
  .done .bigscore{
    font-family:var(--serif);
    font-size:56px;
    font-weight:800;
  }
  .done .bigscore span{font-family:var(--mono);font-size:24px;color:var(--ink-soft);}
  .breakdown{
    margin-top:26px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .breakdown-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
  }
  .breakdown-row .bname{width:150px;flex:0 0 auto;color:var(--ink-soft);font-weight:700;}
  .breakdown-row .btrack{flex:1;height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden;}
  .breakdown-row .bfill{height:100%;background:var(--seal-correct);}
  .breakdown-row .bnum{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);width:52px;text-align:right;}

  .footnote{
    text-align:center;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.6;
    margin-top:30px;
    letter-spacing:.05em;
  }

  @media (max-width:420px){
    .qtext, .choices, .explain, .navrow{padding-left:0;}
    .qhead{gap:10px;}
    .qnum{font-size:28px;}
    .stamp{width:52px;height:52px;top:10px;right:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title">日経TEST 練習問題<small>ZEN KOKU ISSEI TAISAKU &middot; 300 QUESTIONS</small></div>
    <div class="score">正解 <b id="scoreCorrect">0</b> / <span id="scoreTotal">0</span></div>
  </header>

  <div class="chiprow" id="chipRow"></div>

  <div class="toolrow">
    <span class="count" id="filterCount"></span>
    <button class="toolbtn" id="shuffleBtn">シャッフル</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressLabel">問 1 / 300</span><span id="progressPct">0%</span></div>
  </div>

  <div id="quizArea"></div>

  <div class="footnote">日経TEST 練習問題集（全300問）をもとに自動生成 &middot; 本ツールは非公式の学習補助教材です</div>
</div>

<script id="quiz-data" type="application/json">[{"id": 1, "question": "GDP（国内総生産）に算入されるものはどれか。", "choices": ["中古住宅の売買額", "新築住宅の建設額", "株式の売買差益", "家庭内での家事労働"], "category": "経営環境", "correct": 1, "explanation": "中古品の取引は新規の生産ではないためGDPに算入されない。"}, {"id": 2, "question": "「実質GDP」の説明として正しいものはどれか。", "choices": ["物価変動の影響を除いたGDP", "物価変動を含んだままのGDP", "輸出のみを集計したGDP", "政府支出のみを集計したGDP"], "category": "経営環境", "correct": 0, "explanation": "名目GDPから物価変動分を調整したもの。"}, {"id": 3, "question": "ある国のGDPが前年100兆円から103兆円になった場合の経済成長率はどれか。", "choices": ["0.3％", "3％", "30％", "103％"], "category": "経営環境", "correct": 1, "explanation": "(103-100)/100=3％。"}, {"id": 4, "question": "消費者物価指数（CPI）が測定する対象として正しいものはどれか。", "choices": ["企業間で取引される財の価格", "家計が購入する財・サービスの価格", "輸出品の価格のみ", "株式市場の価格"], "category": "経営環境", "correct": 1, "explanation": "消費者の生計費の変動を示す指標。"}, {"id": 5, "question": "日銀短観（全国企業短期経済観測調査）の調査対象として正しいものはどれか。", "choices": ["全国の消費者", "全国の企業", "全国の自治体", "全国の金融機関のみ"], "category": "経営環境", "correct": 1, "explanation": "全国の企業を対象に業況などを調査。"}, {"id": 6, "question": "景気動向指数のうち、景気に先立って動く「先行指数」に含まれる指標はどれか。", "choices": ["有効求人倍率", "新規求人数（除学卒）", "完全失業率", "法人税収入"], "category": "経営環境", "correct": 1, "explanation": "先行指数は景気に先立って動く指標群。有効求人倍率・失業率は一致指数・遅行指数側。"}, {"id": 7, "question": "「完全失業率」の定義として正しいものはどれか。", "choices": ["労働力人口に占める完全失業者の割合", "総人口に占める失業者の割合", "就業者数に占める非正規雇用者の割合", "生産年齢人口に占める就業者の割合"], "category": "経営環境", "correct": 0, "explanation": "総人口ではなく労働力人口が分母。"}, {"id": 8, "question": "「有効求人倍率」が1を上回っている状態が意味するものはどれか。", "choices": ["求職者数が求人数を上回っている", "求人数が求職者数を上回っている", "完全雇用が達成されている", "失業率が急上昇している"], "category": "経営環境", "correct": 1, "explanation": "1人の求職者に対し1件以上の求人がある状態。"}, {"id": 9, "question": "国際収支のうち、貿易収支・サービス収支・所得収支などをまとめたものはどれか。", "choices": ["資本移転等収支", "金融収支", "経常収支", "外貨準備増減"], "category": "経営環境", "correct": 2, "explanation": "貿易・サービス・所得・二次所得の各収支の合計。"}, {"id": 10, "question": "為替相場が「1ドル=140円」から「1ドル=150円」に変化した場合、これは何と呼ばれるか。", "choices": ["円高", "円安", "ドル安", "変化なし"], "category": "経営環境", "correct": 1, "explanation": "同じ1ドルを得るのにより多くの円が必要＝円の価値が下がった状態。"}, {"id": 11, "question": "中央銀行が政策金利を引き下げる金融緩和の主な狙いとして正しいものはどれか。", "choices": ["物価上昇を抑制する", "企業や個人の資金調達コストを下げ、経済活動を刺激する", "為替を円高に誘導する", "財政赤字を縮小する"], "category": "経営環境", "correct": 1, "explanation": "金融緩和の基本的な狙い。"}, {"id": 12, "question": "「量的緩和」の説明として正しいものはどれか。", "choices": ["中央銀行が国債などを大量に買い入れ、市場に資金を供給する政策", "政府が消費税率を引き下げる政策", "企業が自社株買いを増やす動き", "銀行が貸出金利を引き上げる動き"], "category": "経営環境", "correct": 0, "explanation": "量的緩和の定義。"}, {"id": 13, "question": "「マイナス金利政策」の説明として正しいものはどれか。", "choices": ["銀行が日銀に預ける当座預金の一部に、マイナスの金利を適用する政策", "住宅ローン金利をゼロにする政策", "消費者への貸出を禁止する政策", "為替レートをマイナス表示にする政策"], "category": "経営環境", "correct": 0, "explanation": "2016年に日本でも導入された。"}, {"id": 14, "question": "物価が持続的に上昇し続ける現象を何と呼ぶか。", "choices": ["デフレーション", "インフレーション", "スタグネーション", "リセッション"], "category": "経営環境", "correct": 1, "explanation": "物価の持続的上昇。"}, {"id": 15, "question": "不況下で物価が上昇する現象を何と呼ぶか。", "choices": ["デフレスパイラル", "スタグフレーション", "ハイパーインフレ", "ディスインフレ"], "category": "経営環境", "correct": 1, "explanation": "不況（stagnation）とインフレの合成語。"}, {"id": 16, "question": "「プライマリーバランス」が意味する内容として正しいものはどれか。", "choices": ["税収などの歳入と、国債費を除いた歳出の収支", "輸出と輸入の差額", "家計の貯蓄と消費の差額", "為替相場の需給バランス"], "category": "経営環境", "correct": 0, "explanation": "財政の健全性を測る指標の一つ。"}, {"id": 17, "question": "消費税のような税の分類として正しいものはどれか。", "choices": ["直接税", "間接税", "資産税", "法人税"], "category": "経営環境", "correct": 1, "explanation": "税を負担する人と納める人が異なる税。"}, {"id": 18, "question": "所得が高くなるほど税率が高くなる課税方式を何と呼ぶか。", "choices": ["定額課税", "逆進課税", "累進課税", "比例課税"], "category": "経営環境", "correct": 2, "explanation": "所得税などで採用されている方式。"}, {"id": 19, "question": "G7（主要7カ国）に含まれない国はどれか。", "choices": ["日本", "カナダ", "中国", "イタリア"], "category": "経営環境", "correct": 2, "explanation": "G7は日・米・英・仏・独・伊・加。"}, {"id": 20, "question": "国際通貨基金（IMF）の主な役割として正しいものはどれか。", "choices": ["国際貿易のルール策定", "為替相場の安定と国際収支難に陥った国への融資", "各国の関税率の決定", "世界の気候変動対策の推進"], "category": "経営環境", "correct": 1, "explanation": "世界銀行とは役割が異なる点に注意。"}, {"id": 21, "question": "世界貿易機関（WTO）の主な役割として正しいものはどれか。", "choices": ["国際的な貿易ルールの策定・紛争解決", "各国通貨の為替レート決定", "開発途上国への無償資金協力", "世界の食料備蓄の管理"], "category": "経営環境", "correct": 0, "explanation": "自由貿易の推進が目的。"}, {"id": 22, "question": "OECD（経済協力開発機構）の役割として最も適切なものはどれか。", "choices": ["先進国を中心に経済政策の分析・提言を行う", "発展途上国のみを対象とした軍事協力機構", "為替の固定相場を管理する機関", "国連の下部組織として食糧支援を行う"], "category": "経営環境", "correct": 0, "explanation": "「経済協力開発機構」。"}, {"id": 23, "question": "日本の少子高齢化が経済に与える影響として一般的に指摘されているものはどれか。", "choices": ["生産年齢人口の減少による労働力不足", "若年層の急増による内需拡大", "社会保障費の減少", "潜在成長率の上昇"], "category": "経営環境", "correct": 0, "explanation": "少子高齢化の代表的な影響。"}, {"id": 24, "question": "「生産年齢人口」の定義として正しいものはどれか。", "choices": ["15歳以上65歳未満の人口", "20歳以上の人口全体", "就業者数のみ", "65歳以上の人口"], "category": "経営環境", "correct": 0, "explanation": "統計上の定義。"}, {"id": 25, "question": "「潜在成長率」の説明として正しいものはどれか。", "choices": ["経済が持つ生産要素をフル活用した場合に達成しうる中長期的な成長率", "前年比の実際の経済成長率", "政府が目標として掲げる財政赤字削減率", "株式市場の期待成長率"], "category": "経営環境", "correct": 0, "explanation": "実際の成長率とは異なる概念。"}, {"id": 26, "question": "「需給ギャップ」がプラスの状態が意味するものはどれか。", "choices": ["需要が供給（潜在GDP）を上回っている", "供給が需要を上回っている", "需要と供給が完全に一致している", "需給ギャップという概念は存在しない"], "category": "経営環境", "correct": 0, "explanation": "プラスは需要超過＝物価上昇圧力。"}, {"id": 27, "question": "2025年10月、自民党総裁選を経て日本初の女性首相に就任したのは誰か。", "choices": ["石破茂", "高市早苗", "小泉進次郎", "茂木敏充"], "category": "経営環境", "correct": 1, "explanation": "2025年10月21日、第104代首相に指名。"}, {"id": 28, "question": "高市内閣の発足時に財務相に起用されたのは誰か。", "choices": ["木原稔", "鈴木憲和", "片山さつき", "河野太郎"], "category": "経営環境", "correct": 2, "explanation": "高市内閣発足時の財務相。"}, {"id": 29, "question": "高市内閣は自民党とどの政党による連立政権としてスタートしたか。", "choices": ["公明党", "日本維新の会", "立憲民主党", "国民民主党"], "category": "経営環境", "correct": 1, "explanation": "自民・維新の連立政権。"}, {"id": 30, "question": "2025年9月時点で試算された、日米関税交渉合意後の米国の対日平均関税率に最も近い数値はどれか。", "choices": ["約1.5％", "約6％", "約12.3％", "約25％"], "category": "経営環境", "correct": 2, "explanation": "年初1.5％、7月時点14.5％からの低下だが依然高水準。"}, {"id": 31, "question": "トランプ関税の影響で、2025年8月に輸出額が大きく落ち込んだと報じられた品目はどれか。", "choices": ["半導体製造装置", "自動車関連財", "医薬品", "農産物"], "category": "経営環境", "correct": 1, "explanation": "現地生産強化や価格競争力低下が背景とされる。"}, {"id": 32, "question": "2025年9月の金融政策決定会合で日銀が決定した内容として正しいものはどれか。", "choices": ["マイナス金利の再導入", "保有するETF・REITの市場での段階的売却", "長短金利操作の再強化", "大規模な為替介入の実施"], "category": "経営環境", "correct": 1, "explanation": "金融正常化の一環として2025年9月に決定。"}, {"id": 33, "question": "2025年の基準地価（全用途平均）の動きとして正しいものはどれか。", "choices": ["4年連続で上昇した", "5年ぶりに下落した", "横ばいが続いている", "公表が中止された"], "category": "経営環境", "correct": 0, "explanation": "全用途平均1.5％上昇。"}, {"id": 34, "question": "近年の春闘（春季労使交渉）における賃上げ率のトレンドとして正しいものはどれか。", "choices": ["5％を超える高水準の賃上げが続いている", "賃上げはゼロ％台が続いている", "賃下げが常態化している", "春闘そのものが廃止された"], "category": "経営環境", "correct": 0, "explanation": "人手不足や物価高を背景とした傾向。"}, {"id": 35, "question": "「実質賃金」の説明として正しいものはどれか。", "choices": ["名目賃金の上昇率から物価上昇率を差し引いたもの", "名目賃金に税金を加えたもの", "ボーナスのみを指すもの", "最低賃金と同義のもの"], "category": "経営環境", "correct": 0, "explanation": "物価上昇が上回ると実質賃金はマイナスになる。"}, {"id": 36, "question": "為替相場が円安方向に動く一般的な要因として正しいものはどれか。", "choices": ["日本の金利が海外に比べて相対的に低い状態が続く", "日本の貿易黒字が急拡大する", "海外投資家が円建て資産を積極的に購入する", "日銀が大規模な円買い介入を行う"], "category": "経営環境", "correct": 0, "explanation": "低金利通貨は相対的に売られやすく円安要因となる。"}, {"id": 37, "question": "中央銀行の役割として一般的に含まれないものはどれか。", "choices": ["通貨の発行", "物価の安定", "金融システムの安定", "民間企業への出資による経営関与"], "category": "経営環境", "correct": 3, "explanation": "中央銀行の一般的役割には含まれない。"}, {"id": 38, "question": "「マネーストック」が示す内容として正しいものはどれか。", "choices": ["金融機関や中央政府を除く経済主体が保有する通貨量の残高", "国が発行する国債の総額", "家計の預金金利の平均", "上場企業の時価総額の合計"], "category": "経営環境", "correct": 0, "explanation": "代表的なマネー指標。"}, {"id": 39, "question": "通貨当局が為替相場に影響を与えるために外貨を売買する行為を何と呼ぶか。", "choices": ["公開市場操作", "為替介入", "量的緩和", "財政出動"], "category": "経営環境", "correct": 1, "explanation": "通貨当局による外貨売買。"}, {"id": 40, "question": "CPTPP（環太平洋パートナーシップに関する包括的及び先進的な協定）の説明として正しいものはどれか。", "choices": ["参加国間で関税撤廃・削減などを進める経済連携協定", "世界の気候変動対策の国際枠組み", "国連が主導する平和維持活動の枠組み", "主要国の為替レートを固定する協定"], "category": "経営環境", "correct": 0, "explanation": "日本も参加する多国間協定。"}, {"id": 41, "question": "FTA（自由貿易協定）とEPA（経済連携協定）の違いとして正しいものはどれか。", "choices": ["FTAは関税撤廃が中心、EPAは投資・人の移動なども含めたより広範な協定", "FTAとEPAはまったく同じ内容を指す", "EPAは関税に関する協定ではない", "FTAは日本が締結できない協定形式である"], "category": "経営環境", "correct": 0, "explanation": "EPAは投資・人の移動なども含む。"}, {"id": 42, "question": "「サプライチェーン」が指す内容として正しいものはどれか。", "choices": ["原材料の調達から製造・物流・販売に至る一連のつながり", "企業の株主構成", "金融機関同士の資金決済網", "労働組合の組織構造"], "category": "経営環境", "correct": 0, "explanation": "供給網。"}, {"id": 43, "question": "「経済安全保障」の考え方として正しいものはどれか。", "choices": ["重要物資や技術の供給を特定国に過度に依存しないようにする政策的取り組み", "企業の内部留保を最大化する経営手法", "為替レートを完全に固定する制度", "消費税を廃止する政策"], "category": "経営環境", "correct": 0, "explanation": "近年重視される政策分野。"}, {"id": 44, "question": "「カーボンニュートラル」の説明として正しいものはどれか。", "choices": ["温室効果ガスの排出量と吸収量を均衡させ、実質的な排出をゼロにする状態", "二酸化炭素の排出を完全に禁止する法律", "石油を一切使用しない経済体制", "中立国のエネルギー政策を指す用語"], "category": "経営環境", "correct": 0, "explanation": "2050年目標として掲げる国が多い。"}, {"id": 45, "question": "SDGs（持続可能な開発目標）が国連で採択された際の目標数として正しいものはどれか。", "choices": ["8つ", "17個", "30個", "100個"], "category": "経営環境", "correct": 1, "explanation": "2015年に国連で採択。"}, {"id": 46, "question": "「ESG投資」のESGが指すものの組み合わせとして正しいものはどれか。", "choices": ["Environment・Social・Governance", "Economy・Society・Growth", "Export・Sales・Growth", "Energy・Steel・Gold"], "category": "経営環境", "correct": 0, "explanation": "環境・社会・企業統治。"}, {"id": 47, "question": "日本銀行の金融政策決定会合で決定される「政策金利」の主な誘導対象として正しいものはどれか。", "choices": ["無担保コールレート（オーバーナイト物）", "住宅ローン金利", "社債利回り", "株式配当利回り"], "category": "経営環境", "correct": 0, "explanation": "伝統的な政策金利の誘導対象。"}, {"id": 48, "question": "財政赤字が続き、国債残高が累積することの一般的なリスクとして指摘されるものはどれか。", "choices": ["将来世代への負担の先送りや財政の持続可能性への懸念", "物価が必ず下落すること", "為替が必ず円高になること", "GDPが自動的に増加すること"], "category": "経営環境", "correct": 0, "explanation": "財政の持続可能性への懸念が指摘される。"}, {"id": 49, "question": "「貿易収支」の説明として正しいものはどれか。", "choices": ["財（モノ）の輸出額から輸入額を差し引いたもの", "サービスの輸出入のみを集計したもの", "海外への投資収益のみを集計したもの", "政府間の無償資金協力の総額"], "category": "経営環境", "correct": 0, "explanation": "サービスは  177, "question": "職務内容を明確に定義し、その職務に必要なスキルを持つ人材を採用・配置する雇用形態を何と呼ぶか。", "choices": ["ジョブ型雇用", "メンバーシップ型雇用", "終身雇用", "年功序列雇用"], "category": "法務・人事", "correct": 0, "explanation": "職務内容を明確化した雇用。"}, {"id": 178, "question": "職務を限定せず、新卒一括採用や社内異動を通じて人材を育成する日本型の雇用慣行を何と呼ぶか。", "choices": ["メンバーシップ型雇用", "ジョブ型雇用", "成果主義雇用", "出来高制雇用"], "category": "法務・人事", "correct": 0, "explanation": "日本型の雇用慣行。"}, {"id": 179, "question": "労働契約に期間の定めがなく、フルタイムで働く典型的な雇用形態を何と呼ぶか。", "choices": ["正社員", "契約社員", "パートタイム労働者", "業務委託"], "category": "法務・人事", "correct": 0, "explanation": "無期・フルタイムが典型。"}, {"id": 180, "question": "労働条件や職場規律などを定め、常時10人以上の労働者を使用する事業場で作成・届出が義務付けられている規程を何と呼ぶか。", "choices": ["就業規則", "労働協約", "雇用契約書", "内規"], "category": "法務・人事", "correct": 0, "explanation": "常時10人以上の事業場で作成・届出義務。"}, {"id": 181, "question": "労働者と事業主の間の個別労働紛争を、原則3回以内の期日で迅速に解決する裁判所の手続を何と呼ぶか。", "choices": ["労働審判", "民事調停", "仮処分", "家事審判"], "category": "法務・人事", "correct": 0, "explanation": "迅速な個別労働紛争解決手続。"}, {"id": 182, "question": "労働基準法違反の疑いがある事業場への立ち入り調査などを行う行政機関はどれか。", "choices": ["労働基準監督署", "公正取引委員会", "消費者庁", "金融庁"], "category": "法務・人事", "correct": 0, "explanation": "労基法違反の調査等を実施。"}, {"id": 183, "question": "人手不足分野において一定の専門性・技能を持つ外国人の就労を認める在留資格を何と呼ぶか。", "choices": ["特定技能", "技能実習", "高度専門職", "永住者"], "category": "法務・人事", "correct": 0, "explanation": "人手不足分野の外国人就労資格。"}, {"id": 184, "question": "オフィスに出社せず、自宅などで情報通信技術を活用して働く勤務形態を何と呼ぶか。", "choices": ["テレワーク", "ジョブローテーション", "OJT", "アウトプレースメント"], "category": "法務・人事", "correct": 0, "explanation": "ICTを活用した非出社型勤務。"}, {"id": 185, "question": "従業員が本業以外に別の仕事を持つことを何と呼ぶか。", "choices": ["副業・兼業", "出向", "転籍", "配置転換"], "category": "法務・人事", "correct": 0, "explanation": "本業以外の就労。"}, {"id": 186, "question": "女性の職業生活における活躍を推進するための行動計画策定などを事業主に求める法律はどれか。", "choices": ["女性活躍推進法", "男女雇用機会均等法", "育児・介護休業法", "パートタイム・有期雇用労働法"], "category": "法務・人事", "correct": 0, "explanation": "行動計画策定等を義務付け。"}, {"id": 187, "question": "一定規模以上の事業主に対し、障害者の法定雇用率達成を義務付ける法律はどれか。", "choices": ["障害者雇用促進法", "障害者総合支援法", "バリアフリー <script>
(function(){
  const ALL_QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
  const CATEGORIES = [...new Set(ALL_QUESTIONS.map(q=>q.category))];

  let activeCategory = 'すべて';
  let pool = [];        // current filtered/ordered question list
  let idx = 0;           // pointer within pool
  let answered = {};     // id -> chosen index
  let correctCount = 0;
  let answeredCount = 0;

  const chipRow = document.getElementById('chipRow');
  const quizArea = document.getElementById('quizArea');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct = document.getElementById('progressPct');
  const filterCount = document.getElementById('filterCount');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const shuffleBtn = document.getElementById('shuffleBtn');

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildChips(){
    const cats = ['すべて', ...CATEGORIES];
    chipRow.innerHTML = '';
    cats.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip' + (c===activeCategory ? ' active':'');
      b.textContent = c;
      b.onclick = ()=>{ activeCategory = c; initPool(false); };
      chipRow.appendChild(b);
    });
  }

  function initPool(doShuffle){
    const base = activeCategory==='すべて' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q=>q.category===activeCategory);
    pool = doShuffle ? shuffle(base) : base.slice();
    idx = 0;
    answered = {};
    correctCount = 0;
    answeredCount = 0;
    buildChips();
    filterCount.textContent = activeCategory + '（全' + pool.length + '問）';
    render();
  }

  shuffleBtn.onclick = ()=> initPool(true);

  function updateScoreHeader(){
    scoreCorrect.textContent = correctCount;
    scoreTotal.textContent = answeredCount;
  }

  function updateProgress(){
    const total = pool.length;
    const shown = Math.min(idx+1, total);
    progressLabel.textContent = '問 ' + shown + ' / ' + total;
    const pct = total ? Math.round((idx/total)*100) : 0;
    progressFill.style.width = pct + '%';
    progressPct.textContent = pct + '%';
  }

  const stampCorrectSVG = `
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.92"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#2E6B4F" stroke-width="6" opacity="0.35" transform="rotate(6 50 50)"/>
      <text x="50" y="59" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="30" font-weight="800" fill="#2E6B4F">正</text>
    </svg>`;
  const stampWrongSVG = `
    <svg viewBox="0 0 100 100">
      <rect x="14" y="14" width="72" height="72" rx="6" fill="none" stroke="#B23A2C" stroke-width="6" opacity="0.9" transform="rotate(-4 50 50)"/>
      <line x1="26" y1="26" x2="74" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
      <line x1="74" y1="26" x2="26" y2="74" stroke="#B23A2C" stroke-width="6" opacity="0.85"/>
    </svg>`;

  function render(){
    updateScoreHeader();
    updateProgress();

    if(pool.length===0){
      quizArea.innerHTML = '<div class="card"><p style="text-align:center;color:var(--ink-soft);">この分野の問題がありません。</p></div>';
      return;
    }

    if(idx >= pool.length){
      renderDone();
      return;
    }

    const q = pool[idx];
    const chosen = answered[q.id];
    const isLocked = chosen !== undefined;

    const letters = ['A','B','C','D'];
    const choicesHtml = q.choices.map((c,i)=>{
      let cls = 'choice';
      if(isLocked){
        cls += ' locked';
        if(i===chosen && i===q.correct) cls += ' selected-correct';
        else if(i===chosen && i!==q.correct) cls += ' selected-wrong';
        else if(i===q.correct) cls += ' reveal-correct';
      }
      return `<div class="${cls}" data-i="${i}">
        <span class="mark">${letters[i]}</span>
        <span>${c}</span>
      </div>`;
    }).join('');

    let stampHtml = '';
    if(isLocked){
      const wasCorrect = chosen === q.correct;
      stampHtml = `<div class="stamp show">${wasCorrect ? stampCorrectSVG : stampWrongSVG}</div>`;
    }

    quizArea.innerHTML = `
      <div class="card">
        ${stampHtml}
        <div class="qhead">
          <div class="qnum">${String(q.id).padStart(3,'0')}</div>
          <div class="qmeta"><div class="qcat">${q.category}</div></div>
        </div>
        <div class="qtext">${q.question}</div>
        <div class="choices">${choicesHtml}</div>
        <div class="explain ${isLocked ? 'show':''}">
          <div class="explain-inner"><b>${letters[q.correct]}が正解。</b>${q.explanation}</div>
        </div>
        <div class="navrow">
          <button class="navbtn ghost" id="prevBtn" ${idx===0 ? 'disabled':''}>戻る</button>
          <button class="navbtn" id="nextBtn" ${isLocked ? '' : 'disabled'}>${idx===pool.length-1 ? '結果を見る':'次の問題'}</button>
        </div>
      </div>
    `;

    quizArea.querySelectorAll('.choice').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(answered[q.id]!==undefined) return;
        const chosenI = parseInt(el.dataset.i,10);
        answered[q.id] = chosenI;
        answeredCount++;
        if(chosenI===q.correct) correctCount++;
        render();
      });
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>{ idx++; render(); });
    const prevBtn = document.getElementById('prevBtn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
  }

  function renderDone(){
    const total = pool.length;
    const catStats = {};
    pool.forEach(q=>{
      if(!catStats[q.category]) catStats[q.category] = {correct:0,total:0};
      catStats[q.category].total++;
      if(answered[q.id]===q.correct) catStats[q.category].correct++;
    });
    const rows = Object.keys(catStats).map(c=>{
      const s = catStats[c];
      const pct = s.total ? Math.round((s.correct/s.total)*100) : 0;
      return `<div class="breakdown-row">
        <div class="bname">${c}</div>
        <div class="btrack"><div class="bfill" style="width:${pct}%"></div></div>
        <div class="bnum">${s.correct}/${s.total}</div>
      </div>`;
    }).join('');

    quizArea.innerHTML = `
      <div class="card done">
        <div class="qcat" style="margin-bottom:8px;">RESULT</div>
        <div class="bigscore">${correctCount}<span> / ${total}</span></div>
        <div class="breakdown">${rows}</div>
        <div class="navrow" style="justify-content:center;padding-left:0;margin-top:28px;">
          <button class="navbtn" id="retryBtn">もう一度解く</button>
        </div>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=> initPool(false));
    progressFill.style.width='100%';
    progressPct.textContent='100%';
  }

  initPool(false);
})();
</script>
</body>
</html>
